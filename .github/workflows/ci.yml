# The pull-request gate (Rust workspace § 10, Testing § 12). Build plan M0 starts it with these jobs:
# fmt, clippy, test, layering, wasm (with the NFR-SEC-2 size budget), deny, docs and trace. Later
# milestones add browser, audit and skills; M2 adds fuzz-smoke, M3 openapi, M5 itest.
#
# Every action is pinned to a full commit SHA, read from the action's releases on 2026-10-19. The
# toolchain comes from rust-toolchain.toml; the tools are exact versions installed with --locked. No
# job needs a secret.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  WORKER_BUILD_VERSION: "0.8.7" # matches worker 0.8.7 (ADR 0001)
  CARGO_DENY_VERSION: "0.20.2" # crates.io, 2026-07-09
  MDBOOK_VERSION: "0.5.4" # as in site.yml
  CARGO_FUZZ_VERSION: "0.13.2" # crates.io, 2026-06-09

jobs:
  fmt:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, verified 2026-10-19
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install --no-self-update
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, verified 2026-10-19
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2, verified 2026-10-19
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Clippy on the wasm32-only code (platform::cf and the Worker's entry)
        run: >-
          cargo clippy --locked -p pylota-identity-core -p pylota-identity-platform -p pylota-identity-worker
          --target wasm32-unknown-unknown -- -D warnings
      - name: Clippy on the itest hooks and the it suite
        run: |
          cargo clippy --locked -p pylota-identity-worker --features itest-hooks --all-targets -- -D warnings
          cargo clippy --locked -p pylota-identity-core -p pylota-identity-platform -p pylota-identity-worker \
            --target wasm32-unknown-unknown --features itest-hooks -- -D warnings

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, verified 2026-10-19
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2, verified 2026-10-19
      - run: cargo test --locked --workspace

  fuzz-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Build plan M2; ical_parse joins with M32.
        target: [mime_parse, query_parse, address_parse, sanitize, dsn_parse]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, verified 2026-10-19
        with:
          persist-credentials: false
      - name: Install the pinned toolchains (workspace and fuzz/rust-toolchain.toml)
        run: |
          rustup toolchain install --no-self-update
          cd fuzz && rustup toolchain install --no-self-update
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --version "$CARGO_FUZZ_VERSION" --locked
      - run: cargo xtask fuzz --target ${{ matrix.target }} --time 60
      - name: Keep the crash input
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fuzz-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}

  openapi:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, verified 2026-10-19
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2, verified 2026-10-19
      - run: cargo xtask openapi
      - run: cargo xtask gen-sdk --check

  layering:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, verified 2026-10-19
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2, verified 2026-10-19
      - run: cargo xtask check-layering

  wasm:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, verified 2026-10-19
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2, verified 2026-10-19
      - name: core builds for wasm32
        run: cargo build --locked -p pylota-identity-core --target wasm32-unknown-unknown
      - name: Install worker-build
        run: cargo install worker-build --version "$WORKER_BUILD_VERSION" --locked
      - name: Build the Worker and check the size budget (xtask::size_budget, NFR-SEC-2)
        run: cargo xtask build-worker

  itest:
    # The it:: suite against the Worker in workerd (Testing § 6). Wrangler comes from site/package-lock.json.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, verified 2026-10-19
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2, verified 2026-10-19
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0, verified 2026-10-09
        with:
          node-version: "22" # wrangler 4.139.0 declares Node >= 22
      - name: Install Wrangler from the lockfile
        working-directory: site
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install worker-build
        run: cargo install worker-build --version "$WORKER_BUILD_VERSION" --locked
      - name: cargo xtask itest
        run: cargo xtask itest
      - name: The Worker's log
        if: failure()
        run: tail -n 200 target/itest/worker.log

  deny:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, verified 2026-10-19
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2, verified 2026-10-19
      - name: Install cargo-deny
        run: cargo install cargo-deny --version "$CARGO_DENY_VERSION" --locked
      - name: Licences, advisories and sources over the workspace
        run: cargo deny --locked --workspace check licenses advisories sources
      - name: Bans over the Worker's wasm32 graph
        run: >-
          cargo deny --locked --manifest-path crates/worker/Cargo.toml
          --target wasm32-unknown-unknown --exclude-dev check bans

  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, verified 2026-10-19
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2, verified 2026-10-19
      - name: Install mdBook
        run: cargo install mdbook --version "$MDBOOK_VERSION" --locked
      - name: Build the docs with no warnings
        run: |
          set -o pipefail
          mdbook build docs 2>&1 | tee "$RUNNER_TEMP/mdbook.log"
          if grep -E '^\s*(WARN|ERROR)' "$RUNNER_TEMP/mdbook.log"; then
            echo "::error::mdbook build docs printed warnings"
            exit 1
          fi

  trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, verified 2026-10-19
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2, verified 2026-10-19
      - name: Traceability over the landed milestones (MILESTONES)
        run: cargo xtask trace
