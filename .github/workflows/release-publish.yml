# A release, the second of its two workflows (Rust workspace § 10). Started on a v* tag by
# `cargo xtask release sign`, after the owner signed SHA256SUMS on their own machine:
#   verify   the tag's release.yml run passed; the draft's SHA256SUMS.sig verifies against the keys
#            compiled into idvy with the trusted comment `pylota-identity v<v>`, and every file matches;
#            then the draft is published as a pre-release (and becomes immutable)
#   staging  the pre-release deployed to staging with the idvy of this tag
#   live     the live:: suite against staging (it arrives with build plan M20; until then this job fails,
#            and a failed run is never promoted)
#   publish  cargo xtask release-gate, then, for a version without a pre-release part, a full release
# No job holds a signing key, a crates.io token or an npm token: crates are published by the owner
# (`cargo xtask release crates`). Actions are pinned to full commit SHAs.
name: Release publish

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-publish-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write # read the draft, then publish it
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: A v* tag whose release.yml run passed
        run: |
          [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" == v* ]] || { echo "::error::Run this on a v* tag."; exit 1; }
          ok="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow release.yml --branch "$GITHUB_REF_NAME" --json conclusion --jq '[.[] | select(.conclusion == "success")] | length')"
          [ "$ok" -ge 1 ] || { echo "::error::release.yml has not passed on $GITHUB_REF_NAME."; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, verified 2026-10-19
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install --no-self-update
      - name: The signature and every checksum, against the keys compiled into idvy
        run: |
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/draft"
          cargo xtask release verify "$RUNNER_TEMP/draft" "${GITHUB_REF_NAME#v}"
      - name: Publish the draft as a pre-release
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease

  staging:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: staging
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.STAGING_CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.STAGING_CLOUDFLARE_ACCOUNT_ID }}
      STAGING_WRANGLER_TOML: ${{ vars.STAGING_WRANGLER_TOML }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, verified 2026-10-19
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install --no-self-update
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0, verified 2026-10-09
        with:
          node-version: "22" # idvy installs Wrangler from the bundle's lockfile
      - name: idvy deploy --version, which downloads and verifies the pre-release like any deployer
        run: |
          [ -n "$STAGING_WRANGLER_TOML" ] || { echo "::error::The staging environment has no STAGING_WRANGLER_TOML."; exit 1; }
          mkdir -p "$RUNNER_TEMP/deploy"
          printf '%s\n' "$STAGING_WRANGLER_TOML" > "$RUNNER_TEMP/deploy/wrangler.toml"
          cargo build --locked --release -p pylota-identity-cli
          target/release/idvy deploy --version "${GITHUB_REF_NAME#v}" --dir "$RUNNER_TEMP/deploy"

  live:
    needs: staging
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment: staging
    permissions:
      contents: read
    steps:
      - name: The live:: suite (not the manual tests)
        run: |
          echo "::error::The live:: suite arrives with build plan M20; this run cannot be promoted until it passes."
          exit 1

  publish:
    needs: [verify, staging, live]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release
    permissions:
      contents: write # mark the release full
      actions: read
      issues: read
      security-events: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, verified 2026-10-19
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install the pinned toolchain
        run: rustup toolchain install --no-self-update
      - name: The release gate (Security § 16)
        run: |
          v="${GITHUB_REF_NAME#v}"
          if [[ "$v" == *-* ]]; then
            cargo xtask release-gate --version "$v" --pre-release
          else
            cargo xtask release-gate --version "$v"
          fi
      - name: A full release, for a version without a pre-release part
        if: ${{ !contains(github.ref_name, '-') }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --prerelease=false --latest
