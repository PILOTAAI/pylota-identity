# The rollout of a published release to Pylota Identity Cloud (Rust workspace § 10). Only the owner starts
# it, with the version, after release-publish.yml has made that version a full release. It runs nothing of
# the release until three checks pass, with nothing taken from the downloaded files themselves:
#   1. SHA256SUMS.sig verifies with minisign (the exact version below, its archive's SHA-256 checked)
#      against RELEASE_KEYS written here, with the trusted comment `pylota-identity v<version>`;
#   2. the idvy archive's SHA-256 matches its line of SHA256SUMS;
#   3. its attestation names release.yml on refs/tags/v<version>, from a GitHub-hosted runner.
# Then `idvy deploy --version <v> --gradual` (10% → 50% → 100%), which installs Wrangler from the
# signed bundle's lockfile. A pre-release version is refused. RELEASE_KEYS equals the keys idvy
# compiles in (crates/cli/src/bundle/verify.rs); xtask::cloud_deploy_workflow_pins keeps the two
# lists equal, so a key rotation edits both in one change (J35).
#
# The production environment holds PROD_CLOUDFLARE_API_TOKEN (created for one rollout, expiring 24 hours
# ahead; Cloud commissioning § 3), PROD_CLOUDFLARE_ACCOUNT_ID, and the variable PROD_WRANGLER_TOML: the
# deployment's rendered wrangler.toml (resource IDs only, no secret).
name: Cloud deploy

on:
  workflow_dispatch:
    inputs:
      version:
        description: "The released version to roll out, without v (for example 1.0.0)"
        required: true
        type: string

permissions: {}

concurrency:
  group: cloud-deploy
  cancel-in-progress: false

env:
  VERSION: ${{ inputs.version }}
  MINISIGN_VERSION: "0.12" # github.com/jedisct1/minisign, read 2026-10-31
  MINISIGN_SHA256: "9a599b48ba6eb7b1e80f12f36b94ceca7c00b7a5173c95c3efc88d9822957e73" # minisign-0.12-linux.tar.gz
  # The release signing keys, current then next, one base64 minisign public key per line.
  RELEASE_KEYS: |

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: production
    permissions:
      contents: read
      attestations: read
    env:
      GH_TOKEN: ${{ github.token }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.PROD_CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.PROD_CLOUDFLARE_ACCOUNT_ID }}
      PROD_WRANGLER_TOML: ${{ vars.PROD_WRANGLER_TOML }}
    steps:
      - name: Refuse a pre-release version
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::$VERSION is not a full release version."; exit 1; }
          pre="$(gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" --json isPrerelease,isDraft --jq '.isPrerelease or .isDraft')"
          [ "$pre" = false ] || { echo "::error::v$VERSION is a pre-release or a draft."; exit 1; }
      - name: minisign, checked against its pinned SHA-256
        run: |
          cd "$RUNNER_TEMP"
          curl -sSfL -o minisign.tar.gz "https://github.com/jedisct1/minisign/releases/download/$MINISIGN_VERSION/minisign-$MINISIGN_VERSION-linux.tar.gz"
          echo "$MINISIGN_SHA256  minisign.tar.gz" | sha256sum --check --strict
          tar -xzf minisign.tar.gz minisign-linux/x86_64/minisign
          install -m 0755 minisign-linux/x86_64/minisign /usr/local/bin/minisign
      - name: The release's idvy, SHA256SUMS and SHA256SUMS.sig
        run: |
          mkdir -p "$RUNNER_TEMP/r" && cd "$RUNNER_TEMP/r"
          gh release download "v$VERSION" --repo "$GITHUB_REPOSITORY" \
            --pattern "idvy-$VERSION-x86_64-unknown-linux-gnu.tar.gz" --pattern SHA256SUMS --pattern SHA256SUMS.sig
      - name: 1. The signature, against the keys written in this workflow
        run: |
          cd "$RUNNER_TEMP/r"
          ok=false
          while read -r key; do
            [ -n "$key" ] || continue
            if out="$(minisign -V -m SHA256SUMS -x SHA256SUMS.sig -P "$key" 2>&1)" \
              && grep -qxF "Trusted comment: pylota-identity v$VERSION" <<<"$out"; then
              ok=true
            fi
          done <<<"$RELEASE_KEYS"
          $ok || { echo "::error::SHA256SUMS.sig does not verify with the release keys and the trusted comment pylota-identity v$VERSION."; exit 1; }
      - name: 2. The archive's checksum
        run: |
          cd "$RUNNER_TEMP/r"
          grep -E "^[0-9a-f]{64}  idvy-$VERSION-x86_64-unknown-linux-gnu\.tar\.gz$" SHA256SUMS | sha256sum --check --strict
      - name: 3. The attestation names release.yml on the tag
        run: |
          gh attestation verify "$RUNNER_TEMP/r/idvy-$VERSION-x86_64-unknown-linux-gnu.tar.gz" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --source-ref "refs/tags/v$VERSION" \
            --deny-self-hosted-runners
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0, verified 2026-10-09
        with:
          node-version: "22" # idvy installs Wrangler from the signed bundle's lockfile
      - name: idvy deploy --version --gradual
        run: |
          [ -n "$PROD_WRANGLER_TOML" ] || { echo "::error::The production environment has no PROD_WRANGLER_TOML."; exit 1; }
          cd "$RUNNER_TEMP/r"
          tar -xzf "idvy-$VERSION-x86_64-unknown-linux-gnu.tar.gz" idvy
          mkdir -p "$RUNNER_TEMP/deploy"
          printf '%s\n' "$PROD_WRANGLER_TOML" > "$RUNNER_TEMP/deploy/wrangler.toml"
          ./idvy deploy --version "$VERSION" --gradual --dir "$RUNNER_TEMP/deploy"
