# Spikes S8 and S11 (build plan M1, ADR 0023): SES, SNS, S3 and SQS from Rust in wasm, with the staging
# AWS role assumed through GitHub OIDC (no stored AWS key). Runs on a push to the spike branch that
# changes spikes/s8-s11-ses/PHASE (its first line: `setup`, `exercise` or `cleanup`; a second line may note
# why it was run again); the `staging` environment's reviewer approves each run. The spike Worker runs locally in workerd, so no Cloudflare token is needed.
# Every third-party action is pinned to a commit SHA (verified 2026-10-27).
name: Spikes SES

on:
  push:
    branches: [claude/intelligent-albattani-yf44lw]
    paths: [spikes/s8-s11-ses/PHASE]

permissions:
  contents: read
  id-token: write

concurrency:
  group: spikes-ses
  cancel-in-progress: false

env:
  WORKER_BUILD_VERSION: "0.8.7"

jobs:
  spike:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: staging
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, verified 2026-10-19
        with:
          persist-credentials: false
      - name: The staging role is configured
        env:
          ROLE: ${{ vars.STAGING_AWS_ROLE_ARN }}
        run: |
          if [ -z "$ROLE" ]; then
            echo "::error::The variable STAGING_AWS_ROLE_ARN is not set in the staging environment (Settings > Environments > staging > Environment variables; a variable, not a secret)."
            exit 1
          fi
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0 (2026-09-15), verified 2026-10-27
        with:
          role-to-assume: ${{ vars.STAGING_AWS_ROLE_ARN }}
          role-session-name: pylota-identity-spikes-ses
          aws-region: eu-west-2
          role-duration-seconds: 3600
      - name: Toolchain, worker-build and Wrangler (exercise only)
        if: ${{ hashFiles('spikes/s8-s11-ses/PHASE') != '' }}
        run: |
          if [ "$(head -n1 spikes/s8-s11-ses/PHASE)" = exercise ]; then
            rustup toolchain install --no-self-update
            cargo install worker-build --version "$WORKER_BUILD_VERSION" --locked
            (cd site && npm ci --no-audit --no-fund)
          fi
      - name: Run the phase
        env:
          WRANGLER: ${{ github.workspace }}/site/node_modules/.bin/wrangler
        run: spikes/s8-s11-ses/run.sh "$(head -n1 spikes/s8-s11-ses/PHASE)"
      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2, verified 2026-10-09
        with:
          name: spikes-ses-results
          path: spikes/s8-s11-ses/results.json
          if-no-files-found: ignore
