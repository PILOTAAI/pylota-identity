[package]
name = "pylota-identity-worker"
description = "The Pylota Identity Worker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false # shipped inside the Worker bundle, never to crates.io

[lib]
crate-type = ["cdylib", "rlib"]

# Never `worker`, `wasm-bindgen`, `js-sys` or `web-sys` here: the entry points come from
# platform::export_worker! (Rust workspace § 2; `cargo xtask check-layering`).
[dependencies]
pylota-identity-api-types = { path = "../api-types" }
pylota-identity-core = { path = "../core" }
pylota-identity-platform = { path = "../platform" }
serde = { workspace = true }
serde_json = { workspace = true }
regex = { workspace = true }


[dev-dependencies]
reqwest = { workspace = true, features = ["blocking"] }
toml = { workspace = true }
mail-auth = { workspace = true }
rustls-pki-types = { workspace = true }

# The round-trip test of the local MCP protocol types (ADR 0009): native only, never in the Worker.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
rmcp = { workspace = true, default-features = false }
# it::sdk: the Rust SDK against the harness, on a current-thread runtime.
pylota-identity = { path = "../sdk" }
tokio = { workspace = true, features = ["rt-multi-thread", "time"] }

# The workerd suite (Testing § 6): `cargo xtask itest` runs it; `cargo test --workspace` never builds it.
[[test]]
name = "it"
path = "tests/it/main.rs"
required-features = ["itest-hooks"]

[features]
# The test hooks of `cargo xtask itest` (Testing § 6.1): never in a release bundle.
itest-hooks = ["pylota-identity-platform/itest-hooks"]
