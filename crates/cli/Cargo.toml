[package]
name = "pylota-identity-cli"
description = "idvy, the Pylota Identity command-line tool"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "pylota_identity_cli"
path = "src/lib.rs"

[[bin]]
name = "idvy"
path = "src/main.rs"

[dependencies]
pylota-identity = { path = "../sdk" }
pylota-identity-api-types = { path = "../api-types" }
pylota-identity-core = { path = "../core" }
clap = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
hmac = { workspace = true }
base64 = { workspace = true }
toml = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros", "time", "signal"] }
# Chosen at build time (crates.io API, read 2026-10-29: the newest release at least two weeks old).
minisign-verify = "=0.3.0"   # 2026-09-25; release signatures (CLI and setup § 8.2)
flate2 = "=1.1.10"           # 2026-08-28; the release tarball
tar = "=0.4.46"              # 2026-05-18; the release tarball
getrandom = { workspace = true }   # generated secrets and the bootstrap key (OS CSPRNG)

[dev-dependencies]
# The recorded fakes of tests/support: a loopback HTTP server, a real SQLite D1 and signed bundles.
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "time", "net", "io-util", "sync"] }
rusqlite = { workspace = true }
ed25519-dalek = { workspace = true }
blake2 = "=0.11.0"   # 2026-08-26 (crates.io API, read 2026-10-29); prehashed minisign test signatures
