[package]
name = "pylota-mail-platform"
description = "Pylota Mail's Cloudflare capability layer: the only crate that imports worker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# The Cloudflare implementations are compiled for wasm32 only (Rust workspace § 6.2). The direct
# wasm-bindgen, wasm-bindgen-futures and js-sys pins hold the lockfile at the versions worker-build
# 0.8.7 runs (it uses wasm-bindgen 0.2.129 exactly).
[target.'cfg(target_arch = "wasm32")'.dependencies]
worker = { workspace = true }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
js-sys = { workspace = true }
