[package]
name = "pylota-identity-platform"
description = "Pylota Identity's Cloudflare capability layer: the only crate that imports worker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false # shipped inside the Worker bundle, never to crates.io

[features]
# The test hooks of `cargo xtask itest` (Testing § 6.2–6.6): the fake clock offset and fault plan, read
# from the test process's fake server. Never in a release bundle.
itest-hooks = []

[dependencies]
pylota-identity-api-types = { path = "../api-types" }
serde = { workspace = true }
serde_json = { workspace = true }

# The Cloudflare implementations are compiled for wasm32 only (Rust workspace § 6.2). The direct
# wasm-bindgen, wasm-bindgen-futures and js-sys pins hold the lockfile at the versions worker-build
# 0.8.7 runs (it uses wasm-bindgen 0.2.129 exactly).
[target.'cfg(target_arch = "wasm32")'.dependencies]
worker = { workspace = true }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
js-sys = { workspace = true }
web-sys = { workspace = true }
getrandom = { workspace = true }

# platform::fakes, native only: never in the Worker bundle.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rusqlite = { workspace = true }
sha2 = { workspace = true }
