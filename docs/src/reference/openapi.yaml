    get:
      operationId: readEventConsumer
      tags: [Event feed]
      summary: Read the events after a consumer's committed position
      description: >-
        The events after the committed position, as `listEvents` returns them, plus `committed_cursor`. Until
        you commit, the same events come back: to work through a backlog, commit each page's `next_cursor`
        (an empty page's too) before reading the next, while `has_more` is true. There is no `after`. When the
