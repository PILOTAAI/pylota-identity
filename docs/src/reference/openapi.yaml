    # ── Event envelope and payloads ──────────────────────────────────────────────────────────────

    EventBase:
      type: object
      description: >-
        The envelope of every webhook event. Payloads are thin: IDs, a summary, verdicts and at most
        `policy.webhook_text_bytes` of `extracted_text` (FR-WH-4). Fetch anything else through the API.
        Events can arrive out of order: use `occurred_at` and `sequence` to discard stale updates.
      required: [id, type, api_version, occurred_at, tenant_id, identity_id, sequence, data]
      properties:
        id: {$ref: '#/components/schemas/EventId'}
        type: {$ref: '#/components/schemas/EventType'}
        api_version:
          type: string
          description: The payload schema date. A breaking payload change gets a new date; endpoints can pin the old one for 12 months.
          pattern: '^\d{4}-\d{2}-\d{2}$'
          examples: ['2026-10-01']
        occurred_at:
          type: string
          format: date-time
        tenant_id:
          description: '`null` only for deployment-level platform events.'
          oneOf:
            - $ref: '#/components/schemas/TenantId'
            - type: 'null'
        identity_id:
          description: '`null` for events that do not belong to one identity (domain, job and platform events).'
          oneOf:
            - $ref: '#/components/schemas/IdentityId'
            - type: 'null'
        sequence:
          type: [integer, 'null']
          minimum: 1
          description: >-
            Increases strictly per owner: per identity for mailbox events (`message.*`, `identity.*`,
            `verification.received`, `calendar.received`, `draft.*`, `suppression.created`, `quota.warning`), per
            domain for `domain.*` events, and per job for `erasure.*` and `export.*` events. `null` for platform
            events (`webhook.disabled`, `webhook.test`, `member.*`, `billing.*`, `tenant.policy_updated`,
            `signup.verified` and `account.*`). `message.screened` precedes, by one `sequence`, the
            `message.received` or `message.quarantined` it causes, and `message.released` precedes its
            `message.received`.
        data:
          type: object
          description: The payload; its schema depends on `type`.
    SendFailureReason:
      type: string
      description: |
        Why an accepted send did not go out normally (`data.reason` of `message.rejected`, `message.failed`
        and `message.uncertain`).

        | Reason | Status | Meaning |
        |---|---|---|
        | `provider_validation` | `rejected` | The transport refused the content (header, size, format) |
        | `sender_domain_unavailable` | `rejected` | The domain is not onboarded with the transport |
        | `recipient_suppressed_by_provider` | per recipient `suppressed` | The provider's own suppression list; synced into ours, except a suppression scoped to the shared platform domain, which may come from another workspace and is not copied ([G4]) |
        | `quota_exhausted` | `failed` | The provider's daily limit, still exhausted after 24 hours of backoff, or an SMTP relay still unavailable after 24 hours of retries |
        | `transport_timeout` | `uncertain` | No answer from the transport. It may have been sent |
        | `transport_connection_lost` | `uncertain` | The connection dropped after the request was written |
        | `provider_outcome_unknown` | `uncertain` | The transport reported a delivery failure for a message with several recipients without saying which; some may have received it ([G2]) |
        | `resolved_not_sent` | `failed` | A human resolved an uncertain send as not sent |
        | `domain_failing_no_fallback` | `failed` | The domain failed and fallback was disabled by policy |
        | `marketing_needs_ses` | `rejected` | A `kind: marketing` message whose sending domain uses the `cloudflare` transport when it reached the transport (the domain's transport changed, or fallback moved it to the platform domain, after it was accepted). Cloudflare Email Service is for transactional mail only |
      enum: [provider_validation, sender_domain_unavailable, recipient_suppressed_by_provider, quota_exhausted, transport_timeout, transport_connection_lost, provider_outcome_unknown, resolved_not_sent, domain_failing_no_fallback, marketing_needs_ses]
    EventAttachment:
      type: object
      required: [id, filename, content_type, size]
      properties:
        id: {$ref: '#/components/schemas/AttachmentId'}
        filename:
          type: [string, 'null']
        content_type:
          type: string
        size:
          type: integer
          minimum: 0

    MessageReceivedData:
      type: object
      required: [message, thread_id, trust, extracted_text, extracted_text_truncated, attachments]
      properties:
        message: {$ref: '#/components/schemas/MessageSummary'}
        thread_id: {$ref: '#/components/schemas/ThreadId'}
        trust: {$ref: '#/components/schemas/Trust'}
        extracted_text:
          type: [string, 'null']
          description: Up to `policy.webhook_text_bytes` (default 16 KB, maximum 64 KB) of `extracted_text`. Untrusted content.
        extracted_text_truncated:
          type: boolean
        attachments:
          type: array
          items: {$ref: '#/components/schemas/EventAttachment'}
        reprocessed:
          type: boolean
          const: true
          description: Present only on an event re-emitted by a re-parse ([J3]); it is not new mail.
        screening:
          description: The screening record, or `null` when the message was not screened.
          oneOf:
            - $ref: '#/components/schemas/Screening'
            - type: 'null'
        released:
          type: boolean
          const: true
          description: >-
            Present only when a release emitted the event: it is the first time this message is visible.
            `message.received` is emitted exactly once per message (re-parse re-emissions excepted).
    MessageQuarantinedData:
      type: object
      description: As `message.received`, plus `quarantine_reason`, and without `extracted_text`.
      required: [message, thread_id, trust, attachments, quarantine_reason]
      properties:
        message: {$ref: '#/components/schemas/MessageSummary'}
        thread_id: {$ref: '#/components/schemas/ThreadId'}
        trust: {$ref: '#/components/schemas/Trust'}
        attachments:
          type: array
          items: {$ref: '#/components/schemas/EventAttachment'}
        quarantine_reason: {$ref: '#/components/schemas/QuarantineReason'}
        reprocessed:
          type: boolean
          const: true
          description: Present only on an event re-emitted by a re-parse ([J3]).
        screening:
          description: The screening record, or `null` when the message was not screened.
          oneOf:
            - $ref: '#/components/schemas/Screening'
            - type: 'null'
        rescreened:
          type: boolean
          const: true
          description: >-
            Present only when a late signal moved a delivered message back to quarantine. A re-parse that is
            also such a late signal emits one `message.quarantined` with both `reprocessed` and `rescreened`.
    MessageReleasedData:
      type: object
      required: [message, released_by_key_id, released_by_user_id, reason]
      properties:
        message: {$ref: '#/components/schemas/MessageSummary'}
        released_by_key_id:
          description: The API key that released the message, or `null` for a release by a person in the console.
          anyOf:
            - $ref: '#/components/schemas/KeyId'
            - type: 'null'
        released_by_user_id:
          description: The console user who released the message, or `null` for a release by API key.
          anyOf:
            - $ref: '#/components/schemas/UserId'
            - type: 'null'
        reason:
          type: string
    MessageTriagedData:
      type: object
      required: [message_id, thread_id, triage]
      properties:
        message_id: {$ref: '#/components/schemas/MessageId'}
        thread_id: {$ref: '#/components/schemas/ThreadId'}
        triage: {$ref: '#/components/schemas/Triage'}
    MessageScreenedData:
      type: object
      description: No subject, address or text. An endpoint subscribed to `message.screened` needs `quarantine:review`.
      required: [message_id, thread_id, message_status, quarantine_reason, late, screening]
      properties:
        message_id: {$ref: '#/components/schemas/MessageId'}
        thread_id: {$ref: '#/components/schemas/ThreadId'}
        message_status: {$ref: '#/components/schemas/MessageStatus'}
        quarantine_reason:
          oneOf:
            - $ref: '#/components/schemas/QuarantineReason'
            - type: 'null'
        late:
          type: boolean
        screening: {$ref: '#/components/schemas/Screening'}
    MessageSentData:
      type: object
      required: [message, provider, provider_message_id, sent_via_fallback]
      properties:
        message: {$ref: '#/components/schemas/MessageSummary'}
        provider:
          type: string
          description: '`smtp` for a domain that sends through its own SMTP relay (`provider_message_id` is then `smtp:{host}:{Message-ID}`).'
          enum: [cloudflare, ses, smtp, simulator, loopback]
        provider_message_id:
          type: [string, 'null']
          description: '`null` when a person resolved an uncertain send as sent (`resolveMessage` with `outcome: "sent"`).'
        sent_via_fallback:
          type: boolean
          description: Sent from the identity's platform address because the domain was failing.
    MessageDeliveredData:
      type: object
      required: [message_id, recipient, smtp_code]
      properties:
        message_id: {$ref: '#/components/schemas/MessageId'}
        recipient: {$ref: '#/components/schemas/EmailAddress'}
        smtp_code:
          type: [string, 'null']
    MessageDeferredData:
      type: object
      required: [message_id, recipient, smtp_code, smtp_response]
      properties:
        message_id: {$ref: '#/components/schemas/MessageId'}
        recipient: {$ref: '#/components/schemas/EmailAddress'}
        smtp_code:
          type: [string, 'null']
        smtp_response:
          type: [string, 'null']
          maxLength: 512
    MessageBouncedData:
      type: object
      required: [message_id, recipient, bounce_type, smtp_code, smtp_response, suppressed]
      properties:
        message_id: {$ref: '#/components/schemas/MessageId'}
        recipient: {$ref: '#/components/schemas/EmailAddress'}
        bounce_type:
          type: string
          enum: [hard, soft]
        smtp_code:
          type: [string, 'null']
        smtp_response:
          type: [string, 'null']
          maxLength: 512
        suppressed:
          type: boolean
          description: The recipient was added to the suppression list (hard bounces).
    MessageComplainedData:
      type: object
      required: [message_id, recipient, suppressed]
      properties:
        message_id: {$ref: '#/components/schemas/MessageId'}
        recipient: {$ref: '#/components/schemas/EmailAddress'}
        suppressed:
          type: boolean
          const: true
          description: A complaint always creates a permanent suppression.
    MessageRejectedData:
      type: object
      required: [message_id, reason, detail]
      properties:
        message_id: {$ref: '#/components/schemas/MessageId'}
        reason: {$ref: '#/components/schemas/SendFailureReason'}
        detail:
          type: [string, 'null']
          description: The transport's explanation, for example its error code.
    MessageFailedData:
      type: object
      required: [message_id, reason]
      properties:
        message_id: {$ref: '#/components/schemas/MessageId'}
        reason: {$ref: '#/components/schemas/SendFailureReason'}
    MessageUncertainData:
      type: object
      required: [message_id, reason, fix]
      properties:
        message_id: {$ref: '#/components/schemas/MessageId'}
        reason: {$ref: '#/components/schemas/SendFailureReason'}
        fix:
          type: string
          description: What to do, for example to check the recipient's mailbox and then call `resolve`.
    MessageReconciledData:
      type: object
      required: [message_id, status]
      properties:
        message_id: {$ref: '#/components/schemas/MessageId'}
        status:
          description: The real status the uncertain send moved to.
          $ref: '#/components/schemas/OutboundStatus'
    MessageSuppressedData:
      type: object
      required: [message_id, recipients]
      properties:
        message_id: {$ref: '#/components/schemas/MessageId'}
        recipients:
          type: array
          items: {$ref: '#/components/schemas/EmailAddress'}
    MessageCanceledData:
      type: object
      required: [message_id]
      properties:
        message_id: {$ref: '#/components/schemas/MessageId'}
    MessageLabelsChangedData:
      type: object
      required: [messages, added, removed, actor, source, request_id, part, parts]
      properties:
        messages:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: object
            required: [message_id, thread_id]
            properties:
              message_id: {$ref: '#/components/schemas/MessageId'}
              thread_id: {$ref: '#/components/schemas/ThreadId'}
        added:
          type: array
          maxItems: 64
          items: {$ref: '#/components/schemas/Label'}
        removed:
          type: array
          maxItems: 64
          items: {$ref: '#/components/schemas/Label'}
        actor:
          type: object
          required: [kind, key_id, user_id]
          properties:
            kind:
              type: string
              enum: [key, person]
            key_id:
              oneOf:
                - $ref: '#/components/schemas/KeyId'
                - type: 'null'
            user_id:
              oneOf:
                - $ref: '#/components/schemas/UserId'
                - type: 'null'
        source:
          type: string
          enum: [message, thread, batch]
        request_id: {$ref: '#/components/schemas/RequestId'}
        part:
          type: integer
          minimum: 1
        parts:
          type: integer
          minimum: 1
    VerificationReceivedData:
      type: object
      description: The code or link itself is only available through `wait`.
      required: [message_id, sender_domain, kind, account_id]
      properties:
        message_id: {$ref: '#/components/schemas/MessageId'}
        sender_domain:
          type: string
        kind:
          type: string
          enum: [code, link]
        account_id:
          description: The approved service-ledger entry that matched, or `null` when the tenant does not require approval.
          oneOf:
            - $ref: '#/components/schemas/ServiceAccountId'
            - type: 'null'

    CalendarReceivedData:
      type: object
      description: The `uid` is text the sender chose; read the object with `getMessage`.
      required: [message_id, thread_id, object_status, method, uid, sequence, recurrence_id, verified, verified_by, reason, organized_here]
      properties:
        message_id: {$ref: '#/components/schemas/MessageId'}
        thread_id: {$ref: '#/components/schemas/ThreadId'}
        object_status:
          type: string
        method:
          type: [string, 'null']
        uid:
          type: [string, 'null']
          maxLength: 1024
        sequence:
          type: [integer, 'null']
        recurrence_id:
          oneOf:
            - $ref: '#/components/schemas/CalendarTime'
            - type: 'null'
        verified:
          type: boolean
        verified_by:
          type: [string, 'null']
        reason:
          type: [string, 'null']
        organized_here:
          type: boolean
        released:
          type: boolean
          description: Present, `true`, when a release from quarantine or screening emitted the event.
        reprocessed:
          type: boolean
          description: Present, `true`, when a re-parse changed the calendar object.
    DraftSummary:
      type: object
      description: >-
        The draft summary carried by `draft.*` events. No subject, body, address, filename or note, so an
        endpoint needs only `webhooks:manage` to receive them.
      required: [id, identity_id, draft_kind, kind, status, revision, digest, recipient_count, attachment_count, send_at, in_reply_to, forward_of, thread_id, client_id]
      properties:
        id: {$ref: '#/components/schemas/DraftId'}
        identity_id: {$ref: '#/components/schemas/IdentityId'}
        draft_kind: {$ref: '#/components/schemas/DraftKind'}
        kind:
          type: string
          enum: [transactional, marketing, auto_reply]
        status: {$ref: '#/components/schemas/DraftStatus'}
        revision:
          type: integer
          minimum: 1
        digest:
          type: [string, 'null']
        recipient_count:
          type: integer
          minimum: 0
        attachment_count:
          type: integer
          minimum: 0
        send_at:
          type: [string, 'null']
          format: date-time
        in_reply_to:
          oneOf:
            - $ref: '#/components/schemas/MessageId'
            - type: 'null'
        forward_of:
          oneOf:
            - $ref: '#/components/schemas/MessageId'
            - type: 'null'
        thread_id:
          oneOf:
            - $ref: '#/components/schemas/ThreadId'
            - type: 'null'
        client_id:
          type: [string, 'null']
    DraftApprovalRequestedData:
      type: object
      required: [draft, reason, requested_by_key_id]
      properties:
        draft: {$ref: '#/components/schemas/DraftSummary'}
        reason: {$ref: '#/components/schemas/DraftApprovalReason'}
        requested_by_key_id:
          oneOf:
            - $ref: '#/components/schemas/KeyId'
            - type: 'null'
    DraftApprovedData:
      type: object
      required: [draft, send, approved_by_key_id, approved_by_user_id, on_behalf_of]
      properties:
        draft: {$ref: '#/components/schemas/DraftSummary'}
        send:
          type: boolean
        approved_by_key_id:
          description: The API key that approved, or `null` for a person in the console.
          oneOf:
            - $ref: '#/components/schemas/KeyId'
            - type: 'null'
        approved_by_user_id:
          description: The console user who approved, or `null` for an API key.
          oneOf:
            - $ref: '#/components/schemas/UserId'
            - type: 'null'
        on_behalf_of:
          type: [string, 'null']
          description: The caller's opaque user ID, when an API key gave one.
    DraftRejectedData:
      type: object
      required: [draft, reason, rejected_by_key_id, rejected_by_user_id, on_behalf_of]
      properties:
        draft: {$ref: '#/components/schemas/DraftSummary'}
        reason:
          type: string
          enum: [operator, expired]
        rejected_by_key_id:
          oneOf:
            - $ref: '#/components/schemas/KeyId'
            - type: 'null'
        rejected_by_user_id:
          oneOf:
            - $ref: '#/components/schemas/UserId'
            - type: 'null'
        on_behalf_of:
          type: [string, 'null']
    DraftSentData:
      type: object
      required: [draft, message_id, thread_id, message_status]
      properties:
        draft: {$ref: '#/components/schemas/DraftSummary'}
        message_id: {$ref: '#/components/schemas/MessageId'}
        thread_id: {$ref: '#/components/schemas/ThreadId'}
        message_status:
          type: string
          description: '`suppressed` when every recipient was suppressed.'
          enum: [queued, suppressed]
    DraftFailedData:
      type: object
      required: [draft, reason, attempts]
      properties:
        draft: {$ref: '#/components/schemas/DraftSummary'}
        reason: {$ref: '#/components/schemas/DraftFailureReason'}
        attempts:
          type: integer
          minimum: 1
    IdentityCreatedData:
      type: object
      required: [identity]
      properties:
        identity: {$ref: '#/components/schemas/Identity'}
    IdentityUpdatedData:
      type: object
      required: [identity, changed]
      properties:
        identity: {$ref: '#/components/schemas/Identity'}
        changed:
          type: array
          description: The names of the fields that changed.
          items:
            type: string
    IdentityPausedData:
      type: object
      required: [identity_id, reason, metrics]
      properties:
        identity_id: {$ref: '#/components/schemas/IdentityId'}
        reason: {$ref: '#/components/schemas/PauseReason'}
        metrics:
          type: [object, 'null']
          description: For `abuse_threshold`, the complaint and bounce figures that triggered the pause; otherwise `null`.
    IdentityResumedData:
      type: object
      required: [identity_id]
      properties:
        identity_id: {$ref: '#/components/schemas/IdentityId'}
    IdentityDeletedData:
      type: object
      required: [identity_id, erasure_request_id]
      properties:
        identity_id: {$ref: '#/components/schemas/IdentityId'}
        erasure_request_id: {$ref: '#/components/schemas/ErasureRequestId'}
    IdentityAddressData:
      type: object
      description: Payload of `identity.address_added`, `identity.address_activated` and `identity.address_retired`.
      required: [address]
      properties:
        address: {$ref: '#/components/schemas/Address'}
    IdentityAddressPromotedData:
      type: object
      required: [address, previous_primary]
      properties:
        address: {$ref: '#/components/schemas/Address'}
        previous_primary:
          description: The previous primary, now an alias with status `retiring` and its `retire_at`.
          $ref: '#/components/schemas/Address'

    IdentityKeyEventData:
      type: object
      description: Payload of `identity.key_created` and `identity.key_revoked`.
      required: [identity_id, kid]
      properties:
        identity_id: {$ref: '#/components/schemas/IdentityId'}
        kid: {$ref: '#/components/schemas/IdentityKeyKid'}
    IdentityKeyRotatedData:
      type: object
      required: [identity_id, kid, previous_kid]
      properties:
        identity_id: {$ref: '#/components/schemas/IdentityId'}
        kid:
          description: The new active key.
          $ref: '#/components/schemas/IdentityKeyKid'
        previous_kid:
          description: The key now `retiring`, or `null` when the rotation created the identity's first key.
          oneOf:
            - $ref: '#/components/schemas/IdentityKeyKid'
            - type: 'null'

    DomainEventData:
      type: object
      description: Payload of `domain.created` and `domain.verified`.
      required: [domain]
      properties:
        domain: {$ref: '#/components/schemas/Domain'}
    DomainDegradedData:
      type: object
      required: [domain_id, issues]
      properties:
        domain_id: {$ref: '#/components/schemas/DomainId'}
        issues:
          type: array
          items: {$ref: '#/components/schemas/DomainIssue'}
    DomainFailingData:
      type: object
      required: [domain_id, issues, fallback_active]
      properties:
        domain_id: {$ref: '#/components/schemas/DomainId'}
        issues:
          type: array
          items: {$ref: '#/components/schemas/DomainIssue'}
        fallback_active:
          type: boolean
    DomainSuspendedData:
      type: object
      required: [domain_id, reason]
      properties:
        domain_id: {$ref: '#/components/schemas/DomainId'}
        reason:
          type: string
          enum: [failing_14_days, nameservers_changed, ownership_record_missing, registration_changed]
    DomainRecoveredData:
      type: object
      required: [domain_id, from_state]
      properties:
        domain_id: {$ref: '#/components/schemas/DomainId'}
        from_state: {$ref: '#/components/schemas/DomainState'}
    DomainReminderData:
      type: object
      required: [domain_id, state, hours_in_state]
      properties:
        domain_id: {$ref: '#/components/schemas/DomainId'}
        state: {$ref: '#/components/schemas/DomainState'}
        hours_in_state:
          type: integer
          description: 24, 72 and 168 (7 days); `288` (12 days) for a domain never verified, two days before its unverified expiry; `504` (21 days) is the final reminder for a `nameservers` domain still `pending` before Cloudflare deletes its zone at 28 days.
          enum: [24, 72, 168, 288, 504]
    DomainRemovedData:
      type: object
      required: [domain_id, reason]
      properties:
        domain_id: {$ref: '#/components/schemas/DomainId'}
        reason:
          type: string
          description: >-
            `requested`: removed through `DELETE /v1/domains/{domain_id}`. `zone_expired`: a `nameservers`
            zone was never activated and Cloudflare deleted it; the domain can be added again. `evicted`: the
            domain was never verified, and another tenant proved control of its DNS with a claim record.
            `unverified_expired`: the domain was never verified within 14 days of being added (or of its
            zone's activation).
          enum: [requested, zone_expired, evicted, unverified_expired]

    ErasureCompletedData:
      type: object
      required: [erasure_request]
      properties:
        erasure_request: {$ref: '#/components/schemas/ErasureRequest'}
    ErasureFailedData:
      type: object
      required: [erasure_request_id, step, error]
      properties:
        erasure_request_id: {$ref: '#/components/schemas/ErasureRequestId'}
        step:
          type: string
          description: The job step that failed, for example `erase_mailboxes`. The step was retried until 20 hours after the first request.
        error:
          type: string
    ExportCompletedData:
      type: object
      description: Fetch the download link with `getExport`.
      required: [export_id, expires_at]
      properties:
        export_id: {$ref: '#/components/schemas/ExportId'}
        expires_at:
          type: string
          format: date-time
    SuppressionCreatedData:
      type: object
      required: [address_hint, reason, source_message_id]
      properties:
        address_hint:
          type: string
          examples: [j***@example.net]
        reason: {$ref: '#/components/schemas/SuppressionReason'}
        source_message_id:
          oneOf:
            - $ref: '#/components/schemas/MessageId'
            - type: 'null'
    QuotaWarningData:
      type: object
      required: [metric, used, limit, scope]
      properties:
        metric:
          type: string
          description: The daily send cap that was reached. v1 emits this event only for `sends` (the tenant cap and each identity's cap); the agentic budget answers `429 agentic_budget_exhausted` without a warning event.
          enum: [sends]
        used:
          type: integer
          minimum: 0
        limit:
          type: integer
          minimum: 0
        scope:
          type: string
          enum: [tenant, identity]
    WebhookDisabledData:
      type: object
      required: [webhook_id, reason]
      properties:
        webhook_id: {$ref: '#/components/schemas/WebhookId'}
        reason:
          type: string
          description: Why the endpoint was disabled, for example `failing`.
    WebhookTestData:
      type: object
      required: [message]
      properties:
        message:
          type: string
          const: hello

    MemberInvitedData:
      type: object
      required: [invitation_id, email_hint, role]
      properties:
        invitation_id: {$ref: '#/components/schemas/InvitationId'}
        email_hint:
          type: string
          description: The invited address, masked.
          examples: [k***@acmecarhire.example]
        role: {$ref: '#/components/schemas/InvitationRole'}
    MemberJoinedData:
      type: object
      required: [user_id, role]
      properties:
        user_id: {$ref: '#/components/schemas/UserId'}
        role: {$ref: '#/components/schemas/MemberRole'}
    MemberRoleChangedData:
      type: object
      required: [user_id, from, to]
      properties:
        user_id: {$ref: '#/components/schemas/UserId'}
        from: {$ref: '#/components/schemas/MemberRole'}
        to: {$ref: '#/components/schemas/MemberRole'}
    MemberRemovedData:
      type: object
      required: [user_id]
      properties:
        user_id: {$ref: '#/components/schemas/UserId'}
    BillingPlanChangedData:
      type: object
      required: [from_plan, to_plan, reason]
      properties:
        from_plan:
          type: string
          examples: [free]
        to_plan:
          type: string
          examples: [developer]
        reason:
          type: string
          description: '`portal`: an upgrade confirmed in the Stripe Customer Portal. `scheduled_downgrade`: a downgrade the owner scheduled took effect at the period end. `payment_recovered`: the plan was restored after a late payment, or when a dispute was closed in the workspace''s favour. `dispute`: a payment was disputed, so the default plan applies until the dispute closes.'
          enum: [checkout, portal, scheduled_downgrade, payment_failed_grace_ended, payment_recovered, canceled, operator, dispute]
    BillingPaymentFailedData:
      type: object
      required: [grace_until]
      properties:
        grace_until:
          type: string
          format: date-time
          description: The workspace keeps its plan until then.
    BillingLimitReachedData:
      type: object
      required: [feature, granted, resets_at]
      properties:
        feature: {$ref: '#/components/schemas/UsageFeatureName'}
        granted:
          type: [integer, 'null']
          minimum: 0
        resets_at:
          type: [string, 'null']
          format: date-time
    TenantPolicyUpdatedData:
      type: object
      required: [fields, by, actor_key_id, actor_user_id, policy_version]
      properties:
        fields:
          type: array
          description: The dotted paths of the fields written.
          items:
            type: string
          examples: [[retention.message_days, search.custom_refs]]
        by:
          type: string
          description: Who wrote it.
          enum: [platform, partner, tenant, console]
        actor_key_id:
          oneOf:
            - $ref: '#/components/schemas/KeyId'
            - type: 'null'
        actor_user_id:
          description: The person, for a console save.
          oneOf:
            - $ref: '#/components/schemas/UserId'
            - type: 'null'
        policy_version:
          type: integer
          minimum: 1
    SignupVerifiedData:
      type: object
      description: A platform event with `tenant_id` and `identity_id` set.
      required: [signup_id, address, verified_via, user_id]
      properties:
        signup_id: {$ref: '#/components/schemas/AgentSignupId'}
        address: {$ref: '#/components/schemas/EmailAddress'}
        verified_via:
          type: string
          enum: [code, link, claim]
        user_id: {$ref: '#/components/schemas/UserId'}
    AccountEventData:
      type: object
      required: [account]
      properties:
        account: {$ref: '#/components/schemas/ServiceAccount'}
    AccountRejectedData:
      type: object
      required: [account, reason]
      properties:
        account: {$ref: '#/components/schemas/ServiceAccount'}
        reason:
          type: string
          enum: [operator, expired]
