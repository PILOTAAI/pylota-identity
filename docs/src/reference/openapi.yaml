openapi: 3.1.0
jsonSchemaDialect: https://spec.openapis.org/oas/3.1/dialect/base
info:
  title: Pylota Mail API
  version: '1.0.0'
  summary: Email and identity for AI agents, running on your own Cloudflare account.
  description: |
    The machine-readable contract for the Pylota Mail REST API. `docs/src/reference/api.md` is the
    readable version; if the two disagree, this document is the contract. A running deployment serves
    the same document, generated from the Rust types (`crates/api-types`, utoipa), at `/openapi.json`.

    ## Conventions

    - **Base URL.** Versioned endpoints live under `https://{host}/v1`. `/health`, `/openapi.json`,
      `/hooks/ses`, `/hooks/ses/inbound` and the `/.well-known/*` documents live at the host root; their
      path items override `servers`.
    - **Authentication.** `Authorization: Bearer pmk_live_…` (or `pmk_test_…`). Only `/health`,
      `/openapi.json`, `/v1/plans`, `/.well-known/*`, `/v1/links/{token}`, `POST /v1/agent-signup`,
      `/hooks/ses` and `/hooks/ses/inbound` are unauthenticated. `/v1/links/{token}` is checked by its
      signature (`GET` for downloads, `PUT` for upload bytes), and the two `/hooks/ses*` endpoints by the
      SNS signature (version 2 only). `GET /v1/events/stream` also accepts a single-use stream token in
      `Sec-WebSocket-Protocol` (`streamToken`), never in the URL.
    - **Not described here.** The server-rendered console (`/console/*`, including `/console/sign-in…`,
      `/console/sign-up`, `/console/waitlist`, `/console/workspaces/new`,
      `/console/oauth/{provider}/start`, `/console/oauth/{provider}/callback`,
      `/console/settings/security`, `/console/settings/notifications`, `/console/plan/return`,
      `/console/connect`, the agent sign-up pages `/console/agent-signup/verify`, `/console/agent-signup/claim`
      and `/console/agent-signup/refuse`, and the notification unsubscribe pair
      `/console/notifications/unsubscribe`) and
      `/billing/stripe/webhook` (Stripe events) are served by the same Worker but are not part of the
      developer API: they use session cookies, OAuth state, unsubscribe tokens and Stripe signatures, not
      API keys.
    - **Hosts.** The console answers on `PM_CONSOLE_HOST`, which defaults to `PM_API_HOST`. When the two
      differ, console paths answer only on `PM_CONSOLE_HOST`, and the API host `PM_API_HOST` serves only
      the REST API (`/v1/*`), MCP (`/mcp`), `/openapi.json`, `/health`, `/.well-known/*`, signed links
      (`/v1/links/*`), `/hooks/*` and `/billing/stripe/webhook`; anything else returns
      `404 route_not_found`, and no cookie is set or read on the API host. A route called with a method
      it does not have returns `405 method_not_allowed` with an `Allow` header.
    - **Format.** JSON (`application/json; charset=utf-8`). Times are RFC 3339 UTC strings. Sizes are bytes.
    - **IDs** are a type prefix, an underscore and a 26-character upper-case Crockford base32 ULID
      (`ten_ idn_ adr_ dom_ thr_ msg_ att_ whk_ dlv_ evt_ key_ era_ exp_ job_ aud_ req_ usr_ inv_ dlq_ hld_ prb_ ptn_ sac_ drf_ evc_ wsc_ sfb_ upl_ asu_`).
    - **Pagination.** List endpoints take `limit` (default 25, max 100) and `cursor`, and return
      `{ "data": [...], "next_cursor": "…" | null }`. Cursors are opaque and expire after 24 hours
      (`410 cursor_expired`). A list cursor is keyset-based (`created_at`, then `id`, newest first),
      MACed under the deployment's cursor key and bound to the operation, its filters and the calling key;
      one used elsewhere, altered, or signed by an unknown key is `400 invalid_request` (path `cursor`).
      Two exceptions: the event log (`/events` and `/event-consumers/{consumer_id}/events`) pages by log
      position, with its own `limit` (1–500, default 100) and cursors that expire only when retention
      removes the events behind them; the tenant's queue of drafts (`/tenants/{tenant_id}/drafts`) lists
      oldest first.
    - **Idempotency.** `Idempotency-Key` is required on send, reply, reply-all, forward, calendar-reply
      and draft send (`…/drafts/{draft_id}/send`), except on a dry run (`dry_run=true`), where it is
      optional and never recorded. It is optional on every other `POST` except ten
      (`x-idempotency: none`), which ignore it and never record it: the two search endpoints
      (`/identities/{identity_id}/search` and `/tenants/{tenant_id}/search`, which return mail and change
      nothing, so no record ever stores their results), `batch-get`
      (`/identities/{identity_id}/messages/batch-get`, for the same reason), the two signing endpoints
      (`…/assertions` and `…/http-signatures`), the two SNS endpoints (`/hooks/ses` and
      `/hooks/ses/inbound`), `/events/stream-tokens`, because each call mints a single-use secret that a
      stored replay would have to keep or drop, `/agent-signup` (no key), whose answer holds a key secret
      for the same reason, and the mailbox restore (`/platform/identities/{identity_id}/restore`). No
      stored replay ever holds mail content: a replayed response that carries a
      message, thread or draft (release, cancel, resolve, hold, the draft routes) re-reads the resource
      with the caller's visibility. Keys are kept for 30 days, scoped per
      identity for mail, and per calling API key and tenant (or partner, or deployment, when the request
      names no tenant) for everything else. A replay returns the original response with the header
      `Idempotent-Replayed: true` (and `"deduplicated": true` in mail responses); a response that carried
      a one-time secret is replayed without it and with `"secret_replayed": false`.
    - **Rate limits.** Every authenticated response carries `RateLimit-Limit`: the limit of the bucket that
      applied, per period. A `429` also carries `Retry-After` and `RateLimit-Reset`, the seconds to the end
      of the bucket's current period; for `rate_limited` the two are equal, and the other `429` codes set
      `Retry-After` to their own wait. `RateLimit-Remaining` is not sent: the Workers rate-limiting binding
      answers only allow or deny, so the Worker cannot know how many requests are left.
    - **Errors.** Every non-2xx response uses the `Error` envelope, whose `docs` links to the code's entry on
      the deployment's published errors page (`PM_DOCS_URL`). Handle unknown error codes by HTTP status.
    - **Evolution.** Additive changes (new fields, new event types, new enum values) can happen within
      `/v1`. Clients must ignore unknown fields and handle unknown enum values, even where this document
      lists an `enum`.
    - **Untrusted content.** Every text field that comes from email (subjects, display names, filenames,
      bodies, attachment text, snippets) is untrusted. Show it to a model inside a clearly delimited block,
      never as instructions.

    ## Vendor extensions

    | Extension | On | Meaning |
    |---|---|---|
    | `x-required-permission` | operation | Array of permissions the key must hold, all of them. `[]` means any valid key |
    | `x-required-permission-any` | operation | Array of permissions of which the key must hold at least one. Used with `x-required-permission: []` |
    | `x-key-levels` | operation | Key levels (`platform`, `partner`, `tenant`, `identity`) that can call the operation at all. A `partner` key acts only on the tenants its partner's keys created |
    | `x-permission-notes` | operation | Conditional permission or scope rules that the two fields above cannot express |
    | `x-rate-limit-buckets` | operation | Rate-limit buckets the request counts against (`api`, `search`, `agentic`, `send`, `sign`, `partner`, `signin`; `partner` only for a partner key's calls; `signin` per client network, shared with the console's sign-in forms) |
    | `x-idempotency` | operation | `required`, `optional` or `none` for the `Idempotency-Key` header. `required` means a request without it fails with `400 idempotency_key_required`, except a dry run (`dry_run=true`). `none` means the header is ignored and never recorded |
    | `x-error-codes` | response | The `error.code` values this operation can return with that status |
    | `x-sdk` | operation | `false` when neither SDK (Rust or TypeScript) has a method for the operation: the SES hooks, which only Amazon SNS calls, and `security.txt`. Every other operation has exactly one method in each SDK |

    ## Licence

    Pylota Mail is licensed under FSL-1.1-ALv2 (Functional Source License, Version 1.1, ALv2 Future
    License): each release becomes available under Apache-2.0 two years after it is published. The text
    is in [`LICENSE.md`](https://github.com/PILOTAAI/pylota-mail/blob/main/LICENSE.md).
  license:
    name: FSL-1.1-ALv2
    identifier: FSL-1.1-ALv2
servers:
  - url: https://{host}/v1
    description: Versioned REST API of a deployment.
    variables:
      host:
        default: mail.example.com
        description: The deployment's API host (`PM_API_HOST`).
security:
  - apiKey: []
tags:
  - name: Meta
    description: Health, the OpenAPI document and the calling key.
  - name: Tenants
    description: >-
      Tenants and their policy. Keys with `tenants:manage`: platform keys for every tenant, partner keys for
      the tenants their partner's keys created. The tenant's own policy route also takes tenant keys with
      `policy:write`.
  - name: Partners
    description: >-
      Partners: integrators whose partner keys create tenants and act only on those tenants. Platform keys
      with `partners:manage`.
  - name: Identities
    description: Agent identities (one mailbox each).
  - name: Addresses
    description: The addresses of an identity, with promotion to primary and retirement.
  - name: Identity keys
    description: >-
      An identity's Ed25519 signing keys, agent assertions (signed JWTs) and signed HTTP requests (Web Bot
      Auth). Private keys never leave the Worker and no endpoint returns them.
  - name: Service accounts
    description: >-
      The service sign-up ledger: third-party accounts an agent asks to create with its identity's address,
      and the operator's approvals (FR-IDN-10). `accounts:request` and `accounts:approve`.
  - name: Agent sign-up
    description: >-
      Self-sign-up for agents on Pylota Mail Cloud (FR-ASU), behind `PM_AGENT_SIGNUP`. One unauthenticated
      call creates a provisional workspace, one inbox and one key; the named human verifies with a code or
      a link; unverified workspaces are erased after 7 days.
  - name: Domains
    description: The platform domain and tenant domains, DNS records and health.
  - name: Threads
    description: Threads in an identity's mailbox.
  - name: Messages
    description: Messages, raw MIME, attachments, triage and quarantine release.
  - name: Sending
    description: Send, reply, reply-all, forward, calendar-reply, cancel and resolve. `Idempotency-Key` is required on the first five, except on a dry run (`dry_run=true`).
  - name: Drafts
    description: >-
      Drafts, approval before send and scheduled send (FR-DRF). `drafts:read`, `drafts:write`,
      `drafts:approve`; sending a draft needs `messages:send`.
  - name: Uploads
    description: >-
      Files staged by an identity and attached to its sends by `upload_id`. Create, `PUT` the bytes to the
      signed `upload_url`, attach. `messages:send` or `drafts:write`.
  - name: Search
    description: Keyword, semantic, hybrid and agentic search, related messages, contacts and `wait`.
  - name: Quarantine
    description: Quarantined mail.
  - name: Screening
    description: >-
      Screening of inbound mail for agent steering (FR-SCR): feedback on a verdict and the per-identity and
      per-tenant summaries.
  - name: Webhooks
    description: Webhook endpoints, deliveries and replay. Reads need `webhooks:read`; everything else needs `webhooks:manage`, which includes `webhooks:read`.
  - name: Event feed
    description: >-
      The tenant's event log: the feed, durable event consumers, stream tokens and the WebSocket stream.
      Every operation needs `events:read`.
  - name: Suppressions
    description: Suppressed recipients.
  - name: Lists
    description: Receive and send allow and block lists.
  - name: Keys
    description: API keys.
  - name: Privacy
    description: Erasure requests and subject-access exports.
  - name: Usage
    description: Plan, allowances, usage figures, the plan catalog and workspace billing accounts.
  - name: Audit
    description: Audit log.
  - name: Metrics
    description: Pause-window rates with thresholds and headroom, and event counts per hour or day. `metrics:read`.
  - name: Members
    description: Console members and invitations of a workspace. `members:manage`, tenant, partner and platform keys.
  - name: Platform
    description: >-
      Platform operations: signing-key rotation, the dead-letter queue, maintenance jobs, waitlist
      invitations and the list of agent sign-ups. Platform keys with `platform:ops`; every call is
      audit-logged.
  - name: Links and hooks
    description: Signed links (downloads and upload bytes) and the two Amazon SES notification endpoints (delivery events and inbound mail). No API key.
  - name: Well-known
    description: >-
      Documents served at `/.well-known/` on the API host: the security contact, each identity's JWK Set
      and the Web Bot Auth key directory. No API key.
  - name: Events
    description: Webhook events delivered to your endpoints (Standard Webhooks).

paths:

  # ───────────────────────────────────────────── Meta ─────────────────────────────────────────────

  /health:
    servers:
      - url: https://{host}
        description: Deployment root (unversioned).
        variables:
          host:
            default: mail.example.com
            description: The deployment's API host (`PM_API_HOST`).
    get:
      operationId: getHealth
      tags: [Meta]
      summary: Health check
      description: >-
        No authentication. Reports that the Worker is serving, with its version and commit (compiled into
        the release bundle) and `env` (`PM_ENV`); also `ses_region` when SES is configured, `frozen: true` while the deployment is frozen
        for a restore, and `status: degraded` with `ses` or `billing` when a feature is off. `status` is `degraded`, still with `200`, when a feature
        is off because of the
        configuration; a field per feature (`ses`, `billing`, `cf_api_token`) says
        why. A missing required variable or secret, or a malformed optional one, returns
        `503 unavailable` with `details.config_invalid` naming the variable.
      security: []
      x-rate-limit-buckets: []
      x-idempotency: none
      responses:
        '200':
          description: The Worker is serving requests.
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Health'}
              examples:
                ok:
                  value:
                    status: ok
                    version: '1.0.0'
                    commit: abc1234
                    env: production
                degraded:
                  value:
                    status: degraded
                    version: '1.0.0'
                    commit: abc1234
                    env: production
                    ses: sns_topic_missing
        '405':
          description: Any method other than `GET` on this path. `Allow` lists `GET`.
          x-error-codes: [method_not_allowed]
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
            Allow:
              description: The methods this path has.
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
              example:
                error:
                  code: method_not_allowed
                  message: This path does not accept POST.
                  retryable: false
                  fix: Use one of the methods in the Allow header.
                  docs: https://pylotamail.com/docs/reference/errors#code-method_not_allowed
                  request_id: req_01J9Z4K8V4QW7X2M5N6P8R0T1Y
        '500': {$ref: '#/components/responses/InternalError'}
        '503':
          description: >-
            The configuration is invalid: a required variable or secret is missing or malformed, or an
            optional variable is malformed. `details.config_invalid` names it. Every other route answers
            `503 unavailable` too until the configuration is fixed.
          x-error-codes: [unavailable]
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
              example:
                error:
                  code: unavailable
                  message: The deployment's configuration is invalid.
                  retryable: true
                  fix: Set PM_DOH_RESOLVERS to exactly two https URLs and redeploy.
                  docs: https://pylotamail.com/docs/reference/errors#code-unavailable
                  request_id: req_01J9Z4K8V4QW7X2M5N6P8R0T1Y
                  details:
                    config_invalid: PM_DOH_RESOLVERS

  /openapi.json:
    servers:
      - url: https://{host}
        description: Deployment root (unversioned).
        variables:
          host:
            default: mail.example.com
            description: The deployment's API host (`PM_API_HOST`).
    get:
      operationId: getOpenApiDocument
      tags: [Meta]
      summary: OpenAPI document
      description: No authentication. The OpenAPI 3.1 document for this deployment, generated from the Rust types.
      security: []
      x-rate-limit-buckets: []
      x-idempotency: none
      responses:
        '200':
          description: An OpenAPI 3.1.0 document equivalent to this one.
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
          content:
            application/json:
              schema:
                type: object
                description: An OpenAPI 3.1.0 document.
                required: [openapi, info, paths]
                properties:
                  openapi:
                    type: string
                    const: '3.1.0'
                  info:
                    type: object
                  paths:
                    type: object
        '500': {$ref: '#/components/responses/InternalError'}

  /me:
    get:
      operationId: getMe
      tags: [Meta]
      summary: Describe the calling key
      description: >-
        Any valid key. Describes the key that made the request. `mcp_tools` is the key's MCP tool list, or
        `null` for every allowed tool.
      x-required-permission: []
      x-key-levels: [platform, partner, tenant, identity]
      x-rate-limit-buckets: [api]
      x-idempotency: none
      responses:
        '200':
          description: The calling key.
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
            RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Me'}
              example:
                key_id: key_01J9Z3K8V4QW7X2M5N6P8R0T1Y
                name: pylota-api
                level: tenant
                mode: live
                partner_id: null
                tenant_id: ten_01J9Z3K8V4QW7X2M5N6P8R0T1Y
                identity_id: null
                permissions: ['identities:read', 'messages:send', 'search:read']
                mcp_tools: null
                expires_at: null
        '401': {$ref: '#/components/responses/Unauthorized'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}

  # ──────────────────────────────────────────── Tenants ───────────────────────────────────────────

  /tenants:
    post:
      operationId: createTenant
      tags: [Tenants]
      summary: Create a tenant
      description: >-
        Platform and partner keys. `address_suffix` defaults to `"." + slug`; only one tenant (the default tenant
        made by `pmail setup`) can have an empty suffix. `policy` is merged over the defaults (built-in
        defaults, then `PM_DEFAULT_POLICY`). `owner` (optional) creates the workspace's console owner and
        emails them a sign-in link; without it, a platform or partner key can add an owner later with an invitation
        and an ownership transfer in the console. An owner address that this deployment hosts (on the
        platform domain, or an identity's address) gets `400 invalid_request` with
        `details.errors[0].path = "owner.email"`. `billing.mode` defaults to `metered` (plan `free`) on a
        deployment with billing on, and to `disabled` otherwise. With a partner key, the tenant's
        `partner_id` is the key's partner, for good, and its billing mode is the partner's
        `default_billing_mode`; `billing` is platform-only. A partner key's `policy` is checked field by
        field (platform-only, lower-only and free fields, see `TenantPolicy`); it may set
        `quarantine.key_release`. A partner has at most `max_tenants` tenants that are not `erased`
        (`403 partner_tenant_limit`), and a partner key's creations count in the `partner` bucket
        (`RL_PARTNER`, 10 a minute per partner, shared with invitations). The audit row `tenant.create`
        records the `partner_id`.
      x-required-permission: ['tenants:manage']
      x-key-levels: [platform, partner]
      x-permission-notes: >-
        A partner key that sends `billing`, a platform-only policy field, or a lower-only policy field above
        its ceiling gets `403 scope_denied` (`details.field`); beyond the partner's `max_tenants`,
        `403 partner_tenant_limit`.
      x-rate-limit-buckets: [api, partner]
      x-idempotency: optional
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TenantCreateRequest'}
            example:
              slug: acme
              name: Acme Car Hire
              mode: live
              timezone: Europe/London
              address_suffix: .acme
              policy:
                identity_daily_send_cap: 500
              owner:
                email: sam@acmecarhire.example
                name: Sam Patel
              billing:
                mode: exempt
      responses:
        '201':
          description: The tenant was created.
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
            RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}
            Idempotent-Replayed: {$ref: '#/components/headers/Idempotent-Replayed'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Tenant'}
        '400':
          description: >-
            As `BadRequest`, plus `address_reserved` when the address suffix folds to a reserved name
            (`details.field = "address_suffix"`, [D12]).
          x-error-codes: [invalid_request, invalid_idempotency_key, address_reserved]
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403':
          description: >-
            As `Forbidden`, plus `partner_tenant_limit` when the partner already has `max_tenants` tenants
            that are not erased (`details.max_tenants`).
          x-error-codes: [permission_denied, scope_denied, partner_suspended, partner_tenant_limit]
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
              example:
                error:
                  code: partner_tenant_limit
                  message: This partner already has 25 tenants that are not erased.
                  retryable: false
                  fix: Erase a tenant you no longer need, or ask the platform operator to raise max_tenants.
                  docs: https://pylotamail.com/docs/reference/errors#code-partner_tenant_limit
                  request_id: req_01J9Z4K8V4QW7X2M5N6P8R0T1Y
                  details:
                    max_tenants: 25
        '409':
          description: >-
            The slug or address suffix is taken (`suffix_taken` also when the suffix folds to another tenant's,
            for example `.acrne` beside `.acme`, [D12]), or the idempotency key is in use.
          x-error-codes: [slug_taken, suffix_taken, idempotency_conflict, request_in_progress]
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '429':
          description: >-
            A rate limit was hit (`rate_limited`), or the `owner` email's system-mail budget of class
            `invitation` is spent for the creating partner or the platform (`daily_cap_reached`,
            `details.cap: "invitations"`, `details.resets_at` the next 00:00 UTC); no tenant was created.
          x-error-codes: [rate_limited, daily_cap_reached]
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
            Retry-After: {$ref: '#/components/headers/Retry-After'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
    get:
      operationId: listTenants
      tags: [Tenants]
      summary: List tenants
      description: A partner key lists only the tenants its partner's keys created.
      x-required-permission: ['tenants:manage']
      x-key-levels: [platform, partner]
      x-rate-limit-buckets: [api]
      x-idempotency: none
      parameters:
        - name: status
          in: query
          description: Only tenants with this status.
          schema: {$ref: '#/components/schemas/TenantStatus'}
        - name: partner_id
          in: query
          description: >-
            Only tenants created by this partner's keys. An unknown partner, or for a partner key any partner
            but its own, gets `404 partner_not_found`.
          schema: {$ref: '#/components/schemas/PartnerId'}
        - name: mode
          in: query
          description: Only tenants with this mode.
          schema: {$ref: '#/components/schemas/Mode'}
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of tenants.
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
            RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TenantPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '410': {$ref: '#/components/responses/CursorExpired'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}

  /tenants/{tenant_id}:
    parameters:
      - $ref: '#/components/parameters/TenantIdPath'
    get:
      operationId: getTenant
      tags: [Tenants]
      summary: Get a tenant
      description: >-
        Platform keys with `tenants:manage` can read any tenant, and partner keys with `tenants:manage` the
        tenants their partner's keys created, also while the tenant is `erasing` and after it is `erased`
        (its name is then `''`). A tenant key can read its own tenant.
      x-required-permission: ['tenants:manage']
      x-key-levels: [platform, partner, tenant]
      x-permission-notes: A tenant key can read its own tenant without `tenants:manage`.
      x-rate-limit-buckets: [api]
      x-idempotency: none
      responses:
        '200':
          description: The tenant, with its full effective policy.
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
            RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Tenant'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
    patch:
      operationId: updateTenant
      tags: [Tenants]
      summary: Update a tenant
      description: >-
        Updatable: `name`, `timezone`, `policy` (deep merge; `null` resets a field to its default) and
        `status` (`active` or `suspended`). While a tenant is suspended, inbound mail gets a temporary
        failure for up to five days and then a permanent one, and every send is refused (FR-TEN-3).
        `suspended_by` records which level suspended it; a partner key cannot lift a suspension a platform
        key made. Tenants are deleted through an erasure request with `scope: "tenant"`; once a tenant is
        `erasing` or `erased`, only the erasure job changes its status (`409 tenant_erased` for a platform
        key, `404 tenant_not_found` for any other key). `partner_id` and `mode` never change. Only a
        platform key, or the partner key of the tenant's own partner, can set
        `policy.quarantine.key_release` (a tenant key cannot call this operation: it can never hold
        `tenants:manage`, and on `updateTenantPolicy` the field is not writable for it). A value a platform key
        sets on a lower-only policy field becomes that field's ceiling for partner keys and the tenant's own
        writers, and a value the tenant's partner key sets becomes its partner ceiling for the tenant's own
        writers. Every policy write is a compare-and-set (`503 unavailable` after three lost attempts),
        writes the audit row `tenant.policy_update` and emits `tenant.policy_updated`.
      x-required-permission: ['tenants:manage']
      x-key-levels: [platform, partner]
      x-permission-notes: >-
        A partner key updates only the tenants its partner's keys created. Each policy field present is
        checked by its class (see `TenantPolicy`): a platform-only field, or a lower-only field above
        min(deployment default, platform ceiling), gets `403 scope_denied` with `details.field` and
        `details.reason` (`not_writable` or `above_ceiling`), and so does `status: "active"` on a tenant a
        platform key suspended (`details.field = "status"`).
      x-rate-limit-buckets: [api]
      x-idempotency: none
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TenantUpdateRequest'}
            example:
              policy:
                max_recipients: 20
                retention:
                  raw_days: null
      responses:
        '200':
          description: The updated tenant.
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
            RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Tenant'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: >-
            A platform key changed the `status` of a tenant that is `erasing` or `erased` (`tenant_erased`),
            or dropped a zone from `policy.domains.cloudflare_zones` while the tenant still has domains in it
            (`domain_in_use`, `details.reason = "zone_has_domains"`, `details.domain_ids`; [H13]), or tried to
            suspend the default tenant, which holds the system identity (`system_protected`, [A17]).
          x-error-codes: [tenant_erased, domain_in_use, system_protected]
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}

  /tenants/{tenant_id}/policy:
    parameters:
      - $ref: '#/components/parameters/TenantIdPath'
    get:
      operationId: getTenantPolicy
      tags: [Tenants]
      summary: Read a tenant's policy with the caller's limits
      description: >-
        The tenant's full effective policy and, for every field, what the calling key may do with it: its
        class, whether it may write it at all, the loosest value it may set on a lower-only field
        (`ceiling`, and which bound decided it), and whether loosening a guard field needs a person.
        Changes nothing and writes no audit row. Docs › Workspace policy.
      x-required-permission: ['policy:write']
      x-key-levels: [platform, partner, tenant]
      x-permission-notes: >-
        A tenant key reads only its own tenant, a partner key only the tenants its partner's keys created.
        Identity keys can never hold `policy:write`.
      x-rate-limit-buckets: [api]
      x-idempotency: none
      responses:
        '200':
          description: The policy view for the calling key.
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
            RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TenantPolicyView'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
    patch:
      operationId: updateTenantPolicy
      tags: [Tenants]
      summary: Change a tenant's policy
      description: >-
        Deep-merges a partial policy (`null` resets a field to its default; arrays replace) and checks each
        field sent by the caller's level (docs › Configuration › Who may change a field). For a tenant key:
        free fields take any valid value; a lower-only field may be set at most to its workspace ceiling,
        the strictest of the deployment default, the platform ceiling and the partner ceiling; a guard field
        (`send_allowlist_only`, `quarantine.on_auth_fail`, `quarantine.spam_threshold`,
        `quarantine.unsolicited_otp`) may only be tightened unless API keys may take decisions reserved for
        people on this tenant; platform-only fields and `quarantine.key_release` are refused. One refused
        field refuses the whole write. Every write is a compare-and-set on the tenant's `policy_version`,
        writes the audit row `tenant.policy_update` and emits `tenant.policy_updated`. A platform key's
        value on a lower-only field becomes its platform ceiling, and the tenant's partner key's value its
        partner ceiling.
      x-required-permission: ['policy:write']
      x-key-levels: [platform, partner, tenant]
      x-permission-notes: >-
        A tenant key writes only its own tenant, a partner key only its own tenants. A refused field gets
        `403 scope_denied` with `details.field` and `details.reason` (`not_writable`, or `above_ceiling` with
        `details.ceiling` and `details.ceiling_source`); a tenant key loosening a guard field where keys may
        not take decisions reserved for people (`PM_QUARANTINE_KEY_RELEASE=off` and no
        `quarantine.key_release`) gets `403 permission_denied` with `details.field` and
        `details.reason = "person_required"`. A non-platform write to an `erasing` or `erased` tenant gets
        `404 tenant_not_found`.
      x-rate-limit-buckets: [api]
      x-idempotency: none
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TenantPolicyPatch'}
            example:
              retention:
                message_days: 365
              search:
                custom_refs:
                  - name: booking
                    pattern: 'BK-\d{4,6}'
                    normalise: upper
      responses:
        '200':
          description: The policy view after the write.
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
            RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TenantPolicyView'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403':
          description: >-
            The key lacks `policy:write`, or a field may not be written by the key's level
            (`scope_denied`), or a tenant key tried to loosen a guard field where only people may
            (`permission_denied` with `details.reason = "person_required"`), or the key's partner is
            suspended.
          x-error-codes: [permission_denied, scope_denied, partner_suspended]
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
              example:
                error:
                  code: scope_denied
                  message: tenant_daily_send_cap may be at most 1000 for this workspace.
                  retryable: false
                  fix: Send a value at or below 1000, or ask the provider that set it to raise it.
                  docs: https://pylotamail.com/docs/reference/errors#code-scope_denied
                  request_id: req_01J9Z4K8V4QW7X2M5N6P8R0T1Y
                  details:
                    field: tenant_daily_send_cap
                    reason: above_ceiling
                    ceiling: 1000
                    ceiling_source: partner
        '404': {$ref: '#/components/responses/NotFound'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: A dependency is unavailable, or the write lost the compare-and-set on `policy_version` three times to concurrent writes; retry.

  # ──────────────────────────────────────────── Partners ──────────────────────────────────────────

  /partners:
    post:
      operationId: createPartner
      tags: [Partners]
      summary: Create a partner
      description: >-
        Platform keys with `partners:manage`. A partner is an integrator that creates tenants for its own
        customers and manages them with partner keys (FR-KEY-4), which a platform key then mints with
        `POST /v1/keys` (`level: partner`). Every tenant a partner key creates gets the partner's
        `partner_id` and `default_billing_mode`. `max_tenants` (default 25) and `ramp_exempt` (default
        `false`) bound what the partner's keys can create and send. Audit-logged (`partner.create`).
      x-required-permission: ['partners:manage']
      x-key-levels: [platform]
      x-rate-limit-buckets: [api]
      x-idempotency: optional
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PartnerCreateRequest'}
            example:
              name: Pylota
              default_billing_mode: exempt
      responses:
        '201':
          description: The partner was created.
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
            RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}
            Idempotent-Replayed: {$ref: '#/components/headers/Idempotent-Replayed'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Partner'}
              example:
                id: ptn_01JA2B3C4D5E6F7G8H9J0K1M2N
                name: Pylota
                status: active
                default_billing_mode: exempt
                max_tenants: 25
                ramp_exempt: false
                created_at: '2026-10-10T09:00:00Z'
                updated_at: '2026-10-10T09:00:00Z'
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/IdempotencyConflict'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
    get:
      operationId: listPartners
      tags: [Partners]
      summary: List partners
      x-required-permission: ['partners:manage']
      x-key-levels: [platform]
      x-rate-limit-buckets: [api]
      x-idempotency: none
      parameters:
        - name: status
          in: query
          description: Only partners with this status.
          schema: {$ref: '#/components/schemas/PartnerStatus'}
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of partners.
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
            RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PartnerPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '410': {$ref: '#/components/responses/CursorExpired'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}

  /partners/{partner_id}:
    parameters:
      - $ref: '#/components/parameters/PartnerIdPath'
    get:
      operationId: getPartner
      tags: [Partners]
      summary: Get a partner
      description: >-
        A deleted partner is returned with `status: "deleted"` and an empty `name`.
      x-required-permission: ['partners:manage']
      x-key-levels: [platform]
      x-rate-limit-buckets: [api]
      x-idempotency: none
      responses:
        '200':
          description: The partner.
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
            RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Partner'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
    patch:
      operationId: updatePartner
      tags: [Partners]
      summary: Update or suspend a partner
      description: >-
        Updatable: `name`, `status` (`active` or `suspended`), `default_billing_mode`, `max_tenants` and
        `ramp_exempt`. `suspended` refuses at once, with `403 partner_suspended` on every route, every key
        of the partner and every API key of its tenants, so nothing can send for them; the tenants' status
        does not change and their inbound mail is still stored. Deliveries to the partner's endpoints and
        to its tenants' endpoints are held and resume when the partner is `active` again ([J13]). A new
        `default_billing_mode` applies to tenants created afterwards; existing tenants keep theirs, which
        only a platform key changes (`PATCH /v1/tenants/{tenant_id}/billing`). A deleted partner gets
        `404 partner_not_found`. Audit-logged (`partner.update`).
      x-required-permission: ['partners:manage']
      x-key-levels: [platform]
      x-rate-limit-buckets: [api]
      x-idempotency: none
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PartnerUpdateRequest'}
            example:
              status: suspended
      responses:
        '200':
          description: The updated partner.
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
            RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Partner'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
    delete:
      operationId: deletePartner
      tags: [Partners]
      summary: Delete a partner
      description: >-
        A soft delete: the partner stays with `status: "deleted"` and an empty `name`; its partner keys are
        revoked and deleted, and its partner webhook endpoints deleted with their deliveries. The erased
        tenants keep their `partner_id`. Refused with `409 partner_has_tenants` while any tenant with this
        `partner_id` is not `erased` (`active`, `suspended` or `erasing`); erase them first with an erasure
        request of scope `tenant` ([J12]). A deleted partner gets `404 partner_not_found`. Audit-logged
        (`partner.delete`).
      x-required-permission: ['partners:manage']
      x-key-levels: [platform]
      x-rate-limit-buckets: [api]
      x-idempotency: none
      responses:
        '204':
          description: The partner was deleted.
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
            RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: The partner still has tenants that are not erased. Nothing changed.
          x-error-codes: [partner_has_tenants]
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
              example:
                error:
                  code: partner_has_tenants
                  message: This partner still has 3 tenants that are not erased.
                  retryable: false
                  fix: Erase each of the partner's tenants (POST /v1/erasure-requests with scope tenant), then delete the partner.
                  docs: https://pylotamail.com/docs/reference/errors#code-partner_has_tenants
                  request_id: req_01J9Z4K8V4QW7X2M5N6P8R0T1Y
                  details:
                    tenants: 3
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}

  # ─────────────────────────────────────────── Identities ─────────────────────────────────────────

  /tenants/{tenant_id}/identities:
    parameters:
      - $ref: '#/components/parameters/TenantIdPath'
    post:
      operationId: createIdentity
      tags: [Identities]
      summary: Create an identity
      description: >-
        Creates an identity and its primary address: `{username}{tenant.address_suffix}@{platform domain}`,
        or `{username}@{domain}` when `domain_id` names a healthy tenant domain. The combined username and
        suffix can be at most 40 characters, leaving room for a thread token in the 64-character local
        part. `client_id` makes the create idempotent: the same `client_id` with the same body returns
        `200` and the existing identity; with a different body it returns `409 client_id_conflict`.
        `owner` is required before the identity can send (`identity_owner_required`).
        `retention.message_hours` (optional, `null` or 1–8,760) erases each message of the identity, with its
        attachments, index rows and drafts, that many hours after it is stored, except under a legal hold.
      x-required-permission: ['identities:write']
      x-key-levels: [platform, partner, tenant]
      x-permission-notes: >-
        A `send_policy.daily_cap` above the tenant's effective `identity_daily_send_cap` needs a platform
        key (`403 scope_denied`, `details.field = "send_policy.daily_cap"`). A number in
        `retention.message_hours` needs `erasure:manage` as well (`403 permission_denied`,
        `details.required: ["erasure:manage"]`).
      x-rate-limit-buckets: [api]
      x-idempotency: optional
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/IdentityCreateRequest'}
            example:
              username: bookings
              display_name: Acme Car Hire
              purpose: bookings
              owner:
                name: Sam Patel
                email: sam@acmecarhire.example
              signature:
                text: Acme Car Hire · 0113 496 0000
              domain_id: dom_01JA2B3C4D5E6F7G8H9J0K1M2N
              client_id: acme:bookings
              retention:
                message_hours: null
              metadata:
                operator_id: op_123
      responses:
        '201':
          description: The identity was created.
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
            RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}
            Idempotent-Replayed: {$ref: '#/components/headers/Idempotent-Replayed'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Identity'}
        '200':
          description: An identity with this `client_id` and the same body already exists. It is returned unchanged.
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
            RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}
            Idempotent-Replayed: {$ref: '#/components/headers/Idempotent-Replayed'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Identity'}
        '400':
          description: The request is invalid.
          x-error-codes: [invalid_request, invalid_idempotency_key, address_invalid, address_reserved, address_unsupported, local_part_too_long]
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '402':
          $ref: '#/components/responses/BillingLimit'
          description: 'The plan''s `inboxes` allowance is spent (`details.feature: "inboxes"`). Nothing was stored.'
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: >-
            The identity conflicts with an existing one, the idempotency key is in use, or the primary
            address on a `zone` subdomain would be the domain's 201st literal routing rule
            (`domain_in_use`, `details.reason = "routing_rule_limit"`).
          x-error-codes: [client_id_conflict, username_taken, address_taken, domain_not_ready, domain_in_use, idempotency_conflict, request_in_progress]
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '422':
          description: The primary address on a `zone` subdomain needs a literal routing rule, and `PM_CF_API_TOKEN` is not set.
          x-error-codes: [cf_token_required]
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
    get:
      operationId: listTenantIdentities
      tags: [Identities]
      summary: List a tenant's identities
      x-required-permission: ['identities:read']
      x-key-levels: [platform, partner, tenant]
      x-rate-limit-buckets: [api]
      x-idempotency: none
      parameters:
        - name: status
          in: query
          description: Only identities with this status.
          schema: {$ref: '#/components/schemas/IdentityStatus'}
        - name: purpose
          in: query
          description: Only identities with this purpose tag.
          schema:
            type: string
        - name: client_id
          in: query
          description: Only the identity with this integrator `client_id`.
          schema:
            type: string
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of identities.
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
            RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/IdentityPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '410': {$ref: '#/components/responses/CursorExpired'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}

  /identities:
    get:
      operationId: listIdentities
      tags: [Identities]
      summary: List the identities the key can reach
      description: >-
        A platform key sees every identity and can filter by `tenant_id`. A tenant key sees its tenant's
        identities. An identity key sees only its own identity. The system identity (the sender of
        `PM_SYSTEM_FROM`) is never listed.
      x-required-permission: ['identities:read']
      x-key-levels: [platform, partner, tenant, identity]
      x-rate-limit-buckets: [api]
      x-idempotency: none
      parameters:
        - $ref: '#/components/parameters/TenantIdQuery'
        - name: status
          in: query
          description: Only identities with this status.
          schema: {$ref: '#/components/schemas/IdentityStatus'}
        - name: purpose
          in: query
          description: Only identities with this purpose tag.
          schema:
            type: string
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of identities.
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
            RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/IdentityPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '410': {$ref: '#/components/responses/CursorExpired'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}

  /identities/lookup:
    get:
      operationId: lookupIdentity
      tags: [Identities]
      summary: Find the identity that owns an address
      description: >-
        Resolves any `active` or `retiring` address to its identity. Unknown, retired and out-of-scope
        addresses all return `404 identity_not_found`.
      x-required-permission: ['identities:read']
      x-key-levels: [platform, partner, tenant, identity]
      x-rate-limit-buckets: [api]
      x-idempotency: none
      parameters:
        - name: address
          in: query
          required: true
          description: The address to resolve, for example `bookings@acme.example.com`.
          schema: {$ref: '#/components/schemas/EmailAddress'}
          example: bookings@acme.example.com
      responses:
        '200':
          description: The identity that owns the address.
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
            RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Identity'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}

  /identities/{identity_id}:
    parameters:
      - $ref: '#/components/parameters/IdentityIdPath'
    get:
      operationId: getIdentity
      tags: [Identities]
      summary: Get an identity
      description: >-
        Returns the identity in any status, `deleting` and `deleted` included. Once its erasure has run, a
        `deleted` identity has its personal fields scrubbed (empty `display_name`, `owner` and `signature`
        `null`, `metadata` `{}`).
      x-required-permission: ['identities:read']
      x-key-levels: [platform, partner, tenant, identity]
      x-rate-limit-buckets: [api]
      x-idempotency: none
      responses:
        '200':
          description: The identity.
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
            RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Identity'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
    patch:
      operationId: updateIdentity
      tags: [Identities]
      summary: Update, pause or resume an identity
      description: >-
        Updatable: `display_name`, `purpose`, `owner`, `signature`, `metadata`, `send_policy`, `retention`
        and `status` (`active` or `paused`). A paused identity still receives and stores mail and refuses every send with
        `identity_paused` (FR-IDN-3). Setting `status: "active"` on an identity paused for
        `abuse_threshold` needs a platform, partner or tenant key and is audit-logged; on a tenant a
        partner's key created it needs a platform key. A `send_policy.daily_cap` above the tenant's
        effective `identity_daily_send_cap` needs a platform key. `send_policy.require_approval` (`never`,
        `new_recipients`, `external`, `always` or `null`) can only make the tenant's `drafts.require_approval`
        stricter. Setting `retention.message_hours` where it was `null`, or lowering it, needs
        `erasure:manage` as well; raising it or setting `null` needs `identities:write` only and brings nothing
        back; each change writes the audit row `identity.retention_update`. A `deleting` or `deleted`
        identity returns `404 identity_not_found` and is not changed, as on every write by identity ID except
        the legal-hold routes.
      x-required-permission: ['identities:write']
      x-key-levels: [platform, partner, tenant, identity]
      x-permission-notes: >-
        Resuming an identity paused for `abuse_threshold` needs a platform, partner or tenant key, and is
        audit-logged; on a tenant a partner's key created, only a platform key (`403 scope_denied`
        otherwise). `send_policy.daily_cap` above the tenant's `identity_daily_send_cap` from any other key
        gets `403 scope_denied` (`details.field = "send_policy.daily_cap"`). A looser
        `send_policy.require_approval` than the identity's current one gets `403 scope_denied` from an identity
        key and `403 permission_denied` (`person_required`) from a tenant key where people decide. Setting or
        lowering `retention.message_hours` needs `erasure:manage` as well.
      x-rate-limit-buckets: [api]
      x-idempotency: none
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/IdentityUpdateRequest'}
            example:
              status: paused
      responses:
        '200':
          description: The updated identity.
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
            RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Identity'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
    delete:
      operationId: deleteIdentity
      tags: [Identities]
      summary: Delete an identity
      description: >-
        Starts an identity-scope erasure (FR-IDN-4). The identity's addresses are tombstoned and can never
        be assigned to another identity; later mail to them gets `550 5.1.1`. Its signing keys are deleted
        and their key IDs tombstoned, so they are never published again ([O7]). While the identity is
        `deleting` or `deleted`, signing and its JWK Set return `404 identity_not_found`. A second `DELETE`
        of a `deleting` or `deleted` identity returns `200` with its latest identity-scope erasure request
        and starts nothing, unless that request is `failed`: then `202` with a new request that resumes it
        at its failed step. The system identity cannot be deleted (`409 system_protected`, [A17]).
      x-required-permission: ['identities:write', 'erasure:manage']
      x-key-levels: [platform, partner, tenant, identity]
      x-rate-limit-buckets: [api]
      x-idempotency: none
      responses:
        '202':
          description: The erasure request of scope `identity`.
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
            RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErasureRequest'}
        '200':
          description: The identity was already `deleting` or `deleted` and its latest identity-scope erasure request is not `failed`; that request, unchanged.
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
            RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErasureRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: The identity is the deployment's system identity, which no key can delete ([A17]).
          x-error-codes: [system_protected]
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}

  # ─────────────────────────────────────────── Addresses ──────────────────────────────────────────

  /identities/{identity_id}/addresses:
    parameters:
      - $ref: '#/components/parameters/IdentityIdPath'
    get:
      operationId: listAddresses
      tags: [Addresses]
      summary: List an identity's addresses
      description: Every address of the identity, in every status.
      x-required-permission: ['identities:read']
      x-key-levels: [platform, partner, tenant, identity]
      x-rate-limit-buckets: [api]
      x-idempotency: none
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of addresses.
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
            RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AddressPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '410': {$ref: '#/components/responses/CursorExpired'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
    post:
      operationId: createAddress
      tags: [Addresses]
      summary: Add an alias address
      description: >-
        Creates an `alias`. Its status is `pending` until the domain is healthy, then `active`. Only one
        pending address per identity and domain is allowed: a newer request replaces an older pending one
        ([A11]). Emits `identity.address_added`, and `identity.address_activated` once active.
      x-required-permission: ['identities:write']
      x-key-levels: [platform, partner, tenant, identity]
      x-rate-limit-buckets: [api]
      x-idempotency: optional
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AddressCreateRequest'}
            example:
              local_part: bookings
              domain_id: dom_01JA2B3C4D5E6F7G8H9J0K1M2N
      responses:
        '201':
          description: The alias was created.
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
            RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}
            Idempotent-Replayed: {$ref: '#/components/headers/Idempotent-Replayed'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Address'}
        '400':
          description: The request is invalid.
          x-error-codes: [invalid_request, invalid_idempotency_key, address_invalid, address_unsupported, address_reserved, local_part_too_long]
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: >-
            The address is taken, the idempotency key is in use, or the address is on a `zone` subdomain that
            already has 200 literal routing rules (`domain_in_use`, `details.reason = "routing_rule_limit"`).
          x-error-codes: [address_taken, domain_in_use, idempotency_conflict, request_in_progress]
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '422':
          description: >-
            The identity already has 20 addresses in any state, or the address needs a literal routing rule
            and `PM_CF_API_TOKEN` is not set.
          x-error-codes: [address_limit_reached, cf_token_required]
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}

  /identities/{identity_id}/addresses/{address_id}/promote:
    parameters:
      - $ref: '#/components/parameters/IdentityIdPath'
      - $ref: '#/components/parameters/AddressIdPath'
    post:
      operationId: promoteAddress
      tags: [Addresses]
      summary: Make an address the primary
      description: >-
        Makes the address `primary`, so new threads send from it. The previous primary becomes an `alias`
        with status `retiring`, and its `retire_at` is set (default 90 days, range 0–365), with one
        exception: when the previous primary is the identity's **platform address**, it becomes an `active`
        alias instead. The platform address is the fallback address for domain failures (FR-DOM-6), so it is
        never retired. Existing threads keep replying from the address the counterparty wrote to
        (FR-ADR-2). Promoting a `retiring` address (or the platform address) back cancels the change: this
        is how you roll back (FR-ADR-4). Fails with `409 domain_not_ready` unless the domain is `healthy` or
        `degraded`. Emits `identity.address_promoted`.
      x-required-permission: ['identities:write']
      x-key-levels: [platform, partner, tenant, identity]
      x-rate-limit-buckets: [api]
      x-idempotency: optional
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PromoteAddressRequest'}
            example:
              retire_previous_after_days: 90
      responses:
        '200':
          description: The identity, with the new primary and the previous primary now `retiring` (or an `active` alias when it is the platform address).
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
            RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}
            Idempotent-Replayed: {$ref: '#/components/headers/Idempotent-Replayed'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Identity'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: The address's domain is not `healthy` or `degraded`, or the idempotency key is in use.
          x-error-codes: [domain_not_ready, idempotency_conflict, request_in_progress]
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}

  /identities/{identity_id}/addresses/{address_id}/retire:
    parameters:
      - $ref: '#/components/parameters/IdentityIdPath'
      - $ref: '#/components/parameters/AddressIdPath'
    post:
      operationId: retireAddress
      tags: [Addresses]
      summary: Retire an alias
      description: >-
        Moves an alias to `retiring`, or straight to `retired` when `after_days` is 0. A retiring address
        keeps receiving mail into the same identity; a retired one refuses mail with `550 5.1.6`
        (FR-ADR-3). The primary cannot be retired (`409 address_is_primary`), and neither can the
        identity's platform address (`409 address_in_use`), which stays active as the fallback address for
        the identity's whole life. Emits `identity.address_retired` when the address becomes `retired`.
      x-required-permission: ['identities:write']
      x-key-levels: [platform, partner, tenant, identity]
      x-rate-limit-buckets: [api]
      x-idempotency: optional
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RetireAddressRequest'}
            example:
              after_days: 0
      responses:
        '200':
          description: The address, now `retiring` or `retired`.
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
            RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}
            Idempotent-Replayed: {$ref: '#/components/headers/Idempotent-Replayed'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Address'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: The address is the primary or the identity's platform address, or the idempotency key is in use.
          x-error-codes: [address_is_primary, address_in_use, idempotency_conflict, request_in_progress]
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}

  /identities/{identity_id}/addresses/{address_id}:
    parameters:
      - $ref: '#/components/parameters/IdentityIdPath'
      - $ref: '#/components/parameters/AddressIdPath'
    delete:
      operationId: deleteAddress
      tags: [Addresses]
      summary: Delete a pending address
      description: >-
        Only for `pending` addresses that never received mail. Any other address returns
        `409 address_in_use`: retire it instead. The platform address can never be deleted.
      x-required-permission: ['identities:write']
      x-key-levels: [platform, partner, tenant, identity]
      x-rate-limit-buckets: [api]
      x-idempotency: none
      responses:
        '204':
          description: The pending address was deleted.
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
            RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: The address is the primary, or is not a `pending` address that never received mail.
          x-error-codes: [address_is_primary, address_in_use]
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}

  /identities/{identity_id}/addresses/{address_id}/test-forwarding:
    parameters:
      - $ref: '#/components/parameters/IdentityIdPath'
      - $ref: '#/components/parameters/AddressIdPath'
    post:
      operationId: testAddressForwarding
      tags: [Addresses]
      summary: Test that the customer's mailbox forwards to the identity
      description: >-
        For an address on a domain with `inbound: forward` (method `send_only`, or `smtp_relay` with
        `inbound: forward`); any other address returns `422 transport_unavailable` with
        `details.reason: "method_not_supported"`. Sends a short message to the address, from
        `mailer-daemon@{platform domain}` with the subject "Pylota Mail forwarding check" and a one-time
        token. If the token reaches the identity's platform address within 10 minutes, the address's
        `forwarding` becomes `ok`; otherwise `failed` ([N12]). The check is never stored as a message and
        does not count as a plan send. No webhook event is sent: read the address again for the result.
      x-required-permission: ['identities:write']
      x-key-levels: [platform, partner, tenant, identity]
      x-rate-limit-buckets: [api]
      x-idempotency: optional
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      responses:
        '202':
          description: The test message was sent. The address is returned as it stands; `forwarding` changes when the result arrives.
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
            RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}
            Idempotent-Replayed: {$ref: '#/components/headers/Idempotent-Replayed'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Address'}
              example:
                id: adr_01JA2B3C4D5E6F7G8H9J0K1M2N
                identity_id: idn_01J9Z3K8V4QW7X2M5N6P8R0T1Y
                address: bookings@brightwell.example
                local_part: bookings
                domain_id: dom_01JA2B3C4D5E6F7G8H9J0K1M2N
                role: primary
                status: active
                retire_at: null
                retired_at: null
                forwarding: unverified
                forwarding_checked_at: null
                created_at: '2026-10-09T10:00:00Z'
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/IdempotencyConflict'}
        '422':
          description: 'The address''s domain does not use `inbound: forward`.'
          x-error-codes: [transport_unavailable]
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}

  # ───────────────────────────────────────── Identity keys ────────────────────────────────────────

  /identities/{identity_id}/keys:
    parameters:
      - $ref: '#/components/parameters/IdentityIdPath'
    get:
      operationId: listIdentityKeys
      tags: [Identity keys]
      summary: List an identity's signing keys
      description: >-
        Every key the identity has, `retired` ones included, newest first, with its state, `created_at`,
        `verify_until` and public JWK. Private keys are never returned. Key management stays available
        while the identity is paused (including every identity of a suspended tenant), so a suspected leak
