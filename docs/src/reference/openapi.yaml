  # ─────────────────────────────────────── Links and hooks ────────────────────────────────────────

  /links/{token}:
    parameters:
      - $ref: '#/components/parameters/LinkTokenPath'
    get:
      operationId: getSignedLink
      tags: [Links and hooks]
      summary: Download a signed link
      description: >-
        No API key. Serves a signed link: a large attachment replaced by a link in an outbound message, or
        an export ZIP. The token carries the signing key's kid and an expiry, and is checked in constant
        time. The response is always a download. A bad, expired or unknown link, a link signed by a retired
        key, or a deleted target returns `404 attachment_not_found` or `404 export_not_found`; an upload token
        (`PUT` only) returns `404 upload_not_found`.
      security: []
      x-rate-limit-buckets: []
      x-idempotency: none
      responses:
        '200':
          description: The file.
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
            Content-Disposition: {$ref: '#/components/headers/Content-Disposition-Attachment'}
            X-Content-Type-Options: {$ref: '#/components/headers/X-Content-Type-Options'}
            Content-Security-Policy: {$ref: '#/components/headers/Content-Security-Policy'}
            Cache-Control: {$ref: '#/components/headers/Cache-Control-No-Store'}
          content:
            '*/*':
              schema:
                type: string
                contentMediaType: application/octet-stream
        '404':
          description: The link is bad, expired, unknown or signed by a retired key, or its target was deleted; or it is an upload token.
          x-error-codes: [attachment_not_found, export_not_found, upload_not_found]
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
    put:
      operationId: putUploadBytes
      tags: [Uploads]
      summary: Send an upload's bytes
      description: >-
        No API key. The `upload_url` of an upload. `Content-Length` must equal the declared size; the bytes
        are streamed into storage and checked against the declared SHA-256, then classified (and scanned,
        when a scanner is configured). A repeated `PUT` of a `ready` upload answers `200` without reading
        the body. A bad, expired or other-purpose token returns `404 upload_not_found`; an upload token is
        accepted only by `PUT`, and download tokens only by `GET`.
      security: []
      x-rate-limit-buckets: []
      x-permission-notes: Counted against `RL_TENANT` of the token's tenant.
      x-idempotency: none
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              contentMediaType: application/octet-stream
              maxLength: 26214400
      responses:
        '200':
          description: The upload, `ready`.
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Upload'}
        '400':
          description: >-
            `Content-Length` missing or not the declared size, a `Content-Encoding`, or a body that ended early
            (`upload_size_mismatch`, `details.reason` = `content_length`, `encoding` or `incomplete`); bytes
            whose SHA-256 is not the declared one (`upload_checksum_mismatch`).
          x-error-codes: [upload_size_mismatch, upload_checksum_mismatch]
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '403':
          description: The tenant or its partner is suspended.
          x-error-codes: [tenant_suspended, partner_suspended]
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '404':
          description: The token is bad, expired or of another purpose, or the upload, identity or tenant is gone.
          x-error-codes: [upload_not_found]
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '409':
          description: Another `PUT` holds the upload (`upload_in_progress`, `Retry-After`), or the identity is paused.
          x-error-codes: [upload_in_progress, identity_paused]
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
            Retry-After: {$ref: '#/components/headers/Retry-After'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '410':
          description: The upload expired (`upload_expired`, `details.reason`).
          x-error-codes: [upload_expired]
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '422':
          description: The bytes carry a quarantining risk or the scanner found malware (`attachment_risky`, `details.risk` or `details.reason = "infected"`).
          x-error-codes: [attachment_risky]
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}

  /hooks/ses:
    servers:
      - url: https://{host}
        description: Deployment root (unversioned).
        variables:
          host:
            default: mail.example.com
            description: The deployment's API host (`PM_API_HOST`).
    post:
      operationId: receiveSesNotification
      x-sdk: false
      tags: [Links and hooks]
      summary: Amazon SES delivery events (SNS)
      description: >-
        No API key. The Amazon SES delivery event endpoint, subscribed to the SNS topic
        `PM_SES_SNS_TOPIC_ARN`. It accepts only SNS messages with `SignatureVersion` `2` whose signature
        verifies, whose `SigningCertURL` is `https` on `sns.{PM_SES_REGION}.amazonaws.com`, whose `TopicArn`
        equals `PM_SES_SNS_TOPIC_ARN` and whose `Timestamp` is within one hour; anything else gets
        `403 invalid_signature`. Version `1` is refused. A subscription confirmation for that topic is
        confirmed; a notification becomes delivery events for the matching messages and returns `200`. An
        internal failure returns `500`, so SNS retries (it retries `5xx` and `429`).
      security: []
      x-rate-limit-buckets: []
      x-idempotency: none
      requestBody:
        required: true
        description: An SNS HTTP(S) message. SNS sends it with `Content-Type text/plain; charset=UTF-8` and a JSON body.
        content:
          text/plain:
            schema:
              type: string
              contentMediaType: application/json
              contentSchema: {$ref: '#/components/schemas/SnsMessage'}
      responses:
        '200':
          description: The subscription was confirmed, or the notification became delivery events.
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
        '403':
          description: The signature version, signature, signing-certificate host, `TopicArn` or `Timestamp` check failed.
          x-error-codes: [invalid_signature]
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '500': {$ref: '#/components/responses/InternalError'}

  /hooks/ses/inbound:
    servers:
      - url: https://{host}
        description: Deployment root (unversioned).
        variables:
          host:
            default: mail.example.com
            description: The deployment's API host (`PM_API_HOST`).
    post:
      operationId: receiveSesInboundNotification
      x-sdk: false
      tags: [Links and hooks]
      summary: Amazon SES inbound mail notifications (SNS)
      description: >-
        No API key. The Amazon SES inbound mail endpoint for domains with `inbound: ses`, subscribed to the
        SNS topic `PM_SES_INBOUND_TOPIC_ARN`. The same checks as `/hooks/ses` apply, against
        `PM_SES_INBOUND_TOPIC_ARN`: `SignatureVersion` `2` only, `SigningCertURL` `https` on
        `sns.{PM_SES_REGION}.amazonaws.com`, `TopicArn` equal to the topic, `Timestamp` within one hour;
        anything else gets `403 invalid_signature`. A notification names the S3 object SES stored and its
        recipients. Each recipient is recorded once in the `ses_ingest` ledger and queued for the inbound
        pipeline, so each object and recipient is ingested exactly once (FR-DOM-9); duplicates are
        dropped. The SQS queue `PM_SES_INBOUND_QUEUE_URL`, subscribed to the same topic, is a backstop: the
        every-minute cron feeds its messages to the same handler (with a 14-day `Timestamp` window). Mail to
        an unknown address is dropped without a bounce. Returns `200` after the enqueue; an internal failure
        returns `500`, so SNS retries.
      security: []
      x-rate-limit-buckets: []
      x-idempotency: none
      requestBody:
        required: true
        description: An SNS HTTP(S) message. SNS sends it with `Content-Type text/plain; charset=UTF-8` and a JSON body.
        content:
          text/plain:
            schema:
              type: string
              contentMediaType: application/json
              contentSchema: {$ref: '#/components/schemas/SnsMessage'}
      responses:
        '200':
          description: The subscription was confirmed, or every recipient of the notification was queued (or was already ingested).
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
        '403':
          description: The signature version, signature, signing-certificate host, `TopicArn` or `Timestamp` check failed.
          x-error-codes: [invalid_signature]
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '500': {$ref: '#/components/responses/InternalError'}

  # ─────────────────────────────────────────── Well-known ─────────────────────────────────────────

  /.well-known/security.txt:
    servers:
      - url: https://{host}
        description: Deployment root (unversioned).
        variables:
          host:
            default: mail.example.com
            description: The deployment's API host (`PM_API_HOST`).
    get:
      operationId: getSecurityTxt
      x-sdk: false
      tags: [Well-known]
      summary: Security contact
      description: RFC 9116 `security.txt`, built from `PM_SECURITY_CONTACT`. `404` when the variable is unset.
      security: []
      x-rate-limit-buckets: []
      x-idempotency: none
      responses:
        '200':
          description: The security.txt document.
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
          content:
            text/plain:
              schema:
                type: string
              example: |
                Contact: mailto:security@example.com
                Expires: 2027-10-09T00:00:00Z
        '404':
          description: '`PM_SECURITY_CONTACT` is not set.'
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}

  /.well-known/jwks/{identity_id}.json:
    servers:
      - url: https://{host}
        description: Deployment root (unversioned).
        variables:
          host:
            default: mail.example.com
            description: The deployment's API host (`PM_API_HOST`).
    parameters:
      - $ref: '#/components/parameters/IdentityIdPath'
    get:
      operationId: getIdentityJwks
      tags: [Well-known]
      summary: Public signing keys of an identity
      description: >-
        No authentication. The JSON Web Key Set (RFC 7517) that verifiers of the identity's agent assertions
        fetch: its `active` and `retiring` Ed25519 keys (`alg: EdDSA`). A revoked or `retired` key is absent
        from the next response ([O3]). An unknown, `deleting`, `deleted`, paused or suspended identity gets
        the same `404 identity_not_found`, so the endpoint reveals nothing beyond what a valid assertion
        already names; pausing withdraws the set, which is the kill switch ([O1]). Identity IDs are ULIDs
        and never derived from addresses, so the endpoint cannot test whether an address exists.
      security: []
      x-rate-limit-buckets: []
      x-idempotency: none
      responses:
        '200':
          description: The identity's JWK Set.
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
            Cache-Control: {$ref: '#/components/headers/Cache-Control-Jwks'}
          content:
            application/jwk-set+json:
              schema: {$ref: '#/components/schemas/Jwks'}
              example:
                keys:
                  - kty: OKP
                    crv: Ed25519
                    x: NjwMjIq2mTA1VpuDzRvkMIfQ0sCSHWavo0KT_4FcKO0
                    kid: zMkUmAQOlq9JtFPzTK1XINZdWd7gmhXxgA8Ph7cNKHo
                    alg: EdDSA
                    use: sig
                  - kty: OKP
                    crv: Ed25519
                    x: 11qYAYKxCrfVS_7TyWQHOg7hcvPapiMlrwIaaPcHURo
                    kid: kPrK_qmxVWaYVA9wwBF6Iuo3vVzz7TxHCTwXBygrS4k
                    alg: EdDSA
                    use: sig
        '404':
          description: The identity is unknown, `deleting`, `deleted`, paused, or in a suspended tenant.
          x-error-codes: [identity_not_found]
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}

  /.well-known/http-message-signatures-directory:
    servers:
      - url: https://{host}
        description: Deployment root (unversioned).
        variables:
          host:
            default: mail.example.com
            description: The deployment's API host (`PM_API_HOST`).
    get:
      operationId: getHttpMessageSignaturesDirectory
      tags: [Well-known]
      summary: Web Bot Auth key directory
      description: >-
        No authentication, HTTPS only. With `PM_WEB_BOT_AUTH=on`, the deployment's Web Bot Auth keys
        (`active` and `retiring`) as a JWK Set, as draft-meunier-http-message-signatures-directory-03 and
        Cloudflare's Web Bot Auth page require (read 2026-10-09). The response is signed once per listed
        key: `Signature-Input` covers `("@authority";req)` with `alg="ed25519"`, `keyid` (the key's JWK
        thumbprint), a 64-byte random `nonce`, `tag="http-message-signatures-directory"`, `created` (now)
        and `expires` (now + 300), so a copy served from another host does not verify. At most three keys
        are listed: one active and two retiring ([O12]). After a rotation the previous key stays listed for
        7 days, unless the rotation set `revoke_previous=true`. With `PM_WEB_BOT_AUTH=off` (the default) it returns `404 key_not_found`. Registering the
        directory with Cloudflare's verified-bot programme is an optional operator step; signatures verify
        for any Web Bot Auth verifier without it.
      security: []
      x-rate-limit-buckets: []
      x-idempotency: none
      responses:
        '200':
          description: The deployment's Web Bot Auth keys.
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
            Cache-Control: {$ref: '#/components/headers/Cache-Control-Directory'}
            Signature-Input: {$ref: '#/components/headers/Directory-Signature-Input'}
            Signature: {$ref: '#/components/headers/Directory-Signature'}
          content:
            application/http-message-signatures-directory+json:
              schema: {$ref: '#/components/schemas/HttpMessageSignaturesDirectory'}
              example:
                keys:
                  - kty: OKP
                    crv: Ed25519
                    x: JrQLj5P_89iXES9-vFgrIy29clF9CC_oPPsw3c5D0bs
                  - kty: OKP
                    crv: Ed25519
                    x: O6a8lanqRcSF-wEOHWvY3W6blE9tdjJqKHercAsamF8
        '404':
          description: Signed HTTP requests are turned off (`PM_WEB_BOT_AUTH=off`), so there is no directory ([O9]).
          x-error-codes: [key_not_found]
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}

