  /identities/{identity_id}/messages/{message_id}/release:
    parameters:
      - $ref: '#/components/parameters/IdentityIdPath'
      - $ref: '#/components/parameters/MessageIdPath'
    post:
      operationId: releaseMessage
      tags: [Quarantine]
      summary: Release a quarantined message
      description: >-
        Moves a quarantined message to `received`, emits `message.released` and, when the message was never
        evented as received, `message.received` with `released: true` (in that order, in one transaction), and
        runs triage. A message still being screened gets `409 not_quarantined` with
        `details.status = "screening"` and `details.deadline_at`. Audit-logged
        (`quarantine.release`, with the key). When `PM_QUARANTINE_KEY_RELEASE` is `off` (Pylota Mail Cloud),
        every API key gets `403 permission_denied` and the release has to be done by a person in the console
        (FR-CON-6), unless the message's tenant has `policy.quarantine.key_release: true`. Then a platform key,
        or the partner key of the tenant's own partner, with `quarantine:review` may release it; tenant and
        identity keys still need a person ([J16]).
