  /identities/{identity_id}/assertions:
    parameters:
      - $ref: '#/components/parameters/IdentityIdPath'
    post:
      operationId: createAssertion
      tags: [Identity keys]
      summary: Mint an agent assertion
      description: |
        Mints a short-lived JWT, signed with the identity's active Ed25519 key, that any service can verify
        against the identity's JWK Set (`/.well-known/jwks/{identity_id}.json`). The identity's first
        signing request creates its key when it has none.

        - **Header**: `{"alg":"EdDSA","typ":"agent-assertion+jwt","kid":"<thumbprint>"}`.
        - **Claims**: `iss` (`https://{PM_API_HOST}`), `sub` (the identity ID), `aud` (the requested
          audience), `iat` and `nbf` (now), `exp` (now + `expires_in`), `jti` (a new ULID), `email` (the
          identity's primary address while the deployment still receives mail for it, else its platform
          address), `email_verified` (`true`), `unverified` (an object of statements the
          workspace made and the deployment does not check: `name`, the display name; `org`, the workspace
          name; `accountable_human`, `true` when the identity has owner fields set; a verifier must not grant
          access on them, and the owner's name and address are never included), `ai_agent` (`true`), and
          `nonce` and `ext` when given.
        - **Not stored.** Each call mints a new token, so `Idempotency-Key` is ignored and never recorded.
          The token is never stored or logged; only a count is kept (`usage_daily` metric `assertions`).
          Signing is not metered against any plan allowance.
        - **Refusals**: `400 invalid_request` for a missing or invalid `audience`, an `expires_in` outside
          60–600 or an invalid `ext` ([O4], [O5], [O6]); `403 tenant_suspended` when the tenant is suspended (checked first, as on sends);
          `409 identity_paused` for a paused identity; `404 identity_not_found` for a `deleting` or
          `deleted` identity ([O1]).

        A verifier checks `alg` and `typ`, trusts only the issuers it knows, fetches
        `{iss}/.well-known/jwks/{sub}.json` (caching it for at most 5 minutes), verifies the signature, and
        checks `aud`, `nbf` and `exp` with 60 seconds of clock skew and `jti` against replays
        (`project/design/agent-keys.md`, section 4.3). The Rust SDK does this in `verify_assertion`.
      x-required-permission: ['identities:sign']
      x-key-levels: [tenant, identity]
      x-permission-notes: Platform keys cannot hold `identities:sign`. An identity key signs only as its own identity.
      x-rate-limit-buckets: [api, sign]
      x-idempotency: none
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AssertionRequest'}
            example:
              audience: https://portal.supplier.example
              expires_in: 300
              nonce: b3f1c2d47a9e
              ext:
                booking_ref: BK-2291
      responses:
        '201':
          description: The assertion. It is not stored, so keep it until it expires.
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
            RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AssertionResponse'}
              example:
                assertion: eyJhbGciOiJFZERTQSIsInR5cCI6ImFnZW50LWFzc2VydGlvbitqd3QiLCJraWQiOiJ6TWtVbUFRT2xxOUp0RlB6VEsxWElOWmRXZDdnbWhYeGdBOFBoN2NOS0hvIn0..zXMLhbxydQao1zuFx3DOdVpo9gXgDCn9iYUcCDtJdGak3-oQkHl58mKW0YIT3AUbMyKK-7KYZXjWiYVKsa_pDQ
                kid: zMkUmAQOlq9JtFPzTK1XINZdWd7gmhXxgA8Ph7cNKHo
                expires_at: '2026-10-09T12:05:00Z'
                jwks_uri: https://mail.example.com/.well-known/jwks/idn_01J9Z3K8V4QW7X2M5N6P8R0T1Y.json
        '400':
          description: >-
            The request is invalid: `audience` missing, longer than 256 characters or not printable ASCII;
            `expires_in` outside 60–600; `nonce` invalid; or `ext` larger than 2 KB as JSON or using a claim
            name the service sets ([O4], [O5], [O6]). `details.errors[]` names the field. Nothing is signed.
          x-error-codes: [invalid_request]
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403':
          description: The key lacks `identities:sign` (platform keys can never hold it), or the identity is outside the key's scope, or the tenant is suspended (checked before the identity's pause, as on sends).
          x-error-codes: [permission_denied, scope_denied, tenant_suspended]
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '404':
          description: The identity is unknown, out of scope, `deleting` or `deleted`.
          x-error-codes: [identity_not_found]
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '409':
          description: >-
            The identity is paused. Nothing is signed ([O1]). An identity of a suspended tenant gets
            `403 tenant_suspended` first.
          x-error-codes: [identity_paused]
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: >-
            Over a rate limit: the key's request limit, or `RL_SIGN`, 600 signing calls a minute per identity
            for assertions and HTTP signatures together.
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}

  /identities/{identity_id}/http-signatures:
    parameters:
      - $ref: '#/components/parameters/IdentityIdPath'
    post:
      operationId: createHttpSignature
      tags: [Identity keys]
      summary: Sign an HTTP request (Web Bot Auth)
      description: |
        Returns the headers that turn an HTTP request into a Web Bot Auth signed request (RFC 9421), signed
        with the deployment's active `web_bot_auth` key, with the identity's vouched address in a signed
        `From` header. The Worker never makes the request itself, and nothing is created or stored.

        - **`Signature-Agent`** is a structured-field string, in double quotes, naming the deployment's
          origin; its key directory is at `/.well-known/http-message-signatures-directory` there.
        - **`From`** carries the identity's primary address while the deployment still receives mail for it
          (domain `healthy` or `degraded`, inbound by routing, SES or a passing forwarding check), else its
          platform address (RFC 9110: whoever is responsible for the request).
        - **`Signature-Input`** and **`Signature`**: the signature base is built as in RFC 9421 section 2.5,
          with `alg="ed25519"`, `keyid` (the deployment key's JWK thumbprint), a `nonce` of 64 random bytes
          (base64), `tag="web-bot-auth"`, `created` and `expires`.
        - An internationalised host becomes its A-label in `@authority`; a component whose value is not
          ASCII is refused with `400 invalid_request` ([O10]). An `expires_in` outside 30–300 seconds is
          refused ([O11]).
        - `Idempotency-Key` is ignored and never recorded. Only a count is kept (`usage_daily` metric
          `http_signatures`); signatures are not logged. Signing is not metered against any plan allowance.
        - **Refusals**: `422 web_bot_auth_disabled` while `PM_WEB_BOT_AUTH=off` ([O9]); `403 policy_denied`
          while tenant policy `web_bot_auth.allowed` is `false`, the default ([O13]); `403 tenant_suspended`
          when the tenant is suspended (checked first, as on sends); `409 identity_paused` for a paused identity; `404 identity_not_found` for
          a `deleting` or `deleted` identity ([O1]).

        `PM_WEB_BOT_AUTH` can be turned on only after spike S13 has passed; until then signed HTTP requests
        are off and assertions are unaffected.
      x-required-permission: ['identities:sign']
      x-key-levels: [tenant, identity]
      x-permission-notes: Platform keys cannot hold `identities:sign`. An identity key signs only as its own identity. The tenant must also have opted in (`policy.web_bot_auth.allowed`).
      x-rate-limit-buckets: [api, sign]
      x-idempotency: none
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/HttpSignatureRequest'}
            example:
              url: https://www.brightwell.example/fleet/availability?from=2026-10-12
              method: GET
              expires_in: 60
              components: ['@authority', signature-agent, from]
      responses:
        '200':
          description: The four headers to attach to the request, and when the signature expires.
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
            RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HttpSignatureResponse'}
              example:
                headers:
                  Signature-Agent: '"https://mail.example.com"'
                  From: bookings.acme@agents.example
                  Signature-Input: 'sig1=("@authority" "signature-agent" "from");created=1791547200;expires=1791547260;keyid="poqkLGiymh_W0uP6PZFw-dvez3QJT5SolqXBCW38r0U";alg="ed25519";nonce="e8N7S2MFd/qrd6T2R3tdfAuuANngKI7LFtKYI/vowzk4lAZYadIX6wW25MwG7DCT9RUKAJ0qVkU0mEeLElW1qg==";tag="web-bot-auth"'
                  Signature: 'sig1=:jdq0SqOwHdyHr9+r5jw3iYZH6aNGKijYp/EstF4RQTQdi5N5YYKrD+mCT1HA1nZDsi6nJKuHxUi/5Syp3rLWBA==:'
                expires_at: '2026-10-09T12:01:00Z'
        '400':
          description: >-
            The request is invalid: `url` missing, not `https` or longer than 2,048 characters; `method` not an
            upper-case token, or missing while `components` has `@method`; `expires_in` outside 30–300 ([O11]); a component that is not allowed, or whose
            value is not ASCII ([O10]). `details.errors[]` names the field. Nothing is signed.
          x-error-codes: [invalid_request]
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403':
          description: >-
            The key lacks `identities:sign` (platform keys can never hold it) or the identity is outside its
            scope; or the tenant has not opted in to signed HTTP requests (`policy_denied`: tenant policy
            `web_bot_auth.allowed` is `false`, [O13]); or the tenant is suspended (`tenant_suspended`, checked
            before the identity's pause, as on sends).
          x-error-codes: [permission_denied, scope_denied, policy_denied, tenant_suspended]
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
              example:
                error:
                  code: policy_denied
                  message: This workspace has not turned on signed HTTP requests.
                  retryable: false
                  fix: Ask a platform operator to set web_bot_auth.allowed to true in the tenant's policy.
                  docs: https://pylotamail.com/docs/reference/errors#code-policy_denied
                  request_id: req_01J9Z4K8V4QW7X2M5N6P8R0T1Y
        '404':
          description: The identity is unknown, out of scope, `deleting` or `deleted`.
          x-error-codes: [identity_not_found]
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '409':
          description: >-
            The identity is paused. Nothing is signed ([O1]). An identity of a suspended tenant gets
            `403 tenant_suspended` first.
          x-error-codes: [identity_paused]
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '422':
          description: Signed HTTP requests are turned off on this deployment (`PM_WEB_BOT_AUTH=off`, the default) ([O9]).
          x-error-codes: [web_bot_auth_disabled]
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: >-
            Over a rate limit: the key's request limit, or `RL_SIGN`, 600 signing calls a minute per identity
            for assertions and HTTP signatures together.
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}

  # ──────────────────────────────────────── Service accounts ───────────────────────────────────────

  /identities/{identity_id}/accounts:
    parameters:
      - $ref: '#/components/parameters/IdentityIdPath'
    post:
      operationId: requestServiceAccount
      tags: [Service accounts]
      summary: Request approval for a third-party account
      description: >-
        Records that the identity's agent wants to create an account at a third-party service with one of the
        identity's addresses (FR-IDN-10). The entry starts `pending_approval` and expires after 7 days. Where
        the tenant's `accounts.require_approval` is `true`, the service's verification mail reaches the agent
        only once an operator approved the entry. `service_domain` and `sender_domains` are reduced to their
        organisational domains. Emits `account.requested`; audit `account.request`.
      x-required-permission: ['accounts:request']
      x-key-levels: [platform, partner, tenant, identity]
      x-permission-notes: An identity key requests only for its own identity.
      x-rate-limit-buckets: [api]
      x-idempotency: optional
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ServiceAccountCreateRequest'}
            example:
              service_domain: github.com
              account_identifier: brightwell-bookings
              purpose: Open issues on the booking widget's repository.
              sender_domains: [github.com]
              address: bookings.brightwell@pylotamail.com
      responses:
        '201':
          description: The entry, `pending_approval`.
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
            RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}
            Idempotent-Replayed: {$ref: '#/components/headers/Idempotent-Replayed'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ServiceAccount'}
        '400':
          description: >-
            The request is invalid: a service or sender domain that is a public suffix, an IP literal or not
            a DNS name, an `address` that is not an active or retiring address of the identity, or this
            deployment's own platform, API or console domain (`details.reason = "own_deployment"`, [E14]).
          x-error-codes: [invalid_request, invalid_idempotency_key]
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: >-
            A pending or approved entry exists for the same service and account identifier
            (`account_exists`, with `details.account_id` and `details.status`); the identity is paused
            (`identity_paused`); or the idempotency key is in use.
          x-error-codes: [account_exists, identity_paused, idempotency_conflict, request_in_progress]
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '422':
          description: The identity already has 10 pending entries, or 200 in any state (`details.limit`, `details.status`, [E12]).
          x-error-codes: [account_limit_reached]
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
    get:
      operationId: listIdentityServiceAccounts
      tags: [Service accounts]
      summary: List an identity's service-ledger entries
      x-required-permission: ['accounts:request']
      x-key-levels: [platform, partner, tenant, identity]
      x-permission-notes: '`accounts:approve` includes `accounts:request`.'
      x-rate-limit-buckets: [api]
      x-idempotency: none
      parameters:
        - name: status
          in: query
          description: Only entries with this status.
          schema: {$ref: '#/components/schemas/ServiceAccountStatus'}
        - name: service_domain
          in: query
          description: Only entries for this service (its organisational domain).
          schema:
            type: string
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of entries, newest first.
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
            RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ServiceAccountPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '410': {$ref: '#/components/responses/CursorExpired'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}

  /tenants/{tenant_id}/accounts:
    parameters:
      - $ref: '#/components/parameters/TenantIdPath'
    get:
      operationId: listTenantServiceAccounts
      tags: [Service accounts]
      summary: List a tenant's service-ledger entries
      description: The approval queue of a tenant (`status=pending_approval`), or every entry. An identity key gets `403 scope_denied`.
      x-required-permission: ['accounts:request']
      x-key-levels: [platform, partner, tenant]
      x-rate-limit-buckets: [api]
      x-idempotency: none
      parameters:
        - name: status
          in: query
          description: Only entries with this status.
          schema: {$ref: '#/components/schemas/ServiceAccountStatus'}
        - name: identity_id
          in: query
          description: Only entries of this identity.
          schema: {$ref: '#/components/schemas/IdentityId'}
        - name: service_domain
          in: query
          description: Only entries for this service (its organisational domain).
          schema:
            type: string
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of entries, oldest pending first, then newest first.
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
            RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ServiceAccountPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '410': {$ref: '#/components/responses/CursorExpired'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}

  /identities/{identity_id}/accounts/{account_id}:
    parameters:
      - $ref: '#/components/parameters/IdentityIdPath'
      - $ref: '#/components/parameters/AccountIdPath'
    get:
      operationId: getServiceAccount
      tags: [Service accounts]
      summary: Get a service-ledger entry
      x-required-permission: ['accounts:request']
      x-key-levels: [platform, partner, tenant, identity]
      x-rate-limit-buckets: [api]
      x-idempotency: none
      responses:
        '200':
          description: The entry.
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
            RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ServiceAccount'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
    delete:
      operationId: deleteServiceAccount
      tags: [Service accounts]
      summary: Delete a service-ledger entry
      description: >-
        Removes the entry. A pending or approved entry is closed first in the same batch, with
        `account.closed`. Audit `account.delete`, which keeps the entry's ID, service domain and final status.
      x-required-permission: ['accounts:approve']
      x-key-levels: [platform, partner, tenant]
      x-rate-limit-buckets: [api]
      x-idempotency: none
      responses:
        '204':
          description: Deleted.
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
            RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}

  /identities/{identity_id}/accounts/{account_id}/approve:
    parameters:
      - $ref: '#/components/parameters/IdentityIdPath'
      - $ref: '#/components/parameters/AccountIdPath'
    post:
      operationId: approveServiceAccount
      tags: [Service accounts]
      summary: Approve a service-ledger entry
      description: >-
        Approves a `pending_approval` entry, so verification mail from its sender domains to its address can
        reach the agent. A decision reserved for people: an API key may approve only when
        `PM_QUARANTINE_KEY_RELEASE` is `on`, `PM_CONSOLE` is `off`, or the tenant's policy has
        `quarantine.key_release: true` and the key is a platform key or the tenant's partner key; the key
        that requested the entry never approves it (`self_approval`) ([E11]). Approving an approved entry returns it unchanged. Mail already
        quarantined as `account_unapproved` is not released. Emits `account.approved`; audit `account.approve`.
      x-required-permission: ['accounts:approve']
      x-key-levels: [platform, partner, tenant]
      x-permission-notes: >-
        Otherwise `403 permission_denied` with `details.reason = "person_required"`: a signed-in person
        approves in the console. Identity keys can never hold `accounts:approve`.
      x-rate-limit-buckets: [api]
      x-idempotency: optional
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ServiceAccountNoteRequest'}
            example:
              note: Approved for the widget repository only.
      responses:
        '200':
          description: The entry, `approved`.
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
            RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}
            Idempotent-Replayed: {$ref: '#/components/headers/Idempotent-Replayed'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ServiceAccount'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403':
          description: >-
            The key lacks `accounts:approve`, API keys may not take decisions reserved for people on this
            tenant (`permission_denied`, `details.reason = "person_required"`), or the key's partner is
            suspended.
          x-error-codes: [permission_denied, scope_denied, partner_suspended]
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: The entry is no longer `pending_approval`, or it expired (`details.status`); or the idempotency key is in use.
          x-error-codes: [account_not_pending, idempotency_conflict, request_in_progress]
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}

  /identities/{identity_id}/accounts/{account_id}/reject:
    parameters:
      - $ref: '#/components/parameters/IdentityIdPath'
      - $ref: '#/components/parameters/AccountIdPath'
    post:
      operationId: rejectServiceAccount
      tags: [Service accounts]
      summary: Reject a service-ledger entry
      description: >-
        Rejects a `pending_approval` entry (`rejected_reason: "operator"`). Always allowed for a key that holds
        `accounts:approve`. Rejecting a rejected entry returns it unchanged. Emits `account.rejected`; audit
        `account.reject`.
      x-required-permission: ['accounts:approve']
      x-key-levels: [platform, partner, tenant]
      x-rate-limit-buckets: [api]
      x-idempotency: optional
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ServiceAccountNoteRequest'}
      responses:
        '200':
          description: The entry, `rejected`.
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
            RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}
            Idempotent-Replayed: {$ref: '#/components/headers/Idempotent-Replayed'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ServiceAccount'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: The entry was already approved or closed (`details.status`); or the idempotency key is in use.
          x-error-codes: [account_not_pending, idempotency_conflict, request_in_progress]
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}

  /identities/{identity_id}/accounts/{account_id}/close:
    parameters:
      - $ref: '#/components/parameters/IdentityIdPath'
      - $ref: '#/components/parameters/AccountIdPath'
    post:
      operationId: closeServiceAccount
      tags: [Service accounts]
      summary: Close a service-ledger entry
      description: >-
        A pending or approved entry becomes `closed`; no mail matches it afterwards ([E13]). Closing a closed
        or rejected entry returns it unchanged. It does not close the account at the service. Emits
        `account.closed`; audit `account.close`.
      x-required-permission: ['accounts:request']
      x-key-levels: [platform, partner, tenant, identity]
      x-rate-limit-buckets: [api]
      x-idempotency: optional
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ServiceAccountNoteRequest'}
      responses:
        '200':
          description: The entry, `closed` (or unchanged).
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
            RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}
            Idempotent-Replayed: {$ref: '#/components/headers/Idempotent-Replayed'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ServiceAccount'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/IdempotencyConflict'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}

  # ───────────────────────────────────────── Agent sign-up ────────────────────────────────────────

  /agent-signup:
    post:
      operationId: createAgentSignup
      tags: [Agent sign-up]
      summary: Sign up as an agent, with no key
      description: >-
        Creates a provisional workspace with the inbox `agent.{username}@{platform domain}` and returns its
        identity key once (FR-ASU-2). The named human gets a six-digit code and a link; until they verify,
        the key acts with the provisional permission set and the inbox can email only that human, 10
        messages a UTC day. Erased after 7 days if not verified. `Idempotency-Key` is ignored: the answer
        holds a secret that cannot be replayed. Only while `PM_AGENT_SIGNUP` is `on` (Pylota Mail Cloud).
      security: []
      x-rate-limit-buckets: [signin]
      x-idempotency: none
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AgentSignupCreateRequest'}
            example:
              username: travel-planner
              human_email: sam@brightwell.example
              agent_name: Travel planner
              source: pylota-mail-python/1.2.0
              accept_terms: true
      responses:
        '201':
          description: The provisional sign-up, with the key's secret (shown once).
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AgentSignupCreated'}
        '400':
          description: >-
            The body is invalid; the username is malformed, reserved or unsupported; or the human address is
            malformed, unsupported, not allowed (`details.reason = "human_email_not_allowed"`) or on a domain
            that cannot receive mail (`no_mail_domain`).
          x-error-codes: [invalid_request, address_invalid, address_unsupported, address_reserved]
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '403':
          description: Agent sign-up is closed on this deployment (`details.reason` = `disabled` or `paused`).
          x-error-codes: [signup_closed]
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '409':
          description: The username, or one that folds to the same, is taken; usernames are never released.
          x-error-codes: [username_taken]
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
          description: The request body exceeds this route's own limit of 4,096 bytes (`details.limit`).
        '429':
          description: >-
            `RL_SIGNIN` refused the client network (`rate_limited`, `details.bucket = "signin"`), or a daily
            sign-up budget is spent (`signup_limit_reached`, `details.scope` = `network`, `asn`,
            `human_email` or `deployment`, with `details.resets_at`).
          x-error-codes: [rate_limited, signup_limit_reached]
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
            Retry-After: {$ref: '#/components/headers/Retry-After'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
    get:
      operationId: getAgentSignup
      tags: [Agent sign-up]
      summary: Read the calling key's own sign-up
      description: >-
        The agent sign-up of the calling key's own tenant, in any state. A tenant that was not created by
        agent sign-up gets `404 signup_not_found`.
      x-required-permission: []
      x-key-levels: [tenant, identity]
      x-permission-notes: Acts on the sign-up of the key's own tenant; platform and partner keys get `403 scope_denied`.
      x-rate-limit-buckets: [api]
      x-idempotency: none
      responses:
        '200':
          description: The sign-up.
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
            RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AgentSignup'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
    delete:
      operationId: abandonAgentSignup
      tags: [Agent sign-up]
      summary: Abandon a provisional sign-up
      description: Starts the tenant-scope erasure of the provisional workspace; the key is revoked by its first step.
      x-required-permission: []
      x-key-levels: [tenant, identity]
      x-permission-notes: Acts on the sign-up of the key's own tenant; platform and partner keys get `403 scope_denied`.
      x-rate-limit-buckets: [api]
      x-idempotency: none
      responses:
        '202':
          description: Abandoned; the erasure has started.
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AgentSignupEnded'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: The sign-up is not provisional (`details.state`).
          x-error-codes: [signup_not_pending]
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}

  /agent-signup/verify:
    post:
      operationId: verifyAgentSignup
      tags: [Agent sign-up]
      summary: Verify with the human's six-digit code
      description: >-
        Verifies the calling key's provisional sign-up with the code the human received. The workspace then
        belongs to that person, the provisional permission set and policy overlay end, and
        `signup.verified` is emitted.
      x-required-permission: []
      x-key-levels: [tenant, identity]
      x-permission-notes: Acts on the sign-up of the key's own tenant; platform and partner keys get `403 scope_denied`.
      x-rate-limit-buckets: [api]
      x-idempotency: optional
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AgentSignupVerifyRequest'}
            example: {code: '482913'}
      responses:
        '200':
          description: 'Verified, or already verified (`already_verified` is `true`).'
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
            RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}
            Idempotent-Replayed: {$ref: '#/components/headers/Idempotent-Replayed'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AgentSignup'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: >-
            Not provisional or past its 7 days (`signup_not_pending`, `details.state`); or it cannot be
            verified (`signup_cannot_verify`, `details.reason` = `workspace_limit`, `human_email_hosted` or
            `person_disabled`); or the idempotency key is in use.
          x-error-codes: [signup_not_pending, signup_cannot_verify, idempotency_conflict, request_in_progress]
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '422':
          description: >-
            The code was not accepted (`details.reason` = `wrong`, `burned`, `locked`, `expired`, `superseded`
            or `none`, with `attempts_left` and `failures_left`).
          x-error-codes: [signup_code_invalid]
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}

  /agent-signup/resend:
    post:
      operationId: resendAgentSignupCode
      tags: [Agent sign-up]
      summary: Send a new code and link to the human
      description: Invalidates the previous code and link. At most 3 an hour per sign-up and 5 a UTC day per person.
      x-required-permission: []
      x-key-levels: [tenant, identity]
      x-permission-notes: Acts on the sign-up of the key's own tenant; platform and partner keys get `403 scope_denied`.
      x-rate-limit-buckets: [api]
      x-idempotency: optional
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      responses:
        '202':
          description: A new code was issued and emailed (see `code.email`).
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
            RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}
