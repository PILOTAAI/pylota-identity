      tags: [Sending]
      summary: Resolve an uncertain send
      description: >-
        For `uncertain` messages only (otherwise `409 not_uncertain`). `sent` moves the message and its
        uncertain deliveries to `submitted` and emits `message.sent` (with `provider_message_id: null`);
        later delivery events still apply. `not_sent` marks the message `failed` with reason
        `resolved_not_sent`, after which you may send again with a **new** `Idempotency-Key`. Audit-logged.
      x-required-permission: ['messages:write']
      x-key-levels: [platform, partner, tenant, identity]
      x-rate-limit-buckets: [api]
      x-idempotency: optional
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      requestBody:
