            The `partner` or `api` rate limit (`rate_limited`, with `Retry-After`), or the tenant's 50
            invitation emails a day (`daily_cap_reached`, `details.cap: "invitations"`, with
            `details.resets_at`).
          x-error-codes: [rate_limited, daily_cap_reached]
          headers:
