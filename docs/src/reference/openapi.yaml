  # ──────────────────────────────────────────── Domains ───────────────────────────────────────────

  /tenants/{tenant_id}/domains:
    parameters:
      - $ref: '#/components/parameters/TenantIdPath'
    post:
      operationId: createDomain
      tags: [Domains]
      summary: Add a tenant domain
      description: |
        Adds a domain with one of six connection methods (FR-DOM-7) and returns it in `pending` state. Its
        `records` are read from the provider APIs at that moment, never from templates (FR-DOM-3). The
        method fixes the domain's `kind`, `inbound` and `transport` (see `DomainMethod`).

        `method` is required for new clients. When it is absent, the old `kind` is mapped: `zone` →
        `cloudflare_zone`, `external` → `send_only`; `kind: zone` with `create_zone: true` is the old
        spelling of `nameservers`.

        - **`cloudflare_zone`, `nameservers`, `delegated_subdomain`** need `PM_CF_API_TOKEN`
          (`422 cf_token_required`). For an apex `cloudflare_zone`, `pmail domains add --local-token` with the
          operator's own Cloudflare token works instead (catch-all, no literal rules).
        - **Zone permission** (tenant and partner keys, before any Cloudflare call): `cloudflare_zone` and
          `replace_mx` work only on a zone this deployment created for the tenant (`nameservers`,
          `delegated_subdomain`) or one listed in its platform-only policy `domains.cloudflare_zones` (names
          strictly under a listed zone: its apex, and `replace_mx` there, stay platform-only). A zone
          created for another tenant, and any name under the zones of the platform domain, the API host or
          the console host, is refused, as is a `nameservers` or `delegated_subdomain` name inside such a
          zone: `403 scope_denied` with `details.reason = "zone_not_allowed"` ([H8]). Platform keys may use
          any zone.
        - **Name taken** ([H10], [H14]): `409 domain_exists`. For a domain of the caller's own tenant,
          `details.domain_id` names it. Otherwise the body is the same whoever holds the name, in whatever
          state, and also when a zone or provider object of that name exists that this deployment did not
          create for this tenant (it is never adopted); `details.claim` is a TXT record to publish before
          repeating the request with `claim: true`, which evicts a holder that never verified the domain
          (`409 domain_claim_pending` until its removal finishes). A tenant or partner key's tenant may hold
          5 domains that were never verified (`422 unverified_domain_limit`); an unverified domain is removed
          14 days after it was added.
        - **Mail domains per zone** ([H15]): a Cloudflare zone holds at most 30, routing and sending
          together; the 31st returns `422 zone_domain_limit` before anything is created.
        - **`nameservers`** creates the zone, never using one that already exists in the account. Tenant keys
          need the policy `domains.allow_create_zone: true` (`422 transport_unavailable`,
          `zone_creation_not_allowed`, also returned when Cloudflare refuses the create for the Worker
          token's scope); Pylota Mail Cloud does not offer the method. A name with A, AAAA or MX records, or a
          `www` CNAME, A or AAAA record, needs `confirm_dedicated: true` (`409 domain_not_dedicated`, with
          `details.records`) ([N21]). The response's `records` are the zone's `NS` records for the
          registrar. A zone not activated within 28 days is deleted by Cloudflare and the domain becomes
          `removed` (`zone_expired`) ([N23]).
        - **`delegated_subdomain`** needs `PM_CF_SUBDOMAIN_SETUP=on` (`422 transport_unavailable`,
          `subdomain_setup_disabled`) and a Cloudflare Enterprise account.
        - Both zone-creating methods: a zone hold returns `409 zone_hold` ([N24]); Cloudflare error 1105
          returns `429 upstream_rate_limited` with `Retry-After` and `details.retry_after` of `10800`
          ([N22]).
        - **`dns_records`, `send_only`** need the SES transport (`ses_not_configured`); `dns_records`, and
          `smtp_relay` with `inbound: ses`, also need SES receiving (`ses_receiving_not_configured`). A
          method that needs an SES identity fails with `ses_identity_limit` once the region holds 10,000.
          All are `422 transport_unavailable`.
        - **`smtp_relay`**: `smtp.port` must be `465` or `587` (`400 smtp_port_not_allowed`). The Worker
          connects once (EHLO, STARTTLS, AUTH, QUIT) before it stores anything: no STARTTLS on 587 (or TLS
          on 465) returns `422 smtp_tls_required` without sending the credentials, a `535` to AUTH returns
          `422 smtp_auth_failed`, and a connection that cannot be made returns `502 upstream_error`. The
          domain sends only after an alignment probe passes.
        - `replace_mx` (default `false`): a `cloudflare_zone` apex or a `dns_records` domain that already
          has MX records is refused with `409 existing_mx` unless this is `true` ([H5]).
        - An apex whose merged SPF record would need more than 10 DNS lookups (or more than 2 void lookups)
          is refused with `400 spf_lookup_limit`; `details.lookups` gives the count and `fix` names the
          includes to flatten ([H2]).
      x-required-permission: ['domains:write']
      x-key-levels: [platform, partner, tenant]
      x-permission-notes: >-
        `nameservers` (or the old `create_zone: true`) needs a platform key, or a tenant or partner key whose
        tenant's policy has `domains.allow_create_zone: true`. For a tenant or partner key, the zone must be
        one the tenant may use (`403 scope_denied`, `details.reason = "zone_not_allowed"`).
      x-rate-limit-buckets: [api]
      x-idempotency: optional
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DomainCreateRequest'}
            examples:
              dns_records:
                summary: A subdomain whose DNS stays at the customer's DNS host
                value:
                  name: agents.brightwell.example
                  method: dns_records
                  receiving: true
                  sending: true
                  replace_mx: false
              nameservers:
                summary: A new domain used only for mail
                value:
                  name: brightwell-agents.example
                  method: nameservers
                  confirm_dedicated: false
              smtp_relay:
                summary: Sending through the customer's own provider
                value:
                  name: brightwell.example
                  method: smtp_relay
                  inbound: forward
                  smtp:
                    host: smtp.provider.example
                    port: 587
                    username: agents@brightwell.example
                    password: example-app-password
                    probe_from: agents@brightwell.example
              legacy_kind:
                summary: Old spelling (kind zone, mapped to cloudflare_zone)
                value:
                  name: mail.brightwell.example
                  kind: zone
                  receiving: true
                  sending: true
                  replace_mx: false
      responses:
        '201':
          description: The domain was added, in `pending` state.
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
            RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}
            Idempotent-Replayed: {$ref: '#/components/headers/Idempotent-Replayed'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Domain'}
        '400':
          description: >-
            The request is invalid, the apex's merged SPF record would need too many DNS lookups
            (`spf_lookup_limit`, with `details.lookups`), or `smtp.port` is not `465` or `587`
            (`smtp_port_not_allowed`).
          x-error-codes: [invalid_request, invalid_idempotency_key, spf_lookup_limit, smtp_port_not_allowed]
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '402':
          $ref: '#/components/responses/BillingLimit'
          description: 'The plan''s `custom_domains` allowance is spent (`details.feature: "custom_domains"`). Nothing was stored.'
        '403':
          description: >-
            As `Forbidden`. `scope_denied` with `details.reason = "zone_not_allowed"`: a tenant or partner key
            named a Cloudflare zone its tenant may not use ([H8]).
          x-error-codes: [permission_denied, scope_denied, tenant_suspended, partner_suspended]
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
              example:
                error:
                  code: scope_denied
                  message: This key cannot use the Cloudflare zone brightwell.example.
                  retryable: false
                  fix: Use a zone created for this tenant, or ask the platform operator to add it to domains.cloudflare_zones.
                  docs: https://pylotamail.com/docs/reference/errors#code-scope_denied
                  request_id: req_01J9Z4K8V4QW7X2M5N6P8R0T1Y
                  details:
                    reason: zone_not_allowed
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: >-
            The name is not available (`domain_exists`, with `details.claim` unless the domain is the
            caller's own); a proved claim is evicting the previous holder (`domain_claim_pending`, with
            `Retry-After`); the name already has MX records and `replace_mx` is not `true`; a `nameservers`
            name is not dedicated to mail and `confirm_dedicated` is not `true` (`details.records`); Cloudflare
            refused the zone because of a zone hold; or the idempotency key is in use.
          x-error-codes: [domain_exists, domain_claim_pending, existing_mx, domain_not_dedicated, zone_hold, idempotency_conflict, request_in_progress]
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
            Retry-After: {$ref: '#/components/headers/Retry-After'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
              example:
                error:
                  code: domain_not_dedicated
                  message: brightwell-agents.example already has a website and mail.
                  retryable: false
                  fix: Moving the nameservers would stop the website and mail on this domain. Use a domain only for mail, or send confirm_dedicated true.
                  docs: https://pylotamail.com/docs/reference/errors#code-domain_not_dedicated
                  request_id: req_01J9Z4K8V4QW7X2M5N6P8R0T1Y
                  details:
                    records:
                      - type: A
                        name: brightwell-agents.example
                        value: 203.0.113.10
                      - type: MX
                        name: brightwell-agents.example
                        value: 10 mx.mailhost.example
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '422':
          description: >-
            The deployment or the method cannot add this domain (`transport_unavailable`, with
            `details.reason`); the SMTP relay does not offer TLS (`smtp_tls_required`) or refused the
            credentials (`smtp_auth_failed`); or the method needs `PM_CF_API_TOKEN`, which is not set
            (`cf_token_required`); the tenant holds 5 unverified domains (`unverified_domain_limit`); or the
            Cloudflare zone holds 30 mail domains (`zone_domain_limit`).
          x-error-codes: [transport_unavailable, smtp_tls_required, smtp_auth_failed, cf_token_required, unverified_domain_limit, zone_domain_limit]
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
              example:
                error:
                  code: transport_unavailable
                  message: This deployment does not receive mail through Amazon SES.
                  retryable: false
                  fix: Run pmail setup ses to configure SES receiving, or use another connection method.
                  docs: https://pylotamail.com/docs/reference/errors#code-transport_unavailable
                  request_id: req_01J9Z4K8V4QW7X2M5N6P8R0T1Y
                  details:
                    reason: ses_receiving_not_configured
        '429':
          description: >-
            A rate limit was hit (`rate_limited`), or a provider's limit stopped the create
            (`upstream_rate_limited`): Cloudflare refused to create a zone with error 1105 (`Retry-After` and
            `details.retry_after` are `10800`), or the deployment's SES control-plane budget of one call per
            second had no slot within 5 seconds (`Retry-After` is the wait).
          x-error-codes: [rate_limited, upstream_rate_limited]
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
            Retry-After: {$ref: '#/components/headers/Retry-After'}
            RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}
            RateLimit-Reset: {$ref: '#/components/headers/RateLimit-Reset'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '500': {$ref: '#/components/responses/InternalError'}
        '502':
          $ref: '#/components/responses/UpstreamError'
          description: A Cloudflare or SES API returned an unexpected error, or the SMTP relay could not be reached (`smtp_relay`). Retry with backoff.
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
        '504': {$ref: '#/components/responses/GatewayTimeout'}
    get:
      operationId: listTenantDomains
      tags: [Domains]
      summary: List a tenant's domains
      description: >-
        The tenant's domains. The platform domain is visible to every key, with `tenant_id: null`, and is
        included in this list. An identity key with `domains:read` can read its tenant's domains.
      x-required-permission: ['domains:read']
      x-key-levels: [platform, partner, tenant, identity]
      x-rate-limit-buckets: [api]
      x-idempotency: none
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of domains.
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
            RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DomainPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '410': {$ref: '#/components/responses/CursorExpired'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}

  /domains/{domain_id}:
    parameters:
      - $ref: '#/components/parameters/DomainIdPath'
    get:
      operationId: getDomain
      tags: [Domains]
      summary: Get a domain
      description: 'The platform domain is visible to every key, with `tenant_id: null`.'
      x-required-permission: ['domains:read']
      x-key-levels: [platform, partner, tenant, identity]
      x-rate-limit-buckets: [api]
      x-idempotency: none
      responses:
        '200':
          description: The domain.
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
            RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Domain'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
    patch:
      operationId: updateDomain
      tags: [Domains]
      summary: Switch a domain's transport or change its SMTP relay
      description: |
        The body has `transport`, `smtp` or both. Audit-logged.

        - **`transport`** (platform keys only; partner and tenant keys get `403 scope_denied`) switches the transport that
          sends as a domain on Cloudflare: `cloudflare` or `ses`. This is the Email Sending failover of
          [J5]. `ses` needs the SES transport configured (`422 transport_unavailable`,
          `ses_not_configured`) and an SES identity for the domain (`ses_region` set): a `cloudflare_zone`,
          `nameservers` or `delegated_subdomain` domain gets one, with its three DKIM records, during
          onboarding when the SES transport is configured; a domain onboarded without one gets
          `422 transport_unavailable`. The switch also needs SES to report the identity as verified for
          sending with DKIM `SUCCESS` at that moment (`ses_identity_not_verified` otherwise). `dns_records` and `send_only`
          domains send only through `ses`, `smtp_relay` domains only through `smtp`, and the platform domain
          only through `cloudflare`; another value returns `422 transport_unavailable`,
          `method_not_supported`. The change applies to sends that reach the transport after it and starts
          a health check at once (alignment differs per transport).
        - **`smtp`** (tenant, partner or platform keys; `smtp_relay` domains only, otherwise `method_not_supported`)
          rotates the relay credentials or changes the relay. The port rule and the one-off connection of
          domain create apply (`400 smtp_port_not_allowed`, `422 smtp_tls_required`,
          `422 smtp_auth_failed`, `502 upstream_error`). The new values are kept pending until an alignment
          probe with them passes; until then sends keep using the current values, which `smtp` in the
          response still shows. The probe result arrives as a domain health change.
      x-required-permission: ['domains:write']
      x-key-levels: [platform, partner, tenant]
      x-permission-notes: '`transport` needs a platform key: a partner or tenant key gets `403 scope_denied`. `smtp` is allowed for tenant, partner and platform keys.'
      x-rate-limit-buckets: [api]
      x-idempotency: none
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DomainUpdateRequest'}
            examples:
              transport:
                summary: Fail over to SES (platform key)
                value:
                  transport: ses
              smtp:
                summary: Rotate the relay credentials
                value:
                  smtp:
                    host: smtp.provider.example
                    port: 587
                    username: agents@brightwell.example
                    password: example-app-password-2
                    probe_from: agents@brightwell.example
      responses:
        '200':
          description: The domain, with its new `transport`, or with its current `smtp` while the new values wait for a passing probe.
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
            RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Domain'}
        '400':
          description: The request is invalid, or `smtp.port` is not `465` or `587`.
          x-error-codes: [invalid_request, smtp_port_not_allowed]
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '422':
          description: >-
            The domain cannot use the requested transport or has no SMTP relay (`transport_unavailable`,
            `method_not_supported`), the transport is not configured (`ses_not_configured`), SES does not
            report the domain's identity as verified for sending with DKIM `SUCCESS`
            (`ses_identity_not_verified`), or the new relay does not offer TLS (`smtp_tls_required`) or
            refused the credentials (`smtp_auth_failed`).
          x-error-codes: [transport_unavailable, smtp_tls_required, smtp_auth_failed]
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '429':
          description: >-
            A rate limit was hit (`rate_limited`), or the deployment's SES control-plane budget of one call per
            second had no slot within 5 seconds (`upstream_rate_limited`; `Retry-After` is the wait).
          x-error-codes: [rate_limited, upstream_rate_limited]
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
            Retry-After: {$ref: '#/components/headers/Retry-After'}
            RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}
            RateLimit-Reset: {$ref: '#/components/headers/RateLimit-Reset'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
              example:
                error:
                  code: upstream_rate_limited
                  message: The Amazon SES control-plane budget had no free slot within 5 seconds.
                  retryable: true
                  fix: Wait for the number of seconds in the Retry-After header, then retry.
                  docs: https://pylotamail.com/docs/reference/errors#code-upstream_rate_limited
                  request_id: req_01J9Z4K8V4QW7X2M5N6P8R0T1Y
                  details:
                    retry_after: 3
        '500': {$ref: '#/components/responses/InternalError'}
        '502':
          $ref: '#/components/responses/UpstreamError'
          description: The new SMTP relay could not be reached. Nothing was stored. Retry with backoff.
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
    delete:
      operationId: deleteDomain
      tags: [Domains]
      summary: Remove a domain
      description: >-
        Fails with `409 domain_in_use` while any address on the domain is `active` or `retiring`, and with
        `403 scope_denied` on the platform domain ([H9]). Otherwise starts removal of the provider objects
        that onboarding created for this domain, and only those ([H10], [H11]): routing rules, this name's
        routing records (the zone-wide routing disable only for the zone's last routing domain, at its
        apex), sending onboarding and the event subscription, and for a domain with an SES identity, the SES
        identity and the domain's addresses in the retired-address receipt rules (`pm-retired-{n}`). The
        domain moves to `removing`, then `removed`, and `domain.removed` is emitted with `reason: requested`.
        On a domain that is already `removing` because its removal job failed after 10 attempts, the call
        restarts the job from the first step not done and answers `202` ([H12]).
      x-required-permission: ['domains:write']
      x-key-levels: [platform, partner, tenant]
      x-rate-limit-buckets: [api]
      x-idempotency: none
      responses:
        '202':
          description: Removal started, or a failed removal restarted. The domain is returned in state `removing`.
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
            RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Domain'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: An address on the domain is still `active` or `retiring`.
          x-error-codes: [domain_in_use]
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '429':
          description: A rate limit was hit (`rate_limited`).
          x-error-codes: [rate_limited]
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
            Retry-After: {$ref: '#/components/headers/Retry-After'}
            RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}
            RateLimit-Reset: {$ref: '#/components/headers/RateLimit-Reset'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
              example:
                error:
                  code: upstream_rate_limited
                  message: The Amazon SES control-plane budget had no free slot within 5 seconds.
                  retryable: true
                  fix: Wait for the number of seconds in the Retry-After header, then retry.
                  docs: https://pylotamail.com/docs/reference/errors#code-upstream_rate_limited
                  request_id: req_01J9Z4K8V4QW7X2M5N6P8R0T1Y
                  details:
                    retry_after: 3
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}

  /domains/{domain_id}/records:
    parameters:
      - $ref: '#/components/parameters/DomainIdPath'
    get:
      operationId: getDomainRecords
      tags: [Domains]
      summary: Read and check the domain's DNS records
      description: >-
        Re-reads the expected records from the provider APIs and checks each against DNS. `name` is fully
        qualified and `host` is the same name relative to the registrable domain ([N17]). `status` is
        `ok`, `missing`, `mismatch` or `unexpected` (an extra record that conflicts, for example a second
        SPF record). With `?format=bind` the same records come back as an RFC 1035 zone fragment
        (`text/plain`), with suggested records, records to remove and registrar nameservers as comments.
      x-required-permission: ['domains:read']
      x-key-levels: [platform, partner, tenant, identity]
      x-rate-limit-buckets: [api]
      x-idempotency: none
      parameters:
        - name: format
          in: query
          required: false
          description: >-
            `json` (the default) or `bind`: the same records as an RFC 1035 zone fragment, `$ORIGIN` the
            registrable domain, `$TTL 3600`, with suggested records, records to remove and registrar
            nameservers as comments.
          schema:
            type: string
            enum: [json, bind]
            default: json
      responses:
        '200':
          description: The expected records and what DNS returned for each.
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
            RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DomainRecords'}
              example:
                data:
                  - type: TXT
                    name: _pylota-mail.mail.acmecarhire.example
                    host: _pylota-mail.mail
                    value: pm-verify=8f2k3m9q
                    purpose: ownership
                    required: true
                    status: ok
                    observed: [pm-verify=8f2k3m9q]
                  - type: TXT
                    name: cf-bounce._domainkey.mail.acmecarhire.example
                    host: cf-bounce._domainkey.mail
                    value: v=DKIM1; k=rsa; p=MIIBIjANBgkq
                    purpose: dkim
                    required: true
                    status: missing
                    observed: []
                checked_at: '2026-10-09T10:05:00Z'
            text/plain:
              schema:
                type: string
              example: |
                ; Pylota Mail DNS records for mail.acmecarhire.example (dom_01JA9G6M2WW7X2M5N6P8R0T1YR), method dns_records.
                $ORIGIN acmecarhire.example.
                $TTL 3600
                _pylota-mail.mail IN TXT "pm-verify=8f2k3m9q" ; ownership, required, ok
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '502': {$ref: '#/components/responses/UpstreamError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}

  /domains/{domain_id}/probe:
    parameters:
      - $ref: '#/components/parameters/DomainIdPath'
    post:
      operationId: probeDomain
      tags: [Domains]
      summary: Run the SMTP alignment probe now
      description: >-
        For a domain whose transport is `smtp` (otherwise `422 transport_unavailable`,
        `details.reason: "method_not_supported"`). Sends a message `From: {probe_from}` through the relay to
        an address on the platform domain. It passes when the `From` header arrives unchanged and DMARC for
        the domain passes on Pylota Mail's own check. The result arrives as a domain health change within 15
        minutes: in the domain's `probe`, and on failure as the issue `smtp_unaligned`,
        `smtp_from_rewritten` or `smtp_probe_timeout`. At most once a minute per domain
        (`429 rate_limited`). A probe also runs before the domain's first send and every day after.
      x-required-permission: ['domains:write']
      x-key-levels: [platform, partner, tenant]
      x-rate-limit-buckets: [api]
      x-idempotency: optional
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      responses:
        '202':
          description: The probe was sent.
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
            RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}
            Idempotent-Replayed: {$ref: '#/components/headers/Idempotent-Replayed'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProbeAccepted'}
              example:
                probe_id: prb_01JA2B3C4D5E6F7G8H9J0K1M2N
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/IdempotencyConflict'}
        '422':
          description: The domain's transport is not `smtp`.
          x-error-codes: [transport_unavailable]
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
              example:
                error:
                  code: transport_unavailable
                  message: This domain does not send through an SMTP relay.
                  retryable: false
                  fix: Probes run only for domains added with method smtp_relay.
                  docs: https://pylotamail.com/docs/reference/errors#code-transport_unavailable
                  request_id: req_01J9Z4K8V4QW7X2M5N6P8R0T1Y
                  details:
                    reason: method_not_supported
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: A probe already ran for this domain in the last minute, or another rate limit was hit. Wait `Retry-After` seconds.
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}

