            application/json:
              schema: {$ref: '#/components/schemas/ReplayResponse'}
              example:
                queued: 42
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/IdempotencyConflict'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}

  # ────────────────────────────────────────── Event feed ──────────────────────────────────────────

  /events:
    get:
      operationId: listEvents
      tags: [Event feed]
      summary: Read the tenant's event log
      description: >-
        Events after a cursor, in the order they were appended (not `occurred_at`), with type and identity
        filters and an optional long poll (`wait`). The same envelopes that webhooks deliver, byte for byte,
        with the same `evt_` IDs; webhook endpoint filters do not apply. A key sees only events whose subject
        it could read; other types the request covers are listed in `withheld_types`, never refused.
        `next_cursor` is never `null`: pass it as `after` to continue. A page can be empty with
        `has_more: true`: ask again at once. Cursors do not expire with age; a cursor behind the retained log
        gets `410 cursor_expired` with `details.oldest_cursor`. A `since` never expires; `since_truncated`
        says when events appended after it were already removed. At most 5 long polls per key and 20 per tenant
        at once (`429 rate_limited`, `details.bucket = "events_wait"`). A tenant being erased has no feed
        (`404 tenant_not_found`). Responses carry `Cache-Control: no-store`.
      x-required-permission: ['events:read']
      x-key-levels: [platform, partner, tenant, identity]
      x-permission-notes: >-
        Platform and partner keys must pass `tenant_id` (`400 invalid_request` without it). Mail events need
        `messages:read`; `message.quarantined` and `message.screened` also need `quarantine:review`; identity
        keys see only their own identity's events.
      x-rate-limit-buckets: [api]
      x-idempotency: none
      parameters:
        - $ref: '#/components/parameters/TenantIdQuery'
        - $ref: '#/components/parameters/EventAfter'
        - $ref: '#/components/parameters/EventSince'
        - $ref: '#/components/parameters/EventTypes'
        - $ref: '#/components/parameters/EventIdentityFilter'
        - $ref: '#/components/parameters/EventLimit'
        - $ref: '#/components/parameters/EventWait'
      responses:
        '200':
          description: A page of events (possibly empty).
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
            RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}
            Cache-Control: {$ref: '#/components/headers/Cache-Control-No-Store'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EventFeedPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '410': {$ref: '#/components/responses/CursorExpired'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
        '504': {$ref: '#/components/responses/GatewayTimeout'}

  /events/stream:
    get:
      operationId: streamEvents
      tags: [Event feed]
      summary: Stream events over a WebSocket
      description: >-
        Upgrades to a WebSocket that pushes the tenant's events in log order and resumes from a cursor or a
        consumer with nothing lost. Authenticate with `Authorization`, or, from a browser, with the
        subprotocols `pylota-mail.events.v1` and `pylota-mail.token.{token}` (a stream token); never in the URL
        (`400 invalid_request`, `details.reason = "credential_in_url"`). Send `subscribe` within 60 seconds;
        then receive `subscribed`, `events`, `heartbeat` and `error` messages, and send `ack` and `ping`. At
        most 100 connections per tenant and 10 per key. Reconnect only after close `1001`, `1006`, `1011`,
        `1012`, `1013`, `4408` or an unknown code; retry `4429` after 30 seconds; reconcile after `4410`; stop
        on every other close (after `4409` another connection holds this one's place). The message protocol
        and close codes are in `docs/src/project/design/event-feed.md` § 7.
      security: [{apiKey: []}, {streamToken: []}]
      x-required-permission: ['events:read']
      x-key-levels: [platform, partner, tenant, identity]
      x-permission-notes: Platform and partner keys must pass `tenant_id`. Each event is pushed only when the key could read its subject, as on `listEvents`.
      x-rate-limit-buckets: [api]
      x-idempotency: none
      parameters:
        - $ref: '#/components/parameters/TenantIdQuery'
      responses:
        '101':
          description: Switching protocols. `Sec-WebSocket-Protocol` is `pylota-mail.events.v1` when requested.
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '426': {$ref: '#/components/responses/UpgradeRequired'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}

  /events/stream-tokens:
    post:
      operationId: createStreamToken
      tags: [Event feed]
      summary: Mint a single-use stream token
      description: >-
        A single-use token valid for 60 seconds, for a browser that cannot send `Authorization` on a
        WebSocket. Mint it on your server and hand it to your page. At most 100 live (unredeemed and
        unexpired) per tenant; expired tokens stop counting (`429 rate_limited`,
        `details.bucket = "stream_tokens"`). `Idempotency-Key` is ignored: each call mints a new secret.
      x-required-permission: ['events:read']
      x-key-levels: [platform, partner, tenant, identity]
      x-permission-notes: Platform and partner keys must pass `tenant_id`. The token carries the minting key's identity and visibility.
      x-rate-limit-buckets: [api]
      x-idempotency: none
      parameters:
        - $ref: '#/components/parameters/TenantIdQuery'
      responses:
        '201':
          description: The token, valid once for 60 seconds.
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
            RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}
            Cache-Control: {$ref: '#/components/headers/Cache-Control-No-Store'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StreamToken'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}

  /event-consumers:
    post:
      operationId: createEventConsumer
      tags: [Event feed]
      summary: Create a durable event consumer, or return the existing one
      description: >-
        A durable consumer keeps a named position in the tenant's event log for the key that created it.
        The same key repeating the same name and filters gets `200` with the existing consumer; another key
        or other filters get `409 event_consumer_name_taken`. At most 20 per tenant. `types` that name events
        the key can never see get `403 permission_denied` with `details.required`. `start` is `latest`
        (default), `earliest` or a cursor.
      x-required-permission: ['events:read']
      x-key-levels: [platform, partner, tenant, identity]
      x-permission-notes: Platform and partner keys must pass `tenant_id`. The consumer is bound to the key that created it.
      x-rate-limit-buckets: [api]
      x-idempotency: optional
      parameters:
        - $ref: '#/components/parameters/TenantIdQuery'
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EventConsumerCreateRequest'}
            example:
              name: pylota-reconcile
              types: ['message.*']
              identity_ids: null
              start: latest
      responses:
        '200':
          description: The existing consumer with this name, owner key and filters.
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
            RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}
            Idempotent-Replayed: {$ref: '#/components/headers/Idempotent-Replayed'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EventConsumer'}
        '201':
          description: Created.
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
            RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EventConsumer'}
              example:
                id: evc_01J9Z3K8V4QW7X2M5N6P8R0T1Y
                name: pylota-reconcile
                tenant_id: ten_01J9Z3K8V4QW7X2M5N6P8R0T1Y
                owner_key_id: key_01J9Z3K8V4QW7X2M5N6P8R0T1Y
                types: ['message.*']
                identity_ids: null
                committed_cursor: ec_eyJ2IjoxLCJwIjo0MjEwfQ
                committed_at: null
                last_read_at: null
                positions_behind: 0
                state: active
                created_at: '2026-10-17T09:00:00Z'
                updated_at: '2026-10-17T09:00:00Z'
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: >-
            The name is taken by another key's consumer or with other filters (`event_consumer_name_taken`), or
            the idempotency key is in use.
          x-error-codes: [event_consumer_name_taken, idempotency_conflict, request_in_progress]
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '410': {$ref: '#/components/responses/CursorExpired'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '422':
          description: The tenant already has 20 durable event consumers (`details.limit`).
          x-error-codes: [event_consumer_limit_reached]
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
    get:
      operationId: listEventConsumers
      tags: [Event feed]
      summary: List durable event consumers
      description: >-
        The tenant's consumers, newest first. Identity keys list their own consumers; tenant, partner and
        platform keys list every consumer of the tenant.
      x-required-permission: ['events:read']
      x-key-levels: [platform, partner, tenant, identity]
      x-permission-notes: Platform and partner keys must pass `tenant_id`.
      x-rate-limit-buckets: [api]
      x-idempotency: none
      parameters:
        - $ref: '#/components/parameters/TenantIdQuery'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of consumers, newest first.
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
            RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EventConsumerPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '410': {$ref: '#/components/responses/CursorExpired'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}

  /event-consumers/{consumer_id}:
