  # ──────────────────────────────────────────── Privacy ───────────────────────────────────────────

  /erasure-requests:
    post:
      operationId: createErasureRequest
      tags: [Privacy]
      summary: Request an erasure
      description: |
        Deletes data for one scope and returns a receipt counting what was deleted in each store
        (FR-PRV-3). Keyword rows, references and vectors are removed together, and a probe query afterwards
        must return nothing (FR-SRCH-11). Held threads are skipped and listed in the receipt (FR-PRV-4); a
        hold never makes this request fail (no `423`).
        An `erasure.completed` event is emitted.

        | `scope` | Also needs | Deletes |
        |---|---|---|
        | `message` | `identity_id`, `message_id` | One message, its attachments, text, index rows, vectors, raw copies |
        | `thread` | `identity_id`, `thread_id` | Every message in the thread |
        | `counterparty` | `counterparty_address` | Every message to or from that address, in every identity of the tenant |
        | `identity` | `identity_id` | The whole mailbox. Its addresses are tombstoned |
        | `tenant` | none | Everything in the tenant. Then the tenant is marked `erased`, once no held thread remains |

        A failing step is retried automatically until `deadline_at` − 4 hours (20 hours after the first
        request); then the request ends `failed`, and a new request for the same scope and target resumes it
        at its failed step (`resumes_id` names it, `deadline_at` is copied), for every scope. At most one
        request resumes a given request; a second one racing it gets `200` with the first.

        A `tenant` request also needs `tenants:erase` (`403 permission_denied` with
        `details.required = ["tenants:erase"]` otherwise), which workspace admins and the keys they mint never
        hold ([W35]).

        A `tenant` request for a tenant that is already `erasing` depends on the tenant's latest
        tenant-scope request: `queued` or `running` returns it with `200` (the same `era_` ID) and starts
        nothing; `failed` returns `202` with a new request that resumes the failed job at its failed step
        (`resumes_id` names the failed request, `deadline_at` is copied); `completed_with_holds` returns
        `202` with a continuation request that finishes the erasure once no hold remains. For an `erased`
        tenant it returns `409 tenant_erased`. A tenant erasure never deletes a held thread: while one
        remains the request ends `completed_with_holds` and the tenant stays `erasing`. Any other erasure
        request naming an `erasing` or `erased` tenant, like every write to such a tenant, gets
        `404 tenant_not_found` from a non-platform key (the hold routes excepted, on a tenant with holds).
      x-required-permission: ['erasure:manage']
      x-key-levels: [platform, partner, tenant, identity]
      x-permission-notes: An identity key can only erase within its own identity (`message`, `thread` and `identity` scopes). `counterparty` needs a tenant, partner or platform key; `tenant` needs a platform key, the partner key of the tenant's own partner, or the tenant's own key, and in every case `tenants:erase` as well as `erasure:manage`.
      x-rate-limit-buckets: [api]
      x-idempotency: optional
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ErasureRequestCreate'}
            example:
              tenant_id: ten_01J9Z3K8V4QW7X2M5N6P8R0T1Y
              scope: counterparty
              counterparty_address: jo@example.net
              reason: Data subject request DSR-1182
      responses:
        '202':
          description: >-
            The erasure request. It completes asynchronously (within 24 hours, NFR-PRV-1). When the latest request with the
            same scope and target `failed`, or the tenant's latest tenant-scope request ended
            `completed_with_holds`, a new request with `resumes_id` set.
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
            RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}
            Idempotent-Replayed: {$ref: '#/components/headers/Idempotent-Replayed'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErasureRequest'}
        '200':
          description: >-
            A `tenant` request for a tenant already being erased whose latest tenant-scope request is still
            `queued` or `running`: that request, unchanged. Also the resumption of a failed request that a
            concurrent request created first.
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
            RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErasureRequest'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: >-
            The tenant is already `erased` (`tenant_erased`, for a `tenant` request), the request names the
            system identity (scope `identity`) or the default tenant (scope `tenant`), which no key can erase
            (`system_protected`, [A17]), or the idempotency key is in use.
          x-error-codes: [tenant_erased, system_protected, idempotency_conflict, request_in_progress]
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
    get:
      operationId: listErasureRequests
      tags: [Privacy]
      summary: List erasure requests
      x-required-permission: ['erasure:manage']
      x-key-levels: [platform, partner, tenant, identity]
      x-rate-limit-buckets: [api]
      x-idempotency: none
      parameters:
        - $ref: '#/components/parameters/TenantIdQuery'
        - name: status
          in: query
          description: Only requests with this status.
          schema: {$ref: '#/components/schemas/ErasureStatus'}
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of erasure requests.
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
            RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErasureRequestPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '410': {$ref: '#/components/responses/CursorExpired'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}

  /erasure-requests/{erasure_id}:
    parameters:
      - $ref: '#/components/parameters/ErasureIdPath'
    get:
      operationId: getErasureRequest
      tags: [Privacy]
      summary: Get an erasure request
      description: >-
        The request and its status. `completed_with_holds` means the erasure finished but skipped held
        threads, which the receipt lists in `held`. The partner key of an erased tenant's partner can still
        read the tenant's erasure requests and receipts.
      x-required-permission: ['erasure:manage']
      x-key-levels: [platform, partner, tenant, identity]
      x-rate-limit-buckets: [api]
