  # ───────────────────────────────────────────── Keys ─────────────────────────────────────────────

  /keys:
    post:
      operationId: createKey
      tags: [Keys]
      summary: Create an API key
      description: >-
        The new key's level, tenant, identity and permissions must all lie within the caller's own,
        otherwise `403 key_scope_exceeded` (FR-KEY-1). The one exception: a platform or partner key may grant
        `identities:sign`, which it cannot hold, to a tenant or identity key it mints; the `key.create`
        audit row records it in `details.granted_without_holding`. A tenant or identity key's `mode` follows
        its tenant; platform and partner keys are `live`.
        The response carries `secret` (`pmk_live_…` or `pmk_test_…`), **shown only once**; only a keyed
        hash is stored (FR-KEY-2).

        - **Explicit permissions.** `permissions` is required at every level, `platform` included: there is
          no implicit full set. A missing or empty list is `400 invalid_request`.
        - **Permissions tied to levels.** A permission the new key's level cannot hold is refused, whoever
          the caller is, with `400 invalid_request` and `details.reason = "permission_not_allowed_for_level"`: `platform:ops`
          and `partners:manage` on any key but a platform key; `tenants:manage` on a tenant or identity key;
          `members:read`, `members:manage`, `suppressions:manage`, `audit:read`, `usage:read` and
          `drafts:approve` on an identity key (an identity key holds `usage:read` implicitly for its own
          workspace's `GET /v1/usage`, and can never approve drafts); `identities:sign` on a platform or partner key; `tenants:erase` on an identity
          key. The table is under `Permission`.
        - **Owner-only permission.** `tenants:erase` on a tenant key needs a caller whose
          `created_by_role` is `owner` (the workspace owner's console session, or a key it minted):
          otherwise `400 invalid_request` with `details.reason = "permission_owner_only"`.
        - **Partner keys** (FR-KEY-4). `level: partner` needs `partner_id` and no `tenant_id` or
          `identity_id`, and only a platform key may ask for it (an unknown partner is
          `404 partner_not_found`); other levels refuse `partner_id`. A partner key mints only `tenant` and
          `identity` keys of the tenants its partner's keys created; a `partner` or `platform` key, or another
          tenant, is `403 key_scope_exceeded`.
        - **Order.** These checks run first; the scope check (`403 key_scope_exceeded`) comes after them,
          then the active-key cap: at most 100 active tenant and identity keys per tenant and 10 partner
          keys per partner (`422 key_limit_reached`). Minting is audit-logged (`key.create`, with `level`
          and, for a partner key, `partner_id`).
        - **Who minted it.** `created_by_user_id` is the console user whose session minted the key, copied
          to every key minted with it; removing that person, or lowering their role, revokes their keys.
        - **MCP tools.** `mcp_tools` (optional) lists the MCP tools the key may see, at most 64 distinct
          names. It narrows what the key's permissions and level allow and never widens them. Absent or
          `null` means every allowed tool; `[]` means none. Rotation keeps the list; keys minted by this key
          do not inherit it. It limits MCP only: REST access follows the permissions.
      x-required-permission: ['keys:manage']
      x-key-levels: [platform, partner, tenant, identity]
      x-rate-limit-buckets: [api]
      x-idempotency: optional
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ApiKeyCreateRequest'}
            example:
              name: bookings-agent
              level: identity
              tenant_id: ten_01J9Z3K8V4QW7X2M5N6P8R0T1Y
              identity_id: idn_01J9Z3K8V4QW7X2M5N6P8R0T1Y
              permissions: ['messages:read', 'messages:send', 'search:read', 'attachments:read', 'identities:sign', 'metrics:read']
              mcp_tools: null
              expires_at: '2027-10-09T00:00:00Z'
      responses:
        '201':
          description: The key, with its secret (shown only once).
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
            RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}
            Idempotent-Replayed: {$ref: '#/components/headers/Idempotent-Replayed'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApiKeyCreated'}
        '400':
          description: >-
            The request is invalid (`details.errors[]` holds `{path, message}`): for example `permissions`
            missing or empty, or `tenant_id` or `identity_id` missing for the level. A permission the new
            key's level cannot hold is `invalid_request` with `details.reason =
            "permission_not_allowed_for_level"`; `tenants:erase` from a caller that is not the workspace
            owner's session or one of its keys, `details.reason = "permission_owner_only"`. An unknown MCP tool
            in `mcp_tools` is `invalid_request` with `details.reason = "unknown_mcp_tool"`; a tool the new key
            could not see, `details.reason = "mcp_tool_not_permitted"`.
          x-error-codes: [invalid_request, invalid_idempotency_key]
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
              example:
                error:
                  code: invalid_request
                  message: A platform key cannot hold identities:sign.
                  retryable: false
                  fix: Remove identities:sign, or create a tenant or identity key to sign as an identity.
                  docs: https://pylotamail.com/docs/reference/errors#code-invalid_request
                  request_id: req_01J9Z4K8V4QW7X2M5N6P8R0T1Y
                  details:
                    reason: permission_not_allowed_for_level
                    errors:
                      - path: permissions[2]
                        message: identities:sign cannot be held by a platform key
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403':
          description: The key lacks `keys:manage`, the target is out of scope, the new key would be wider than the caller, or the partner is suspended. A suspended tenant does not stop key management.
          x-error-codes: [permission_denied, scope_denied, key_scope_exceeded, partner_suspended]
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/IdempotencyConflict'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '422':
          description: >-
            The tenant already has 100 active tenant and identity keys, or the partner 10 partner keys
            (`details.limit`). Revoked and expired keys do not count.
          x-error-codes: [key_limit_reached]
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
              example:
                error:
                  code: key_limit_reached
                  message: This tenant already has 100 active API keys.
                  retryable: false
                  fix: Revoke keys you no longer use, then create the new one.
                  docs: https://pylotamail.com/docs/reference/errors#code-key_limit_reached
                  request_id: req_01J9Z4K8V4QW7X2M5N6P8R0T1Y
                  details:
                    limit: 100
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
    get:
      operationId: listKeys
      tags: [Keys]
      summary: List API keys
      description: >-
        Keys the caller may read (never with secrets): those it reaches and is not narrower than, as for
        `GET /v1/keys/{key_id}`. A partner key lists only tenant and identity keys of its own tenants; an
        identity key, only identity keys of its own identity.
      x-required-permission: ['keys:manage']
      x-key-levels: [platform, partner, tenant, identity]
      x-rate-limit-buckets: [api]
      x-idempotency: none
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of keys.
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
            RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApiKeyPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '410': {$ref: '#/components/responses/CursorExpired'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}

  /keys/{key_id}:
    parameters:
      - $ref: '#/components/parameters/KeyIdPath'
    get:
      operationId: getKey
      tags: [Keys]
      summary: Get an API key
      description: >-
        The key, never with its secret.
        Two checks apply to the target key ([J20]). **Reach:** a platform key reaches every key; a partner
        key, the tenant and identity keys of its own tenants; a tenant key, the keys of its tenant; an
        identity key, only the identity keys of its own identity. A key out of reach is
        `404 key_not_found`, like a missing one. **Not wider:** the target's level must be at most the
        caller's and each of its permissions one the caller holds (or, for a platform or partner caller,
        `identities:sign`); otherwise `403 key_scope_exceeded` and nothing is changed or returned. A key
        always passes for itself.
      x-required-permission: ['keys:manage']
      x-key-levels: [platform, partner, tenant, identity]
      x-rate-limit-buckets: [api]
      x-idempotency: none
      responses:
        '200':
          description: The key (never with its secret).
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
            RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApiKey'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/KeyManageForbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
    delete:
      operationId: revokeKey
      tags: [Keys]
      summary: Revoke an API key
      description: >-
        Revokes the key immediately. Later requests with it get `401 key_revoked`.
        Two checks apply to the target key ([J20]). **Reach:** a platform key reaches every key; a partner
        key, the tenant and identity keys of its own tenants; a tenant key, the keys of its tenant; an
        identity key, only the identity keys of its own identity. A key out of reach is
        `404 key_not_found`, like a missing one. **Not wider:** the target's level must be at most the
        caller's and each of its permissions one the caller holds (or, for a platform or partner caller,
        `identities:sign`); otherwise `403 key_scope_exceeded` and nothing is changed or returned. A key
        always passes for itself.
      x-required-permission: ['keys:manage']
      x-key-levels: [platform, partner, tenant, identity]
      x-rate-limit-buckets: [api]
      x-idempotency: none
      responses:
        '204':
          description: The key was revoked.
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
            RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/KeyManageForbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}

  /keys/{key_id}/rotate:
    parameters:
      - $ref: '#/components/parameters/KeyIdPath'
    post:
      operationId: rotateKey
      tags: [Keys]
      summary: Rotate an API key
      description: >-
        Issues a new secret for the same key and returns it once. The old secret keeps working until the
        overlap ends (0–168 hours, default 24). Because the response carries the secret, no key may rotate
        a key wider than itself.
        Two checks apply to the target key ([J20]). **Reach:** a platform key reaches every key; a partner
        key, the tenant and identity keys of its own tenants; a tenant key, the keys of its tenant; an
        identity key, only the identity keys of its own identity. A key out of reach is
        `404 key_not_found`, like a missing one. **Not wider:** the target's level must be at most the
        caller's and each of its permissions one the caller holds (or, for a platform or partner caller,
        `identities:sign`); otherwise `403 key_scope_exceeded` and nothing is changed or returned. A key
        always passes for itself. **Provider-managed:** a key a platform or partner key minted can be
        rotated only by a platform key or a partner key that reaches it (`403 key_scope_exceeded`,
        `details.reason = "provider_managed"`, [W48]). On success the key's `created_by_user_id` and
        `created_by_role` become the caller's, so the new secret is traced to whoever received it.
      x-required-permission: ['keys:manage']
