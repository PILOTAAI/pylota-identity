              plan_id: developer
      responses:
        '200':
          description: The updated billing account.
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
            RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BillingAccount'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: The workspace's plan is paid through Stripe, so `plan_id` cannot be set here.
          x-error-codes: [plan_managed_by_stripe]
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}

  /audit-events:
    get:
      operationId: listAuditEvents
      tags: [Audit]
      summary: List audit events
      description: >-
        Audit entries, newest first. They never hold message content or clear-text addresses. Audit rows cover
        administrative actions; the `action` values are keys: `key.create`, `key.rotate`, `key.revoke`; identity
        signing keys `identity_key.create`, `identity_key.rotate`, `identity_key.revoke`; deployment signing
        keys `signing_key.rotate`; partners: `partner.create`, `partner.update`, `partner.delete`; tenants:
        `tenant.create` (with the `partner_id` when a partner key created it), `tenant.policy_update` (every
        policy write), `tenant.ramp_held`, `tenant.ramp_lifted`; identities: `identity.create`,
        `identity.update` (a status change by a key or a person, with `details.from` and `details.to`),
        `identity.delete`, `identity.auto_pause`; domains: `domain.create` (with any MX records `replace_mx`
        deleted), `domain.transport`, `domain.evict`; service accounts: `account.request`, `account.approve`,
        `account.reject`, `account.close`, `account.delete`; mail: `quarantine.release`, `message.cancel`,
        `message.resolve`, `suppression.remove` (only for a `complaint` suppression); webhooks:
        `webhook.create`, `webhook.update`, `webhook.delete`, `webhook.rotate_secret`, `webhook.replay`,
        `webhook.disable`; privacy: `erasure.create`, `hold.set`, `hold.removed`, `hold.expired`,
        `export.delete`; people: `member.invite`, `member.invite_resend`, `member.invite_revoke`, `member.join`,
        `member.role_change`, `member.leave`, `member.remove`, `member.ownership_transfer`, `user.delete`,
        `user.notifications_resume`, `user.oauth_unlink`, `waitlist.invite`; billing:
        `billing.checkout_started`, `billing.portal_opened`, `billing.downgrade_scheduled`, `billing.downgrade_cancelled`, `billing.mode_change`, `billing.plan_set`,
        `billing.plan_changed`, `billing.duplicate_cancelled`, `billing.dispute_opened`,
        `billing.dispute_closed`, `billing.refund_recorded`; platform operations: `ops.switch`,
        `mailbox.restore`, `master_key.activated`, `master_key.resealed`; automatic containment:
        `partner.auto_suspend`, `tenant.auto_pause`, `domain.auto_pause`; and `mail.read`, one row per request
        by a platform or partner key to a route that returns mail content, written before the response. **Sends
        are not audit rows**: each send is recorded by its message, its events (`message.sent` and the delivery
        events) and its per-recipient delivery log. To review what a key sent, list the outbound messages of the
        identities it reaches for the period; request logs also carry the key ID for 7 days. A partner key reads
        the rows of its own tenants only; rows about a partner itself have no `tenant_id` and are for platform
        keys.
      x-required-permission: ['audit:read']
      x-key-levels: [platform, partner, tenant]
      x-rate-limit-buckets: [api]
      x-idempotency: none
      parameters:
        - $ref: '#/components/parameters/TenantIdQuery'
        - name: actor_key_id
          in: query
          description: Only entries made by this key.
          schema: {$ref: '#/components/schemas/KeyId'}
        - name: action
          in: query
          description: Only entries with this action, for example `key.create` or `quarantine.release`.
          schema:
            type: string
        - name: target_id
          in: query
          description: Only entries about this resource ID.
          schema:
            type: string
        - $ref: '#/components/parameters/After'
        - $ref: '#/components/parameters/Before'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of audit events.
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
            RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuditEventPage'}
              example:
                data:
                  - id: aud_01JA2B3C4D5E6F7G8H9J0K1M2N
                    tenant_id: ten_01J9Z3K8V4QW7X2M5N6P8R0T1Y
                    actor_key_id: key_01J9Z3K8V4QW7X2M5N6P8R0T1Y
                    actor_user_id: null
                    action: quarantine.release
                    target_type: message
                    target_id: msg_01JA2B3C4D5E6F7G8H9J0K1M2N
                    details: {}
                    request_id: req_01JA2B3C4D5E6F7G8H9J0K1M2N
                    created_at: '2026-10-09T10:20:00Z'
                next_cursor: null
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '410': {$ref: '#/components/responses/CursorExpired'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}

  # ──────────────────────────────────── Deliverability metrics ────────────────────────────────────

  /metrics/rates:
    get:
      operationId: getRates
      tags: [Metrics]
      summary: Get pause-window rates
      description: >-
        Every rule that can pause the scope's sending (and, for a domain, the operator alert rules), with
        its threshold, source, window, minimum outcomes, current counts, whether it is tripped, and the
        headroom: the fewest further complaints or bounces that would trip it. Computed by the same code,
        from the same state, that decides the pauses. `sending.stops` lists the pauses in effect. Plan
        allowances and metered units stay on `getUsage`.
      x-required-permission: ['metrics:read']
      x-key-levels: [platform, partner, tenant, identity]
      x-permission-notes: >-
        Platform and partner keys pass `tenant_id`. An identity key reads its own identity, its tenant, the
        platform domain and the domains its addresses use.
      x-rate-limit-buckets: [api]
      x-idempotency: none
      parameters:
        - $ref: '#/components/parameters/TenantIdQuery'
        - name: scope
          in: query
          description: Default `identity` for an identity key, `tenant` otherwise.
          schema:
            type: string
            enum: [identity, tenant, domain]
        - name: identity_id
          in: query
          description: The identity, for `scope=identity` (an identity key's own by default).
          schema: {$ref: '#/components/schemas/IdentityId'}
        - name: domain_id
          in: query
          description: The domain, for `scope=domain`.
          schema: {$ref: '#/components/schemas/DomainId'}
      responses:
        '200':
          description: The windows.
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
            RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Rates'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404':
          description: No such tenant, identity or domain in scope.
          x-error-codes: [tenant_not_found, identity_not_found, domain_not_found]
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}

  /metrics/events:
    get:
      operationId: getEventCounts
      tags: [Metrics]
      summary: Get event counts
      description: >-
        Counts of message events per UTC hour or day for an identity, a tenant or a domain, one entry per
        bucket including zeros. Hourly: at most 168 buckets within the last 192 hours. Daily: at most 92
        buckets within the last 92 days. Tenant and domain scope read at most 100 identities and report
        `partial` and `failed_identities`.
      x-required-permission: ['metrics:read']
      x-key-levels: [platform, partner, tenant, identity]
      x-permission-notes: Platform and partner keys pass `tenant_id`. An identity key reads only identity scope, for itself.
      x-rate-limit-buckets: [api, search]
      x-idempotency: none
      parameters:
        - $ref: '#/components/parameters/TenantIdQuery'
        - name: scope
          in: query
          description: Default `identity` for an identity key, `tenant` otherwise.
          schema:
            type: string
            enum: [identity, tenant, domain]
        - name: identity_id
          in: query
          description: The identity, for `scope=identity`.
          schema: {$ref: '#/components/schemas/IdentityId'}
        - name: domain_id
          in: query
          description: The domain, for `scope=domain`.
          schema: {$ref: '#/components/schemas/DomainId'}
        - name: bucket
          in: query
          description: Bucket size.
          schema:
            type: string
            enum: [hour, day]
            default: day
        - name: from
          in: query
          description: Rounded down to the bucket. Default 24 hours (hour) or 30 days (day) before `to`.
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          description: Exclusive; rounded up to the bucket. Default the end of the current bucket.
          schema:
            type: string
            format: date-time
        - name: types
          in: query
          description: Event types to count, comma-separated. Default all.
          style: form
          explode: false
          schema:
            type: array
            items: {$ref: '#/components/schemas/MetricEventType'}
        - name: identity_ids
          in: query
          description: For tenant and domain scope, the identities to read, comma-separated (at most 100).
          style: form
          explode: false
          schema:
            type: array
            maxItems: 100
            items: {$ref: '#/components/schemas/IdentityId'}
      responses:
        '200':
          description: The counts.
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
            RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EventCounts'}
        '400':
          description: >-
            The request is invalid (`invalid_request`), or the range is wider or older than the buckets kept
            (`query_range_too_wide`, with `details.max_buckets`, `details.requested_buckets` and
            `details.earliest`).
          x-error-codes: [invalid_request, query_range_too_wide]
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403':
          description: >-
            Missing `metrics:read` (`permission_denied`), an identity key asking for tenant or domain scope
            (`scope_denied`), or the tenant or its partner is suspended.
          x-error-codes: [permission_denied, scope_denied, tenant_suspended, partner_suspended]
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '404':
          description: No such tenant, identity or domain in scope.
          x-error-codes: [tenant_not_found, identity_not_found, domain_not_found]
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '422':
          description: More than 100 identities in scope without `identity_ids` (`scope_too_large`).
          x-error-codes: [scope_too_large]
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}

