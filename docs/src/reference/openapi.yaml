              type: [integer, 'null']
              minimum: 1
            message_days:
              type: [integer, 'null']
              minimum: 1
            events_days:
              type: [integer, 'null']
              minimum: 1
              maximum: 365
        triage:
          type: [object, 'null']
          properties:
            enabled:
              type: [boolean, 'null']
            daily_model_cap:
              type: [integer, 'null']
              minimum: 0
            categories:
              type: [array, 'null']
              maxItems: 20
              items: {$ref: '#/components/schemas/TriageCategoryDefinition'}
            rules:
              type: [array, 'null']
              maxItems: 50
              items: {$ref: '#/components/schemas/TriageRule'}
        search:
          type: [object, 'null']
          properties:
            agentic_enabled:
              type: [boolean, 'null']
            agentic_daily_cap:
              type: [integer, 'null']
              minimum: 0
            agentic_max_steps:
              type: [integer, 'null']
              minimum: 2
              maximum: 10
            agentic_max_seconds:
              type: [integer, 'null']
              minimum: 3
              maximum: 30
            refs_packs:
              type: [array, 'null']
              uniqueItems: true
