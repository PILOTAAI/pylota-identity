      x-key-levels: [platform, partner, tenant, identity]
      x-permission-notes: A `status` filter of `quarantined`, `screening`, `hidden` or `throttled` returns those messages only if the key also holds `quarantine:review`; without it the page has none of them (never `403`).
      x-rate-limit-buckets: [api]
