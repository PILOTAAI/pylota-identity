    TenantPolicyView:
      type: object
      description: >-
        A tenant's effective policy and, for each field, what the calling key may do with it
        (docs › Workspace policy). Clients build forms from `fields` so they never send a value the write
        would refuse.
      required: [tenant_id, policy_version, policy, fields]
      properties:
        tenant_id: {$ref: '#/components/schemas/TenantId'}
        policy_version:
          type: integer
          minimum: 0
          description: Rises by one with every policy write; the console uses it to detect a stale form.
        policy: {$ref: '#/components/schemas/TenantPolicy'}
        fields:
          type: array
          items: {$ref: '#/components/schemas/PolicyFieldAccess'}
    PolicyFieldAccess:
      type: object
      required: [field, class, writable, ceiling, ceiling_source, person_required_to_loosen]
      properties:
        field:
          type: string
          description: The dotted path of the field.
          examples: [tenant_daily_send_cap, quarantine.on_auth_fail]
        class:
          type: string
          description: >-
            `platform_only`, `partner_or_platform` (`quarantine.key_release`, `drafts.key_approval`), `lower_only`,
            `guard` or `free`
            (docs › Configuration › Who may change a field).
          enum: [platform_only, partner_or_platform, lower_only, guard, free]
        writable:
          type: boolean
          description: Whether the calling key may set the field to any value at all.
        ceiling:
          description: >-
            For a lower-only field, the loosest value the calling key may set (a number, or a boolean for a
            switch); `null` when no ceiling binds the key or the field is not lower-only.
          type: [number, boolean, 'null']
        ceiling_source:
          type: [string, 'null']
          description: Which bound decided `ceiling`.
          enum: [deployment, platform, partner, null]
        person_required_to_loosen:
          type: boolean
          description: >-
            For a guard field: `true` when the calling key may only tighten it, because API keys may not take
            decisions reserved for people on this tenant.
    TriageCategoryDefinition:
      type: object
      description: A custom triage category. The description is given to the triage model.
      required: [name, description]
      properties:
        name:
          type: string
          minLength: 1
          examples: [pcn]
        description:
          type: string
          minLength: 1
          examples: [Penalty charge notices from councils]
    TriageRule:
      type: object
      description: >-
        A deterministic tenant triage rule (`policy.triage.rules`, at most 50), as in the Triage design
        (`project/design/triage.md`, sections 4 and 5) and the Triage guide. Tenant rules run first, in array
        order, before the built-in rules and the model (FR-TRI-2). For every rule whose `match` holds:
        `category` and `needs_reply` are set by the first rule that sets them (first match wins),
        `urgency_min` takes the highest value, `labels_add` accumulates (at most 10 in all), and
        `skip_model` is on if any matching rule turns it on. A matching rule with `stop: true` ends tenant
        rules. Tenant rules cannot add or remove risk flags. With `skip_model`, triage ends with a rules-only
        record (`model: "rules"`); otherwise the values set here are fixed and the model fills the rest.
        Strings are NFKC-folded and lower-cased when the policy is written. Rules apply to mail that arrives
        afterwards; re-run triage to apply them to a message already triaged.
      required: [id, match, set]
      additionalProperties: false
      properties:
        id:
          type: string
          pattern: '^[a-z0-9][a-z0-9_-]{0,47}$'
          description: Unique in the list. Recorded (stored only) in the IDs of the rules that matched.
          examples: [pcn-council]
        match: {$ref: '#/components/schemas/TriageRuleMatch'}
        set: {$ref: '#/components/schemas/TriageRuleSet'}
        stop:
          type: boolean
          default: false
          description: '`true` ends tenant rules when this rule matches. Built-in rules still run.'
      examples:
        - id: pcn-council
          match:
            from_domain: [westminster.example, leeds.example]
            subject_contains: [penalty charge, pcn]
          set:
            category: legal_compliance
            labels_add: [pcn]
            urgency_min: 2
            needs_reply: 0.9
          stop: true
        - id: garage-invoices
          match:
            from: [accounts@brightwell.example]
            has_attachment: true
            subject_contains: [invoice]
          set:
            category: billing
            labels_add: [invoice]
            urgency_min: 1
            needs_reply: 0.1
            skip_model: true
    TriageRuleMatch:
      type: object
      description: >-
        The conditions of a tenant triage rule. At least one field. **All** listed fields must hold; within a
        field's list, **any** value may match. Each list has at most 20 entries and each string at most 200
        characters.
      minProperties: 1
      additionalProperties: false
      properties:
        from:
          type: array
          maxItems: 20
          description: The From address is one of these exact addresses (case-insensitive).
          items: {$ref: '#/components/schemas/EmailAddress'}
        from_domain:
          type: array
          maxItems: 20
          description: The From address is at one of these domains or any of their subdomains.
          items:
            type: string
            minLength: 1
            maxLength: 200
            examples: [leeds.example]
        to_identity:
          type: array
          maxItems: 20
          description: The message was delivered to one of these identities of the tenant (identity IDs or usernames).
          items:
            type: string
            minLength: 1
            maxLength: 200
        subject_contains:
          type: array
          maxItems: 20
          description: The folded subject contains one of these strings.
          items:
            type: string
            minLength: 1
            maxLength: 200
        body_contains:
          type: array
          maxItems: 20
          description: The first 64 KB of `extracted_text` contains one of these strings (case-insensitive).
          items:
            type: string
            minLength: 1
            maxLength: 200
        has_attachment:
          type: boolean
          description: A non-inline attachment exists (`true`) or none does (`false`).
        label:
          type: array
          maxItems: 20
          description: The message carries one of these labels at triage time, including labels added by earlier tenant rules in the same run.
          items: {$ref: '#/components/schemas/Label'}
    TriageRuleSet:
      type: object
      description: The triage fields a matching tenant rule sets. At least one field.
      minProperties: 1
      additionalProperties: false
      properties:
        category:
          type: string
          minLength: 1
          description: Must be in the effective category list (the built-in categories, or the tenant's custom ones).
          examples: [billing]
        labels_add:
          type: array
          maxItems: 10
          items: {$ref: '#/components/schemas/Label'}
        urgency_min:
          type: integer
          minimum: 0
          maximum: 3
          description: The lowest urgency the message can get; the model may raise it.
        needs_reply:
          type: number
          minimum: 0
          maximum: 1
          description: Fixes `needs_reply`; the model's value is not used.
        skip_model:
          type: boolean
          description: '`true` finishes triage with a rules-only record, without the model.'
    CustomRefPattern:
      type: object
      description: >-
        A tenant-defined reference pattern, matched exactly at ingest and searchable with
        `ref:` (stored with kind `custom:<name>`). Patterns use the Rust `regex` crate syntax: linear time, no
        back-references, compiled size capped at 64 KB.
      required: [name, pattern]
      properties:
        name:
          type: string
          minLength: 1
          examples: [booking]
        pattern:
          type: string
          minLength: 1
          examples: ['BK-\d{4,6}']
        normalise:
          type: string
          description: How matched values are normalised before storage and comparison.
          examples: [upper]

    # ── Service accounts ─────────────────────────────────────────────────────────────────────────

    ServiceAccountId:
      type: string
      description: Service-ledger entry ID (`sac_` + ULID).
      pattern: '^sac_[0-9A-HJKMNP-TV-Z]{26}$'
      examples: [sac_01JA2B3C4D5E6F7G8H9J0K1M2N]
    ServiceAccountStatus:
      type: string
      description: '`pending_approval` (expires after 7 days), `approved`, `rejected` or `closed`.'
      enum: [pending_approval, approved, rejected, closed]
    ServiceAccount:
      type: object
      description: >-
        An entry of the service sign-up ledger: a third-party account an identity's agent asked to create
        (FR-IDN-10). `purpose` and `account_identifier` were written by an agent: show them as untrusted text.
      required: [id, tenant_id, identity_id, service_domain, sender_domains, account_identifier, address, purpose, status, rejected_reason, note, requested_by_key_id, decided_by_key_id, decided_by_user_id, decided_at, closed_by_key_id, closed_by_user_id, closed_at, expires_at, created_at, updated_at]
      properties:
        id: {$ref: '#/components/schemas/ServiceAccountId'}
        tenant_id: {$ref: '#/components/schemas/TenantId'}
        identity_id: {$ref: '#/components/schemas/IdentityId'}
        service_domain:
          type: string
          description: The service's organisational domain (A-label, lower case).
          examples: [github.com]
        sender_domains:
          type: array
          description: Organisational domains the service's verification mail may come from; always includes `service_domain`.
          minItems: 1
          maxItems: 6
          items:
            type: string
          examples: [[github.com]]
        account_identifier:
          type: string
          minLength: 1
          maxLength: 254
          examples: [brightwell-bookings]
        address: {$ref: '#/components/schemas/EmailAddress'}
        purpose:
          type: string
          minLength: 1
          maxLength: 500
        status: {$ref: '#/components/schemas/ServiceAccountStatus'}
        rejected_reason:
          type: [string, 'null']
          description: 'While `rejected`: `operator`, or `expired` after 7 days undecided.'
          enum: [operator, expired, null]
        note:
          type: [string, 'null']
          maxLength: 500
          description: The note given with the decision or the closure.
        requested_by_key_id:
          oneOf:
            - $ref: '#/components/schemas/KeyId'
            - type: 'null'
        decided_by_key_id:
          oneOf:
            - $ref: '#/components/schemas/KeyId'
            - type: 'null'
        decided_by_user_id:
          description: The person who decided in the console, or `null`.
          oneOf:
            - $ref: '#/components/schemas/UserId'
            - type: 'null'
        decided_at:
          type: [string, 'null']
          format: date-time
        closed_by_key_id:
          oneOf:
            - $ref: '#/components/schemas/KeyId'
            - type: 'null'
        closed_by_user_id:
          oneOf:
            - $ref: '#/components/schemas/UserId'
            - type: 'null'
        closed_at:
          type: [string, 'null']
          format: date-time
        expires_at:
          type: [string, 'null']
          format: date-time
          description: While `pending_approval`, when it is rejected as `expired`; otherwise `null`.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ServiceAccountCreateRequest:
      type: object
      required: [service_domain, account_identifier, purpose]
      additionalProperties: false
      properties:
        service_domain:
          type: string
          minLength: 1
          maxLength: 253
          description: The service's domain; it is reduced to its organisational domain. A public suffix or this deployment's own domain is refused.
          examples: [github.com]
        sender_domains:
          type: array
          maxItems: 5
          uniqueItems: true
          description: Other domains the service's mail comes from, each reduced to its organisational domain.
          items:
            type: string
            minLength: 1
            maxLength: 253
        account_identifier:
          type: string
          minLength: 1
          maxLength: 254
          description: The username or account email the agent will use at the service.
        purpose:
          type: string
          minLength: 1
          maxLength: 500
          description: Why the agent needs the account, shown to the operator.
        address:
          description: An active or retiring address of the identity; defaults to its primary address.
          $ref: '#/components/schemas/EmailAddress'
    ServiceAccountNoteRequest:
      type: object
      additionalProperties: false
      properties:
        note:
          type: string
          maxLength: 500
    ServiceAccountPage:
      type: object
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items: {$ref: '#/components/schemas/ServiceAccount'}
        next_cursor:
          type: [string, 'null']

    # ── Agent sign-up ────────────────────────────────────────────────────────────────────────────

    AgentSignupId:
      type: string
      description: Agent sign-up ID (`asu_` + ULID).
      pattern: '^asu_[0-9A-HJKMNP-TV-Z]{26}$'
      examples: [asu_01JA2B3C4D5E6F7G8H9J0K1M2N]
    AgentSignupState:
      type: string
      enum: [provisional, verified, expired, abandoned, refused]
    AgentSignupCreateRequest:
      type: object
      additionalProperties: false
      required: [username, human_email, accept_terms]
      properties:
        username:
          type: string
          description: 2–32 characters of `[a-z0-9-]` after lower-casing; checked by the address-suffix rules, not a schema pattern. The inbox is `agent.{username}@{platform domain}`.
        human_email:
          type: string
          maxLength: 254
          description: The person responsible for the agent. They get a six-digit code and a link.
        agent_name:
          type: string
          minLength: 1
          maxLength: 78
        source:
          type: string
          pattern: '^[A-Za-z0-9._/+-]{1,64}$'
          description: The client that signs up, for example an SDK and its version.
        accept_terms:
          type: boolean
          const: true
    AgentSignupCreated:
      type: object
      required: [signup_id, state, tenant_id, identity_id, address, key, human_email_hint, expires_at, verification, limits, next]
      properties:
        signup_id: {$ref: '#/components/schemas/AgentSignupId'}
        state: {$ref: '#/components/schemas/AgentSignupState'}
        tenant_id: {$ref: '#/components/schemas/TenantId'}
        identity_id: {$ref: '#/components/schemas/IdentityId'}
        address: {$ref: '#/components/schemas/EmailAddress'}
        key:
          type: object
          required: [id, secret]
          properties:
            id: {$ref: '#/components/schemas/KeyId'}
            secret:
              type: string
              description: Shown once; never stored or replayed.
        human_email_hint:
          type: string
          description: The human's address, masked.
        expires_at:
          type: string
          format: date-time
          description: When an unverified sign-up is erased (7 days).
        verification:
          type: object
          required: [email, code_expires_at]
          properties:
            email:
              type: string
              enum: [queued, not_sent]
            code_expires_at:
              type: string
              format: date-time
        limits:
          type: object
          required: [recipients, daily_sends]
          properties:
            recipients:
              type: string
              enum: [human_only]
            daily_sends:
              type: integer
              const: 10
        next:
          type: string
          description: What the agent should do next, in one sentence.
    AgentSignup:
      type: object
      required: [signup_id, state, tenant_id, identity_id, address, human_email_hint, expires_at, permissions, created_at]
      properties:
        signup_id: {$ref: '#/components/schemas/AgentSignupId'}
        state: {$ref: '#/components/schemas/AgentSignupState'}
        tenant_id: {$ref: '#/components/schemas/TenantId'}
        identity_id: {$ref: '#/components/schemas/IdentityId'}
        address: {$ref: '#/components/schemas/EmailAddress'}
        human_email_hint:
          type: string
        human_status:
          type: string
          enum: [pending, delivered, bounced]
        replacements_left:
          type: integer
          minimum: 0
          maximum: 2
        expires_at:
          type: string
          format: date-time
        code:
          type: [object, 'null']
          properties:
            expires_at:
              type: string
              format: date-time
            attempts_left:
              type: integer
              minimum: 0
              maximum: 10
            failures_left:
              type: integer
              minimum: 0
              maximum: 30
            emails_left_this_hour:
              type: integer
              minimum: 0
              maximum: 3
            email:
              type: string
              enum: [queued, not_sent]
        permissions:
          type: array
          description: The permissions the key acts with now (the provisional set until verified).
          items: {$ref: '#/components/schemas/Permission'}
        verified_at:
          type: [string, 'null']
          format: date-time
        verified_via:
          type: [string, 'null']
          enum: [code, link, claim, null]
        already_verified:
          type: boolean
        source:
          type: [string, 'null']
        created_at:
          type: string
          format: date-time
    AgentSignupVerifyRequest:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code:
          type: string
          pattern: '^[0-9]{6}$'
    AgentSignupHumanRequest:
      type: object
      additionalProperties: false
      required: [human_email]
      properties:
        human_email:
          type: string
          maxLength: 254
    AgentSignupEnded:
      type: object
      required: [state, erasure_request_id]
      properties:
        state:
          type: string
          const: abandoned
        erasure_request_id: {$ref: '#/components/schemas/ErasureRequestId'}
    AgentSignupListItem:
      type: object
      required: [signup_id, tenant_id, state, address, human_email_hint, network, created_at, expires_at]
      properties:
        signup_id: {$ref: '#/components/schemas/AgentSignupId'}
        tenant_id: {$ref: '#/components/schemas/TenantId'}
        state: {$ref: '#/components/schemas/AgentSignupState'}
        address: {$ref: '#/components/schemas/EmailAddress'}
        human_email_hint:
          type: [string, 'null']
        human_status:
          type: string
          enum: [pending, delivered, bounced]
        source:
          type: [string, 'null']
        network:
          type: string
          pattern: '^[0-9a-f]{16}$'
          description: A keyed hash of the client network.
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        verified_at:
          type: [string, 'null']
          format: date-time
        verified_via:
          type: [string, 'null']
          enum: [code, link, claim, null]

    # ── Partners ─────────────────────────────────────────────────────────────────────────────────

    PartnerStatus:
      type: string
      description: >-
        `suspended` refuses every key of the partner, and every API key of its tenants, with
        `403 partner_suspended`, and holds deliveries to its and its tenants' endpoints; the tenants' status
        does not change. `deleted` is set by `DELETE /v1/partners/{partner_id}` and is final.
      enum: [active, suspended, deleted]
    PartnerBillingMode:
      type: string
      description: >-
        The billing mode given to every tenant a partner key creates (`billing_accounts.mode`). Only a
        platform key changes a tenant's mode afterwards.
      enum: [exempt, metered]
    Partner:
      type: object
      description: >-
        An integrator whose partner keys create tenants and act only on those tenants (FR-KEY-4). A partner
        holds nothing but its name and these settings. A deleted partner stays, with `status: "deleted"`
        and an empty `name`.
      required: [id, name, status, default_billing_mode, max_tenants, ramp_exempt, created_at, updated_at]
      properties:
        id: {$ref: '#/components/schemas/PartnerId'}
        name:
          type: string
          description: '`""` once the partner is deleted.'
          examples: [Pylota]
        status: {$ref: '#/components/schemas/PartnerStatus'}
        default_billing_mode: {$ref: '#/components/schemas/PartnerBillingMode'}
        max_tenants: {$ref: '#/components/schemas/PartnerMaxTenants'}
        ramp_exempt: {$ref: '#/components/schemas/PartnerRampExempt'}
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    PartnerCreateRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
        default_billing_mode:
          description: Defaults to `metered`.
          allOf:
            - $ref: '#/components/schemas/PartnerBillingMode'
          default: metered
        max_tenants: {$ref: '#/components/schemas/PartnerMaxTenants'}
        ramp_exempt: {$ref: '#/components/schemas/PartnerRampExempt'}
    PartnerUpdateRequest:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
        status:
          type: string
          description: '`deleted` cannot be set here: use `DELETE /v1/partners/{partner_id}`.'
          enum: [active, suspended]
        default_billing_mode: {$ref: '#/components/schemas/PartnerBillingMode'}
        max_tenants: {$ref: '#/components/schemas/PartnerMaxTenants'}
        ramp_exempt: {$ref: '#/components/schemas/PartnerRampExempt'}
    PartnerMaxTenants:
      type: integer
      minimum: 0
      default: 25
      description: >-
        The most tenants that are not `erased` the partner may have; the next `POST /v1/tenants` by a partner
        key gets `403 partner_tenant_limit`. Default 25: with the default `tenant_daily_send_cap` of 5,000,
        one partner can send at most 125,000 messages a day (1,250 while its new tenants are on the send
        ramp). Lowering it below the current count refuses new tenants and changes no existing one.
    PartnerRampExempt:
      type: boolean
      default: false
      description: >-
        `true` lets the partner's new tenants skip the new-workspace send ramp (a tenant daily cap of 50 for
        at least 7 days). `false`, the default: they follow it whatever their billing mode.

    # ── Identities ───────────────────────────────────────────────────────────────────────────────

    IdentityStatus:
      type: string
      description: '`deleting` and `deleted` are set by identity deletion.'
      enum: [active, paused, deleting, deleted]
    PauseReason:
      type: string
      enum: [manual, abuse_threshold, tenant_suspended]
    Username:
      type: string
      description: >-
        The stored form of a username: the lower-case local-part stem. Requests send a `UsernameInput`,
        which the service validates and lower-cases into this form.
      pattern: '^[a-z0-9][a-z0-9._-]{0,23}$'
      examples: [bookings]
    UsernameInput:
      type: string
      description: >-
        A username as sent in a request. The schema does not constrain it: the service validates it with
        the username rules ([A1], [A3], [A4], [A12]) and returns their own codes, never a generic
        `invalid_request`. A reserved name, a confusable one (homoglyphs, mixed scripts, right-to-left
        characters) or a name that folds to a reserved one gets `400 address_reserved`; any other non-ASCII
        character `400 address_unsupported`; a name whose lower-cased form does not match the stored form
        `^[a-z0-9][a-z0-9._-]{0,23}$` (at most 24 characters, no `..`, not ending in `.`) gets
        `400 address_invalid`; username plus tenant suffix over 40 characters gets `400 local_part_too_long`.
      examples: [bookings]
    DisplayName:
      type: string
      description: At most 78 characters, no CR or LF. Unicode is allowed.
      minLength: 1
      maxLength: 78
      pattern: '^[^\r\n]*$'
      examples: [Acme Car Hire]
    IdentityOwner:
      type: object
      description: The accountable human for the identity (FR-IDN-2). Required before the identity can send.
      required: [name, email]
      properties:
        name:
          type: string
          minLength: 1
          examples: [Sam Patel]
        email: {$ref: '#/components/schemas/EmailAddress'}
    IdentitySignature:
      type: object
      description: Appended to outbound messages according to policy. `html` is sanitised on write.
      properties:
        text:
          type: [string, 'null']
        html:
          type: [string, 'null']
    IdentitySendPolicy:
      type: object
      description: Per-identity sending rules, applied on top of the tenant policy.
      properties:
        daily_cap:
          type: integer
          minimum: 0
          description: >-
            Sends per day for this identity. Defaults to the tenant's `identity_daily_send_cap`. Only a
            platform key may set it above that cap (`403 scope_denied` with `details.field`).
        auto_reply:
          type: string
          enum: [allowed, denied]
          default: allowed
          description: >-
            Whether the identity may send `kind: "auto_reply"` messages. `denied` refuses them
            (`409 auto_reply_not_allowed`); `allowed`, the default, leaves the decision to the tenant's
            `policy.auto_reply.allowed` and the exchange cap.
        require_known_recipient:
          type: boolean
          default: true
          description: >-
            Suppress recipients that are not known ([E2], FR-OUT-13): a recipient is known when the identity has
            sent to it before (a delivery that was not suppressed), when the effective send-allow entry for this
            identity (its own or the tenant's) names it or its domain, for a reply or reply-all when it is the
            reply target of a `received` message whose verdict is `pass` or `arc_rescued`, for a send from a
            draft whose current revision carries a valid approval when that approval covers it, and for a
            calendar reply when it is the `ORGANIZER` of the verified invitation answered. Mail received from an
            address does not make it known. On by default for every identity; the system identity is created
            with `false`. Turn it off for an identity that sends to new people by design (booking
            confirmations).
        require_approval:
          description: >-
            The identity's own approval level for sends; it can only make the tenant's `drafts.require_approval`
            stricter, never looser. `null` follows the tenant. A looser value than the identity's current one
            gets `403 scope_denied` from an identity key and `403 permission_denied` (`person_required`) from a
            tenant key where people decide.
          oneOf:
            - $ref: '#/components/schemas/RequireApproval'
            - type: 'null'
    IdentityRetention:
      type: object
      required: [message_hours]
      properties:
        message_hours:
          type: [integer, 'null']
          minimum: 1
          maximum: 8760
          description: >-
            Each message of the identity, with its attachments, extracted text, index rows, vectors and drafts,
            is erased this many hours after it is stored, except in a thread under a legal hold. `null`: the
            tenant's retention policy alone applies. Setting a number where there was `null`, or lowering it,
            needs `erasure:manage` as well (`403 permission_denied`, `details.required: ["erasure:manage"]`);
            raising it or setting `null` needs `identities:write` only and brings nothing back.
    Identity:
      type: object
      required: [id, tenant_id, username, display_name, purpose, status, pause_reason, primary_address, addresses, owner, signature, send_policy, retention, metadata, client_id, created_at, updated_at]
      properties:
        id: {$ref: '#/components/schemas/IdentityId'}
        tenant_id: {$ref: '#/components/schemas/TenantId'}
        username: {$ref: '#/components/schemas/Username'}
        display_name: {$ref: '#/components/schemas/DisplayName'}
        purpose:
          type: [string, 'null']
          description: A free tag, for example `bookings`.
        status: {$ref: '#/components/schemas/IdentityStatus'}
        pause_reason:
          description: Set when `status` is `paused`.
          oneOf:
            - $ref: '#/components/schemas/PauseReason'
            - type: 'null'
        primary_address: {$ref: '#/components/schemas/EmailAddress'}
        addresses:
          type: array
          description: Every address of the identity, in every status.
          items: {$ref: '#/components/schemas/Address'}
        owner:
          oneOf:
            - $ref: '#/components/schemas/IdentityOwner'
            - type: 'null'
        signature: {$ref: '#/components/schemas/IdentitySignature'}
        send_policy: {$ref: '#/components/schemas/IdentitySendPolicy'}
        retention: {$ref: '#/components/schemas/IdentityRetention'}
        metadata: {$ref: '#/components/schemas/Metadata'}
        client_id:
          type: [string, 'null']
          description: The integrator's idempotent-create key.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    IdentityCreateRequest:
      type: object
      required: [username, display_name]
      properties:
        username: {$ref: '#/components/schemas/UsernameInput'}
        display_name: {$ref: '#/components/schemas/DisplayName'}
        purpose:
          type: string
          description: A free tag, for example `bookings`.
        owner: {$ref: '#/components/schemas/IdentityOwner'}
        signature: {$ref: '#/components/schemas/IdentitySignature'}
        domain_id:
          description: >-
            A healthy tenant domain for the primary address (`{username}@{domain}`). Omitted: the platform
            domain (`{username}{suffix}@{platform}`).
          $ref: '#/components/schemas/DomainId'
        client_id:
          type: string
          minLength: 1
          description: Makes the create idempotent within the tenant.
          examples: ['acme:bookings']
        send_policy:
          description: >-
            The identity's own send policy, as on update. From any key but a platform key, a `daily_cap` above
            the tenant's effective `identity_daily_send_cap` gets `403 scope_denied` with
            `details.field = "send_policy.daily_cap"`, and nothing is created.
          $ref: '#/components/schemas/IdentitySendPolicy'
        retention:
          description: The identity's own message retention; a number needs `erasure:manage` as well.
          $ref: '#/components/schemas/IdentityRetention'
        metadata: {$ref: '#/components/schemas/Metadata'}
    IdentityUpdateRequest:
      type: object
      minProperties: 1
      properties:
        display_name: {$ref: '#/components/schemas/DisplayName'}
        purpose:
          type: [string, 'null']
        owner: {$ref: '#/components/schemas/IdentityOwner'}
        signature: {$ref: '#/components/schemas/IdentitySignature'}
        metadata: {$ref: '#/components/schemas/Metadata'}
        send_policy: {$ref: '#/components/schemas/IdentitySendPolicy'}
        retention:
          description: >-
            Setting `message_hours` where it was `null`, or lowering it, needs `erasure:manage` as well; raising
            it or setting `null` needs `identities:write` only. Each change writes the audit row
            `identity.retention_update`.
          $ref: '#/components/schemas/IdentityRetention'
        status:
          type: string
          description: >-
            `paused` pauses with reason `manual`; `active` resumes (an `abuse_threshold` pause on a tenant a
            partner's key created needs a platform key).
          enum: [active, paused]

    # ── Addresses ────────────────────────────────────────────────────────────────────────────────

    AddressRole:
      type: string
      enum: [primary, alias]
    AddressStatus:
      type: string
      description: >-
        `pending` until the domain is healthy; `active`; `retiring` (still receives, until `retire_at`);
        `retired` (inbound refused with `550 5.1.6`).
      enum: [pending, active, retiring, retired]
    AddressForwarding:
      type: [string, 'null']
      description: >-
        `null` when the address's domain does not use `inbound: forward`. Otherwise `unverified` (no
        forwarding test and no forwarded message has arrived yet), `ok` (the last test passed, or mail
        arrived through forwarding) or `failed` (the last test timed out after 10 minutes).
      enum: [unverified, ok, failed, null]
    Address:
      type: object
      required: [id, identity_id, address, local_part, domain_id, role, status, retire_at, retired_at, forwarding, forwarding_checked_at, created_at]
      properties:
        id: {$ref: '#/components/schemas/AddressId'}
        identity_id: {$ref: '#/components/schemas/IdentityId'}
        address: {$ref: '#/components/schemas/EmailAddress'}
        local_part:
          type: string
        domain_id: {$ref: '#/components/schemas/DomainId'}
        role: {$ref: '#/components/schemas/AddressRole'}
        status: {$ref: '#/components/schemas/AddressStatus'}
        retire_at:
          type: [string, 'null']
          format: date-time
          description: When a `retiring` address becomes `retired`.
        retired_at:
          type: [string, 'null']
          format: date-time
        forwarding: {$ref: '#/components/schemas/AddressForwarding'}
        forwarding_checked_at:
          type: [string, 'null']
          format: date-time
          description: When `forwarding` last changed.
        created_at:
          type: string
          format: date-time
    AddressCreateRequest:
      type: object
      required: [local_part, domain_id]
      properties:
        local_part:
          type: string
          description: >-
            The local part on the tenant domain. The schema does not constrain it: the service validates it
            with the username rules for a tenant domain, with a maximum of 40 characters (room for a thread
            token), and returns their own codes, never a generic `invalid_request`: `400 address_reserved`
            for a reserved or confusable name, `400 address_unsupported` for any other non-ASCII character,
            and `400 address_invalid` when the lower-cased form does not match the stored form
            `^[a-z0-9][a-z0-9._-]{0,39}$` (no `..`, not ending in `.`).
          examples: [bookings]
        domain_id: {$ref: '#/components/schemas/DomainId'}
    PromoteAddressRequest:
      type: object
      properties:
        retire_previous_after_days:
          type: integer
          minimum: 0
          maximum: 365
          default: 90
          description: Days the previous primary stays `retiring` before it becomes `retired`.
    RetireAddressRequest:
      type: object
      properties:
        after_days:
          type: integer
          minimum: 0
          maximum: 365
          default: 90
          description: Days the alias stays `retiring`. `0` retires it immediately.

    # ── Domains ──────────────────────────────────────────────────────────────────────────────────

    DomainMethod:
      type: string
      description: |
        How the domain is connected (FR-DOM-7). The method fixes `kind`, `inbound` and `transport`; `platform`
        is the deployment's shared domain only.

        | `method` | The customer changes | `kind` | `inbound` | `transport` |
        |---|---|---|---|---|
        | `cloudflare_zone` | Nothing: the zone is in this Cloudflare account and the Worker writes the records | `zone` | `routing` | `cloudflare` |
        | `nameservers` | Two NS records at the registrar, for a domain used only for mail | `zone` | `routing` | `cloudflare` |
        | `dns_records` | One MX, three DKIM CNAMEs, a MAIL FROM MX and TXT, and the ownership TXT, at any DNS host | `external` | `ses` | `ses` |
        | `send_only` | Three DKIM CNAMEs, a MAIL FROM MX and TXT, and the ownership TXT; their own mailbox forwards to the agent | `external` | `forward` | `ses` |
        | `smtp_relay` | The ownership TXT, plus what their own mail provider already needs | `external` | `forward` or `ses` | `smtp` |
        | `delegated_subdomain` | NS records for one subdomain | `delegated` | `routing` | `cloudflare` |
      enum: [platform, cloudflare_zone, nameservers, dns_records, send_only, smtp_relay, delegated_subdomain]
    DomainKind:
      type: string
      description: >-
        Where the domain's DNS lives relative to this deployment. `platform` is the deployment's shared
        domain; `zone` a zone in this Cloudflare account; `delegated` a child zone for a subdomain whose
        parent stays at another DNS host; `external` DNS at any other host.
      enum: [platform, zone, delegated, external]
    DomainInbound:
      type: string
      description: >-
        How mail to the domain's addresses reaches identities: `routing` (Cloudflare Email Routing), `ses`
        (Amazon SES receiving, through `/hooks/ses/inbound`), `forward` (the customer's own mailbox
        forwards to each identity's platform address) or `none`.
      enum: [routing, ses, forward, none]
    DomainState:
      type: string
      description: >-
        `pending` → `verifying` → `healthy` ⇄ `degraded` → `failing` → `suspended`; `removing` → `removed`
        after deletion. A return to `healthy` emits `domain.recovered`.
      enum: [pending, verifying, healthy, degraded, failing, suspended, removing, removed]
    RoutingMode:
      type: string
      description: '`catch_all` (zone apex, or SES receiving), `literal` (one routing rule per address, zone subdomains) or `forward` (forwarding domains).'
      enum: [catch_all, literal, forward]
    Transport:
      type: string
      description: How mail from the domain's addresses is sent.
      enum: [cloudflare, ses, smtp]
    ReplyTokenMode:
      type: string
      description: '`subaddress` puts the thread token in the `Reply-To` sub-address (FR-OUT-6).'
      enum: [subaddress, none]
    SmtpSettings:
      type: object
      description: >-
        SMTP relay settings (`smtp_relay` only). The Worker connects once (EHLO, STARTTLS, AUTH, QUIT)
        before it stores them. The credentials are sealed under `PM_MASTER_KEY` and never returned, logged
        or exported.
      required: [host, port, username, password]
      properties:
        host:
          type: string
          format: hostname
          description: A DNS name, not an IP literal. It must resolve to public addresses.
          examples: [smtp.provider.example]
        port:
          type: integer
          description: '`465` (implicit TLS) or `587` (STARTTLS). Any other port, `25` included, returns `400 smtp_port_not_allowed`.'
          examples: [587]
        username:
          type: string
          examples: [agents@brightwell.example]
        password:
          type: string
          format: password
          writeOnly: true
        probe_from:
          type: string
          format: email
          description: An address the relay accepts as sender, used by the alignment probe. Defaults to `postmaster@{name}`.
          examples: [agents@brightwell.example]
    DomainSmtp:
      type: object
      description: The relay settings as stored, never the password.
      required: [host, port, username, probe_from]
      properties:
        host:
          type: string
          examples: [smtp.provider.example]
        port:
          type: integer
          enum: [465, 587]
        username:
          type: string
          examples: [agents@brightwell.example]
        probe_from:
          type: string
          format: email
          examples: [agents@brightwell.example]
    DomainProbe:
      type: object
      description: The last alignment probe of an `smtp` domain.
      required: [last_at, result]
      properties:
        last_at:
          type: [string, 'null']
          format: date-time
          description: '`null` before the first probe.'
        result:
          type: [string, 'null']
          description: >-
            `pass`, or the issue code of the failure. `null` before the first probe.
          enum: [pass, smtp_unaligned, smtp_from_rewritten, smtp_probe_timeout, smtp_auth_failed, smtp_tls_required, null]
    Domain:
      type: object
      required: [id, tenant_id, name, method, kind, inbound, transport, is_apex, routing_mode, reply_token, receiving, sending, ses_region, mail_from_domain, smtp, probe, state, state_reason, state_changed_at, sending_paused_at, delivery_events, details, records, created_at]
      properties:
        id: {$ref: '#/components/schemas/DomainId'}
        tenant_id:
          description: '`null` for the platform domain.'
          oneOf:
            - $ref: '#/components/schemas/TenantId'
            - type: 'null'
        name:
          type: string
          format: hostname
          description: The domain as an IDNA A-label, lower case.
          examples: [agents.brightwell.example]
        method: {$ref: '#/components/schemas/DomainMethod'}
        kind: {$ref: '#/components/schemas/DomainKind'}
        inbound: {$ref: '#/components/schemas/DomainInbound'}
        transport: {$ref: '#/components/schemas/Transport'}
        is_apex:
          type: boolean
        routing_mode: {$ref: '#/components/schemas/RoutingMode'}
        reply_token: {$ref: '#/components/schemas/ReplyTokenMode'}
        receiving:
          type: boolean
        sending:
          type: boolean
        ses_region:
          type: [string, 'null']
          description: >-
            The region of the domain's SES identity: set when `inbound` or `transport` is `ses`, and on a
            Cloudflare-method domain that has an SES identity for the [J5] failover; otherwise `null`.
          examples: [eu-west-2]
        mail_from_domain:
          type: [string, 'null']
          description: >-
            The custom MAIL FROM domain, `pm-bounce.{name}`, of a `dns_records` or `send_only` domain, whose
            mail SES sends. The local part `pm-bounce` is reserved on such domains. Otherwise `null`, including
            a Cloudflare-method domain sending through its [J5] failover identity after a `PATCH` to `ses`:
            that identity has no custom MAIL FROM.
          examples: [pm-bounce.agents.brightwell.example]
        smtp:
          description: '`smtp_relay` only, otherwise `null`. Never the password.'
          oneOf:
            - $ref: '#/components/schemas/DomainSmtp'
            - type: 'null'
        probe:
          description: '`smtp` transport only, otherwise `null`.'
          oneOf:
            - $ref: '#/components/schemas/DomainProbe'
            - type: 'null'
        state: {$ref: '#/components/schemas/DomainState'}
        state_reason:
          type: [string, 'null']
          description: Machine code for the state, for example `dkim_missing`; `zone_expired` on a `nameservers` domain whose zone Cloudflare deleted; `evicted` or `unverified_expired` on a never-verified domain that is being or was removed.
        state_changed_at:
          type: string
          format: date-time
        sending_paused_at:
          type: [string, 'null']
          format: date-time
          description: >-
            When sending from this tenant domain was paused automatically (FR-DLV-6, [G12]); `null` while it
            may send, and always `null` for the platform domain. Sends from it get `409 sending_paused` and never
            fall back to the platform domain. Only a platform key can resume it (`sending_paused: false`).
        delivery_events:
          type: string
          enum: [active, manual, none]
          description: >-
            `active`: provider delivery events reach the service. `manual`: a Cloudflare-transport domain was
            created without an Email Sending event subscription (spike S9 fallback); until
            `pmail domains subscribe <domain>` has run, its sends go out from each identity's platform address
            (`sent_via_fallback`), whose delivery events are seen ([H17]). `none`: `sending` is false.
        details:
          description: '`null`, or the operator step that remains while `delivery_events` is `manual`.'
          oneOf:
            - type: object
              required: [action]
              properties:
                action:
                  type: string
                  examples: ['run pmail domains subscribe agents.brightwell.example']
            - type: 'null'
        records:
          type: array
          description: The records last read from the provider APIs, with their last check result.
          items: {$ref: '#/components/schemas/DnsRecord'}
        created_at:
          type: string
          format: date-time
      examples:
        - id: dom_01JA2B3C4D5E6F7G8H9J0K1M2N
          tenant_id: ten_01J9Z3K8V4QW7X2M5N6P8R0T1Y
          name: agents.brightwell.example
          method: dns_records
          kind: external
          inbound: ses
          transport: ses
          is_apex: false
          routing_mode: catch_all
          reply_token: subaddress
          receiving: true
          sending: true
          ses_region: eu-west-2
          mail_from_domain: pm-bounce.agents.brightwell.example
          smtp: null
          probe: null
          state: pending
          state_reason: null
          state_changed_at: '2026-10-09T10:00:00Z'
          sending_paused_at: null
          delivery_events: active
          details: null
          records:
            - type: TXT
              name: _pylota-mail.agents.brightwell.example
              host: _pylota-mail.agents
              value: pm-verify=8f2k3m9q
              purpose: ownership
              required: true
            - type: MX
              name: agents.brightwell.example
              host: agents
              value: 10 inbound-smtp.eu-west-2.amazonaws.com
              purpose: mx
              required: true
          created_at: '2026-10-09T10:00:00Z'
    DomainCreateRequest:
      type: object
      description: >-
        `method` is required for new clients. When it is absent, the old `kind` is mapped: `zone` →
        `cloudflare_zone`, `external` → `send_only`; `kind: zone` with `create_zone: true` is the old
        spelling of `nameservers`.
      required: [name]
      anyOf:
        - required: [method]
        - required: [kind]
      properties:
        name:
          type: string
          format: hostname
          examples: [agents.brightwell.example]
        method:
          type: string
          enum: [cloudflare_zone, nameservers, dns_records, send_only, smtp_relay, delegated_subdomain]
        kind:
          type: string
          deprecated: true
          description: 'Old spelling, used only when `method` is absent: `zone` → `cloudflare_zone`, `external` → `send_only`.'
          enum: [zone, external]
        create_zone:
          type: boolean
          default: false
          deprecated: true
          description: 'Old spelling: `kind: zone` with `create_zone: true` means `method: nameservers`.'
        receiving:
          type: boolean
          default: true
        sending:
          type: boolean
          default: true
        replace_mx:
          type: boolean
          default: false
          description: >-
            `cloudflare_zone` apex and `dns_records`. A name that already has MX records, none of them the
            expected host, is refused with `409 existing_mx` unless this is `true` ([H5]). On a zone apex,
            enabling routing replaces the existing mail provider; on `dns_records` it means "I will replace
            these", and health reports `mx_unexpected` until the old records are gone.
        confirm_dedicated:
          type: boolean
          default: false
          description: >-
            `nameservers` only. Confirms that a website or mail on the name may stop. Without it, a name with
            A, AAAA or MX records, or a `www` CNAME, A or AAAA record, returns `409 domain_not_dedicated` ([N21]).
        claim:
          type: boolean
          default: false
          description: >-
            Claims a name that another tenant holds but never verified ([H14]). Publish the TXT record from
            `details.claim` of the earlier `409 domain_exists` answer, then repeat the request with this set to
            `true`. When both resolvers show it and the holder never verified the domain, the holder is evicted
            and the answer is `409 domain_claim_pending` until its removal finishes; then the same request
            succeeds. Otherwise the answer is the same `409 domain_exists`.
        inbound:
          type: string
          description: '`smtp_relay` only, and required there: `forward` (the customer''s mailbox forwards) or `ses` (they also publish the SES MX and DKIM records).'
          enum: [forward, ses]
        smtp:
          description: '`smtp_relay` only, and required there.'
          $ref: '#/components/schemas/SmtpSettings'
      if:
        properties:
          method: {const: smtp_relay}
        required: [method]
      then:
        required: [inbound, smtp]
    DomainUpdateRequest:
      type: object
      description: '`transport` (platform keys only), `smtp` (`smtp_relay` domains), `sending_paused` (platform keys only), or several.'
      minProperties: 1
      properties:
        sending_paused:
          type: boolean
          const: false
          description: >-
            `false` lifts an automatic sending pause of this domain ([G12]), audit-logged. Platform keys only:
            any other key gets `403 scope_denied` with `details.field = "sending_paused"`.
        transport:
          type: string
          description: >-
            Platform keys only. The transport that sends as a domain on Cloudflare (the failover of [J5]).
            `ses` needs the SES transport configured and a verified SES identity for the domain.
            `dns_records` and `send_only` domains send only through `ses`, `smtp_relay` domains only through
            `smtp`, and the platform domain only through `cloudflare`; another value returns
            `422 transport_unavailable` with `details.reason: "method_not_supported"`.
          enum: [cloudflare, ses]
        smtp:
          description: >-
            `smtp_relay` domains, tenant or platform keys. New relay settings, tested with one connection
            before they are stored and kept pending until an alignment probe with them passes; until then
            sends keep using the current values.
          $ref: '#/components/schemas/SmtpSettings'
    ProbeAccepted:
      type: object
      required: [probe_id]
      properties:
        probe_id:
          type: string
          pattern: '^prb_[0-9A-HJKMNP-TV-Z]{26}$'
          description: The probe's ID. The result arrives as a domain health change.
          examples: [prb_01JA2B3C4D5E6F7G8H9J0K1M2N]
    DnsRecordStatus:
      type: string
      description: '`unexpected` means an extra record that conflicts, for example a second SPF record.'
      enum: [ok, missing, mismatch, unexpected]
    DnsRecord:
      type: object
      required: [type, name, host, value, purpose, required]
      properties:
        type:
          type: string
          enum: [TXT, MX, CNAME, NS]
        name:
          type: string
          description: The fully qualified name.
          examples: [_pylota-mail.mail.acmecarhire.example]
        host:
          type: string
          description: >-
            The same name relative to the registrable domain (from the Public Suffix List), for DNS hosts
            that ask for only that part ([N17]).
          examples: [_pylota-mail.mail]
        value:
          type: string
          examples: [pm-verify=8f2k3m9q]
        purpose:
          type: string
          description: What the record is for, for example `ownership`, `mx`, `dkim`, `return_path`, `spf`, `dmarc` or `ns`.
          examples: [ownership]
        required:
          type: boolean
        status:
          $ref: '#/components/schemas/DnsRecordStatus'
        observed:
          type: array
          description: The values DNS returned at the last check.
          items:
            type: string
    DomainRecords:
      type: object
      required: [data, checked_at]
      properties:
        data:
          type: array
          items: {$ref: '#/components/schemas/DnsRecord'}
        checked_at:
          type: string
          format: date-time
    DomainIssue:
      type: object
      required: [code, record, fix]
      properties:
        code:
          type: string
          description: Machine code, for example `dkim_missing`.
        record:
          type: string
          description: The record name the issue is about.
        fix:
          type: string
          description: The exact change to make.
    DomainCheck:
      type: object
      required: [at, resolver, outcome]
      properties:
        at:
          type: string
          format: date-time
        resolver:
          type: string
          enum: [cloudflare-doh, google-doh]
        outcome:
          type: string
          enum: [pass, degraded, fail, ownership_changed, error]
    DomainHealth:
      type: object
      required: [state, reason, since, issues, checks, fallback_active]
      properties:
        state: {$ref: '#/components/schemas/DomainState'}
        reason:
          type: [string, 'null']
          description: Machine code for the state, for example `dkim_missing`.
        since:
          type: string
          format: date-time
        issues:
          type: array
          items: {$ref: '#/components/schemas/DomainIssue'}
        checks:
          type: array
          description: Recent checks, newest first.
          items: {$ref: '#/components/schemas/DomainCheck'}
        fallback_active:
          type: boolean
          description: Sends from this domain currently go out from platform addresses (`sent_via_fallback`).

    # ── Threads ──────────────────────────────────────────────────────────────────────────────────

    ThreadHold:
      type: object
      description: A legal hold. Retention and erasure skip the thread while it is set (FR-PRV-4).
      required: [reason, until, set_by, set_at]
      properties:
        reason:
          type: string
          examples: [PCN dispute WM12345678]
        until:
          type: [string, 'null']
          format: date-time
          description: When the hold lapses. `null` holds until removed.
        set_by:
          description: The key that set the hold.
          oneOf:
            - $ref: '#/components/schemas/KeyId'
            - type: 'null'
        set_at:
          type: string
          format: date-time
    ThreadHoldRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
        until:
          type: [string, 'null']
          format: date-time
          description: When the hold lapses. Omitted or `null` holds until removed.
    ThreadSummary:
      type: object
      required: [id, subject, participants, message_count, unread_count, first_at, last_at, last_inbound_at, last_direction, snippet, labels, category, needs_reply, urgency, hold]
      properties:
        id: {$ref: '#/components/schemas/ThreadId'}
        subject:
          type: string
          description: The normalised subject of the first message (untrusted content).
        participants:
          type: array
          description: Everyone on the thread, capped at 50.
          maxItems: 50
          items: {$ref: '#/components/schemas/MailboxAddress'}
        message_count:
          type: integer
          minimum: 0
        unread_count:
          type: integer
          minimum: 0
        first_at:
          type: string
          format: date-time
        last_at:
          type: string
          format: date-time
        last_inbound_at:
          type: [string, 'null']
          format: date-time
          description: When the latest inbound message arrived. Use it to detect new mail before approving a draft ([C5]).
        last_direction: {$ref: '#/components/schemas/Direction'}
        snippet:
          type: string
          description: Up to 240 characters of the latest message's `extracted_text` (untrusted content).
        labels:
          type: array
          description: Labels on any message in the thread.
          items: {$ref: '#/components/schemas/Label'}
        category:
          type: [string, 'null']
          description: The triage category of the latest triaged inbound message.
        needs_reply:
          type: [number, 'null']
          minimum: 0
          maximum: 1
        urgency:
          type: [integer, 'null']
          minimum: 0
          maximum: 3
        archived:
          type: boolean
        hold:
          oneOf:
            - $ref: '#/components/schemas/ThreadHold'
            - type: 'null'
    Thread:
      description: A thread summary with a page of its messages, oldest first within the page.
      allOf:
        - $ref: '#/components/schemas/ThreadSummary'
        - type: object
          required: [messages, next_cursor]
          properties:
            messages:
              type: array
              items: {$ref: '#/components/schemas/Message'}
            next_cursor:
              type: [string, 'null']
              description: Cursor for the next page of messages, or `null` on the last page.
    ThreadUpdateRequest:
      type: object
      minProperties: 1
      properties:
        labels_add:
          type: array
          items: {$ref: '#/components/schemas/Label'}
        labels_remove:
          type: array
          items: {$ref: '#/components/schemas/Label'}
        read:
          type: boolean
        archived:
          type: boolean

    # ── Messages ─────────────────────────────────────────────────────────────────────────────────

    MessageStatus:
      type: string
      description: >-
        Inbound: `received`, `quarantined`, `screening` (held until its screening verdict, hidden from
        agents), `throttled` (over the per-sender limit, hidden from agents) and `hidden` (receive-blocked
        sender, or a delivery report, kept for audit). Outbound: see `OutboundStatus`.
      enum: [received, quarantined, screening, throttled, hidden, queued, submitted, delivered, deferred, bounced, complained, rejected, failed, uncertain, suppressed, canceled]
    OutboundStatus:
      type: string
      description: |
        The roll-up status of an outbound message. Per-recipient status is in `deliveries`.

        | Status | Meaning | Terminal |
        |---|---|---|
        | `queued` | Accepted, waiting for the transport | no |
        | `submitted` | The transport accepted it; `provider_message_id` is set | no |
        | `delivered` | Every recipient is delivered | yes |
        | `deferred` | At least one recipient has a temporary failure and the provider is still retrying | no |
        | `bounced` | At least one recipient bounced and none remains in flight | yes |
        | `complained` | A recipient reported spam (can follow `delivered`) | yes |
        | `rejected` | The transport refused it before sending (validation, policy) | yes |
        | `failed` | It could not be sent (quota exhausted after retries, or resolved as not sent) | yes |
        | `uncertain` | The outcome is unknown. It is never resent automatically | until resolved |
        | `suppressed` | Every recipient is suppressed. Nothing was sent | yes |
        | `canceled` | Cancelled while queued | yes |
      enum: [queued, submitted, delivered, deferred, bounced, complained, rejected, failed, uncertain, suppressed, canceled]
    MessageKind:
      type: string
      description: >-
        Inbound: `normal`, `automated`, `dsn`, `list`, `calendar` or `mdn`. Outbound: `transactional`,
        `marketing` or `auto_reply`.
      enum: [normal, automated, dsn, list, calendar, mdn, transactional, marketing, auto_reply]
    MessageFlag:
      type: string
      description: >-
        `sent_via_fallback` (sent from the platform address because the domain was failing), `parse_degraded`,
        `encrypted`, `message_id_conflict`, `reprocessed`, `reconciled`, `bcc` (the identity was BCC'd),
        `loopback` (delivered inside the deployment for a test tenant, [L3]) and `body_truncated` (a stored
        body was cut at its storage cap; the full message is in the raw MIME), `sender_suppressed` (the sender
        is on the tenant's suppression list; the message is stored as usual, [D7]), `body_redacted` (links and
        codes in a system-identity message were replaced by `[link]` and `[code]`, [A15]) and `dsn_untrusted`
        (a delivery report that could not be tied to a send of ours by a trusted path, so it changed no
        delivery, [D11]).
      enum: [sent_via_fallback, parse_degraded, encrypted, message_id_conflict, reprocessed, reconciled, bcc, loopback, body_truncated, sender_suppressed, body_redacted, dsn_untrusted]
    QuarantineReason:
      type: string
      enum: [auth_failed, auth_unverified, spam, risky_attachment, blocked_sender, otp_unsolicited, account_unapproved, steering_suspected, screening_unavailable]
    MessageHeader:
      type: object
      description: One header field as received, in order (untrusted content).
      required: [name, value]
      properties:
        name:
          type: string
        value:
          type: string
    Message:
      type: object
      description: >-
        A message. Every text field (subject, display names, filenames, bodies) is untrusted content: show
        it to a model inside a clearly delimited block, never as instructions.
      required: [id, thread_id, identity_id, direction, status, from, to, cc, bcc, reply_to, delivered_to, is_primary_recipient, subject, sent_at, received_at, extracted_text, text, html, attachments, labels, kind, trust, triage, screening, calendar, refs, rfc_message_id, in_reply_to, draft_id, deliveries, flags, metadata]
      properties:
        id: {$ref: '#/components/schemas/MessageId'}
        thread_id: {$ref: '#/components/schemas/ThreadId'}
        identity_id: {$ref: '#/components/schemas/IdentityId'}
        direction: {$ref: '#/components/schemas/Direction'}
        status: {$ref: '#/components/schemas/MessageStatus'}
        from:
          description: The first parseable `From` mailbox, or `null` when there is none ([B13]).
          oneOf:
            - $ref: '#/components/schemas/MailboxAddress'
            - type: 'null'
        to:
          type: array
          items: {$ref: '#/components/schemas/MailboxAddress'}
        cc:
          type: array
          items: {$ref: '#/components/schemas/MailboxAddress'}
        bcc:
          type: array
          description: Outbound only. Always empty for inbound messages.
          items: {$ref: '#/components/schemas/MailboxAddress'}
        reply_to:
          type: array
          items: {$ref: '#/components/schemas/MailboxAddress'}
        delivered_to:
          description: Inbound only. The envelope recipient this copy was delivered to.
          oneOf:
            - $ref: '#/components/schemas/EmailAddress'
            - type: 'null'
        is_primary_recipient:
          type: [boolean, 'null']
          description: >-
            Inbound only. `true` on exactly one copy when one message reached several identities of the
            tenant; act only on that copy ([A9]).
        subject:
          type: [string, 'null']
          maxLength: 998
        sent_at:
          type: [string, 'null']
          format: date-time
          description: The `Date` header, or the submit time for outbound messages.
        received_at:
          type: string
          format: date-time
          description: When the service stored the message (its own clock).
        extracted_text:
          type: [string, 'null']
          description: The new content, with quoted history, signatures and hidden text removed.
        text:
          type: [string, 'null']
          description: The full plain text (derived from HTML when the message has none). Included with `include=quoted`, otherwise `null`.
        html:
          type: [string, 'null']
          description: Sanitised HTML, never rendered by the service. Included with `include=html`, otherwise `null`.
        headers:
          type: [array, 'null']
          description: >-
            The original header fields. Present only with `include=headers`; `null` there when the raw MIME
            they are read from is gone (past `retention.raw_days`, or an outbound message whose sent copy was
            deleted).
          items: {$ref: '#/components/schemas/MessageHeader'}
        attachments:
          type: array
          items: {$ref: '#/components/schemas/Attachment'}
        labels:
          type: array
          maxItems: 64
          items: {$ref: '#/components/schemas/Label'}
        kind: {$ref: '#/components/schemas/MessageKind'}
        trust:
          description: Authentication and trust metadata of an inbound message. `null` for outbound messages.
          oneOf:
            - $ref: '#/components/schemas/Trust'
            - type: 'null'
        triage:
          description: Triage of an inbound message. `null` for outbound messages, and for a quarantined message until it is released (triage then runs).
          oneOf:
            - $ref: '#/components/schemas/Triage'
            - type: 'null'
        screening:
          description: >-
            The screening record, or `null` when the message was not screened. `status: "screening"` means the
            message is held until its verdict, at the latest at `screening.deadline_at`.
          oneOf:
            - $ref: '#/components/schemas/Screening'
            - type: 'null'
        calendar:
          description: The message's calendar object, or `null`. Every string in it is untrusted content.
          oneOf:
            - $ref: '#/components/schemas/MessageCalendar'
            - type: 'null'
        quarantine_reason:
          description: Set when `status` is `quarantined`.
          oneOf:
            - $ref: '#/components/schemas/QuarantineReason'
            - type: 'null'
        refs:
          type: array
          description: Exact references extracted at ingest (FR-SRCH-4).
          items: {$ref: '#/components/schemas/Ref'}
        rfc_message_id:
          type: [string, 'null']
          description: The `Message-ID` header, normalised, without angle brackets.
        in_reply_to:
          type: [string, 'null']
          description: The `In-Reply-To` header, normalised, without angle brackets.
        draft_id:
          description: The draft an outbound message was sent from, or `null`.
          oneOf:
            - $ref: '#/components/schemas/DraftId'
            - type: 'null'
        provider_message_id:
          type: [string, 'null']
          description: Outbound only. The transport's message ID, set once the message is `submitted`.
        deliveries:
          description: Outbound only. Per-recipient delivery status; `null` for inbound messages.
          oneOf:
            - type: array
              items: {$ref: '#/components/schemas/Delivery'}
            - type: 'null'
        flags:
          type: array
          items: {$ref: '#/components/schemas/MessageFlag'}
        metadata: {$ref: '#/components/schemas/Metadata'}
    MessageSummary:
      type: object
      description: The thin message summary carried in webhook events.
      required: [id, thread_id, direction, status, from, to, cc, delivered_to, is_primary_recipient, subject, sent_at, received_at, kind, labels, in_reply_to, draft_id, flags]
      properties:
        id: {$ref: '#/components/schemas/MessageId'}
        thread_id: {$ref: '#/components/schemas/ThreadId'}
        direction: {$ref: '#/components/schemas/Direction'}
        status: {$ref: '#/components/schemas/MessageStatus'}
        from:
          oneOf:
            - $ref: '#/components/schemas/MailboxAddress'
            - type: 'null'
        to:
          type: array
          items: {$ref: '#/components/schemas/MailboxAddress'}
        cc:
          type: array
          items: {$ref: '#/components/schemas/MailboxAddress'}
        delivered_to:
          oneOf:
            - $ref: '#/components/schemas/EmailAddress'
            - type: 'null'
        is_primary_recipient:
          type: [boolean, 'null']
          description: >-
            Inbound only. `true` on exactly one copy when one message reached several identities of the
            tenant; act only on that copy ([A9]).
        subject:
          type: [string, 'null']
        sent_at:
          type: [string, 'null']
          format: date-time
        received_at:
          type: string
          format: date-time
        kind: {$ref: '#/components/schemas/MessageKind'}
        labels:
          type: array
          items: {$ref: '#/components/schemas/Label'}
        in_reply_to:
          type: [string, 'null']
        draft_id:
          description: The draft an outbound message was sent from, or `null`.
          oneOf:
            - $ref: '#/components/schemas/DraftId'
            - type: 'null'
        flags:
          type: array
          items: {$ref: '#/components/schemas/MessageFlag'}
    MessageUpdateRequest:
      type: object
      minProperties: 1
      properties:
        labels_add:
          type: array
          items: {$ref: '#/components/schemas/Label'}
        labels_remove:
          type: array
          items: {$ref: '#/components/schemas/Label'}
        read:
          type: boolean
    BatchMessageIds:
      type: array
      minItems: 1
      maxItems: 100
      description: Message IDs of one identity. A repeated ID is processed once, at its first position.
      items: {$ref: '#/components/schemas/MessageId'}
    BatchGetRequest:
      type: object
      required: [message_ids]
      properties:
        message_ids: {$ref: '#/components/schemas/BatchMessageIds'}
        extracted_text_bytes:
          type: integer
          minimum: 0
          maximum: 16384
          default: 2048
          description: '`extracted_text` of each message is cut at a UTF-8 character boundary to this many bytes.'
    BatchMessage:
      allOf:
        - $ref: '#/components/schemas/Message'
        - type: object
          required: [extracted_text_truncated]
          properties:
            extracted_text_truncated:
              type: boolean
    BatchGetResponse:
      type: object
      required: [data, not_found, remaining, truncated]
      properties:
        data:
          type: array
          items: {$ref: '#/components/schemas/BatchMessage'}
        not_found:
          type: array
          description: Missing, erased, of another identity, or not visible to the key; never told apart.
          items: {$ref: '#/components/schemas/MessageId'}
        remaining:
          type: array
          description: Found messages left out to keep the body within 1,048,576 bytes; ask for them again.
          items: {$ref: '#/components/schemas/MessageId'}
        truncated:
          type: boolean
    BatchUpdateRequest:
      type: object
      required: [message_ids]
      description: At least one of `labels_add`, `labels_remove`, `read` and `archived` is required (checked by the service).
      properties:
        message_ids: {$ref: '#/components/schemas/BatchMessageIds'}
        labels_add:
          type: array
          maxItems: 64
          items: {$ref: '#/components/schemas/Label'}
        labels_remove:
          type: array
          maxItems: 64
          items: {$ref: '#/components/schemas/Label'}
        read:
          type: boolean
        archived:
          type: boolean
          description: Sets the archived flag of each thread that holds a listed message.
        require_absent:
          type: array
          maxItems: 10
          description: A message carrying any of these labels is not changed and is listed in `conflicts`. Needs `labels_add` or `labels_remove`.
          items: {$ref: '#/components/schemas/Label'}
    BatchUpdateResponse:
      type: object
      required: [updated, unchanged, conflicts, not_found, threads_archived, threads_unarchived]
      properties:
        updated:
          type: array
          items: {$ref: '#/components/schemas/MessageId'}
        unchanged:
          type: array
          items: {$ref: '#/components/schemas/MessageId'}
        conflicts:
          type: array
          items: {$ref: '#/components/schemas/MessageId'}
        not_found:
          type: array
          items: {$ref: '#/components/schemas/MessageId'}
        threads_archived:
          type: integer
          minimum: 0
        threads_unarchived:
          type: integer
          minimum: 0

    AttachmentRisk:
      type: string
      description: Why an attachment is unsafe ([B10]). A message with a risky attachment is quarantined.
      enum: [executable, macro, encrypted_archive, archive_bomb, type_mismatch, encrypted_document]
    AttachmentTextStatus:
      type: string
      description: '`unavailable`: extraction failed or the type is unsupported. `skipped`: by policy or risk.'
      enum: [pending, ready, unavailable, skipped]
    Attachment:
      type: object
      required: [id, filename, content_type, size, disposition, text_status, pages, risk, upload_id]
      properties:
        id: {$ref: '#/components/schemas/AttachmentId'}
        filename:
          type: [string, 'null']
          description: Sanitised (no path, at most 255 bytes). Untrusted content.
        content_type:
          type: string
          examples: [application/pdf]
        size:
          type: integer
          minimum: 0
          description: Bytes.
        disposition:
          type: [string, 'null']
          enum: [attachment, inline, null]
        text_status: {$ref: '#/components/schemas/AttachmentTextStatus'}
        pages:
          type: [integer, 'null']
          minimum: 0
          description: Pages of extracted text, when known.
        risk:
          oneOf:
            - $ref: '#/components/schemas/AttachmentRisk'
            - type: 'null'
        upload_id:
          description: >-
            The upload the attachment was copied from; `null` for inline, inbound and forwarded attachments. It
            stays after the upload is gone.
          oneOf:
            - $ref: '#/components/schemas/UploadId'
            - type: 'null'
    AttachmentText:
      type: object
      required: [status, pages, total_pages, truncated]
      properties:
        status: {$ref: '#/components/schemas/AttachmentTextStatus'}
        pages:
          type: array
          description: The requested pages (untrusted content). Empty unless `status` is `ready`.
          items:
            type: object
            required: [page, text]
            properties:
              page:
                type: integer
                minimum: 1
              text:
                type: string
        total_pages:
          type: [integer, 'null']
          minimum: 0
        truncated:
          type: boolean
          description: '`true` when the text was cut at 200 KB.'

    AuthVerdict:
      type: string
      description: >-
        `unverified`: the sender's DMARC policy is `quarantine` or `reject`, no aligned DKIM signature
        passed, and SPF alignment could not be read because no trusted `Authentication-Results` header was
        available (`PM_TRUSTED_AUTHSERV_ID` not yet set). It quarantines with `auth_unverified`.
        `arc_rescued`: DMARC failed, and the newest ARC seal is from a sealer in
        `inbound.trusted_arc_sealers` that signed `From`, recorded `dmarc=pass` for the `From` domain, sealed
        within 72 hours and saw the message addressed to this identity. It is not quarantined for
        authentication and never releases a verification code.
      enum: [pass, arc_rescued, fail, softfail, none, unaligned, unverified]
    AuthResult:
      type: string
      description: An RFC 8601 authentication result for one method.
      enum: [pass, fail, softfail, neutral, none, temperror, permerror, policy]
    TrustFlag:
      type: string
      description: >-
        `thread_join_unverified`: the message joined a thread without a valid thread token, either by a token
        that failed verification or by `In-Reply-To`/`References` from a sender who is not a participant of
        the thread ([C9]); a `wait` with `kind=reply` does not match it. `shared_domain_sender`: the sender is
        an address on the shared platform domain that belongs to another workspace ([D12]).
        `steering_suspected`: screening judged that the message tries to steer an agent.
        `attachments_unscreened`: screening could not read the text of at least one attachment (an image
        while `inbound.extract_image_text` is off, a file whose conversion failed, text still pending at the
        verdict); treat those attachments' bytes as unscreened content.
      enum: [hidden_text, display_name_spoof, lookalike_domain, reply_to_mismatch, thread_join_unverified, shared_domain_sender, steering_suspected, attachments_unscreened]
    Trust:
      type: object
      description: Authentication and trust metadata (FR-IN-4), with the domain each method checked and whether it aligned (FR-IN-14).
      required: [verdict, spf, dkim, dmarc, arc, spf_domain, spf_aligned, dkim_domains, dmarc_domain, dmarc_policy, dmarc_aligned_by, arc_sealer, known_sender, quarantined, spam_score, automated, flags]
      properties:
        verdict: {$ref: '#/components/schemas/AuthVerdict'}
        spf: {$ref: '#/components/schemas/AuthResult'}
        dkim: {$ref: '#/components/schemas/AuthResult'}
        dmarc: {$ref: '#/components/schemas/AuthResult'}
        arc: {$ref: '#/components/schemas/AuthResult'}
        spf_domain:
          type: [string, 'null']
          description: The domain SPF checked (`smtp.mailfrom` of the trusted header, or SES's `mail.source`); `null` when SPF was not checked.
        spf_aligned:
          type: boolean
        dkim_domains:
          type: array
          maxItems: 10
          description: One entry per DKIM signature evaluated, in header order.
          items: {$ref: '#/components/schemas/DkimDomainResult'}
        dmarc_domain:
          type: [string, 'null']
          description: The `From` domain DMARC was evaluated for.
        dmarc_policy:
          type: [string, 'null']
          enum: [none, quarantine, reject, null]
        dmarc_aligned_by:
          type: [string, 'null']
          enum: [dkim, spf, null]
        arc_sealer:
          type: [string, 'null']
          description: The `d=` of the newest `ARC-Seal` when the ARC chain validated, trusted or not.
        known_sender:
          type: boolean
          description: The sender is a known contact of this identity.
        quarantined:
          type: boolean
        spam_score:
          type: [number, 'null']
          minimum: 0
          maximum: 1
        automated:
          type: boolean
          description: Auto-reply, mailing list, bounce or read receipt (FR-IN-6). Never auto-reply to it.
        flags:
          type: array
          items: {$ref: '#/components/schemas/TrustFlag'}
    DkimDomainResult:
      type: object
      required: [domain, selector, result, aligned]
      properties:
        domain:
          type: string
          description: '`d=`, an A-label in lower case.'
        selector:
          type: string
        result: {$ref: '#/components/schemas/AuthResult'}
        aligned:
          type: boolean
    TrustSummary:
      type: object
      required: [verdict, known_sender, quarantined]
      properties:
        verdict: {$ref: '#/components/schemas/AuthVerdict'}
        known_sender:
          type: boolean
        quarantined:
          type: boolean

    TriageStatus:
      type: string
      enum: [pending, done, skipped, failed]
    BuiltinTriageCategory:
      type: string
      description: The built-in triage categories, used when the tenant has no custom list.
      enum: [customer_request, vendor, billing, legal_compliance, verification, notification, newsletter, marketing, auto_reply, personal, spam, other]
    RiskFlag:
      type: string
      enum: [payment_change_request, credential_request, prompt_injection_suspected, phishing_suspected, impersonation_suspected, urgent_pressure, unknown_sender, auth_failed, attachment_risky, hidden_text]
    Triage:
      type: object
      description: Advisory triage (FR-TRI-1). It never sends, deletes or releases anything.
      required: [status, category, needs_reply, urgency, summary, language, risk_flags, model, version, run]
      properties:
        status: {$ref: '#/components/schemas/TriageStatus'}
        category:
          description: A built-in category, or one of the tenant's custom categories.
          anyOf:
            - $ref: '#/components/schemas/BuiltinTriageCategory'
            - type: string
            - type: 'null'
        needs_reply:
          type: [number, 'null']
          minimum: 0
          maximum: 1
        urgency:
          type: [integer, 'null']
          minimum: 0
          maximum: 3
        summary:
          type: [string, 'null']
          maxLength: 280
        language:
          type: [string, 'null']
          description: BCP 47 language tag.
          examples: [en]
        risk_flags:
          type: array
          items: {$ref: '#/components/schemas/RiskFlag'}
        model:
          type: [string, 'null']
          description: 'The model that produced the triage, `"rules"` when rules alone decided (`skip_model`), or `null` while it is pending or when it was skipped or failed.'
          examples: ['@cf/openai/gpt-oss-20b']
        version:
          type: integer
          minimum: 1
          description: >-
            The triage logic version (`TRIAGE_VERSION`) that produced the record: the prompt, schema, built-in
            rules and merge logic of the release that ran it. A re-run on the same release keeps it; a re-run after
            an upgrade records the current one.
        run:
          type: integer
          minimum: 0
          description: >-
            How many times triage has completed for this message: `0` for a record written at ingest
            (`skipped`), `1` after the first run, one more after each re-run, release or re-parse.
        reason:
          type: string
          description: >-
            Present only when `status` is `skipped` (`allowance`: the workspace's triage allowance is spent,
            edge case W7; `policy_disabled`; `not_eligible`: hidden, throttled, DSN or MDN, or a message of the
            system identity; `ai_unavailable`: the tenant's share of Workers AI stayed busy for about two hours,
            [F16]) or `failed` (`invalid_output`, `model_unavailable`, `input_unavailable`).
          enum: [allowance, policy_disabled, not_eligible, ai_unavailable, invalid_output, model_unavailable, input_unavailable]

    DeliveryStatus:
      type: string
      enum: [queued, suppressed, submitted, delivered, deferred, bounced, complained, rejected, failed, uncertain]
    Delivery:
      type: object
      description: The delivery status of one recipient of an outbound message.
      required: [address, field, status, smtp_code, enhanced_code, bounce_type, updated_at]
      properties:
        address: {$ref: '#/components/schemas/EmailAddress'}
        field:
          type: string
          enum: [to, cc, bcc]
        status: {$ref: '#/components/schemas/DeliveryStatus'}
        smtp_code:
          type: [string, 'null']
          examples: ['250']
        enhanced_code:
          type: [string, 'null']
          description: The RFC 3463 enhanced status code from the provider or relay, when it gave one.
          examples: ['5.1.1']
        bounce_type:
          type: [string, 'null']
          enum: [hard, soft, null]
        updated_at:
          type: string
          format: date-time
    Ref:
      type: object
      description: An exact reference extracted from the subject, body or attachment text.
      required: [kind, value]
      properties:
        kind:
          description: >-
            A built-in kind, or `custom:<name>` for a tenant pattern (a booking reference, for example, is
            `custom:booking`).
          anyOf:
            - type: string
              enum: [uk_plate, pcn, invoice, order, amount, phone, email, domain, date]
            - type: string
              pattern: '^custom:.+$'
        value:
          type: string
          description: The normalised value, for example `AB12CDE`, `+447700900123` or `GBP:412.80`.

    # ── Screening ────────────────────────────────────────────────────────────────────────────────

    ScreeningStatus:
      type: string
      description: '`pending` (no verdict yet), `clear`, `suspect` (the message tries to steer an agent) or `unavailable` (no verdict by the deadline).'
      enum: [pending, clear, suspect, unavailable]
    ScreeningReason:
      type: string
      description: >-
        A service code, never model text. With status `unavailable` in hold mode, `model_cap` and
        `invalid_output` always hold the message as `screening_unavailable`; `deadline_exceeded`,
        `model_unavailable` and `ai_rate_limited` follow the tenant's `screening.on_unavailable`.
      enum: [rules, model, late_signal, model_clear, nothing_to_screen, deadline_exceeded, model_unavailable, invalid_output, ai_rate_limited, model_cap, test_forced]
    ScreeningSignal:
      type: object
      required: [source, kind, field, severity]
      properties:
        source:
          type: string
          enum: [rules, model]
        kind:
          type: string
          enum: [instruction_override, role_marker, role_claim, tool_mention, action_request, exfiltration, fence_spoof, encoded_payload, concealment]
        field:
          type: [string, 'null']
          enum: [subject, display_name, body, html, hidden, filename, attachment, null]
        severity:
          type: [string, 'null']
          enum: [high, medium, low, null]
    Screening:
      type: object
      description: A message's screening record (docs › Screening hold § 3). Holds no text from the mail or the classifier.
      required: [status, mode, reason, signals, model, started_at, deadline_at, completed_at, late, released_by]
      properties:
        status: {$ref: '#/components/schemas/ScreeningStatus'}
        mode:
          type: string
          enum: [monitor, hold]
        reason:
          oneOf:
            - $ref: '#/components/schemas/ScreeningReason'
            - type: 'null'
        signals:
          type: array
          maxItems: 32
          items: {$ref: '#/components/schemas/ScreeningSignal'}
        model:
          type: [string, 'null']
          description: The model ID, `rules`, or `null`.
        started_at:
          type: string
          format: date-time
        deadline_at:
          type: string
          format: date-time
        completed_at:
          type: [string, 'null']
          format: date-time
        late:
          type: boolean
        released_by:
          oneOf:
            - type: object
              required: [key_id, user_id, at]
              properties:
                key_id:
                  type: [string, 'null']
                user_id:
                  type: [string, 'null']
                at:
                  type: string
                  format: date-time
            - type: 'null'
    ScreeningFeedbackVerdict:
      type: string
      enum: [correct, false_positive, missed_threat, legitimate_instruction, spam]
    ScreeningFeedbackRequest:
      type: object
      additionalProperties: false
      required: [verdict]
      properties:
        verdict:
          description: Must fit the record's status (`400 invalid_request`, `details.reason = "feedback_not_applicable"`).
          $ref: '#/components/schemas/ScreeningFeedbackVerdict'
        notes:
          type: string
          minLength: 1
          maxLength: 500
    ScreeningFeedback:
      type: object
      required: [id, message_id, verdict, screening_status, notes, actor, created_at]
      properties:
        id:
          type: string
          description: Screening feedback ID (`sfb_` + ULID).
          pattern: '^sfb_[0-9A-HJKMNP-TV-Z]{26}$'
        message_id: {$ref: '#/components/schemas/MessageId'}
        verdict: {$ref: '#/components/schemas/ScreeningFeedbackVerdict'}
        screening_status:
          type: string
          enum: [clear, suspect, unavailable]
        notes:
          type: [string, 'null']
        actor:
          type: object
          required: [kind, key_id, user_id]
          properties:
            kind:
              type: string
              enum: [key, person]
            key_id:
              type: [string, 'null']
            user_id:
              type: [string, 'null']
        created_at:
          type: string
          format: date-time
    ScreeningSummary:
      type: object
      required: [from, to, partial, failed_identities, verdicts, reasons, outcomes, feedback, quality]
      properties:
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        partial:
          type: boolean
        failed_identities:
          type: array
          items: {$ref: '#/components/schemas/IdentityId'}
        verdicts:
          type: object
          additionalProperties:
            type: integer
            minimum: 0
        reasons:
          type: object
          additionalProperties:
            type: integer
            minimum: 0
        outcomes:
          type: object
          required: [held, delivered, monitored, released]
          properties:
            held:
              type: integer
            delivered:
              type: integer
            monitored:
              type: integer
            released:
              type: integer
        feedback:
          type: object
          required: [messages_reviewed, correct, false_positive, missed_threat, legitimate_instruction, spam]
          additionalProperties:
            type: integer
            minimum: 0
        quality:
          type: object
          required: [true_positive, false_positive, false_negative, true_negative, precision, recall]
          properties:
            true_positive:
              type: integer
            false_positive:
              type: integer
            false_negative:
              type: integer
            true_negative:
              type: integer
            precision:
              type: [number, 'null']
              minimum: 0
              maximum: 1
            recall:
              type: [number, 'null']
              minimum: 0
              maximum: 1

    # ── Sending ──────────────────────────────────────────────────────────────────────────────────

    Recipient:
      description: A recipient, as a bare address or as an object with a display name.
      oneOf:
        - $ref: '#/components/schemas/EmailAddress'
        - type: object
          required: [address]
          properties:
            address: {$ref: '#/components/schemas/EmailAddress'}
            name:
              type: string
              description: Display name. No CR or LF.
              pattern: '^[^\r\n]*$'
    AttachmentInput:
      type: object
      description: An inline attachment, its bytes in base64. For a large file, create an upload and attach it by `upload_id` instead (`AttachmentUploadInput`).
      required: [filename, content_type, content_base64]
      additionalProperties: false
      properties:
        filename:
          type: string
          minLength: 1
          maxLength: 255
        content_type:
          type: string
          examples: [application/pdf]
        content_base64:
          type: string
          contentEncoding: base64
          description: The file bytes, base64-encoded.
        disposition:
          type: string
          enum: [attachment, inline]
          default: attachment
        content_id:
          type: string
          description: The Content-ID for an `inline` attachment referenced as `cid:` from the HTML body.
    Unsubscribe:
      type: object
      description: One-click unsubscribe (RFC 8058) for marketing mail. Sets the List-Unsubscribe headers and a visible link.
      required: [url]
      properties:
        url:
          type: string
          format: uri
          pattern: '^https://'
        mailto:
          type: string
          description: An unsubscribe mailbox, for the `mailto:` form of List-Unsubscribe.
    Consent:
      type: object
      description: The tenant's attestation of the recipient's consent to marketing mail.
      required: [basis, recorded_at]
      properties:
        basis:
          type: string
          examples: [opt_in]
        recorded_at:
          type: string
          format: date-time
    SendHeaders:
      type: object
      description: >-
        Custom headers, checked when the request arrives, never later at the transport. Names are matched
        case-insensitively, as Cloudflare matches them. A name must be an `X-` name matching
        `^X-[A-Za-z0-9_-]+$`, the prefix in either case (at most 100 bytes, sent as given; `X-Pylota-*` and
        `X-AI-Generated` are reserved in any case), or one of `Importance`, `Priority`, `Sensitivity`,
        `Keywords`, `Comments` and `Organization` in any case, which is sent in that casing; any other name
        is `400 header_not_allowed` (the schema leaves names unconstrained, so that this code and not a
        generic `invalid_request` is returned). Two names that differ only in case are `400 invalid_request`.
        The enums below are listed under the canonical names and apply to every casing. `Importance` takes
        only `high`, `normal` or `low`, `Priority` only `normal`, `non-urgent` or `urgent`, and
        `Sensitivity` only `personal`, `private` or `company-confidential`; another value, an empty value or
        one with CR or LF is `400 invalid_request`. Everything else is set by the service. At most 16 KB in
        total; each value at most 2,048 bytes.
      additionalProperties:
        type: string
        minLength: 1
        maxLength: 2048
        pattern: '^[^\r\n]+$'
      properties:
        Importance:
          type: string
          enum: [high, normal, low]
        Priority:
          type: string
          enum: [normal, non-urgent, urgent]
        Sensitivity:
          type: string
          enum: [personal, private, company-confidential]
      examples:
        - X-Booking-Ref: BK-2291
    SendRequest:
      type: object
      description: >-
        A new message. At most `policy.max_recipients` (default 10, hard maximum 49) across `to`, `cc` and
        `bcc` (`400 too_many_recipients`); duplicates are removed.
      required: [to, subject]
      anyOf:
        - required: [text]
        - required: [html]
      properties:
        to:
          type: array
          minItems: 1
          maxItems: 49
          items: {$ref: '#/components/schemas/Recipient'}
        cc:
          type: array
          maxItems: 49
          items: {$ref: '#/components/schemas/Recipient'}
        bcc:
          type: array
          maxItems: 49
          items: {$ref: '#/components/schemas/Recipient'}
        subject:
          type: string
          maxLength: 998
        text:
          type: [string, 'null']
          description: Plain-text body. Derived from `html` when missing.
        html:
          type: [string, 'null']
          description: HTML body.
        attachments:
          type: array
          maxItems: 32
          description: At most 32, each inline or from an upload of the same identity; 26,214,400 decoded bytes in total.
          items: {$ref: '#/components/schemas/SendAttachment'}
        kind:
          type: string
          enum: [transactional, marketing, auto_reply]
          default: transactional
        unsubscribe:
          $ref: '#/components/schemas/Unsubscribe'
        consent:
          $ref: '#/components/schemas/Consent'
        thread_id:
          description: Continue this thread without quoting; `References` are set from the thread.
          oneOf:
            - $ref: '#/components/schemas/ThreadId'
            - type: 'null'
        from_address:
          description: >-
            An `active` address of the identity, or a `retiring` one on a thread that already uses it ([G7];
            with `thread_id`). Otherwise `400 invalid_request` with `details.errors[0].path = "from_address"`.
            Default the primary.
          oneOf:
            - $ref: '#/components/schemas/EmailAddress'
            - type: 'null'
        labels:
          type: array
          maxItems: 64
          items: {$ref: '#/components/schemas/Label'}
        headers: {$ref: '#/components/schemas/SendHeaders'}
        calendar:
          description: Sends iMIP (docs › Calendar invitations § 5).
          $ref: '#/components/schemas/CalendarSendInput'
        metadata: {$ref: '#/components/schemas/Metadata'}
    ReplyRequest:
      type: object
      description: >-
        The body of a reply or reply-all. Recipients, subject, `From`, `In-Reply-To` and `References` are
        derived from the original message. At least one of `text` and `html` is required. `calendar` is
        accepted on a reply and refused on a reply-all (`400 invalid_request`).
      anyOf:
        - required: [text]
        - required: [html]
      properties:
        text:
          type: [string, 'null']
        html:
          type: [string, 'null']
        attachments:
          type: array
          maxItems: 32
          description: At most 32, each inline or from an upload of the same identity; 26,214,400 decoded bytes in total.
          items: {$ref: '#/components/schemas/SendAttachment'}
        kind:
          type: string
          enum: [transactional, marketing, auto_reply]
          default: transactional
        unsubscribe:
          $ref: '#/components/schemas/Unsubscribe'
        consent:
          $ref: '#/components/schemas/Consent'
        labels:
          type: array
          maxItems: 64
          items: {$ref: '#/components/schemas/Label'}
        headers: {$ref: '#/components/schemas/SendHeaders'}
        calendar:
          description: Sends iMIP on a reply (docs › Calendar invitations § 5). Refused on a reply-all.
          $ref: '#/components/schemas/CalendarSendInput'
        metadata: {$ref: '#/components/schemas/Metadata'}
    ForwardRequest:
      type: object
      description: >-
        The body of a forward. The original message is attached with its `References` kept. Recipients
        count against `policy.max_recipients` as for a new message.
      required: [to]
      properties:
        to:
          type: array
          minItems: 1
          maxItems: 49
          items: {$ref: '#/components/schemas/Recipient'}
        cc:
          type: array
          maxItems: 49
          items: {$ref: '#/components/schemas/Recipient'}
        bcc:
          type: array
          maxItems: 49
          items: {$ref: '#/components/schemas/Recipient'}
        text:
          type: [string, 'null']
          description: A note placed above the forwarded message.
        html:
          type: [string, 'null']
        include_attachments:
          type: boolean
          default: true
          description: Attach the original's attachments (never those with a `risk`).
        attachments:
          type: array
          maxItems: 32
          description: Extra attachments, at most 32 as on a send, each inline or from an upload of the same identity.
          items: {$ref: '#/components/schemas/SendAttachment'}
        labels:
          type: array
          maxItems: 64
          items: {$ref: '#/components/schemas/Label'}
        headers: {$ref: '#/components/schemas/SendHeaders'}
        metadata: {$ref: '#/components/schemas/Metadata'}
    SendResponse:
      description: >-
        The outbound Message object (`direction: "outbound"`, `status: "queued"` on first acceptance) plus
        `deduplicated`.
      allOf:
        - $ref: '#/components/schemas/Message'
        - type: object
          required: [deduplicated]
          properties:
            deduplicated:
              type: boolean
              description: '`true` when this is the stored response of an earlier request with the same `Idempotency-Key`.'
    DryRunResult:
      type: object
      description: The result of a dry run (`dry_run=true`). Nothing was sent or stored.
      required: [would_send, recipients]
      properties:
        would_send:
          type: boolean
          const: true
          description: Always `true` in a `200`; a send that would be refused returns its error instead.
        recipients:
          type: array
          description: Each recipient after duplicates are removed, with what a real send would do with it.
          items: {$ref: '#/components/schemas/DryRunRecipient'}
    DryRunRecipient:
      type: object
      required: [address, field, status]
      properties:
        address: {$ref: '#/components/schemas/EmailAddress'}
        field:
          type: string
          enum: [to, cc, bcc]
        status:
          type: string
          description: '`queued` (it would be sent) or `suppressed` (it would be skipped; see `reason`).'
          enum: [queued, suppressed]
        reason:
          type: string
          description: >-
            Only for `suppressed`: the suppression reason (`hard_bounce`, `complaint`, `unsubscribe`,
            `manual`, `provider`), or `send_block`, `not_on_allowlist` or `unknown_recipient`.
          examples: [hard_bounce]
        scope:
          type: string
          description: 'Only with `reason: "send_block"`: whether the identity''s own entry or the tenant''s blocked it.'
          enum: [identity, tenant]
    ResolveRequest:
      type: object
      required: [outcome]
      properties:
        outcome:
          type: string
          description: >-
            `sent` moves the message and its uncertain deliveries to `submitted` and emits `message.sent`;
            `not_sent` marks the message `failed` with reason `resolved_not_sent`.
          enum: [sent, not_sent]
    ReleaseRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1

    # ── Calendar ─────────────────────────────────────────────────────────────────────────────────

    CalendarSendInput:
      type: object
      required: [ics]
      additionalProperties: false
      description: >-
        An iCalendar object to send as iMIP (docs › Calendar invitations § 5). It needs exactly one `METHOD`,
        one `UID`, a `DTSTAMP` in each `VEVENT` and the structure RFC 5546 gives its method
        (`400 calendar_invalid`). For `PUBLISH`, `REQUEST`, `ADD`, `CANCEL` and `DECLINECOUNTER` the
        `ORGANIZER` must be the address the message is sent from (`400 calendar_organizer_mismatch`), and for
        all of them but `PUBLISH`, which has no attendees and may go to anyone, every recipient must be an
        `ATTENDEE`; for `REPLY`, `REFRESH` and `COUNTER` the replying `ATTENDEE` must be the
        `From` (`400 calendar_attendee_mismatch`) and the one recipient the `ORGANIZER`
        (`400 calendar_recipient_mismatch`). `kind` must be `transactional`. A lower `SEQUENCE` than one this
        identity already sent for the `UID` is `409 calendar_sequence_stale`. A calendar message never falls
        back to the platform domain.
      properties:
        ics:
          type: string
          maxLength: 262144
          description: UTF-8 iCalendar text; the limit is 262,144 bytes, checked by the server (`413 calendar_too_large`).
        attach_copy:
          type: boolean
          description: Attach an `invite.ics` copy. Default `true` for organizer methods, `false` for attendee methods.
    CalendarReplyRequest:
      type: object
      required: [partstat]
      additionalProperties: false
      properties:
        partstat:
          type: string
          enum: [accepted, declined, tentative]
        comment:
          type: string
          maxLength: 1000
        recurrence_id:
          type: [string, 'null']
          description: >-
            Answers one instance, in the form of the invitation's DTSTART: an RFC 3339 instant for a UTC or zoned
            date-time, a local `YYYY-MM-DDTHH:MM:SS` without offset for a floating one, `YYYY-MM-DD` for a date.
            An invitation whose zone is unknown cannot be answered per instance (`400 invalid_request`,
            `instance_zone_unknown`).
    CalendarTime:
      type: object
      required: [utc, local, date, tzid, tz, tz_resolution]
      properties:
        utc:
          type: [string, 'null']
          format: date-time
        local:
          type: [string, 'null']
          description: Local wall time, `YYYY-MM-DDTHH:MM:SS`.
        date:
          type: [string, 'null']
          format: date
        tzid:
          type: [string, 'null']
          maxLength: 256
        tz:
          type: [string, 'null']
          description: IANA zone name.
        tz_resolution:
          type: string
          enum: [utc, iana, windows, prefixed, vtimezone, unknown, floating, date]
        source:
          type: string
          enum: [dtend, duration, default]
          description: Ends only.
    CalendarParty:
      type: object
      required: [address, name]
      properties:
        address:
          type: [string, 'null']
        name:
          type: [string, 'null']
          maxLength: 256
        sent_by:
          type: [string, 'null']
        uri_scheme:
          type: [string, 'null']
    CalendarAttendee:
      allOf:
        - $ref: '#/components/schemas/CalendarParty'
        - type: object
          required: [role, partstat, rsvp, cutype, is_self]
          properties:
            role:
              type: string
              enum: [chair, req_participant, opt_participant, non_participant, other]
            partstat:
              type: string
              enum: [needs_action, accepted, declined, tentative, delegated, other]
            rsvp:
              type: boolean
            cutype:
              type: string
              enum: [individual, group, resource, room, unknown]
            delegated_from:
              type: array
              maxItems: 5
              items:
                type: string
            delegated_to:
              type: array
              maxItems: 5
              items:
                type: string
            is_self:
              type: boolean
    MessageCalendar:
      type: object
      description: >-
        The message's calendar object (docs › Calendar invitations § 2.9). Every string is untrusted content.
        Alarms, attachments, images and extension properties are never included. New `warnings` values and new
        `reason` values may be added within /v1.
      required: [object_status, method, verified, reason, attachment_id]
      properties:
        object_status:
          type: string
          enum: [parsed, invalid, too_large, too_complex, unsupported]
        method:
          type: [string, 'null']
          enum: [publish, request, reply, add, cancel, refresh, counter, declinecounter, none, unknown, null]
        verified:
          type: [boolean, 'null']
          description: '`null` on outbound messages.'
        verified_by:
          type: [string, 'null']
          enum: [organizer, attendee, null]
        reason:
          type: [string, 'null']
          description: '`sent_by_unverifiable`: the sender is only a `SENT-BY` of the organizer or attendee, which never verifies.'
          enum: [object_invalid, object_too_large, object_too_complex, no_vevent, method_unknown, method_mismatch, organizer_missing, organizer_not_mailto, organizer_inconsistent, uid_mismatch, attendee_count, sender_not_authenticated, sender_is_delegator, sent_by_unverifiable, sender_not_organizer, sender_not_attendee, null]
        authenticated_sender:
          type: [string, 'null']
        uid:
          type: [string, 'null']
          maxLength: 1024
        sequence:
          type: [integer, 'null']
        dtstamp:
          type: [string, 'null']
          format: date-time
        recurrence_id:
          oneOf:
            - $ref: '#/components/schemas/CalendarTime'
            - type: 'null'
        status:
          type: [string, 'null']
          enum: [tentative, confirmed, cancelled, null]
        summary:
          type: [string, 'null']
          maxLength: 1000
        summary_truncated:
          type: boolean
        description:
          type: [string, 'null']
          maxLength: 2000
        description_truncated:
          type: boolean
        location:
          type: [string, 'null']
          maxLength: 1024
        conference:
          type: array
          maxItems: 5
          description: The primary's `CONFERENCE` properties (RFC 7986). Untrusted; never fetched.
          items:
            type: object
            required: [uri, label]
            properties:
              uri:
                type: string
                maxLength: 2048
              label:
                type: [string, 'null']
                maxLength: 256
        comment:
          type: [string, 'null']
          maxLength: 2000
        start:
          oneOf:
            - $ref: '#/components/schemas/CalendarTime'
            - type: 'null'
        end:
          oneOf:
            - $ref: '#/components/schemas/CalendarTime'
            - type: 'null'
        all_day:
          type: boolean
        floating:
          type: boolean
        ends_at:
          type: [string, 'null']
          format: date-time
        ends_at_basis:
          type: string
          enum: [utc, tenant_timezone]
        rrule:
          type: [object, 'null']
          description: Validated, never expanded.
          properties:
            text:
              type: string
              maxLength: 512
            valid:
              type: boolean
            freq:
              type: [string, 'null']
            interval:
              type: [integer, 'null']
            count:
              type: [integer, 'null']
            until:
              type: [string, 'null']
        exdates_count:
          type: integer
        rdates_count:
          type: integer
        organizer:
          oneOf:
            - $ref: '#/components/schemas/CalendarParty'
            - type: 'null'
        attendees:
          type: array
          maxItems: 100
          items: {$ref: '#/components/schemas/CalendarAttendee'}
        attendees_total:
          type: integer
        attendees_truncated:
          type: boolean
        overrides:
          type: array
          maxItems: 100
          items:
            type: object
            properties:
              recurrence_id: {$ref: '#/components/schemas/CalendarTime'}
              this_and_future:
                type: boolean
              sequence:
                type: integer
              status:
                type: [string, 'null']
              start: {$ref: '#/components/schemas/CalendarTime'}
              end: {$ref: '#/components/schemas/CalendarTime'}
              summary:
                type: [string, 'null']
                maxLength: 256
              location:
                type: [string, 'null']
                maxLength: 256
              self:
                oneOf:
                  - $ref: '#/components/schemas/CalendarAttendee'
                  - type: 'null'
        overrides_total:
          type: integer
        overrides_truncated:
          type: boolean
        organized_here:
          type: boolean
          description: >-
            `true` only for a verified `reply`, `refresh` or `counter` answering an invitation this identity sent
            with the same `UID` and `ORGANIZER`, from an attendee that invitation names.
        attachment_id:
          description: The attachment holding the raw `.ics`.
          oneOf:
            - $ref: '#/components/schemas/AttachmentId'
            - type: 'null'
        other_objects:
          type: integer
        ignored_components:
          type: array
          items:
            type: string
        removed:
          type: object
          properties:
            alarms:
              type: integer
            attachments:
              type: integer
            images:
              type: integer
            x_properties:
              type: integer
            conference:
              type: integer
        warnings:
          type: array
          items:
            type: string
        outbound:
          type: object
          description: Outbound messages only.
          properties:
            attach_copy:
              type: boolean
            added_vtimezones:
              type: array
              maxItems: 10
              items:
                type: string
            removed:
              type: array
              maxItems: 20
              items:
                type: string
        parser_version:
          type: integer

    # ── Drafts ───────────────────────────────────────────────────────────────────────────────────

    DraftId:
      type: string
      description: Draft ID (`drf_` + ULID).
      pattern: '^drf_[0-9A-HJKMNP-TV-Z]{26}$'
      examples: [drf_01JA2B3C4D5E6F7G8H9J0K1M2N]
    DraftStatus:
      type: string
      description: >-
        `editing`, `pending_approval` (waits for an approver), `approved`, `scheduled` (waits for `send_at`),
        `sending`, `sent` (became a message), `failed` (a send it did not answer synchronously ended without a
        message; never retried automatically), `rejected` or `canceled`.
      enum: [editing, pending_approval, approved, scheduled, sending, sent, failed, rejected, canceled]
    DraftKind:
      type: string
      description: Fixed at creation from `in_reply_to`, `reply_all` and `forward_of`.
      enum: [new, reply, reply_all, forward]
    DraftApprovalReason:
      type: string
      description: '`requested` by the writer, or the policy level that needed approval.'
      enum: [requested, new_recipients, external, always]
    RequireApproval:
      type: string
      description: >-
        When a send needs approval: `never`; `new_recipients` (a recipient is neither known nor internal to the
        workspace); `external` (a recipient is not internal); `always`. Ordered from loosest to strictest.
      enum: [never, new_recipients, external, always]
    DraftFailureReason:
      type: string
      description: >-
        `failure.reason` of a `failed` draft: the error code the send would have returned for a refusal that
        is not transient (every code the send pipeline can return for a stored draft is in this list), or
        `authority_revoked` (the key or person that scheduled it can no longer send),
        `sender_address_unavailable` (its explicit `from_address` is no longer usable), `send_interrupted`
        (three attempts died before the message was stored) or `send_window_missed` (not sent within an hour
        of `send_at`).
      enum: [identity_paused, tenant_suspended, partner_suspended, sending_paused, identity_owner_required, billing_limit, daily_cap_reached, authority_revoked, sender_address_unavailable, domain_not_ready, transport_unavailable, test_mode_recipient, loop_detected, auto_reply_not_allowed, message_too_large, thread_not_found, source_unavailable, identity_not_found, too_many_recipients, policy_denied, attachment_risky, calendar_invalid, calendar_too_large, calendar_organizer_mismatch, calendar_attendee_mismatch, calendar_recipient_mismatch, calendar_sequence_stale, invalid_request, address_invalid, address_unsupported, header_not_allowed, marketing_requirements_missing, send_interrupted, send_window_missed]
    DraftAttachmentInput:
      description: >-
        Inline (`filename`, `content_type`, `content_base64`) or a reference to a `ready` upload of the same
        identity (`upload_id`), whose bytes are copied when the revision is saved.
      oneOf:
        - $ref: '#/components/schemas/AttachmentInput'
        - $ref: '#/components/schemas/AttachmentUploadInput'
    DraftAttachment:
      type: object
      required: [id, filename, content_type, disposition, content_id, size, sha256, source, upload_id]
      properties:
        id: {$ref: '#/components/schemas/AttachmentId'}
        filename:
          type: string
          description: Sanitised. Untrusted content.
        content_type:
          type: string
        disposition:
          type: string
          enum: [attachment, inline]
        content_id:
          type: [string, 'null']
        size:
          type: integer
          minimum: 0
        sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
        source:
          type: string
          description: '`inline` (bytes given as base64) or `upload` (copied from an upload when the revision was saved).'
          enum: [inline, upload]
        upload_id:
          description: The upload the bytes were copied from; `null` for inline parts. It stays after the upload is gone.
          oneOf:
            - $ref: '#/components/schemas/UploadId'
            - type: 'null'
    DraftCreateRequest:
      type: object
      additionalProperties: false
      description: >-
        The fields of `SendRequest`, or `in_reply_to` (with `reply_all`) or `forward_of` with the fields of a
        reply or forward, plus `send_at`, `client_id` and `request_approval`. A field the kind does not take is
        `400 invalid_request`: `new` takes every content field; `reply` takes `text`, `html`, `attachments`,
        `kind` (`transactional` or `auto_reply`), `headers`, `calendar`, `labels`, `metadata` and `send_at`;
        `reply_all` the same without `calendar`; `forward` takes `to`, `cc`, `bcc`, `text`, `html`,
        `attachments`, `include_attachments`, `from_address`, `headers`, `labels`, `metadata` and `send_at`.
      properties:
        client_id:
          type: string
          minLength: 1
          maxLength: 255
          pattern: '^[\x20-\x3F\x41-\x7E]{1,255}$'
          description: Makes the create idempotent per identity. Printable ASCII without `@`; it appears in events.
        in_reply_to:
          description: 'Makes a `reply` draft (with `reply_all: true`, a `reply_all` draft) of this message.'
          $ref: '#/components/schemas/MessageId'
        reply_all:
          type: boolean
        forward_of:
          description: Makes a `forward` draft of this message.
          $ref: '#/components/schemas/MessageId'
        to:
          type: array
          maxItems: 49
          items: {$ref: '#/components/schemas/Recipient'}
        cc:
          type: array
          maxItems: 49
          items: {$ref: '#/components/schemas/Recipient'}
        bcc:
          type: array
          maxItems: 49
          items: {$ref: '#/components/schemas/Recipient'}
        subject:
          type: [string, 'null']
          maxLength: 998
        text:
          type: [string, 'null']
        html:
          type: [string, 'null']
          description: Kept as written; sanitised only when shown in the console and when the message is stored.
        attachments:
          type: array
          maxItems: 32
          items: {$ref: '#/components/schemas/DraftAttachmentInput'}
        kind:
          type: string
          enum: [transactional, marketing, auto_reply]
          default: transactional
        thread_id:
          oneOf:
            - $ref: '#/components/schemas/ThreadId'
            - type: 'null'
        from_address:
          oneOf:
            - $ref: '#/components/schemas/EmailAddress'
            - type: 'null'
        headers: {$ref: '#/components/schemas/SendHeaders'}
        unsubscribe:
          $ref: '#/components/schemas/Unsubscribe'
        consent:
          $ref: '#/components/schemas/Consent'
        calendar: {$ref: '#/components/schemas/CalendarSendInput'}
        include_attachments:
          type: boolean
          description: Forward drafts only. Default `true`.
        labels:
          type: array
          maxItems: 64
          items: {$ref: '#/components/schemas/Label'}
        metadata: {$ref: '#/components/schemas/Metadata'}
        send_at:
          type: [string, 'null']
          format: date-time
          description: The time the draft should be sent. Setting it alone schedules nothing.
        request_approval:
          type: boolean
          description: '`true` puts the draft in `pending_approval` at once.'
    DraftUpdateRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      description: >-
        A field left out is unchanged; `null` clears a nullable field. `to`, `cc`, `bcc`, `headers` and
        `metadata` are replaced whole; attachments change only through `attachments_add` and
        `attachments_remove`, labels through `labels`, or `labels_add` and `labels_remove`. `client_id`,
        `in_reply_to`, `reply_all` and `forward_of` cannot change.
      properties:
        to:
          type: array
          maxItems: 49
          items: {$ref: '#/components/schemas/Recipient'}
        cc:
          type: array
          maxItems: 49
          items: {$ref: '#/components/schemas/Recipient'}
        bcc:
          type: array
          maxItems: 49
          items: {$ref: '#/components/schemas/Recipient'}
        subject:
          type: [string, 'null']
          maxLength: 998
        text:
          type: [string, 'null']
        html:
          type: [string, 'null']
        kind:
          type: string
          enum: [transactional, marketing, auto_reply]
        thread_id:
          oneOf:
            - $ref: '#/components/schemas/ThreadId'
            - type: 'null'
        from_address:
          oneOf:
            - $ref: '#/components/schemas/EmailAddress'
            - type: 'null'
        headers: {$ref: '#/components/schemas/SendHeaders'}
        unsubscribe:
          oneOf:
            - $ref: '#/components/schemas/Unsubscribe'
            - type: 'null'
        consent:
          oneOf:
            - $ref: '#/components/schemas/Consent'
            - type: 'null'
        calendar:
          oneOf:
            - $ref: '#/components/schemas/CalendarSendInput'
            - type: 'null'
        include_attachments:
          type: boolean
        labels:
          type: array
          maxItems: 64
          items: {$ref: '#/components/schemas/Label'}
        metadata: {$ref: '#/components/schemas/Metadata'}
        send_at:
          type: [string, 'null']
          format: date-time
        request_approval:
          type: boolean
        attachments_add:
          type: array
          maxItems: 32
          items: {$ref: '#/components/schemas/DraftAttachmentInput'}
        attachments_remove:
          type: array
          maxItems: 32
          items: {$ref: '#/components/schemas/AttachmentId'}
        labels_add:
          type: array
          maxItems: 64
          items: {$ref: '#/components/schemas/Label'}
        labels_remove:
          type: array
          maxItems: 64
          items: {$ref: '#/components/schemas/Label'}
    DraftSendRequest:
      type: object
      additionalProperties: false
      properties:
        send_at:
          type: [string, 'null']
          format: date-time
          description: A time schedules; `null` sends now; left out, the draft's future `send_at` is used, or it is sent now.
        revision:
          type: integer
          minimum: 1
          description: When given, the draft must still be at this revision (`409 draft_revision_mismatch`).
        labels_add:
          type: array
          maxItems: 64
          items: {$ref: '#/components/schemas/Label'}
        labels_remove:
          type: array
          maxItems: 64
          items: {$ref: '#/components/schemas/Label'}
    DraftApproveRequest:
      type: object
      additionalProperties: false
      required: [revision, send]
      properties:
        revision:
          type: integer
          minimum: 1
        digest:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: When given, the revision's content digest must match (`409 draft_revision_mismatch`, `details.reason = "digest"`).
        send:
          type: boolean
          description: '`true` also sends now, or at a future `send_at`; it needs `messages:send` as well.'
        note:
          type: string
          maxLength: 500
        on_behalf_of:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[\x20-\x3F\x41-\x7E]{1,128}$'
          description: API keys only. Your own user's ID, recorded with the decision.
    DraftRejectRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
        revision:
          type: integer
          minimum: 1
        on_behalf_of:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[\x20-\x3F\x41-\x7E]{1,128}$'
    Draft:
      type: object
      description: >-
        A draft (docs › Drafts, approvals and scheduled send § 2). Every text field was written by an agent that
        mail may have steered: it is untrusted content.
      required: [id, tenant_id, identity_id, client_id, draft_kind, kind, status, revision, etag, digest, in_reply_to, forward_of, thread_id, from_address, to, cc, bcc, subject, text, html, attachments, include_attachments, calendar, headers, unsubscribe, consent, labels, metadata, send_at, approval, send, rejection, failure, message_id, sent_at, created_by_key_id, updated_by_key_id, content_by_key_id, created_at, updated_at]
      properties:
        id: {$ref: '#/components/schemas/DraftId'}
        tenant_id: {$ref: '#/components/schemas/TenantId'}
        identity_id: {$ref: '#/components/schemas/IdentityId'}
        client_id:
          type: [string, 'null']
        draft_kind: {$ref: '#/components/schemas/DraftKind'}
        kind:
          type: string
          enum: [transactional, marketing, auto_reply]
        status: {$ref: '#/components/schemas/DraftStatus'}
        revision:
          type: integer
          minimum: 1
        etag:
          type: string
          description: The entity tag of the current revision, `"{revision}-{8 hex}"`.
        digest:
          type: [string, 'null']
          pattern: '^[0-9a-f]{64}$'
          description: The content digest of the current revision; `null` once the content is cleared.
        in_reply_to:
          oneOf:
            - $ref: '#/components/schemas/MessageId'
            - type: 'null'
        forward_of:
          oneOf:
            - $ref: '#/components/schemas/MessageId'
            - type: 'null'
        thread_id:
          oneOf:
            - $ref: '#/components/schemas/ThreadId'
            - type: 'null'
        from_address:
          oneOf:
            - $ref: '#/components/schemas/EmailAddress'
            - type: 'null'
        to:
          type: array
          items: {$ref: '#/components/schemas/MailboxAddress'}
        cc:
          type: array
          items: {$ref: '#/components/schemas/MailboxAddress'}
        bcc:
          type: array
          items: {$ref: '#/components/schemas/MailboxAddress'}
        subject:
          type: [string, 'null']
        text:
          type: [string, 'null']
        html:
          type: [string, 'null']
        preview:
          type: [string, 'null']
          maxLength: 240
          description: Lists only, where `text` and `html` are `null`.
        attachments:
          type: array
          items: {$ref: '#/components/schemas/DraftAttachment'}
        include_attachments:
          type: [boolean, 'null']
        calendar:
          oneOf:
            - $ref: '#/components/schemas/CalendarSendInput'
            - type: 'null'
        headers:
          type: object
          additionalProperties:
            type: string
        unsubscribe:
          oneOf:
            - $ref: '#/components/schemas/Unsubscribe'
            - type: 'null'
        consent:
          oneOf:
            - $ref: '#/components/schemas/Consent'
            - type: 'null'
        labels:
          type: array
          items: {$ref: '#/components/schemas/Label'}
        metadata: {$ref: '#/components/schemas/Metadata'}
        send_at:
          type: [string, 'null']
          format: date-time
        approval:
          type: object
          required: [state, reason]
          properties:
            state:
              type: string
              enum: [none, requested, approved]
            reason:
              oneOf:
                - $ref: '#/components/schemas/DraftApprovalReason'
                - type: 'null'
            requested_at:
              type: [string, 'null']
              format: date-time
            requested_by_key_id:
              type: [string, 'null']
            approved_revision:
              type: [integer, 'null']
            approved_digest:
              type: [string, 'null']
              description: The digest the approval covers; a send needs it to equal the current digest.
            approved_at:
              type: [string, 'null']
              format: date-time
            approved_by_key_id:
              type: [string, 'null']
            approved_by_user_id:
              type: [string, 'null']
            on_behalf_of:
              type: [string, 'null']
            note:
              type: [string, 'null']
        send:
          description: The pending or last send request; `null` when none.
          type: [object, 'null']
          properties:
            origin:
              type: string
              enum: [api, approval, console]
            requested_at:
              type: string
              format: date-time
            requested_by_key_id:
              type: [string, 'null']
            requested_by_user_id:
              type: [string, 'null']
            due_at:
              type: [string, 'null']
              format: date-time
            labels_add:
              type: array
              items: {$ref: '#/components/schemas/Label'}
            labels_remove:
              type: array
              items: {$ref: '#/components/schemas/Label'}
        rejection:
          description: Set while `rejected`.
          type: [object, 'null']
          properties:
            reason:
              type: string
              enum: [operator, expired]
            note:
              type: [string, 'null']
            rejected_at:
              type: string
              format: date-time
            rejected_by_key_id:
              type: [string, 'null']
            rejected_by_user_id:
              type: [string, 'null']
            on_behalf_of:
              type: [string, 'null']
        failure:
          description: Set while `failed`.
          type: [object, 'null']
          properties:
            reason: {$ref: '#/components/schemas/DraftFailureReason'}
            detail:
              type: object
            failed_at:
              type: string
              format: date-time
            attempts:
              type: integer
              minimum: 1
        message_id:
          description: Set when the draft became a message.
          oneOf:
            - $ref: '#/components/schemas/MessageId'
            - type: 'null'
        sent_at:
          type: [string, 'null']
          format: date-time
        created_by_key_id:
          type: [string, 'null']
        updated_by_key_id:
          type: [string, 'null']
          description: The key that wrote the current revision (`null` for a console write).
        content_by_key_id:
          type: [string, 'null']
          description: >-
            The key that last changed the content: the create, or the last `PATCH` that changed the digest. It
            may not approve the draft (`self_approval`); a change of only `send_at`, `labels` or `metadata`
            leaves it.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        deduplicated:
          type: boolean
          description: Present on write responses; `true` on an idempotent replay.
    DraftDryRun:
      type: object
      description: The result of a draft send's dry run (`dry_run=true`). Nothing was sent, scheduled or stored.
      required: [would_send, outcome, recipients]
      properties:
        would_send:
          type: boolean
          description: '`false` only for `pending_approval`.'
        outcome:
          type: string
          enum: [send, schedule, pending_approval]
        approval_reason:
          oneOf:
            - $ref: '#/components/schemas/DraftApprovalReason'
            - type: 'null'
        send_at:
          type: [string, 'null']
          format: date-time
        recipients:
          type: array
          description: Each recipient as a real send would treat it (after an approval, for `pending_approval`).
          items: {$ref: '#/components/schemas/DryRunRecipient'}
    DraftIndexEntry:
      type: object
      description: An entry of the tenant's queue of drafts. No content.
      required: [draft_id, identity_id, status, draft_kind, revision, approval_reason, recipient_count, attachment_count, send_at, status_at, failure_reason, requested_by_key_id, updated_at]
      properties:
        draft_id: {$ref: '#/components/schemas/DraftId'}
        identity_id: {$ref: '#/components/schemas/IdentityId'}
        status:
          type: string
          enum: [pending_approval, scheduled, failed]
        draft_kind: {$ref: '#/components/schemas/DraftKind'}
        revision:
          type: integer
          minimum: 1
        approval_reason:
          oneOf:
            - $ref: '#/components/schemas/DraftApprovalReason'
            - type: 'null'
        recipient_count:
          type: integer
          minimum: 0
        attachment_count:
          type: integer
          minimum: 0
        send_at:
          type: [string, 'null']
          format: date-time
        status_at:
          type: string
          format: date-time
        failure_reason:
          oneOf:
            - $ref: '#/components/schemas/DraftFailureReason'
            - type: 'null'
        requested_by_key_id:
          type: [string, 'null']
        updated_at:
          type: string
          format: date-time

    # ── Uploads ──────────────────────────────────────────────────────────────────────────────────

    UploadId:
      type: string
      description: Upload ID (`upl_` + ULID).
      pattern: '^upl_[0-9A-HJKMNP-TV-Z]{26}$'
      examples: [upl_01JAC3Q7W9X2M5N6P8R0T1Y4ZB]
    UploadStatus:
      type: string
      enum: [pending, uploading, ready, rejected, expired]
    UploadCreateRequest:
      type: object
      additionalProperties: false
      required: [filename, content_type, size, sha256]
      properties:
        filename:
          type: string
          minLength: 1
          maxLength: 255
        content_type:
          type: string
          maxLength: 127
          examples: [application/pdf]
        size:
          type: integer
          minimum: 1
          maximum: 26214400
          description: Bytes.
        sha256:
          type: string
          pattern: '^[0-9A-Fa-f]{64}$'
          description: SHA-256 of the bytes, hexadecimal.
        expires_in:
          type: integer
          minimum: 900
          maximum: 604800
          default: 86400
          description: Seconds; capped by the identity's mail retention.
    Upload:
      type: object
      required: [id, identity_id, filename, content_type, size, sha256, status, status_reason, sniffed_type, risk, scan_status, use_count, last_used_at, created_at, expires_at, upload_url, upload_url_expires_at]
      properties:
        id: {$ref: '#/components/schemas/UploadId'}
        identity_id: {$ref: '#/components/schemas/IdentityId'}
        filename:
          type: string
          description: Sanitised. Untrusted content.
        content_type:
          type: string
        size:
          type: integer
          minimum: 1
          maximum: 26214400
        sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
        status: {$ref: '#/components/schemas/UploadStatus'}
        status_reason:
          type: [string, 'null']
          enum: [risk, infected, expired, too_many_attempts, object_missing, null]
        sniffed_type:
          type: [string, 'null']
        risk:
          oneOf:
            - $ref: '#/components/schemas/AttachmentRisk'
            - type: 'null'
        scan_status:
          type: string
          enum: [skipped, clean, infected, error]
        use_count:
          type: integer
          minimum: 0
        last_used_at:
          type: [string, 'null']
          format: date-time
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        upload_url:
          type: [string, 'null']
          format: uri
          description: Only in the create response and in `getUpload` while `pending` or `uploading`. A bearer URL; valid until `upload_url_expires_at`.
        upload_url_expires_at:
          type: [string, 'null']
          format: date-time
    AttachmentUploadInput:
      type: object
      additionalProperties: false
      required: [upload_id]
      properties:
        upload_id: {$ref: '#/components/schemas/UploadId'}
        filename:
          type: string
          minLength: 1
          maxLength: 255
          description: Defaults to the upload's filename.
        disposition:
          type: string
          enum: [attachment, inline]
          default: attachment
        content_id:
          type: string
          description: The Content-ID for an `inline` attachment.
    SendAttachment:
      description: An attachment of a send, reply, reply-all or forward, inline or from an upload of the same identity.
      oneOf:
        - $ref: '#/components/schemas/AttachmentInput'
        - $ref: '#/components/schemas/AttachmentUploadInput'

    # ── Search ───────────────────────────────────────────────────────────────────────────────────

    SearchFilters:
      type: object
      description: Structured filters, combined with the operators in `q`. Dates resolve in the tenant time zone ([F9]).
      properties:
        direction:
          oneOf:
            - $ref: '#/components/schemas/Direction'
            - type: 'null'
        labels:
          type: array
          items: {$ref: '#/components/schemas/Label'}
        after:
          type: [string, 'null']
          format: date-time
        before:
          type: [string, 'null']
          format: date-time
    SearchRequest:
      type: object
      description: A `keyword`, `semantic` or `hybrid` search.
      required: [q]
      properties:
        q:
          type: string
          maxLength: 1024
          description: The query, in the query language described on `searchIdentity`. At most 1,024 characters; `""` matches all messages.
        mode:
          type: string
          enum: [keyword, semantic, hybrid]
          default: hybrid
        filters: {$ref: '#/components/schemas/SearchFilters'}
        group_by:
          type: string
          enum: [message, thread]
          default: message
          description: '`thread` returns one `ThreadHit` per thread.'
        limit:
          type: integer
          minimum: 1
          maximum: 50
          default: 10
        snippet_chars:
          type: integer
          minimum: 40
          maximum: 1000
          default: 240
          description: Maximum characters per snippet.
        facets:
          type: boolean
          default: true
          description: Include `facets` in the response.
        include_quarantined:
          type: boolean
          default: false
          description: Include quarantined mail and mail still being screened. Needs `quarantine:review`.
        cursor:
          type: [string, 'null']
          description: The `next_cursor` of the previous page.
        require_mode:
          type: boolean
          default: false
          description: Fail with `503 search_degraded` instead of degrading when the requested mode is unavailable.
    TenantSearchRequest:
      description: A `keyword`, `semantic` or `hybrid` search across a tenant's identities.
      allOf:
        - $ref: '#/components/schemas/SearchRequest'
        - type: object
          properties:
            identity_ids:
              $ref: '#/components/schemas/IdentityIdFilter'
    IdentityIdFilter:
      type: array
      description: Restrict a tenant search to these identities (at most 100).
      uniqueItems: true
      minItems: 1
      maxItems: 100
      items: {$ref: '#/components/schemas/IdentityId'}
    AgenticBudget:
      type: object
      properties:
        max_steps:
          type: integer
          minimum: 2
          maximum: 10
          default: 6
          description: Defaults to, and is capped by, `policy.search.agentic_max_steps` (a larger value is lowered to it, not refused). Outside 2–10 is `400 invalid_request`.
        max_seconds:
          type: integer
          minimum: 3
          maximum: 30
          default: 8
          description: Defaults to, and is capped by, `policy.search.agentic_max_seconds` (a larger value is lowered to it, not refused). Outside 3–30 is `400 invalid_request`.
    AgenticRequest:
      type: object
      description: An agentic search. The planner's tools are read-only and cannot widen the caller's scope or filters ([F10]).
      required: [q, mode]
      properties:
        q:
          type: string
          minLength: 1
          maxLength: 1024
          description: The question, in natural language, at most 1,024 characters.
        mode:
          type: string
          const: agentic
        budget: {$ref: '#/components/schemas/AgenticBudget'}
        stream:
          type: boolean
          default: false
          description: 'With `Accept: text/event-stream`, stream progress as server-sent events.'
        filters: {$ref: '#/components/schemas/SearchFilters'}
        include_quarantined:
          type: boolean
          default: false
          description: Include quarantined mail and mail still being screened. Needs `quarantine:review`.
        require_mode:
          type: boolean
          default: false
          description: Fail with `503 search_degraded` instead of degrading to hybrid results when the model is unavailable.
    TenantAgenticRequest:
      description: An agentic search across a tenant's identities.
      allOf:
        - $ref: '#/components/schemas/AgenticRequest'
        - type: object
          properties:
            identity_ids:
              $ref: '#/components/schemas/IdentityIdFilter'
    SearchMode:
      type: string
      enum: [keyword, semantic, hybrid, agentic]
    SearchResponse:
      type: object
      required: [query, hits, facets, next_cursor, truncated, semantic_coverage, degraded, as_of]
      properties:
        query:
          type: object
          required: [parsed, mode]
          properties:
            parsed:
              type: string
              description: The query as parsed (normalised).
            mode:
              type: string
              enum: [keyword, semantic, hybrid]
              description: The mode that ran.
        hits:
          type: array
          description: '`SearchHit` rows, or `ThreadHit` rows with `group_by: "thread"`.'
          items:
            oneOf:
              - $ref: '#/components/schemas/SearchHit'
              - $ref: '#/components/schemas/ThreadHit'
        facets:
          description: 'Computed on the first page only: `null` on later pages (with a `cursor`) and when the request set `facets: false`.'
          oneOf:
            - $ref: '#/components/schemas/Facets'
            - type: 'null'
        next_cursor:
          type: [string, 'null']
        truncated:
          type: boolean
          description: '`true` when results were cut to fit the 256 KB response cap.'
        semantic_coverage:
          type: [number, 'null']
          minimum: 0
          maximum: 1
          description: The share of the mailbox that is embedded (FR-SRCH-7).
        degraded:
          type: boolean
          description: A mode's dependency was unavailable and search fell back.
        as_of:
          type: string
          format: date-time
          description: The point in time the results (and cursor) are pinned to.
        partial:
          type: boolean
          description: >-
            Tenant search only, and always present there. `true` when at least one identity's mailbox errored
            or missed the 900 ms deadline from the start of the fan-out ([F15]).
        failed_identities:
          type: array
          description: >-
            Tenant search only, and always present there (`[]` when every identity answered). The identities
            whose mailboxes errored or did not answer in time; their late results are discarded.
          items: {$ref: '#/components/schemas/IdentityId'}
    TenantSearchResponse:
      description: A `SearchResponse` from tenant search, where `partial` and `failed_identities` are always present.
      allOf:
        - $ref: '#/components/schemas/SearchResponse'
        - type: object
          required: [partial, failed_identities]
    AttachmentHit:
      type: object
      required: [attachment_id, filename, page]
      properties:
        attachment_id: {$ref: '#/components/schemas/AttachmentId'}
        filename:
          type: [string, 'null']
        page:
          type: [integer, 'null']
          minimum: 1
    SearchHit:
      type: object
      required: [message_id, thread_id, identity_id, date, direction, from, subject, snippet, score, why, attachment_hits, trust]
      properties:
        message_id: {$ref: '#/components/schemas/MessageId'}
        thread_id: {$ref: '#/components/schemas/ThreadId'}
        identity_id: {$ref: '#/components/schemas/IdentityId'}
        date:
          type: string
          format: date-time
        direction: {$ref: '#/components/schemas/Direction'}
        from:
          oneOf:
            - $ref: '#/components/schemas/MailboxAddress'
            - type: 'null'
        subject:
          type: [string, 'null']
        snippet:
          type: string
          description: Untrusted content, at most `snippet_chars` characters.
        score:
          type: number
        why:
          type: array
          description: Why the hit matched, for example `ref:AB12CDE (attachment p.1)` or `attachment_text_unavailable`.
          items:
            type: string
        attachment_hits:
          type: array
          items: {$ref: '#/components/schemas/AttachmentHit'}
        trust: {$ref: '#/components/schemas/TrustSummary'}
    ThreadHit:
      type: object
      description: 'One row per thread, with `group_by: "thread"`.'
      required: [thread_id, subject, participants, message_count, last_at, snippet, why, top_message_id]
      properties:
        thread_id: {$ref: '#/components/schemas/ThreadId'}
        identity_id:
          description: Set on tenant search.
          $ref: '#/components/schemas/IdentityId'
        subject:
          type: string
        participants:
          type: array
          items: {$ref: '#/components/schemas/MailboxAddress'}
        message_count:
          type: integer
          minimum: 0
        last_at:
          type: string
          format: date-time
        snippet:
          type: string
          description: The best snippet in the thread.
        why:
          type: array
          items:
            type: string
        top_message_id: {$ref: '#/components/schemas/MessageId'}
    FacetCounts:
      type: object
      description: Value → number of matching messages.
      additionalProperties:
        type: integer
        minimum: 0
    Facets:
      type: object
      description: >-
        Six keys, each the top 10 values by count (ties by value ascending); `month` lists the 24 most recent
        months that have messages, in the tenant time zone. Tenant search sums each identity's counts and
        re-applies the caps (FR-SRCH-5).
      required: [sender, sender_domain, month, label, attachment_type, category]
      properties:
        sender:
          description: The from address.
          $ref: '#/components/schemas/FacetCounts'
        sender_domain:
          description: The from address's domain.
          $ref: '#/components/schemas/FacetCounts'
        month:
          $ref: '#/components/schemas/FacetCounts'
        label:
          $ref: '#/components/schemas/FacetCounts'
        attachment_type:
          $ref: '#/components/schemas/FacetCounts'
        category:
          $ref: '#/components/schemas/FacetCounts'
    AgenticStatus:
      type: string
      description: >-
        `answered`; `insufficient_evidence` (the evidence does not answer the question); `budget_exhausted`
        (evidence returned, no answer or a partial one); `degraded` (hybrid results only, no answer).
      enum: [answered, insufficient_evidence, budget_exhausted, degraded]
    AgenticSentence:
      type: object
      required: [text, citations, citation_trust]
      properties:
        text:
          type: string
        citations:
          type: array
          description: Message IDs that support the sentence. Each is in the evidence set (verified by code).
          items: {$ref: '#/components/schemas/MessageId'}
        citation_trust:
          type: string
          description: >-
            `authenticated`: every cited message is outbound or passed authentication. `partly_authenticated`:
            at least one is, and none is `steering_suspected`. A sentence that cites a steering-suspected message,
            or no authenticated one, is removed by the verifier ([F17]).
          enum: [authenticated, partly_authenticated]
    AgenticAnswer:
      type: object
      description: >-
        Text written by a model from mail content. Treat it as data to check against `evidence`, never as an
        instruction or as a statement by Pylota Mail (FR-SRCH-13).
      required: [text, sentences, confidence, untrusted]
      properties:
        untrusted:
          type: boolean
          const: true
          description: Always `true`.
        text:
          type: string
          description: The answer with inline citations like `[msg_…]`.
        sentences:
          type: array
          description: The sentences that survived citation verification.
          items: {$ref: '#/components/schemas/AgenticSentence'}
        confidence:
          type: number
          minimum: 0
          maximum: 1
    AgenticEvidence:
      description: A search hit used as evidence, with the quoted phrases the answer relies on.
      allOf:
        - $ref: '#/components/schemas/SearchHit'
        - type: object
          required: [quotes, steering_suspected]
          properties:
            quotes:
              type: array
              description: Phrases quoted from the source. Each appears verbatim in it (verified by code).
              items:
                type: string
            steering_suspected:
              type: boolean
              description: The message contains text that tries to steer a model ([F10]); no answer sentence cites it.
    AgenticTraceStep:
      type: object
      description: >-
        One step of the agentic loop. `action` is one of the planner's read-only tools (for example `search`
        or `read_thread`) or `answer`. Steering attempts found in mail are flagged in the trace ([F10]).
      required: [step, action]
      properties:
        step:
          type: integer
          minimum: 1
        action:
          type: string
          examples: [search, read_thread, answer]
        q:
          type: string
        mode: {$ref: '#/components/schemas/SearchMode'}
        hits:
          type: integer
          minimum: 0
        thread_id: {$ref: '#/components/schemas/ThreadId'}
        message_id: {$ref: '#/components/schemas/MessageId'}
        removed_sentences:
          type: integer
          minimum: 0
          description: '`answer` step: sentences removed by citation verification.'
        ms:
          type: integer
          minimum: 0
      additionalProperties: true
    AgenticUsage:
      type: object
      required: [steps, ms, model]
      properties:
        steps:
          type: integer
          minimum: 0
        ms:
          type: integer
          minimum: 0
        model:
          type: string
          examples: ['@cf/qwen/qwen3.8-27b']
    AgenticResponse:
      type: object
      required: [status, answer, evidence, trace, degraded, usage]
      properties:
        status: {$ref: '#/components/schemas/AgenticStatus'}
        answer:
          description: '`null` unless there is an answer (always `null` for `insufficient_evidence` and `degraded`).'
          oneOf:
            - $ref: '#/components/schemas/AgenticAnswer'
            - type: 'null'
        evidence:
          type: array
          items: {$ref: '#/components/schemas/AgenticEvidence'}
        trace:
          type: array
          items: {$ref: '#/components/schemas/AgenticTraceStep'}
        degraded:
          type: boolean
        usage: {$ref: '#/components/schemas/AgenticUsage'}
        partial:
          type: boolean
          description: Tenant search only. `true` when some identities missed the deadline ([F15]).
        failed_identities:
          type: array
          description: Tenant search only.
          items: {$ref: '#/components/schemas/IdentityId'}
    SearchHitList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: {$ref: '#/components/schemas/SearchHit'}

    Contact:
      type: object
      required: [address, name, domain, first_seen_at, last_seen_at, inbound_count, outbound_count, last_thread_id]
      properties:
        address: {$ref: '#/components/schemas/EmailAddress'}
        name:
          type: [string, 'null']
        domain:
          type: string
        first_seen_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time
        inbound_count:
          type: integer
          minimum: 0
        outbound_count:
          type: integer
          minimum: 0
        last_thread_id:
          oneOf:
            - $ref: '#/components/schemas/ThreadId'
            - type: 'null'
    Verification:
      type: object
      description: A verification code or link, released only for authenticated mail from the expected sender domain ([E4]).
      required: [code, link, sender_domain]
      properties:
        code:
          type: [string, 'null']
          examples: [481 207]
        link:
          type: [string, 'null']
          format: uri
        sender_domain:
          type: string
          examples: [service.example]
    WaitResponse:
      type: object
      required: [message, verification, timed_out]
      properties:
        message:
          description: The matching message, or `null` on timeout.
          oneOf:
            - $ref: '#/components/schemas/Message'
            - type: 'null'
        verification:
          description: Set only when a code or link was found and the release conditions hold.
          oneOf:
            - $ref: '#/components/schemas/Verification'
            - type: 'null'
        timed_out:
          type: boolean

    # ── Webhooks ─────────────────────────────────────────────────────────────────────────────────

    WebhookEventFilter:
      description: >-
        An event type, or `*` for every event type that is not opt-in, including types added later. The opt-in
        type `message.labels_changed` is delivered only to endpoints that name it.
      oneOf:
        - $ref: '#/components/schemas/EventType'
        - type: string
          const: '*'
    Webhook:
      type: object
      required: [id, scope, partner_id, tenant_id, url, events, identity_ids, description, header_names, enabled, disabled_reason, created_at, updated_at]
      properties:
        id: {$ref: '#/components/schemas/WebhookId'}
        scope:
          type: string
          description: >-
            Whose events the endpoint receives: `platform`, every tenant's; `partner`, only those of the
            tenants its partner's keys created; `tenant`, its tenant's. Set by the key that created it.
          enum: [platform, partner, tenant]
        partner_id:
          description: The partner of a `partner` endpoint; `null` otherwise.
          oneOf:
            - $ref: '#/components/schemas/PartnerId'
            - type: 'null'
        tenant_id:
          description: '`null` for a platform or partner endpoint.'
          oneOf:
            - $ref: '#/components/schemas/TenantId'
            - type: 'null'
        url:
          type: string
          format: uri
        events:
          type: array
          items: {$ref: '#/components/schemas/WebhookEventFilter'}
        identity_ids:
          type: [array, 'null']
          description: Only events of these identities. `null` means every identity.
          items: {$ref: '#/components/schemas/IdentityId'}
        description:
          type: [string, 'null']
        header_names:
          type: array
          description: The names of the custom delivery headers, in their stored casing. Values are never returned.
          items:
            type: string
        enabled:
          type: boolean
        disabled_reason:
          type: [string, 'null']
          description: >-
            `manual`, `failing` (a `410` or 100 failures over 24 hours), `url_changed` (a `PATCH` changed the
            URL; a passing test delivery re-enables it, [J29]), or `creator_removed` (the person who created it
            left the workspace or lost `webhooks:manage`; an owner or admin re-enables it, [W47]).
          enum: [manual, failing, url_changed, creator_removed, null]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    WebhookCreated:
      description: >-
        An endpoint with its signing secret. The secret is shown only in this response: an idempotent replay
        (`Idempotent-Replayed: true`) returns the same body without `secret` and with
        `"secret_replayed": false`, because the stored response never holds it.
      allOf:
        - $ref: '#/components/schemas/Webhook'
        - type: object
          properties:
            secret:
              type: string
              pattern: '^whsec_[A-Za-z0-9+/]+={0,2}$'
              description: '`whsec_` followed by the base64-encoded signing key.'
            secret_replayed:
              type: boolean
              const: false
              description: Present only on an idempotent replay, which carries no secret. Rotate the secret if it was lost.
          oneOf:
            - required: [secret]
            - required: [secret_replayed]
    WebhookCreateRequest:
      type: object
      required: [url, events]
      properties:
        url:
          type: string
          format: uri
          pattern: '^https://'
          description: HTTPS only. Private, loopback and reserved addresses are refused; redirects are not followed.
          examples: ['https://api.example.com/webhooks/mail']
        events:
          type: array
          minItems: 1
          uniqueItems: true
          items: {$ref: '#/components/schemas/WebhookEventFilter'}
        identity_ids:
          type: [array, 'null']
          uniqueItems: true
          items: {$ref: '#/components/schemas/IdentityId'}
        description:
          type: [string, 'null']
        headers: {$ref: '#/components/schemas/WebhookHeaderMap'}
    WebhookUpdateRequest:
      type: object
      minProperties: 1
      properties:
        url:
          type: string
          format: uri
          pattern: '^https://'
        events:
          type: array
          minItems: 1
          uniqueItems: true
          items: {$ref: '#/components/schemas/WebhookEventFilter'}
        identity_ids:
          type: [array, 'null']
          uniqueItems: true
          items: {$ref: '#/components/schemas/IdentityId'}
        description:
          type: [string, 'null']
        enabled:
          type: boolean
    WebhookHeaderMap:
      type: object
      description: >-
        Static request headers sent with every delivery: at most 10, values together at most 4,096 bytes,
        write-only. A name that would change how the request is framed, routed or attributed (the Fetch
        forbidden request headers, `Proxy-*`, `Sec-*`, `Content-Type`, `Content-Encoding`, `User-Agent`,
        `webhook-*`, `Forwarded`, `X-Real-IP`, `True-Client-IP`, `X-Forwarded-*`, `CF-*`, `X-HTTP-Method`,
        `X-HTTP-Method-Override`, `X-Method-Override`, `X-Pylota-*`) is `400 header_not_allowed`; the schema
        leaves names unconstrained so that this code, not a schema error, names it. `Authorization` is allowed,
        and so are `CF-Access-Client-Id` and `CF-Access-Client-Secret` (a Cloudflare Access service token).
        Too many or too long: `422 webhook_header_limit_reached`.
      maxProperties: 10
      additionalProperties:
        type: string
        minLength: 1
        maxLength: 1024
        pattern: '^[\x21-\x7E]([\x20-\x7E]*[\x21-\x7E])?$'
    WebhookHeadersUpdateRequest:
      type: object
      minProperties: 1
      properties:
        set: {$ref: '#/components/schemas/WebhookHeaderMap'}
        remove:
          type: array
          maxItems: 10
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 64
    RotateRequest:
      type: object
      properties:
        overlap_hours:
          type: integer
          minimum: 0
          maximum: 168
          default: 24
          description: Hours the previous secret stays valid.
    WebhookDeliveryStatus:
      type: string
      enum: [succeeded, failed, dead]
    WebhookDelivery:
      type: object
      description: One delivery attempt of one event to one endpoint.
      required: [id, webhook_id, event_id, event_type, attempt, status, http_status, error, duration_ms, next_attempt_at, created_at]
      properties:
        id: {$ref: '#/components/schemas/DeliveryId'}
        webhook_id: {$ref: '#/components/schemas/WebhookId'}
        event_id: {$ref: '#/components/schemas/EventId'}
        event_type: {$ref: '#/components/schemas/EventType'}
        attempt:
          type: integer
          minimum: 1
        status: {$ref: '#/components/schemas/WebhookDeliveryStatus'}
        http_status:
          type: [integer, 'null']
          description: The endpoint's HTTP status, when it answered.
        error:
          type: [string, 'null']
          description: Machine code when the attempt failed without a usable answer, for example `timeout`, `tls`, `dns` or `status_5xx`.
        duration_ms:
          type: [integer, 'null']
          minimum: 0
        next_attempt_at:
          type: [string, 'null']
          format: date-time
          description: When the next retry is scheduled, if any.
        created_at:
          type: string
          format: date-time
    ReplayRequest:
      description: Replay events by ID, or by time range.
      oneOf:
        - $ref: '#/components/schemas/ReplayByIds'
        - $ref: '#/components/schemas/ReplayByRange'
    ReplayByIds:
      type: object
      required: [event_ids]
      properties:
        event_ids:
          type: array
          minItems: 1
          uniqueItems: true
          items: {$ref: '#/components/schemas/EventId'}
    ReplayByRange:
      type: object
      required: [since]
      properties:
        since:
          type: string
          format: date-time
          description: >-
            Events whose `occurred_at` is at or after this time. Only events at most 30 days old (or
            `retention.events_days`, if shorter) can be replayed.
        until:
          type: string
          format: date-time
        status:
          description: Only events whose latest delivery to this endpoint has this status.
          $ref: '#/components/schemas/WebhookDeliveryStatus'
    ReplayResponse:
      type: object
      required: [queued]
      properties:
        queued:
          type: integer
          minimum: 0

    # ── Event feed ───────────────────────────────────────────────────────────────────────────────

    EventConsumerId:
      type: string
      description: Durable event consumer ID (`evc_` + ULID).
      pattern: '^evc_[0-9A-HJKMNP-TV-Z]{26}$'
      examples: [evc_01J9Z3K8V4QW7X2M5N6P8R0T1Y]
    EventCursor:
      type: string
      description: Opaque event-log cursor. Valid until retention removes the events behind it.
      pattern: '^ec_[A-Za-z0-9_-]+$'
      examples: [ec_eyJ2IjoxLCJwIjo0MjEwfQ]
    EventFeedItem:
      type: object
      required: [cursor, event]
      properties:
        cursor: {$ref: '#/components/schemas/EventCursor'}
        event:
          description: The webhook envelope, byte for byte.
          $ref: '#/components/schemas/Event'
    EventFeedPage:
      type: object
      required: [data, next_cursor, has_more, withheld_types, since_truncated]
      properties:
        data:
          type: array
          items: {$ref: '#/components/schemas/EventFeedItem'}
        next_cursor:
          description: Never `null`; pass it as `after` to continue.
          $ref: '#/components/schemas/EventCursor'
        has_more:
          type: boolean
        withheld_types:
          type: array
          description: Event types the request covers that this key may not see; left out, never refused.
          items:
            type: string
        since_truncated:
          type: boolean
          description: >-
            `true` only on a request with `since` when retention or the size budget had already removed
            events appended at or after that time, so the page does not start where the client asked. Erasure
            never sets it. Always `false` on consumer reads, which take no `since`.
        committed_cursor:
          description: Only on consumer reads.
          $ref: '#/components/schemas/EventCursor'
    EventConsumer:
      type: object
      required: [id, name, tenant_id, owner_key_id, types, identity_ids, committed_cursor, committed_at, last_read_at, positions_behind, state, created_at, updated_at]
      properties:
        id: {$ref: '#/components/schemas/EventConsumerId'}
        name:
          type: string
          pattern: '^[a-z0-9][a-z0-9._-]{0,63}$'
        tenant_id: {$ref: '#/components/schemas/TenantId'}
        owner_key_id: {$ref: '#/components/schemas/KeyId'}
        types:
          type: array
          items:
            type: string
        identity_ids:
          type: [array, 'null']
          items: {$ref: '#/components/schemas/IdentityId'}
        committed_cursor: {$ref: '#/components/schemas/EventCursor'}
        committed_at:
          type: [string, 'null']
          format: date-time
        last_read_at:
          type: [string, 'null']
          format: date-time
        positions_behind:
          type: integer
          minimum: 0
        state:
          type: string
          enum: [active, expired, reset_required]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    EventConsumerCreateRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          pattern: '^[a-z0-9][a-z0-9._-]{0,63}$'
        types:
          type: array
          maxItems: 50
          default: ['*']
          items:
            type: string
            maxLength: 64
        identity_ids:
          type: [array, 'null']
          maxItems: 100
          items: {$ref: '#/components/schemas/IdentityId'}
        start:
          type: string
          default: latest
          description: '`earliest`, `latest` or a cursor.'
    EventConsumerCommitRequest:
      type: object
      required: [cursor]
      additionalProperties: false
      properties:
        cursor: {$ref: '#/components/schemas/EventCursor'}
    EventConsumerResetRequest:
      type: object
      additionalProperties: false
      description: Exactly one of `to` and `since`.
      properties:
        to:
          type: string
          description: '`earliest`, `latest` or a cursor.'
        since:
          type: string
          format: date-time
    StreamToken:
      type: object
      required: [token, expires_at, url, protocols]
      properties:
        token:
          type: string
          pattern: '^pmst_[0-9A-HJKMNP-TV-Z]{26}_[0-9a-hjkmnp-tv-z]{52}$'
          description: Single use, valid for 60 seconds. A secret.
        expires_at:
          type: string
          format: date-time
        url:
          type: string
          format: uri
          description: The `wss://` URL of `GET /v1/events/stream`, without any credential.
        protocols:
          type: array
          minItems: 2
          maxItems: 2
          description: The subprotocols to offer, `pylota-mail.events.v1` and `pylota-mail.token.{token}`.
          items:
            type: string

    # ── Suppressions and lists ───────────────────────────────────────────────────────────────────

    SuppressionReason:
      type: string
      enum: [hard_bounce, complaint, unsubscribe, manual, provider]
    Suppression:
      type: object
      description: A suppressed recipient. Only a keyed hash of the address is stored, so it is shown masked.
      required: [address_hint, reason, created_at, expires_at]
      properties:
        address_hint:
          type: string
          examples: [j***@example.net]
        reason: {$ref: '#/components/schemas/SuppressionReason'}
        created_at:
          type: string
          format: date-time
        expires_at:
          type: [string, 'null']
          format: date-time
          description: '`null` means permanent.'
    SuppressionCreateRequest:
      type: object
      required: [address]
      properties:
        address: {$ref: '#/components/schemas/EmailAddress'}
        reason:
          description: Defaults to `manual`.
          $ref: '#/components/schemas/SuppressionReason'
        note:
          type: string
    SuppressionDeleteRequest:
      type: object
      properties:
        confirm_complaint_removal:
          type: boolean
          default: false
          description: Required (`true`) to remove a `complaint` suppression. Audit-logged.
    ListDirection:
      type: string
      enum: [receive, send]
    ListKind:
      type: string
      enum: [allow, block]
    ListEntryValue:
      type: string
      description: An address (`user@example.com`) or a whole domain (`@example.com`).
      pattern: '^([^@\s]+@[^@\s]+|@[^@\s]+)$'
      examples: ['@example.com']
    ListEntry:
      type: object
      required: [direction, kind, entry, scope, identity_id, note, created_at]
      properties:
        direction: {$ref: '#/components/schemas/ListDirection'}
        kind: {$ref: '#/components/schemas/ListKind'}
        entry: {$ref: '#/components/schemas/ListEntryValue'}
        scope:
          type: string
          enum: [tenant, identity]
        identity_id:
          description: The identity of an `identity`-scope entry; `null` for the tenant scope.
          oneOf:
            - $ref: '#/components/schemas/IdentityId'
            - type: 'null'
        note:
          type: [string, 'null']
        created_at:
          type: string
          format: date-time
    ListEntryPutRequest:
      type: object
      properties:
        note:
          type: [string, 'null']

    # ── API keys ─────────────────────────────────────────────────────────────────────────────────

    McpToolName:
      type: string
      pattern: '^mail_[a-z_]{1,60}$'
      description: An MCP tool name, as listed by `tools/list`.
      examples: [mail_search]
    McpToolList:
      description: >-
        The MCP tools the key may see, narrowing what its permissions and level allow. `null` means every
        allowed tool; `[]` means none. MCP only: REST access follows the permissions.
      oneOf:
        - type: array
          maxItems: 64
          uniqueItems: true
          items: {$ref: '#/components/schemas/McpToolName'}
        - type: 'null'
    ApiKey:
      type: object
      required: [id, name, level, mode, partner_id, tenant_id, identity_id, permissions, mcp_tools, created_by_user_id, expires_at, revoked_at, last_used_at, created_at]
      properties:
        id: {$ref: '#/components/schemas/KeyId'}
        name:
          type: string
        level: {$ref: '#/components/schemas/KeyLevel'}
        mode: {$ref: '#/components/schemas/Mode'}
        partner_id:
          description: '`null` unless the key is partner-level.'
          oneOf:
            - $ref: '#/components/schemas/PartnerId'
            - type: 'null'
        tenant_id:
          oneOf:
            - $ref: '#/components/schemas/TenantId'
            - type: 'null'
        identity_id:
          oneOf:
            - $ref: '#/components/schemas/IdentityId'
            - type: 'null'
        permissions:
          type: array
          uniqueItems: true
          items: {$ref: '#/components/schemas/Permission'}
        mcp_tools: {$ref: '#/components/schemas/McpToolList'}
        expires_at:
          type: [string, 'null']
          format: date-time
        revoked_at:
          type: [string, 'null']
          format: date-time
        last_used_at:
          type: [string, 'null']
          format: date-time
          description: Updated at most once a minute.
        created_by_user_id:
          description: >-
            The console user behind the key: the person whose console session minted it, copied to every key
            minted with it. `null` for a key minted by a platform or partner key with no person behind it.
            Removing that person from the workspace, or lowering their role, revokes the key ([W36]).
          oneOf:
            - $ref: '#/components/schemas/UserId'
            - type: 'null'
        created_at:
          type: string
          format: date-time
    ApiKeyCreated:
      description: >-
        A key with its secret. The secret is shown only in this response: an idempotent replay
        (`Idempotent-Replayed: true`) returns the same body without `secret` and with
        `"secret_replayed": false`, because the stored response never holds it (FR-KEY-2).
      allOf:
        - $ref: '#/components/schemas/ApiKey'
        - type: object
          properties:
            secret:
              type: string
              pattern: '^pmk_(live|test)_.{12}_.+$'
              description: '`pmk_live_<lookup12>_<secret>` or `pmk_test_<lookup12>_<secret>`.'
            secret_replayed:
              type: boolean
              const: false
              description: Present only on an idempotent replay, which carries no secret. Rotate or revoke the key if the secret was lost.
          oneOf:
            - required: [secret]
            - required: [secret_replayed]
    ApiKeyCreateRequest:
      type: object
      description: >-
        `tenant_id` is required for `tenant` and `identity` keys, and `identity_id` for `identity` keys;
        neither is allowed on `platform` or `partner` keys. `partner_id` is required for `partner` keys, which
        only a platform key may create, and refused on every other level. `permissions` is required at every
        level, `platform` included (no implicit full set). Level, tenant, identity and permissions must lie within the
        caller's own (`403 key_scope_exceeded`), and each permission must be one the level can hold
        (`400 invalid_request`, `details.reason = "permission_not_allowed_for_level"`; see `Permission`).
      required: [name, level, permissions]
      properties:
        name:
          type: string
          minLength: 1
        level: {$ref: '#/components/schemas/KeyLevel'}
        partner_id: {$ref: '#/components/schemas/PartnerId'}
        tenant_id: {$ref: '#/components/schemas/TenantId'}
        identity_id: {$ref: '#/components/schemas/IdentityId'}
        permissions:
          type: array
          minItems: 1
          uniqueItems: true
          items: {$ref: '#/components/schemas/Permission'}
        mcp_tools:
          description: >-
            Optional. The MCP tools the key may see, at most 64 distinct names, narrowing what its permissions
            and level allow. Absent or `null`: every allowed tool. An unknown name is `400 invalid_request`
            with `details.reason = "unknown_mcp_tool"`; a tool the new key could not see is
            `details.reason = "mcp_tool_not_permitted"` (both with `details.tool`). Rotation keeps the list;
            keys minted by this key do not inherit it.
          $ref: '#/components/schemas/McpToolList'
        expires_at:
          type: [string, 'null']
          format: date-time

    # ── Privacy ──────────────────────────────────────────────────────────────────────────────────

    ErasureScope:
      type: string
      enum: [message, thread, counterparty, identity, tenant]
    ErasureStatus:
      type: string
      description: '`completed_with_holds`: the erasure finished but skipped held threads, listed in the receipt''s `held` (a tenant then stays `erasing` until no hold remains). `failed`: a step still failed 20 hours after the first request. `canceled`: a tenant erasure superseded it.'
      enum: [queued, running, completed, completed_with_holds, failed, canceled]
    ErasureRequestCreate:
      description: An erasure request. `scope` selects which other fields are required.
      oneOf:
        - $ref: '#/components/schemas/ErasureRequestCreateMessage'
        - $ref: '#/components/schemas/ErasureRequestCreateThread'
        - $ref: '#/components/schemas/ErasureRequestCreateCounterparty'
        - $ref: '#/components/schemas/ErasureRequestCreateIdentity'
        - $ref: '#/components/schemas/ErasureRequestCreateTenant'
      discriminator:
        propertyName: scope
        mapping:
          message: '#/components/schemas/ErasureRequestCreateMessage'
          thread: '#/components/schemas/ErasureRequestCreateThread'
          counterparty: '#/components/schemas/ErasureRequestCreateCounterparty'
          identity: '#/components/schemas/ErasureRequestCreateIdentity'
          tenant: '#/components/schemas/ErasureRequestCreateTenant'
    ErasureRequestCreateMessage:
      type: object
      required: [tenant_id, scope, identity_id, message_id, reason]
      properties:
        tenant_id: {$ref: '#/components/schemas/TenantId'}
        scope:
          type: string
          const: message
        identity_id: {$ref: '#/components/schemas/IdentityId'}
        message_id: {$ref: '#/components/schemas/MessageId'}
        reason:
          type: string
          minLength: 1
    ErasureRequestCreateThread:
      type: object
      required: [tenant_id, scope, identity_id, thread_id, reason]
      properties:
        tenant_id: {$ref: '#/components/schemas/TenantId'}
        scope:
          type: string
          const: thread
        identity_id: {$ref: '#/components/schemas/IdentityId'}
        thread_id: {$ref: '#/components/schemas/ThreadId'}
        reason:
          type: string
          minLength: 1
    ErasureRequestCreateCounterparty:
      type: object
      required: [tenant_id, scope, counterparty_address, reason]
      properties:
        tenant_id: {$ref: '#/components/schemas/TenantId'}
        scope:
          type: string
          const: counterparty
        counterparty_address: {$ref: '#/components/schemas/EmailAddress'}
        reason:
          type: string
          minLength: 1
          examples: [Data subject request DSR-1182]
    ErasureRequestCreateIdentity:
      type: object
      required: [tenant_id, scope, identity_id, reason]
      properties:
        tenant_id: {$ref: '#/components/schemas/TenantId'}
        scope:
          type: string
          const: identity
        identity_id: {$ref: '#/components/schemas/IdentityId'}
        reason:
          type: string
          minLength: 1
    ErasureRequestCreateTenant:
      type: object
      required: [tenant_id, scope, reason]
      properties:
        tenant_id: {$ref: '#/components/schemas/TenantId'}
        scope:
          type: string
          const: tenant
        reason:
          type: string
          minLength: 1
    ErasureHeldItem:
      type: object
      required: [thread_id, reason]
      properties:
        thread_id: {$ref: '#/components/schemas/ThreadId'}
        reason:
          type: string
    ErasureReceipt:
      type: object
      description: What was deleted in each store (FR-PRV-3), the held items skipped (FR-PRV-4), and the post-erasure probe.
      required: [messages_deleted, attachments_deleted, r2_objects_deleted, fts_rows_deleted, refs_deleted, vectors_deleted, events_deleted, log_events_deleted, drafts_deleted, uploads_deleted, screenings_deleted, screening_feedback_deleted, list_entries_deleted, identities_affected, held, probe]
      properties:
        messages_deleted:
          type: integer
          minimum: 0
        attachments_deleted:
          type: integer
          minimum: 0
        r2_objects_deleted:
          type: integer
          minimum: 0
        fts_rows_deleted:
          type: integer
          minimum: 0
        refs_deleted:
          type: integer
          minimum: 0
        vectors_deleted:
          type: integer
          minimum: 0
        events_deleted:
          type: integer
          minimum: 0
        log_events_deleted:
          type: integer
          minimum: 0
          description: Rows deleted from the tenant's event log.
        drafts_deleted:
          type: integer
          minimum: 0
          description: Drafts deleted (including by `WipeAll`).
        uploads_deleted:
          type: integer
          minimum: 0
          description: Upload rows deleted (including by `WipeAll`).
        screenings_deleted:
          type: integer
          minimum: 0
          description: Screening records deleted with their messages.
        screening_feedback_deleted:
          type: integer
          minimum: 0
          description: Screening feedback rows deleted with their messages.
        list_entries_deleted:
          type: integer
          minimum: 0
          description: Allow and block list entries deleted (identity and tenant scope).
        identities_affected:
          type: array
          items: {$ref: '#/components/schemas/IdentityId'}
        held:
          type: array
          items: {$ref: '#/components/schemas/ErasureHeldItem'}
        probe:
          type: object
          description: >-
            Results of keyword and semantic probe queries run after the erasure, and the event-log probe. All
            must be 0 (FR-SRCH-11).
          required: [keyword_hits, semantic_hits, log_hits]
          properties:
            keyword_hits:
              type: integer
              minimum: 0
            semantic_hits:
              type: integer
              minimum: 0
            log_hits:
              type: integer
              minimum: 0
    ErasureRequest:
      type: object
      required: [id, tenant_id, scope, status, identity_id, target_id, resumes_id, created_at, deadline_at, completed_at, receipt]
      properties:
        id: {$ref: '#/components/schemas/ErasureRequestId'}
        tenant_id: {$ref: '#/components/schemas/TenantId'}
        scope: {$ref: '#/components/schemas/ErasureScope'}
        status: {$ref: '#/components/schemas/ErasureStatus'}
        identity_id:
          description: Set for message, thread and identity scope.
          oneOf:
            - $ref: '#/components/schemas/IdentityId'
            - type: 'null'
        target_id:
          type: [string, 'null']
          description: The `msg_` or `thr_` ID, for message and thread scope. The counterparty address is never stored or returned.
        resumes_id:
          description: The failed request this one resumes, or the `completed_with_holds` request it continues.
          oneOf:
            - $ref: '#/components/schemas/ErasureRequestId'
            - type: 'null'
        created_at:
          type: string
          format: date-time
        deadline_at:
          type: string
          format: date-time
          description: When the 24 hours of NFR-PRV-1 end, counted from the first request (copied when resuming a failed one).
        completed_at:
          type: [string, 'null']
          format: date-time
        receipt:
          description: Set once the request has completed.
          oneOf:
            - $ref: '#/components/schemas/ErasureReceipt'
            - type: 'null'
        created_by_key_id:
          type: [string, 'null']
          description: The API key that started the request (`null` when a person started it in the console or the system started it, for example after a legal hold ended). Lets an operator list what a compromised key did ([J6]).
    ExportScope:
      type: string
      enum: [counterparty, identity]
    ExportStatus:
      type: string
      description: '`expired` once the download is no longer available (7 days after creation, or earlier when an erasure of the tenant expired it). `canceled`: a tenant erasure superseded it.'
      enum: [queued, running, completed, failed, canceled, expired]
    ExportCreate:
      description: A subject-access export. `scope` selects which other field is required.
      oneOf:
        - $ref: '#/components/schemas/ExportCreateCounterparty'
        - $ref: '#/components/schemas/ExportCreateIdentity'
      discriminator:
        propertyName: scope
        mapping:
          counterparty: '#/components/schemas/ExportCreateCounterparty'
          identity: '#/components/schemas/ExportCreateIdentity'
    ExportCreateCounterparty:
      type: object
      required: [tenant_id, scope, counterparty_address]
      properties:
        tenant_id: {$ref: '#/components/schemas/TenantId'}
        scope:
          type: string
          const: counterparty
        counterparty_address: {$ref: '#/components/schemas/EmailAddress'}
    ExportCreateIdentity:
      type: object
      required: [tenant_id, scope, identity_id]
      properties:
        tenant_id: {$ref: '#/components/schemas/TenantId'}
        scope:
          type: string
          const: identity
        identity_id: {$ref: '#/components/schemas/IdentityId'}
    Export:
      type: object
      required: [id, tenant_id, scope, status, size, created_at, expires_at, download_url]
      properties:
        id: {$ref: '#/components/schemas/ExportId'}
        tenant_id: {$ref: '#/components/schemas/TenantId'}
        scope: {$ref: '#/components/schemas/ExportScope'}
        identity_id:
          description: The identity, for identity scope.
          oneOf:
            - $ref: '#/components/schemas/IdentityId'
            - type: 'null'
        status: {$ref: '#/components/schemas/ExportStatus'}
        size:
          type: [integer, 'null']
          minimum: 0
          description: Bytes of the ZIP, once `completed`.
        download_url:
          type: [string, 'null']
          format: uri
          description: >-
            Set when `completed`: a signed link (`getSignedLink`) to a ZIP holding one `.eml` per message
            plus `messages.json`. Minted again on each `GET`, and valid for one hour from it, or until
            `expires_at` if that is sooner.
        expires_at:
          type: [string, 'null']
          format: date-time
          description: When the export and its ZIP are deleted (7 days after it completed). No link works after it.
        created_at:
          type: string
          format: date-time

    # ── Usage and audit ──────────────────────────────────────────────────────────────────────────

    UsageDay:
      type: object
      required: [day, inbound, outbound, sends, triage, search, agentic, assertions, http_signatures, ai_neurons, storage_bytes]
      properties:
        day:
          type: string
          format: date
          description: The UTC day.
        inbound:
          type: integer
          minimum: 0
        outbound:
          type: integer
          minimum: 0
        sends:
          type: integer
          minimum: 0
          description: Metered sends (one per recipient the transport accepted).
        triage:
          type: integer
          minimum: 0
          description: Stored triage analyses.
        search:
          type: integer
          minimum: 0
        agentic:
          type: integer
          minimum: 0
        assertions:
          type: integer
          minimum: 0
          description: Agent assertions minted (`POST …/assertions`). Counted only; not metered against a plan allowance.
        http_signatures:
          type: integer
          minimum: 0
          description: Web Bot Auth HTTP signatures made (`POST …/http-signatures`). Counted only; not metered against a plan allowance.
        ai_neurons:
          type: integer
          minimum: 0
          description: Workers AI usage in neurons.
        storage_bytes:
          type: integer
          minimum: 0
    DailyUsage:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: {$ref: '#/components/schemas/UsageDay'}
    BillingMode:
      type: string
      description: >-
        `metered` (the plan's allowances plus top-ups), `exempt` (no limits) or `disabled` (self-hosted
        without billing; only the daily caps in tenant policy apply).
      enum: [metered, exempt, disabled]
    UsageFeatureName:
      type: string
      description: A metered allowance.
      enum: [inboxes, sends, triage, custom_domains, storage_gb, seats]
    UsageFeature:
      type: object
      description: The state of one allowance in the current period.
      required: [feature, granted, used, remaining, unlimited, resets_at]
      properties:
        feature: {$ref: '#/components/schemas/UsageFeatureName'}
        granted:
          type: [integer, 'null']
          minimum: 0
          description: The allowance, top-ups included. `null` when unlimited.
        used:
          type: integer
          minimum: 0
          description: For `storage_gb`, measured, rounded up, and refreshed at least hourly.
        remaining:
          type: [integer, 'null']
          minimum: 0
          description: '`null` when unlimited.'
        unlimited:
          type: boolean
        resets_at:
          type: [string, 'null']
          format: date-time
          description: When a monthly allowance resets; `null` for counts.
    PlanState:
      type: object
      description: The workspace's current plan.
      required: [plan_id, status, current_period_end, cancel_at_period_end]
      properties:
        plan_id:
          type: string
          pattern: '^[a-z][a-z0-9_]{0,31}$'
          examples: [developer]
        status:
          type: string
          enum: [active, trialing, past_due, canceled, incomplete]
        current_period_end:
          type: string
          format: date-time
        cancel_at_period_end:
          type: boolean
    Plan:
      type: object
      description: A plan of the catalog (`PM_PLAN_CATALOG`). Stripe price IDs are never returned.
      required: [plan_id, name, price, currency, interval, included, topups, support]
      properties:
        plan_id:
          type: string
          pattern: '^[a-z][a-z0-9_]{0,31}$'
          examples: [free]
        name:
          type: string
          examples: [Free]
        price:
          type: number
          minimum: 0
          description: Display only.
        currency:
          type: string
          examples: [gbp]
        interval:
          type: string
          examples: [month]
        included:
          type: object
          description: The allowance of each feature; `null` means unlimited.
          required: [inboxes, sends, triage, custom_domains, storage_gb, seats]
          properties:
            inboxes:
              type: [integer, 'null']
              minimum: 0
            sends:
              type: [integer, 'null']
              minimum: 0
            triage:
              type: [integer, 'null']
              minimum: 0
            custom_domains:
              type: [integer, 'null']
              minimum: 0
            storage_gb:
              type: [integer, 'null']
              minimum: 0
            seats:
              type: [integer, 'null']
              minimum: 0
        topups:
          type: boolean
          description: Whether top-ups can be bought on this plan.
        support:
          type: string
          enum: [github_issues, email, priority_email]
    Topups:
      type: object
      description: Top-up units held, per feature that has top-ups.
      required: [inboxes, sends, triage]
      properties:
        inboxes:
          type: integer
          minimum: 0
        sends:
          type: integer
          minimum: 0
        triage:
          type: integer
          minimum: 0
    UsageSummary:
      type: object
      required: [billing, plan, features, topups, plans]
      properties:
        billing: {$ref: '#/components/schemas/BillingMode'}
        plan: {$ref: '#/components/schemas/PlanState'}
        features:
          type: array
          items: {$ref: '#/components/schemas/UsageFeature'}
        topups: {$ref: '#/components/schemas/Topups'}
        plans:
          type: array
          description: The plan catalog.
          items: {$ref: '#/components/schemas/Plan'}
    PlanCatalog:
      type: object
      required: [billing_enabled, data]
      properties:
        billing_enabled:
          type: boolean
          description: '`false` on a deployment without billing, with an empty `data`.'
        data:
          type: array
          items: {$ref: '#/components/schemas/Plan'}
    BillingAccount:
      type: object
      description: A workspace's billing account.
      required: [tenant_id, mode, plan, topups]
      properties:
        tenant_id: {$ref: '#/components/schemas/TenantId'}
        mode: {$ref: '#/components/schemas/BillingMode'}
        plan: {$ref: '#/components/schemas/PlanState'}
        topups: {$ref: '#/components/schemas/Topups'}
    BillingAccountUpdateRequest:
      type: object
      minProperties: 1
      properties:
        mode: {$ref: '#/components/schemas/BillingMode'}
        plan_id:
          type: string
          pattern: '^[a-z][a-z0-9_]{0,31}$'
          description: >-
            A complimentary plan from the catalog. Only for workspaces without a Stripe subscription
            (`409 plan_managed_by_stripe` otherwise).
    AuditEvent:
      type: object
      required: [id, tenant_id, actor_key_id, actor_user_id, action, target_type, target_id, details, request_id, created_at]
      properties:
        id: {$ref: '#/components/schemas/AuditEventId'}
        tenant_id:
          oneOf:
            - $ref: '#/components/schemas/TenantId'
            - type: 'null'
        actor_key_id:
          description: The key that acted, or `null` for a console user or the system (for example retention purges).
          oneOf:
            - $ref: '#/components/schemas/KeyId'
            - type: 'null'
        actor_user_id:
          description: The console user who acted, or `null` for an API key or the system.
          oneOf:
            - $ref: '#/components/schemas/UserId'
            - type: 'null'
        action:
          type: string
          examples: [key.create, quarantine.release]
        target_type:
          type: [string, 'null']
        target_id:
          type: [string, 'null']
        details:
          type: [object, 'null']
          description: Never message content or clear-text addresses.
        request_id:
          oneOf:
            - $ref: '#/components/schemas/RequestId'
            - type: 'null'
        created_at:
          type: string
          format: date-time

    # ── Deliverability metrics ───────────────────────────────────────────────────────────────────

    MetricEventType:
      type: string
      enum: [received, quarantined, sent, delivered, deferred, bounced, complained, rejected, failed, uncertain, suppressed, canceled]
    RateWindow:
      type: object
      required: [id, metric, action, domain_id, window, comparison, threshold, threshold_source, min_outcomes, outcomes, events, denominator, rate, evaluated, tripped, headroom, summary]
      properties:
        id:
          type: string
          enum: [identity_complaints, identity_bounces, tenant_complaints_7d, tenant_bounces_7d, domain_complaints_7d, domain_bounces_7d, burst_bounces_1h, burst_complaints_24h, alert_bounces_1h, alert_complaints_24h]
        metric:
          type: string
          enum: [complaint_rate, bounce_rate]
        action:
          type: string
          enum: [pause_identity, pause_tenant, pause_domain, operator_alert]
        domain_id:
          description: >-
            The domain of a domain or burst window. `null` for identity and tenant windows, and, for an
            identity key, on the burst windows of a domain none of its addresses use.
          oneOf:
            - $ref: '#/components/schemas/DomainId'
            - type: 'null'
        window:
          type: object
          required: [kind, size, from, to]
          properties:
            kind:
              type: string
              enum: [last_outcomes, utc_days, utc_hours]
            size:
              type: [integer, 'null']
              description: Outcomes, for `last_outcomes`.
            from:
              type: [string, 'null']
              format: date-time
            to:
              type: [string, 'null']
              format: date-time
        comparison:
          type: string
          enum: [gt, ge]
        threshold:
          type: number
          minimum: 0
          maximum: 1
          description: Compared in parts per million.
        threshold_source:
          type: string
          examples: [policy.abuse.complaint_rate_pause, fixed]
        min_outcomes:
          type: [integer, 'null']
          minimum: 0
        outcomes:
          type: integer
          minimum: 0
        events:
          type: integer
          minimum: 0
        denominator:
          type: integer
          minimum: 0
        rate:
          type: number
          minimum: 0
          description: '`events / denominator`, rounded to 6 decimal places.'
        evaluated:
          type: boolean
        tripped:
          type: boolean
        headroom:
          type: [integer, 'null']
          minimum: 0
          description: >-
            The fewest further complaints or bounces that would trip the rule at `evaluated_at`; fewer
            further outcomes of any kinds cannot. It can fall between reads (a delivery below the window's
            minimum, an hour or day rolling out), so read it just before a batch. `null` when no number could
            trip it: a threshold of 1 with `gt`, or with `ge` once the window holds an outcome not of its kind.
        summary:
          type: string
    SendingStop:
      type: object
      required: [scope, id, reason, paused_at]
      properties:
        scope:
          type: string
          enum: [identity, tenant, domain]
        id:
          type: string
        reason:
          type: string
          examples: [abuse_threshold, abuse_burst, manual, tenant_suspended]
        paused_at:
          type: [string, 'null']
          format: date-time
    Rates:
      type: object
      required: [scope, tenant_id, identity_id, domain_id, evaluated_at, exempt, sending, windows]
      properties:
        scope:
          type: string
          enum: [identity, tenant, domain]
        tenant_id: {$ref: '#/components/schemas/TenantId'}
        identity_id:
          oneOf:
            - $ref: '#/components/schemas/IdentityId'
            - type: 'null'
        domain_id:
          oneOf:
            - $ref: '#/components/schemas/DomainId'
            - type: 'null'
        evaluated_at:
          type: string
          format: date-time
        exempt:
          type: boolean
        sending:
          type: object
          required: [paused, stops]
          properties:
            paused:
              type: boolean
            stops:
              type: array
              items: {$ref: '#/components/schemas/SendingStop'}
        windows:
          type: array
          items: {$ref: '#/components/schemas/RateWindow'}
    EventCounts:
      type: object
      required: [scope, tenant_id, identity_id, domain_id, bucket, from, to, types, identities, partial, failed_identities, data, totals]
      properties:
        scope:
          type: string
          enum: [identity, tenant, domain]
        tenant_id: {$ref: '#/components/schemas/TenantId'}
        identity_id:
          oneOf:
            - $ref: '#/components/schemas/IdentityId'
            - type: 'null'
        domain_id:
          oneOf:
            - $ref: '#/components/schemas/DomainId'
            - type: 'null'
        bucket:
          type: string
          enum: [hour, day]
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        types:
          type: array
          items: {$ref: '#/components/schemas/MetricEventType'}
        identities:
          type: integer
          minimum: 0
        partial:
          type: boolean
        failed_identities:
          type: array
          items: {$ref: '#/components/schemas/IdentityId'}
        data:
          type: array
          items:
            type: object
            required: [start, counts]
            properties:
              start:
                type: string
                format: date-time
              counts:
                type: object
                additionalProperties:
                  type: integer
                  minimum: 0
        totals:
          type: object
          additionalProperties:
            type: integer
            minimum: 0

    # ── Members ──────────────────────────────────────────────────────────────────────────────────

    MemberRole:
      type: string
      description: The owner is set at workspace creation or by an ownership transfer in the console.
      enum: [owner, admin, member, viewer]
    InvitationRole:
      type: string
      enum: [admin, member, viewer]
    Member:
      type: object
      required: [user_id, email, name, role, last_login_at, created_at]
      properties:
        user_id: {$ref: '#/components/schemas/UserId'}
        email: {$ref: '#/components/schemas/EmailAddress'}
        name:
          type: [string, 'null']
        role: {$ref: '#/components/schemas/MemberRole'}
        last_login_at:
          type: [string, 'null']
          format: date-time
          description: The person's last console sign-in, from `users.last_login_at`; `null` before the first.
        created_at:
          type: string
          format: date-time
    Invitation:
      type: object
      description: A pending invitation. It uses a seat until it is accepted, revoked or expires.
      required: [id, email, role, invited_by, expires_at]
      properties:
        id: {$ref: '#/components/schemas/InvitationId'}
        email: {$ref: '#/components/schemas/EmailAddress'}
        role: {$ref: '#/components/schemas/InvitationRole'}
        invited_by:
          description: The console user who sent it, or `null` when an API key created it.
          oneOf:
            - $ref: '#/components/schemas/UserId'
            - type: 'null'
        expires_at:
          type: string
          format: date-time
    InvitationCreateRequest:
      type: object
      required: [email, role]
      properties:
        email: {$ref: '#/components/schemas/EmailAddress'}
        role: {$ref: '#/components/schemas/InvitationRole'}
    MemberList:
      type: object
      required: [data, invitations, seats]
      properties:
        data:
          type: array
          items: {$ref: '#/components/schemas/Member'}
        invitations:
          type: array
          description: Pending invitations.
          items: {$ref: '#/components/schemas/Invitation'}
        seats:
          type: object
          description: Members plus pending invitations count as used seats.
          required: [granted, used]
          properties:
            granted:
              type: [integer, 'null']
              minimum: 0
              description: '`null` when unlimited.'
            used:
              type: integer
              minimum: 0

    # ── Platform operations ──────────────────────────────────────────────────────────────────────

    SigningKeyPurpose:
      type: string
      description: >-
        What a deployment signing key signs: `thread` (thread tokens), `link` (download links, console
        sign-in, invitation and session tokens, OAuth state hashes), `cursor` (search cursors) or
        `web_bot_auth` (Web Bot Auth HTTP signatures and the key directory).
      enum: [thread, link, cursor, web_bot_auth]
    SigningKeyRotation:
      type: object
      description: The result of a signing-key rotation. Key material is never returned.
      required: [purpose, kid, created_at, previous]
      properties:
        purpose: {$ref: '#/components/schemas/SigningKeyPurpose'}
        kid:
          type: string
          description: >-
            The new current key's ID: one character for `thread`, `link` and `cursor`; the 43-character
            JWK thumbprint (base64url) for `web_bot_auth`.
          examples: ['4', poqkLGiymh_W0uP6PZFw-dvez3QJT5SolqXBCW38r0U]
        created_at:
          type: string
          format: date-time
        previous:
          type: [object, 'null']
          description: >-
            The key it replaced, and until when it keeps verifying (90 days for `thread`, 7 days for `link`
            and `web_bot_auth`, 24 hours for `cursor`; the rotation time with `revoke_previous=true`). A
            previous `web_bot_auth` key stays in the key directory until then. `null` when the purpose had no
            key yet: the rotation then creates the first one.
          required: [kid, verify_until, revoked]
          properties:
            kid:
              type: string
              examples: ['3']
            verify_until:
              type: string
              format: date-time
            revoked:
              type: boolean
              description: '`true` when the request set `revoke_previous=true` and the previous key was deleted.'
    DlqQueue:
      type: string
      description: The source queue of a dead-letter item.
      enum: [pm-inbound, pm-outbound, pm-delivery-events, pm-webhooks, pm-index, pm-screen]
    DlqItem:
      type: object
      description: >-
        A dead-lettered queue message. The stored body is not returned: it is a pointer, and inbound
        pointers carry envelope addresses. Kept for 14 days.
      required: [id, queue, kind, tenant_id, first_seen_at, redriven_at, redrive_count]
      properties:
        id: {$ref: '#/components/schemas/DlqItemId'}
        queue: {$ref: '#/components/schemas/DlqQueue'}
        kind:
          type: [string, 'null']
          description: The body's `kind`, if any.
          examples: [message]
        tenant_id:
          description: The tenant the body names, if any.
          oneOf:
            - $ref: '#/components/schemas/TenantId'
            - type: 'null'
        first_seen_at:
          type: string
          format: date-time
        redriven_at:
          type: [string, 'null']
          format: date-time
        redrive_count:
          type: integer
          minimum: 0
    DlqItemPage:
      type: object
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items: {$ref: '#/components/schemas/DlqItem'}
        next_cursor:
          type: [string, 'null']
    JobKind:
      type: string
      description: >-
        `reparse` (re-parse messages from raw MIME and re-emit their events with `reprocessed: true`),
        `reembed` (re-chunk and re-embed into Vectorize), `reindex` (rebuild the keyword index) or
        `restore_reconcile` (after a mailbox restore) or `event_log_rebuild` (rebuild a tenant's event log in a
        new epoch) can be started with `createJob`. `getJob` also returns the jobs the system runs itself:
        `retention`, `backup` and `domain_remove`.
      enum: [reparse, reembed, reindex, restore_reconcile, event_log_rebuild, retention, backup, domain_remove]
    JobStatus:
      type: string
      enum: [queued, running, completed, failed, canceled]
    JobCreateRequest:
      type: object
      required: [kind, tenant_id]
      properties:
        kind:
          type: string
          description: '`restore_reconcile` needs `after` and `identity_ids`. `event_log_rebuild` takes `tenant_id` only.'
          enum: [reparse, reembed, reindex, restore_reconcile, event_log_rebuild]
        tenant_id: {$ref: '#/components/schemas/TenantId'}
        identity_ids:
          type: [array, 'null']
          description: Only these identities. `null` or omitted means every identity of the tenant.
          uniqueItems: true
          items: {$ref: '#/components/schemas/IdentityId'}
        after:
          type: [string, 'null']
          format: date-time
          description: Only messages at or after this time.
        before:
          type: [string, 'null']
          format: date-time
          description: Only messages before this time.
    Job:
      type: object
      required: [id, kind, tenant_id, status, created_at, completed_at, result]
      properties:
        id: {$ref: '#/components/schemas/JobId'}
        kind: {$ref: '#/components/schemas/JobKind'}
        tenant_id:
          description: The tenant; `null` for a deployment-wide job (`backup`, the global `retention` job).
          oneOf:
            - $ref: '#/components/schemas/TenantId'
            - type: 'null'
        status: {$ref: '#/components/schemas/JobStatus'}
        created_at:
          type: string
          format: date-time
        completed_at:
          type: [string, 'null']
          format: date-time
        result:
          type: [object, 'null']
          description: >-
            Counts, once the job ends (for `reparse`, including the messages skipped past `raw_days`); for
            a `failed` job also `failed_step` and `error` (strings).
          additionalProperties:
            type: [integer, string]
        created_by_key_id:
          type: [string, 'null']
          description: The API key that started the job, or `null` for a job the system started itself (for example the `reembed` job that the cron creates during an embedding-model change).
    SwitchName:
      type: string
      description: '`agent_signup` (default `on`) stops new agent sign-ups and their mail when `off`; the containment rule `agent_signup_off` turns it off automatically.'
      enum: [read_only, free_sending, emergency_prune, agent_signup]
    SwitchUpdate:
      type: object
      required: [name, state, reason]
      properties:
        name: {$ref: '#/components/schemas/SwitchName'}
        state:
          type: string
          enum: ['on', 'off']
        reason:
          type: string
          minLength: 1
          maxLength: 200
    Switch:
      type: object
      required: [name, state, set_by, reason, set_at]
      properties:
        name: {$ref: '#/components/schemas/SwitchName'}
        state:
          type: string
          enum: ['on', 'off']
        set_by:
          type: string
          description: '`auto` when an automatic containment rule set it, `platform` when a platform key did.'
          enum: [auto, platform]
        reason:
          type: string
        set_at:
          type: string
          format: date-time
    PlatformStatus:
      type: object
      required: [frozen, frozen_since, switches, alert_email, firing, master_key, capacity, agent_signup]
      properties:
        frozen:
          type: boolean
          description: '`true` while `PM_FREEZE = "on"` (a restore is in progress).'
        frozen_since:
          type: [string, 'null']
          format: date-time
        switches:
          type: object
          required: [read_only, free_sending, emergency_prune, agent_signup]
          properties:
            read_only:
              type: string
              enum: ['on', 'off']
            free_sending:
              type: string
              enum: ['on', 'off']
            emergency_prune:
              type: string
              enum: ['on', 'off']
            agent_signup:
              type: string
              enum: ['on', 'off']
        alert_email:
          type: string
          description: '`missing` when neither `PM_ALERT_EMAIL` nor a `mailto:` `PM_SECURITY_CONTACT` is set.'
          enum: [configured, missing]
        firing:
          type: array
          items:
            type: object
            required: [alert, severity, fired_at]
            properties:
              alert:
                type: string
                description: The alert key, for example `dlq:pm-inbound`.
              severity:
                type: string
                enum: [page, ticket]
              fired_at:
                type: string
                format: date-time
        master_key:
          type: object
          required: [active_slot, slots, remaining, activated_at, resealed_at]
          properties:
            active_slot:
              type: string
              enum: [a, b]
            slots:
              type: array
              items:
                type: object
                required: [slot, present, kid]
                properties:
                  slot:
                    type: string
                    enum: [a, b]
                  present:
                    type: boolean
                  kid:
                    type: [string, 'null']
                    description: First 8 bytes of SHA-256 of the key, lower-case hex.
            remaining:
              type: integer
              minimum: 0
              description: Sealed values whose key ID is not the active key's; 0 once a rotation's re-seal is done.
            activated_at:
              type: [string, 'null']
              format: date-time
              description: When the Worker first saw the active key.
            resealed_at:
              type: [string, 'null']
              format: date-time
              description: When `remaining` first reached 0 under the active key; a next rotation is allowed without `--discard-previous` 30 days later.
        capacity:
          type: object
          required: [d1_bytes, d1_pct, vectors, vectors_pct, tenants, namespaces_pct, measured_at]
          properties:
            d1_bytes:
              type: [integer, 'null']
              minimum: 0
            d1_pct:
              type: [number, 'null']
            vectors:
              type: [integer, 'null']
              minimum: 0
            vectors_pct:
              type: [number, 'null']
            tenants:
              type: integer
              minimum: 0
              description: Tenants that are not erased (one Vectorize namespace each).
            namespaces_pct:
              type: number
            measured_at:
              type: [string, 'null']
              format: date-time
        agent_signup:
          type: object
          description: >-
            Agent self-sign-up: whether `PM_AGENT_SIGNUP` is `on` (`configured`), whether sign-ups are accepted
            now (`active`), why not, the switch, today's (UTC) sign-ups against `PM_AGENT_SIGNUP_DAILY_CAP`, and
            the last 24 hours' outcomes of sign-up mail.
          required: [configured, active, reason]
          properties:
            configured:
              type: boolean
            active:
              type: boolean
            reason:
              type: [string, 'null']
              enum: [signup_not_open, billing_off, console_off, switch_off, null]
            switch:
              type: string
              enum: ['on', 'off']
            signups_today:
              type: integer
              minimum: 0
            daily_cap:
              type: integer
              minimum: 1
              maximum: 10000
            outcomes_24h:
              type: object
              properties:
                outcomes:
                  type: integer
                  minimum: 0
                bounced:
                  type: integer
                  minimum: 0
                complained:
                  type: integer
                  minimum: 0
    MailboxRestoreRequest:
      description: Exactly one of `at` and `bookmark`.
      oneOf:
        - type: object
          required: [at]
          properties:
            at:
              type: string
              format: date-time
              description: The point in time, within the last 30 days.
          additionalProperties: false
        - type: object
          required: [bookmark]
          properties:
            bookmark:
              type: string
              minLength: 1
              description: An undo bookmark returned by an earlier restore.
          additionalProperties: false
    MailboxRestoreResult:
      type: object
      required: [identity_id, restored_to, undo_bookmark]
      properties:
        identity_id: {$ref: '#/components/schemas/IdentityId'}
        restored_to:
          type: [string, 'null']
          format: date-time
          description: The `at` asked for, or `null` when a bookmark was restored.
        undo_bookmark:
          type: string
          description: Restores the state this call replaced.
    WaitlistInviteRequest:
      type: object
      required: [count]
      properties:
        count:
          type: integer
          minimum: 1
          maximum: 500
          description: How many entries to invite, oldest confirmed first.
          examples: [50]
        plan:
          type: [string, 'null']
          description: Invite only entries whose plan of interest is this plan. `null` or omitted means any plan.
          examples: [team]
    WaitlistInviteResult:
      type: object
      required: [invited, waiting]
      properties:
        invited:
          type: integer
          minimum: 0
          description: Entries invited by this request.
        waiting:
          type: integer
          minimum: 0
          description: Confirmed entries still not invited.

    # ── Provider hooks ───────────────────────────────────────────────────────────────────────────

    SnsMessage:
      type: object
      description: >-
        An Amazon SNS HTTP(S) message, as SNS sends it. Only `SubscriptionConfirmation` and `Notification`
        messages for the endpoint's own topic are acted on: `PM_SES_SNS_TOPIC_ARN` for `/hooks/ses`,
        `PM_SES_INBOUND_TOPIC_ARN` for `/hooks/ses/inbound`.
      required: [Type, MessageId, TopicArn, Message, Timestamp, SignatureVersion, Signature, SigningCertURL]
      properties:
        Type:
          type: string
          examples: [Notification, SubscriptionConfirmation]
        MessageId:
          type: string
        TopicArn:
          type: string
        Subject:
          type: string
        Message:
          type: string
          description: >-
            For a notification, the SES event (`/hooks/ses`) or the SES receipt notification
            (`/hooks/ses/inbound`) as a JSON string.
        Timestamp:
          type: string
          format: date-time
        SignatureVersion:
          type: string
          description: Must be `2` (SHA256withRSA). Version `1` (SHA1withRSA) is refused with `403 invalid_signature`.
          enum: ['2']
        Signature:
          type: string
        SigningCertURL:
          type: string
          format: uri
          description: Must be `https` on the host `sns.{PM_SES_REGION}.amazonaws.com`.
        SubscribeURL:
          type: string
          format: uri
          description: '`SubscriptionConfirmation` only.'
        Token:
          type: string
          description: '`SubscriptionConfirmation` only.'
        UnsubscribeURL:
          type: string
          format: uri
      additionalProperties: true

    # ── Well-known ───────────────────────────────────────────────────────────────────────────────

    Jwks:
      type: object
      description: A JSON Web Key Set (RFC 7517).
      required: [keys]
      properties:
        keys:
          type: array
          items: {$ref: '#/components/schemas/Jwk'}
    Jwk:
      type: object
      description: An Ed25519 public key (RFC 8037).
      required: [kty, crv, x, kid, alg]
      properties:
        kty:
          type: string
          const: OKP
        crv:
          type: string
          const: Ed25519
        x:
          type: string
          description: The public key, base64url-encoded.
        kid:
          type: string
        alg:
          type: string
          const: EdDSA
        use:
          type: string
          const: sig

    # ── Identity keys and signatures ─────────────────────────────────────────────────────────────

    IdentityKeyKid:
      type: string
      description: >-
        An identity key's ID: the base64url RFC 7638 thumbprint of its public JWK (RFC 8037, appendix A.3).
        A deleted identity's key IDs are tombstoned and never published again.
      pattern: '^[A-Za-z0-9_-]{43}$'
      examples: [kPrK_qmxVWaYVA9wwBF6Iuo3vVzz7TxHCTwXBygrS4k]
    IdentityKeyStatus:
      type: string
      description: >-
        `active` (signs and is published; at most one per identity), `retiring` (published, does not sign,
        until `verify_until`) or `retired` (not published; kept until the identity is deleted, so its
        thumbprint is never reused).
      enum: [active, retiring, retired]
    IdentityKey:
      type: object
      description: >-
        One Ed25519 signing key of an identity. The private key is sealed under `PM_MASTER_KEY`, never
        leaves the Worker and is never returned.
      required: [kid, identity_id, status, alg, public_jwk, created_at, verify_until, retired_at]
      properties:
        kid: {$ref: '#/components/schemas/IdentityKeyKid'}
        identity_id: {$ref: '#/components/schemas/IdentityId'}
        status: {$ref: '#/components/schemas/IdentityKeyStatus'}
        alg:
          type: string
          const: EdDSA
        public_jwk:
          description: The public key as published in the identity's JWK Set.
          $ref: '#/components/schemas/Jwk'
        created_at:
          type: string
          format: date-time
        verify_until:
          type: [string, 'null']
          format: date-time
          description: >-
            Set when the key becomes `retiring`: the rotation time plus `PM_IDENTITY_KEY_OVERLAP_DAYS`
            (default 7 days). The key stays in the JWK Set until then, unless it is revoked. `null` while the
            key is `active`.
        retired_at:
          type: [string, 'null']
          format: date-time
          description: When the key became `retired`; `null` before that.
      examples:
        - kid: kPrK_qmxVWaYVA9wwBF6Iuo3vVzz7TxHCTwXBygrS4k
          identity_id: idn_01J9Z3K8V4QW7X2M5N6P8R0T1Y
          status: retiring
          alg: EdDSA
          public_jwk:
            kty: OKP
            crv: Ed25519
            x: 11qYAYKxCrfVS_7TyWQHOg7hcvPapiMlrwIaaPcHURo
            kid: kPrK_qmxVWaYVA9wwBF6Iuo3vVzz7TxHCTwXBygrS4k
            alg: EdDSA
            use: sig
          created_at: '2026-10-02T09:00:00Z'
          verify_until: '2026-10-16T09:00:00Z'
          retired_at: null
    IdentityKeyPage:
      type: object
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items: {$ref: '#/components/schemas/IdentityKey'}
        next_cursor:
          type: [string, 'null']
    IdentityKeyRotation:
      type: object
      description: The result of rotating an identity key.
      required: [key, previous]
      properties:
        key:
          description: The new key, `active`.
          $ref: '#/components/schemas/IdentityKey'
        previous:
          description: >-
            The key that was active, now `retiring` with `verify_until` set; `null` when the identity had
            no active key and the rotation created the first one.
          oneOf:
            - $ref: '#/components/schemas/IdentityKey'
            - type: 'null'
    AssertionRequest:
      type: object
      description: A request for an agent assertion.
      required: [audience]
      properties:
        audience:
          type: string
          minLength: 1
          maxLength: 256
          pattern: '^[\x20-\x7E]{1,256}$'
          description: >-
            The verifier's expected audience, a URL or an identifier: 1–256 characters of printable ASCII.
            Becomes the `aud` claim ([O4]).
          examples: ['https://portal.supplier.example']
        expires_in:
          type: integer
          minimum: 60
          maximum: 600
          default: 300
          description: Seconds until the token expires ([O5]).
        nonce:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[\x20-\x7E]{1,128}$'
          description: Copied into the `nonce` claim, for the verifier's own challenge. 1–128 characters of printable ASCII.
        ext:
          type: object
          description: >-
            Extra claims placed under the `ext` claim: at most 2 KB as JSON, and no member may use a
            registered or Pylota claim name, so a claim the service sets is never overwritten ([O6]).
          propertyNames:
            not:
              enum: [iss, sub, aud, iat, nbf, exp, jti, email, email_verified, unverified, ai_agent, nonce, ext]
          examples:
            - booking_ref: BK-2291
    AssertionResponse:
      type: object
      description: A minted agent assertion. Neither the token nor its claims are stored.
      required: [assertion, kid, expires_at, jwks_uri]
      properties:
        assertion:
          type: string
          description: >-
            The token, a compact JWS (RFC 7519) with header `{"alg":"EdDSA","typ":"agent-assertion+jwt","kid":…}`
            and the claims `iss`, `sub`, `aud`, `iat`, `nbf`, `exp`, `jti`, `email`, `email_verified`,
            `unverified` (`name`, `org`, `accountable_human`: set by the workspace, not checked), `ai_agent`,
            and `nonce` and `ext` when given.
          pattern: '^[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$'
        kid: {$ref: '#/components/schemas/IdentityKeyKid'}
        expires_at:
          type: string
          format: date-time
          description: The `exp` claim.
        jwks_uri:
          type: string
          format: uri
          description: The identity's JWK Set, `https://{PM_API_HOST}/.well-known/jwks/{identity_id}.json`.
    HttpSignatureRequest:
      type: object
      description: A request for Web Bot Auth signature headers.
      required: [url]
      properties:
        url:
          type: string
          format: uri
          maxLength: 2048
          pattern: '^https://'
          description: >-
            The URL the agent will request: `https` only, at most 2,048 characters. An internationalised host
            is converted to its A-label for `@authority` ([O10]).
          examples: ['https://www.brightwell.example/fleet/availability?from=2026-10-12']
        method:
          type: string
          pattern: '^[!#$%&''*+.^_`|~0-9A-Z-]+$'
          description: >-
            The request method, an upper-case token. Signed only if `@method` is in `components`, and then
            required (`400 invalid_request` without it).
          examples: [GET]
        expires_in:
          type: integer
          minimum: 30
          maximum: 300
          default: 60
          description: Seconds until the signature expires. Too short an expiry fails in transit ([O11]).
        components:
          type: array
          uniqueItems: true
          description: >-
            The components to sign. `@authority`, `signature-agent` and `from` are always signed; `@method`,
            `@path` and `@query` may be added. Any other component, or one whose value is not ASCII, is
            refused with `400 invalid_request` ([O10]).
          items:
            type: string
            enum: ['@authority', signature-agent, from, '@method', '@path', '@query']
          default: ['@authority', signature-agent, from]
    HttpSignatureResponse:
      type: object
      description: The headers to attach to the request. Nothing is stored.
      required: [headers, expires_at]
      properties:
        headers:
          type: object
          required: [Signature-Agent, From, Signature-Input, Signature]
          properties:
            Signature-Agent:
              type: string
              description: The deployment's origin as a structured-field string, in double quotes.
              examples: ['"https://mail.example.com"']
            From:
              description: The identity's vouched address, as for the assertion's `email` claim.
              $ref: '#/components/schemas/EmailAddress'
            Signature-Input:
              type: string
              description: >-
                RFC 9421 signature parameters: the components, `created`, `expires`, `keyid` (the deployment
                key's JWK thumbprint), `alg="ed25519"`, a base64 `nonce` of 64 random bytes and
                `tag="web-bot-auth"`.
            Signature:
              type: string
              description: The RFC 9421 signature, made with the deployment's active `web_bot_auth` key.
        expires_at:
          type: string
          format: date-time
          description: When the signature expires (`expires` in `Signature-Input`).
    HttpMessageSignaturesDirectory:
      type: object
      description: >-
        The Web Bot Auth key directory: a JWK Set (RFC 7517) of the deployment's `active` and `retiring`
        Ed25519 keys, at most three. A verifier identifies a key by its RFC 8037 JWK thumbprint, which is the
        `keyid` of the signatures made with it.
      required: [keys]
      properties:
        keys:
          type: array
          minItems: 1
          maxItems: 3
          items: {$ref: '#/components/schemas/DirectoryJwk'}
    DirectoryJwk:
      type: object
      description: An Ed25519 public key in the Web Bot Auth key directory.
      required: [kty, crv, x]
      properties:
        kty:
          type: string
          const: OKP
        crv:
          type: string
          const: Ed25519
        x:
          type: string
          description: The public key, base64url-encoded without padding.

