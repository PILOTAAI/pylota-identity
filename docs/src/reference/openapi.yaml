components:

  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      bearerFormat: pmk_live_<lookup12>_<secret> | pmk_test_<lookup12>_<secret>
      description: >-
        An API key sent as a bearer token: `Authorization: Bearer pmk_live_…`. Keys have a level
        (`platform`, `tenant` or `identity`) and a list of permissions; scope always comes from the key,
        never from the request body (FR-KEY-3). Only a keyed hash of the secret is stored.
    streamToken:
      type: apiKey
      in: header
      name: Sec-WebSocket-Protocol
      description: >-
        Only for `GET /events/stream`: the subprotocol list `pylota-mail.events.v1, pylota-mail.token.{token}`
        with a token from `createStreamToken`. Single use, 60 seconds. Never echoed.

  parameters:

    Limit:
      name: limit
      in: query
      description: Page size.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    Cursor:
      name: cursor
      in: query
      description: The `next_cursor` of the previous page. Opaque; expires after 24 hours (`410 cursor_expired`).
      schema:
        type: string
        minLength: 1
    After:
      name: after
      in: query
      description: Only items at or after this time (RFC 3339).
      schema:
        type: string
        format: date-time
    Before:
      name: before
      in: query
      description: Only items before this time (RFC 3339).
      schema:
        type: string
        format: date-time
    Include:
      name: include
      in: query
      description: >-
        Comma-separated extras for each message: `quoted` adds the full plain `text`, `html` adds the
        sanitised `html`, `headers` adds the original `headers`.
      style: form
      explode: false
      schema:
        type: array
        uniqueItems: true
        items:
          type: string
          enum: [quoted, html, headers]
      example: [html, headers]
    TenantIdQuery:
      name: tenant_id
      in: query
      description: >-
        Restrict to one tenant. A platform key may name any tenant; a partner key, one of its own tenants;
        a tenant or identity key, only its own (a list is always restricted to it). A tenant outside the
        key's scope returns `404 tenant_not_found`, never an empty page, as for a missing tenant.
      schema: {$ref: '#/components/schemas/TenantId'}
    IdempotencyKeySend:
      name: Idempotency-Key
      in: header
      required: false
      description: >-
        Required on every real send, reply, reply-all, forward, calendar-reply and draft send; optional on a
        dry run (`dry_run=true`), where it is never recorded. 1–255 printable ASCII characters, unique per message. Kept for 30 days,
        scoped to the identity. Reuse the same key on every retry of the same request. Missing:
        `400 idempotency_key_required`; malformed: `400 invalid_idempotency_key`.
      schema:
        type: string
        minLength: 1
        maxLength: 255
        pattern: '^[\x20-\x7E]{1,255}$'
      example: bk-2291-confirm
    DryRun:
      name: dry_run
      in: query
      required: false
      description: >-
        `true` runs every check (permissions, policy, recipients, suppressions and lists, size) without
        sending or storing anything, taking quota or locking the thread, and returns `200` with a
        `DryRunResult`. `Idempotency-Key` is optional and never recorded.
      schema:
        type: boolean
        default: false
    IdempotencyKeyOptional:
      name: Idempotency-Key
      in: header
      required: false
      description: >-
        Optional. 1–255 printable ASCII characters. Kept for 30 days, scoped to the calling API key and the
        tenant (or, for a request that names no tenant, to the partner for a partner key and to the platform
        for a platform key), so another key never receives this key's replay. The same key with the same
        request returns the original response with `Idempotent-Replayed: true`; with a different request,
        `409 idempotency_conflict`. A response that carried a one-time secret (`createKey`, `rotateKey`,
        `createWebhook`, `createTenantWebhook`, `rotateWebhookSecret`) is replayed without it and with
        `"secret_replayed": false`.
      schema:
        type: string
        minLength: 1
        maxLength: 255
        pattern: '^[\x20-\x7E]{1,255}$'
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: The draft's `etag`; a stale value fails with `409 draft_revision_mismatch`. `*` matches any draft.
      schema:
        type: string
        maxLength: 64
    EventAfter:
      name: after
      in: query
      description: A cursor from a previous page, `earliest` (the oldest retained event comes next) or `latest`. Not with `since`.
      schema:
        type: string
        minLength: 1
        maxLength: 512
    EventSince:
      name: since
      in: query
      description: Start with the first event appended at or after this time. Not with `after`; not in the future.
      schema:
        type: string
        format: date-time
    EventTypes:
      name: types
      in: query
      description: Type patterns, comma-separated, at most 50 (`*`, `message.*`, `message.received`).
      style: form
      explode: false
      schema:
        type: array
        maxItems: 50
        items:
          type: string
          maxLength: 64
          pattern: '^(\*|[a-z0-9_]+(\.[a-z0-9_]+)*(\.\*)?)$'
    EventIdentityFilter:
      name: identity_id
      in: query
      description: Identity IDs, comma-separated, at most 100. An identity key may name only its own.
      style: form
      explode: false
      schema:
        type: array
        maxItems: 100
        items: {$ref: '#/components/schemas/IdentityId'}
    EventLimit:
      name: limit
      in: query
      description: Page size.
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 100
    EventWait:
      name: wait
      in: query
      description: Seconds to wait for a matching event when none is newer.
      schema:
        type: integer
        minimum: 0
        maximum: 60
        default: 0
    ScreeningFrom:
      name: from
      in: query
      description: Start of the window (RFC 3339). Default 30 days before `to`.
      schema:
        type: string
        format: date-time
    ScreeningTo:
      name: to
      in: query
      description: End of the window (RFC 3339). Default now. At most 92 days after `from`.
      schema:
        type: string
        format: date-time

    TenantIdPath:
      name: tenant_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/TenantId'}
    AccountIdPath:
      name: account_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/ServiceAccountId'}
    DraftIdPath:
      name: draft_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/DraftId'}
    UploadIdPath:
      name: upload_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/UploadId'}
    EventConsumerIdPath:
      name: consumer_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/EventConsumerId'}
    PartnerIdPath:
      name: partner_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/PartnerId'}
    IdentityIdPath:
      name: identity_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/IdentityId'}
    AddressIdPath:
      name: address_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/AddressId'}
    DomainIdPath:
      name: domain_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/DomainId'}
    ThreadIdPath:
      name: thread_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/ThreadId'}
    MessageIdPath:
      name: message_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/MessageId'}
    AttachmentIdPath:
      name: attachment_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/AttachmentId'}
    WebhookIdPath:
      name: webhook_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/WebhookId'}
    KeyIdPath:
      name: key_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/KeyId'}
    ErasureIdPath:
      name: erasure_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/ErasureRequestId'}
    ExportIdPath:
      name: export_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/ExportId'}
    InvitationIdPath:
      name: invitation_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/InvitationId'}
    UserIdPath:
      name: user_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/UserId'}
    DlqIdPath:
      name: dlq_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/DlqItemId'}
    JobIdPath:
      name: job_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/JobId'}
    IdentityKeyKidPath:
      name: kid
      in: path
      required: true
      description: The identity key's ID, its RFC 7638 JWK thumbprint (base64url, 43 characters).
      schema: {$ref: '#/components/schemas/IdentityKeyKid'}
    SigningKeyPurposePath:
      name: purpose
      in: path
      required: true
      description: '`thread` (thread tokens), `link` (download links, console sign-in, invitation and session tokens, OAuth state hashes), `cursor` (search cursors) or `web_bot_auth` (Web Bot Auth HTTP signatures and the key directory).'
      schema: {$ref: '#/components/schemas/SigningKeyPurpose'}
    LinkTokenPath:
      name: token
      in: path
      required: true
      description: The signed-link token. It carries the signing key's kid and an expiry.
      schema:
        type: string
        minLength: 1
    ListDirectionPath:
      name: direction
      in: path
      required: true
      description: '`receive` or `send`.'
      schema: {$ref: '#/components/schemas/ListDirection'}
    ListKindPath:
      name: kind
      in: path
      required: true
      description: '`allow` or `block`.'
      schema: {$ref: '#/components/schemas/ListKind'}
    ListEntryPath:
      name: entry
      in: path
      required: true
      description: An address (`user@example.com`) or a whole domain (`@example.com`), percent-encoded where needed.
      schema: {$ref: '#/components/schemas/ListEntryValue'}

    WebhookIdHeader:
      name: webhook-id
      in: header
      required: true
      description: The event ID. Delivery is at least once, so deduplicate on it.
      schema: {$ref: '#/components/schemas/EventId'}
    WebhookTimestampHeader:
      name: webhook-timestamp
      in: header
      required: true
      description: Unix time in seconds when the delivery was signed. Reject requests more than 5 minutes from your clock.
      schema:
        type: integer
        minimum: 0
      example: 1791540000
    WebhookSignatureHeader:
      name: webhook-signature
      in: header
      required: true
      description: >-
        Space-separated `v1,<base64>` signatures: `base64(HMAC-SHA256(secret_bytes, "{webhook-id}.{webhook-timestamp}.{raw body}"))`,
        where `secret_bytes` is the base64-decoded part of `whsec_…` after the prefix. Two signatures are sent
        during a secret rotation overlap. Compare in constant time and accept on any match.
      schema:
        type: string
        pattern: '^v1,[A-Za-z0-9+/]+={0,2}( v1,[A-Za-z0-9+/]+={0,2})*$'
      example: v1,K5oZfzN95Z9UVu1EsfQmfVNQhnkZ2pj9o9NDN/H/pI4=
    WebhookUserAgentHeader:
      name: User-Agent
      in: header
      required: true
      description: Identifies the sender.
      schema:
        type: string
      example: PylotaMail/1.0 (+https://github.com/PILOTAAI/pylota-mail)

  headers:

    Request-Id:
      description: The request ID (`req_…`). Every response carries it, and errors echo it as `error.request_id`.
      schema: {$ref: '#/components/schemas/RequestId'}
    RateLimit-Limit:
      description: >-
        The limit of the rate-limit bucket that applied to this request, per period (for example `600` for
        the per-key bucket of 600 requests a minute). Every authenticated response carries it.
      schema:
        type: integer
        minimum: 0
    RateLimit-Reset:
      description: >-
        Sent only with a `429`: seconds until the end of the bucket's current period. There is no
        `RateLimit-Remaining` header, because the rate-limiting binding answers only allow or deny.
      schema:
        type: integer
        minimum: 0
    Retry-After:
      description: Seconds to wait before retrying. On a `429 rate_limited` it equals `RateLimit-Reset`.
      schema:
        type: integer
        minimum: 0
    Idempotent-Replayed:
      description: Present, with the value `true`, when the response is a replay of an earlier request with the same `Idempotency-Key`.
      schema:
        type: string
        enum: ['true']
    ETag:
      description: The draft's entity tag, `"{revision}-{8 hex}"`. Send it back in `If-Match`.
      schema:
        type: string
    Content-Disposition-Attachment:
      description: Always `attachment`, with the sanitised filename, for example `attachment; filename="INV-88213.pdf"`.
      schema:
        type: string
        pattern: '^attachment(;.*)?$'
    X-Content-Type-Options:
      description: Always `nosniff`.
      schema:
        type: string
        enum: [nosniff]
    Content-Security-Policy:
      description: Always `sandbox`.
      schema:
        type: string
        enum: [sandbox]
    Cache-Control-No-Store:
      description: Always `private, no-store`.
      schema:
        type: string
        enum: ['private, no-store']
    Cache-Control-Jwks:
      description: Always `public, max-age=300`. Verifiers cache an identity's JWK Set for at most 5 minutes.
      schema:
        type: string
        enum: ['public, max-age=300']
    Cache-Control-Directory:
      description: Always `max-age=86400`.
      schema:
        type: string
        enum: ['max-age=86400']
    Directory-Signature-Input:
      description: >-
        One RFC 9421 signature per listed key, each over `("@authority";req)` with `alg="ed25519"`, `keyid`
        (the key's JWK thumbprint), a 64-byte random `nonce`, `tag="http-message-signatures-directory"`,
        `created` and `expires` (`created` + 300).
      schema:
        type: string
      example: 'sig1=("@authority";req);alg="ed25519";keyid="poqkLGiymh_W0uP6PZFw-dvez3QJT5SolqXBCW38r0U";nonce="ZO3/XMEZjrvSnLtAP9M7jK0WGQf3J+pbmQRUpKDhF9/jsNCWqUh2sq+TH4WTX3/GpNoSZUa8eNWMKqxWp2/c2g==";tag="http-message-signatures-directory";created=1791547200;expires=1791547500, sig2=("@authority";req);alg="ed25519";keyid="521omx3NZ4BMQZPNvThhZbY7uITn_wjh09-53ZFC0wk";nonce="enN8xXfGRxQLlICS8VZg3pIsSGnRkOvRFSiH10a4TS4v/hyiFG3AWhUObSlUdRZ6jaf4I7fUvl1zbaMYOA0v6g==";tag="http-message-signatures-directory";created=1791547200;expires=1791547500'
    Directory-Signature:
      description: The signatures named in `Signature-Input`, one per listed key.
      schema:
        type: string
      example: 'sig1=:TD5arhV1ved6xtx63cUIFCMONT248cpDeVUAljLgkdozbjMNpJGr/WAx4PzHj+WeG0xMHQF1BOdFLDsfjdjvBA==:, sig2=:pWhbkxEjP/MBnlByqa5/AWesMuWGG7SUVe1jlM0KFpeYt14tMetCabzPnowCg1wLJGVwK0EfqafEsJLCrASjVQ==:'

  responses:

    BadRequest:
      description: The request is malformed or violates the schema. `details.errors[]` holds `{path, message}`.
      x-error-codes: [invalid_request, invalid_idempotency_key]
      headers:
        Request-Id: {$ref: '#/components/headers/Request-Id'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example:
            error:
              code: invalid_request
              message: 'limit: must be between 1 and 100.'
              retryable: false
              fix: Send a limit between 1 and 100.
              docs: https://pylotamail.com/docs/reference/errors#code-invalid_request
              request_id: req_01J9Z4K8V4QW7X2M5N6P8R0T1Y
              details:
                errors:
                  - path: limit
                    message: must be between 1 and 100
    SendBadRequest:
      description: >-
        The send request is invalid. `too_many_recipients`: more than `policy.max_recipients` (hard maximum
        49: Cloudflare allows 50 and one is kept for the hidden journal copy). A `from_address` that is not
        allowed is `invalid_request` with `details.errors[0].path = "from_address"`. `too_many_recipients`
        with `details.reason = "calendar_single_recipient"`: a calendar message on the `cloudflare` transport
        when a raw send takes one recipient. The `calendar_*` codes refuse an iCalendar object that is not a
        valid iTIP message (`calendar_invalid`, `details.reason`) or whose parties do not match the message
        (`calendar_organizer_mismatch`, `calendar_attendee_mismatch`, `calendar_recipient_mismatch`).
      x-error-codes: [invalid_request, idempotency_key_required, invalid_idempotency_key, address_invalid, address_unsupported, header_not_allowed, marketing_requirements_missing, too_many_recipients, calendar_invalid, calendar_organizer_mismatch, calendar_attendee_mismatch, calendar_recipient_mismatch]
      headers:
        Request-Id: {$ref: '#/components/headers/Request-Id'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example:
            error:
              code: idempotency_key_required
              message: This endpoint needs an Idempotency-Key header.
              retryable: false
              fix: Send a unique Idempotency-Key per message and reuse it on every retry of that message.
              docs: https://pylotamail.com/docs/reference/errors#code-idempotency_key_required
              request_id: req_01J9Z4K8V4QW7X2M5N6P8R0T1Y
    SearchBadRequest:
      description: The search request is invalid, or `q` could not be parsed (`details.position`, `details.expected`).
      x-error-codes: [invalid_request, invalid_query, invalid_idempotency_key]
      headers:
        Request-Id: {$ref: '#/components/headers/Request-Id'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example:
            error:
              code: invalid_query
              message: Unterminated quoted phrase.
              retryable: false
              fix: Close the quoted phrase that starts at position 5.
              docs: https://pylotamail.com/docs/reference/errors#code-invalid_query
              request_id: req_01J9Z4K8V4QW7X2M5N6P8R0T1Y
              details:
                position: 5
                expected: closing quote
    Unauthorized:
      description: No key, a malformed or unknown key, or an expired or revoked key.
      x-error-codes: [unauthenticated, key_expired, key_revoked]
      headers:
        Request-Id: {$ref: '#/components/headers/Request-Id'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example:
            error:
              code: unauthenticated
              message: No valid API key was provided.
              retryable: false
              fix: 'Send Authorization: Bearer pmk_live_… with a key created by pmail keys create.'
              docs: https://pylotamail.com/docs/reference/errors#code-unauthenticated
              request_id: req_01J9Z4K8V4QW7X2M5N6P8R0T1Y
    Forbidden:
      description: >-
        The key lacks the permission (`details.required` names it), the resource is outside the key's
        tenant or identity, the tenant is suspended, or the key's partner is suspended
        (`partner_suspended`, on every route: a partner key, or a tenant or identity key of one of the
        partner's tenants).
      x-error-codes: [permission_denied, scope_denied, tenant_suspended, partner_suspended]
      headers:
        Request-Id: {$ref: '#/components/headers/Request-Id'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example:
            error:
              code: permission_denied
              message: This key does not have the messages:send permission.
              retryable: false
              fix: Use a key that holds messages:send.
              docs: https://pylotamail.com/docs/reference/errors#code-permission_denied
              request_id: req_01J9Z4K8V4QW7X2M5N6P8R0T1Y
              details:
                required: ['messages:send']
    KeyManageForbidden:
      description: >-
        As `Forbidden`, plus `key_scope_exceeded` when the target key is wider than the caller: a higher
        level, or a permission the caller does not hold ([J20]).
      x-error-codes: [permission_denied, scope_denied, key_scope_exceeded, partner_suspended]
      headers:
        Request-Id: {$ref: '#/components/headers/Request-Id'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example:
            error:
              code: key_scope_exceeded
              message: This key cannot manage a key that holds permissions it does not hold.
              retryable: false
              fix: Use a key that holds every permission of the target key, or a key of a higher level.
              docs: https://pylotamail.com/docs/reference/errors#code-key_scope_exceeded
              request_id: req_01J9Z4K8V4QW7X2M5N6P8R0T1Y
    SendForbidden:
      description: >-
        As `Forbidden`, plus `test_mode_recipient` when a test tenant sends to an address that is neither
        `*@simulator.invalid` nor an identity of its own tenant or of another test tenant with the same partner ([L1], [L3]), and `policy_denied` with `details.reason = "free_sending_off"` when the
        operator's `free_sending` switch is off and the workspace is on the Free plan or still in its send
        ramp, or `details.reason = "signup_unverified"` (or `signup_human_unreachable`) when a provisional agent
        sign-up sends to anyone but its named human, or `signup_paused` for any send of one while the operator's
        `agent_signup` switch is off. `approval_required` when the tenant's
        `drafts.require_approval`, or the identity's stricter `send_policy.require_approval`, needs approval for
        these recipients (`details.reason`, `details.recipients`): nothing was stored; create the message as a
        draft and send it, and it waits for an approver.
      x-error-codes: [permission_denied, scope_denied, tenant_suspended, partner_suspended, test_mode_recipient, policy_denied, approval_required]
      headers:
        Request-Id: {$ref: '#/components/headers/Request-Id'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    NotFound:
      description: >-
        The resource does not exist **or** is outside the key's scope (deliberately indistinguishable). A
        `404` always carries one of this service's own codes; a `404` without this envelope came from
        something else and must not be read as "already deleted". `route_not_found` means the path is no
        route on this host, which says nothing about any resource.
      x-error-codes: [route_not_found, tenant_not_found, identity_not_found, address_not_found, domain_not_found, thread_not_found, message_not_found, attachment_not_found, webhook_not_found, key_not_found, erasure_not_found, export_not_found, suppression_not_found, list_entry_not_found, member_not_found, invitation_not_found, job_not_found, dlq_item_not_found, partner_not_found, account_not_found, draft_not_found, event_consumer_not_found, signup_not_found, upload_not_found]
      headers:
        Request-Id: {$ref: '#/components/headers/Request-Id'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example:
            error:
              code: message_not_found
              message: No such message for this identity.
              retryable: false
              fix: Check the message ID and that the key can reach this identity.
              docs: https://pylotamail.com/docs/reference/errors#code-message_not_found
              request_id: req_01J9Z4K8V4QW7X2M5N6P8R0T1Y
    IdempotencyConflict:
      description: >-
        The `Idempotency-Key` was used with a different request (`idempotency_conflict`), or the first
        request with it is still running (`request_in_progress`, retryable).
      x-error-codes: [idempotency_conflict, request_in_progress]
      headers:
        Request-Id: {$ref: '#/components/headers/Request-Id'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    SendConflict:
      description: >-
        The send conflicts with the idempotency record or with the identity, thread or domain state.
        `idempotency_conflict` carries `details.original_message_id` when known; `identity_paused` carries
        `details.reason`; `thread_busy` carries `details.retry_after`; `loop_detected` carries `details.hop`
        ([N13]), or `details.reason` (`thread_rate` or `sender_rate`) and `details.retry_after` ([N35]); `sending_paused` carries `details.scope` (`tenant` or `domain`), `details.reason` and, for a
        domain, `details.domain_id` ([G12]); `calendar_sequence_stale` carries `details.sequence`,
        `details.latest_sequence` and `details.latest_message_id`; `upload_not_ready` (retryable) carries
        `details.index` and `details.status` of an attached upload still `pending` or `uploading`. A recipient
        refused by `send_policy.require_known_recipient` is not an error: its delivery is `suppressed` with
        `policy: unknown_recipient` ([E2]).
      x-error-codes: [idempotency_conflict, request_in_progress, identity_paused, identity_owner_required, thread_busy, domain_not_ready, auto_reply_not_allowed, loop_detected, sending_paused, calendar_sequence_stale, upload_not_ready]
      headers:
        Request-Id: {$ref: '#/components/headers/Request-Id'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example:
            error:
              code: idempotency_conflict
              message: This Idempotency-Key was used with a different request body.
              retryable: false
              fix: Use a new Idempotency-Key for a different message, or resend the original body.
              docs: https://pylotamail.com/docs/reference/errors#code-idempotency_conflict
              request_id: req_01J9Z4K8V4QW7X2M5N6P8R0T1Y
              details:
                original_message_id: msg_01J9Z3K8V4QW7X2M5N6P8R0T1Y
    CalendarReplyConflict:
      description: >-
        The invitation cannot be answered, or the send conflicts with the idempotency record or with the
        identity, thread or domain state (as `SendConflict`). `calendar_not_invitation` (no readable
        invitation, or an outbound message; `details.method`, `details.object_status`),
        `calendar_not_verified` (`details.reason`, `message_quarantined` or `message_screening` for a held invitation),
        `calendar_not_attendee`, `calendar_cancelled` (`details.cancel_message_id`), `calendar_superseded`
        (`details.latest_message_id`, `details.latest_sequence`), `calendar_event_past` (`details.ended_at`),
        `calendar_attendee_address_unavailable` (`details.address`, `details.reason`: `retired`, `pending` or
        `fallback_pinned`).
      x-error-codes: [calendar_not_invitation, calendar_not_verified, calendar_not_attendee, calendar_cancelled, calendar_superseded, calendar_event_past, calendar_attendee_address_unavailable, idempotency_conflict, request_in_progress, identity_paused, identity_owner_required, thread_busy, domain_not_ready, loop_detected, sending_paused]
      headers:
        Request-Id: {$ref: '#/components/headers/Request-Id'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    RawExpired:
      description: The raw MIME is past `policy.retention.raw_days`.
      x-error-codes: [raw_expired]
      headers:
        Request-Id: {$ref: '#/components/headers/Request-Id'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    MessageExpired:
      description: >-
        The `Idempotency-Key` and body match a send whose message expired under the identity's
        `retention.message_hours` (`details.message_id`, `details.expired_at`). Nothing was sent.
      x-error-codes: [message_expired]
      headers:
        Request-Id: {$ref: '#/components/headers/Request-Id'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    SendGone:
      description: >-
        As `MessageExpired` (`message_expired`: a retried send whose message expired under the identity's
        `retention.message_hours`; nothing was sent), or an attached upload expired (`upload_expired`,
        `details.index`, `details.reason`: `expired`, `too_many_attempts` or `object_missing`; nothing was
        stored, upload the file again).
      x-error-codes: [message_expired, upload_expired]
      headers:
        Request-Id: {$ref: '#/components/headers/Request-Id'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    CursorExpired:
      description: >-
        The pagination cursor is older than 24 hours (lists): start again from the first page. Or the event
        cursor or consumer position is behind the retained event log (`details.reason`: `retention`,
        `size_limit` or `log_reset`; `details.oldest_cursor`; `details.consumer_id` for a consumer).
      x-error-codes: [cursor_expired]
      headers:
        Request-Id: {$ref: '#/components/headers/Request-Id'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    PayloadTooLarge:
      description: The request body exceeds 7 MiB.
      x-error-codes: [payload_too_large]
      headers:
        Request-Id: {$ref: '#/components/headers/Request-Id'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    SendPayloadTooLarge:
      description: >-
        The composed message exceeds the transport limit (5 MiB with Cloudflare; `message_too_large` with
        `details.reason = "transport_limit"`) and the tenant does not use `large_attachments: link`; or its
        attachments total more than 26,214,400 decoded bytes (`details.reason = "attachments_total"`, whatever
        `large_attachments` says); or the request body exceeds 7 MiB (`payload_too_large`); or `calendar.ics`
        exceeds 262,144 bytes (`calendar_too_large`, `details.limit`).
      x-error-codes: [message_too_large, payload_too_large, calendar_too_large]
      headers:
        Request-Id: {$ref: '#/components/headers/Request-Id'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    SendUnprocessable:
      description: >-
        The sending domain's transport is not configured (for example SES for an `external` domain), or a
        `kind: marketing` message comes from a domain whose transport is `cloudflare` (`details.reason =
        "marketing_needs_ses"`: Cloudflare Email Service is for transactional mail only). Only a
        dry run (`dry_run=true`) returns `all_recipients_suppressed` (a real send whose every recipient is
        suppressed is accepted and ends `suppressed`) and `recipient_blocked` (a recipient is on the
        send-block list; `details.scope` is `identity` or `tenant`). A calendar message on a `cloudflare`
        domain before the raw send is available gets `transport_unavailable` with
        `details.reason = "calendar_needs_raw_mime"`. `attachment_risky`: an attachment, inline or from an
        upload, carries a quarantining risk (`details.risk`), including after a rename, or the scanner found
        malware (`details.reason = "infected"`); `details.index` names it.
      x-error-codes: [transport_unavailable, all_recipients_suppressed, recipient_blocked, attachment_risky]
      headers:
        Request-Id: {$ref: '#/components/headers/Request-Id'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    BillingLimit:
      description: >-
        A plan allowance is spent (`details`: `feature`, `granted`, `used`, `resets_at`, `upgrade_url`).
        Nothing was stored: upgrade or add a top-up, then retry with the **same** `Idempotency-Key`. Never
        returned for inbound mail or for the replay of a request that already completed.
      x-error-codes: [billing_limit]
      headers:
        Request-Id: {$ref: '#/components/headers/Request-Id'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example:
            error:
              code: billing_limit
              message: This workspace has used all 12000 sends in its plan for this period.
              retryable: false
              fix: Upgrade the plan or add a sends top-up, then retry with the same Idempotency-Key.
              docs: https://pylotamail.com/docs/reference/errors#code-billing_limit
              request_id: req_01J9Z4K8V4QW7X2M5N6P8R0T1Y
              details:
                feature: sends
                granted: 12000
                used: 12000
                resets_at: '2026-11-01T00:00:00Z'
                upgrade_url: https://mail.example.com/console/plan
    DryRunOk:
      description: >-
        Dry run only (`dry_run=true`): every check passed. Nothing was sent or stored, no quota was taken
        and the thread was not locked.
      headers:
        Request-Id: {$ref: '#/components/headers/Request-Id'}
        RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/DryRunResult'}
          example:
            would_send: true
            recipients:
              - address: jo@example.net
                field: to
                status: queued
              - address: old@example.org
                field: cc
                status: suppressed
                reason: hard_bounce
    LegalHold:
      description: The operation would delete data under a legal hold.
      x-error-codes: [legal_hold]
      headers:
        Request-Id: {$ref: '#/components/headers/Request-Id'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    TooManyRequests:
      description: A rate limit was hit. Wait `Retry-After` seconds, then retry.
      x-error-codes: [rate_limited]
      headers:
        Request-Id: {$ref: '#/components/headers/Request-Id'}
        Retry-After: {$ref: '#/components/headers/Retry-After'}
        RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}
        RateLimit-Reset: {$ref: '#/components/headers/RateLimit-Reset'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example:
            error:
              code: rate_limited
              message: Too many requests for this API key.
              retryable: true
              fix: Wait for the number of seconds in the Retry-After header, then retry with the same Idempotency-Key.
              docs: https://pylotamail.com/docs/reference/errors#code-rate_limited
              request_id: req_01J9Z4K8V4QW7X2M5N6P8R0T1Y
              details:
                retry_after: 12
    SendTooManyRequests:
      description: >-
        A per-key or per-identity rate limit (`rate_limited`, with `Retry-After`), or a daily cap
        (`daily_cap_reached`, with `details.cap` and `details.resets_at`): the tenant or identity cap, the
        shared-domain breaker, or a workspace whose payment is disputed (`resets_at` null). Retry with the
        same `Idempotency-Key`.
      x-error-codes: [rate_limited, daily_cap_reached]
      headers:
        Request-Id: {$ref: '#/components/headers/Request-Id'}
        Retry-After: {$ref: '#/components/headers/Retry-After'}
        RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}
        RateLimit-Reset: {$ref: '#/components/headers/RateLimit-Reset'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    SearchTooManyRequests:
      description: >-
        A search rate limit (`rate_limited`, with `Retry-After`), or the tenant's daily agentic-search budget
        is spent (`agentic_budget_exhausted`).
      x-error-codes: [rate_limited, agentic_budget_exhausted]
      headers:
        Request-Id: {$ref: '#/components/headers/Request-Id'}
        Retry-After: {$ref: '#/components/headers/Retry-After'}
        RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}
        RateLimit-Reset: {$ref: '#/components/headers/RateLimit-Reset'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    NotFrozen:
      description: The call is allowed only while the deployment is frozen for a restore (`pmail ops freeze`).
      x-error-codes: [not_frozen]
      headers:
        Request-Id: {$ref: '#/components/headers/Request-Id'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    InternalError:
      description: A bug. It is logged with the `request_id`. Retry with backoff.
      x-error-codes: [internal_error]
      headers:
        Request-Id: {$ref: '#/components/headers/Request-Id'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    UpstreamError:
      description: A Cloudflare or SES API returned an unexpected error during a synchronous call. Retry with backoff.
      x-error-codes: [upstream_error]
      headers:
        Request-Id: {$ref: '#/components/headers/Request-Id'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    ServiceUnavailable:
      description: >-
        A dependency is temporarily unavailable (D1, an overloaded Durable Object). Retry with backoff.
        `details.reason` says when the operator caused it: `frozen` (a restore is in progress; `Retry-After`
        is 300), `read_only` (an automatic containment rule refused writes) or `storage_full` (the D1
        database is full).
      x-error-codes: [unavailable]
      headers:
        Request-Id: {$ref: '#/components/headers/Request-Id'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    SearchUnavailable:
      description: >-
        A dependency is unavailable (`unavailable`), or the request set `require_mode: true` and the
        requested mode is unavailable (`search_degraded`). Without `require_mode`, search degrades and sets
        `degraded: true` instead.
      x-error-codes: [unavailable, search_degraded]
      headers:
        Request-Id: {$ref: '#/components/headers/Request-Id'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    GatewayTimeout:
      description: >-
        An internal deadline was exceeded. For sends this happens before the message is queued, so a retry
        with the same `Idempotency-Key` is safe.
      x-error-codes: [timeout]
      headers:
        Request-Id: {$ref: '#/components/headers/Request-Id'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    UpgradeRequired:
      description: '`GET /events/stream` without `Upgrade: websocket`. Open it as a WebSocket.'
      x-error-codes: [upgrade_required]
      headers:
        Request-Id: {$ref: '#/components/headers/Request-Id'}
        Upgrade:
          description: Always `websocket`.
          schema:
            type: string
            const: websocket
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}

    WebhookAccepted:
      description: Any `2xx` within 15 seconds counts as delivered. The response body is ignored (read up to 4 KB).
    WebhookGone:
      description: '`410 Gone` disables the endpoint immediately.'
    WebhookFailed:
      description: >-
        Anything else (including a timeout, TLS or DNS error, redirect or `3xx`) is a failure. Failures retry
        at about 30 s, 2 min, 10 min, 30 min, 1 h, 2 h, 4 h, 8 h, 12 h, 12 h, 12 h and 19 h (±10% jitter,
        about 72 hours in all), then the delivery is `dead`. The event can be replayed for 30 days from its
        `occurred_at` (or `retention.events_days`, if shorter), not from when the delivery went dead. After 100
        consecutive failures over at least 24 hours the endpoint is disabled (`disabled_reason: failing`).

  schemas:

    # ── Identifiers ──────────────────────────────────────────────────────────────────────────────

    TenantId:
      type: string
      description: Tenant ID (`ten_` + ULID).
      pattern: '^ten_[0-9A-HJKMNP-TV-Z]{26}$'
      examples: [ten_01J9Z3K8V4QW7X2M5N6P8R0T1Y]
    PartnerId:
      type: string
      description: Partner ID (`ptn_` + ULID).
      pattern: '^ptn_[0-9A-HJKMNP-TV-Z]{26}$'
      examples: [ptn_01JA2B3C4D5E6F7G8H9J0K1M2N]
    IdentityId:
      type: string
      description: Identity ID (`idn_` + ULID).
      pattern: '^idn_[0-9A-HJKMNP-TV-Z]{26}$'
      examples: [idn_01J9Z3K8V4QW7X2M5N6P8R0T1Y]
    AddressId:
      type: string
      description: Address ID (`adr_` + ULID).
      pattern: '^adr_[0-9A-HJKMNP-TV-Z]{26}$'
      examples: [adr_01J9Z3K8V4QW7X2M5N6P8R0T1Y]
    DomainId:
      type: string
      description: Domain ID (`dom_` + ULID).
      pattern: '^dom_[0-9A-HJKMNP-TV-Z]{26}$'
      examples: [dom_01JA2B3C4D5E6F7G8H9J0K1M2N]
    ThreadId:
      type: string
      description: Thread ID (`thr_` + ULID).
      pattern: '^thr_[0-9A-HJKMNP-TV-Z]{26}$'
      examples: [thr_01J9Z3K8V4QW7X2M5N6P8R0T1Y]
    MessageId:
      type: string
      description: Message ID (`msg_` + ULID).
      pattern: '^msg_[0-9A-HJKMNP-TV-Z]{26}$'
      examples: [msg_01J9Z3K8V4QW7X2M5N6P8R0T1Y]
    AttachmentId:
      type: string
      description: Attachment ID (`att_` + ULID).
      pattern: '^att_[0-9A-HJKMNP-TV-Z]{26}$'
      examples: [att_01J9Z3K8V4QW7X2M5N6P8R0T1Y]
    WebhookId:
      type: string
      description: Webhook endpoint ID (`whk_` + ULID).
      pattern: '^whk_[0-9A-HJKMNP-TV-Z]{26}$'
      examples: [whk_01J9Z3K8V4QW7X2M5N6P8R0T1Y]
    DeliveryId:
      type: string
      description: Webhook delivery attempt ID (`dlv_` + ULID).
      pattern: '^dlv_[0-9A-HJKMNP-TV-Z]{26}$'
      examples: [dlv_01J9Z3K8V4QW7X2M5N6P8R0T1Y]
    EventId:
      type: string
      description: Event ID (`evt_` + ULID). Also sent as the `webhook-id` header.
      pattern: '^evt_[0-9A-HJKMNP-TV-Z]{26}$'
      examples: [evt_01J9Z5K8V4QW7X2M5N6P8R0T1Y]
    KeyId:
      type: string
      description: API key ID (`key_` + ULID). Not secret.
      pattern: '^key_[0-9A-HJKMNP-TV-Z]{26}$'
      examples: [key_01J9Z3K8V4QW7X2M5N6P8R0T1Y]
    ErasureRequestId:
      type: string
      description: Erasure request ID (`era_` + ULID).
      pattern: '^era_[0-9A-HJKMNP-TV-Z]{26}$'
      examples: [era_01J9Z3K8V4QW7X2M5N6P8R0T1Y]
    ExportId:
      type: string
      description: Export ID (`exp_` + ULID).
      pattern: '^exp_[0-9A-HJKMNP-TV-Z]{26}$'
      examples: [exp_01J9Z3K8V4QW7X2M5N6P8R0T1Y]
    AuditEventId:
      type: string
      description: Audit entry ID (`aud_` + ULID).
      pattern: '^aud_[0-9A-HJKMNP-TV-Z]{26}$'
      examples: [aud_01J9Z3K8V4QW7X2M5N6P8R0T1Y]
    UserId:
      type: string
      description: Console user ID (`usr_` + ULID).
      pattern: '^usr_[0-9A-HJKMNP-TV-Z]{26}$'
      examples: [usr_01JA2B3C4D5E6F7G8H9J0K1M2N]
    InvitationId:
      type: string
      description: Invitation ID (`inv_` + ULID).
      pattern: '^inv_[0-9A-HJKMNP-TV-Z]{26}$'
      examples: [inv_01JA2B3C4D5E6F7G8H9J0K1M2N]
    DlqItemId:
      type: string
      description: Dead-letter item ID (`dlq_` + ULID).
      pattern: '^dlq_[0-9A-HJKMNP-TV-Z]{26}$'
      examples: [dlq_01JA2B3C4D5E6F7G8H9J0K1M2N]
    JobId:
      type: string
      description: Job ID (`job_` + ULID).
      pattern: '^job_[0-9A-HJKMNP-TV-Z]{26}$'
      examples: [job_01JA2B3C4D5E6F7G8H9J0K1M2N]
    RequestId:
      type: string
      description: Request ID (`req_` + ULID).
      pattern: '^req_[0-9A-HJKMNP-TV-Z]{26}$'
      examples: [req_01J9Z4K8V4QW7X2M5N6P8R0T1Y]

    # ── Primitives ───────────────────────────────────────────────────────────────────────────────

    EmailAddress:
      type: string
      format: email
      maxLength: 254
      description: >-
        An RFC 5321 address. Stored lower-cased with the domain as an IDNA A-label; dots in the local part
        are significant ([A1]). SMTPUTF8 (non-ASCII) local parts are refused with `address_unsupported`.
      examples: [jo@example.net]
    MailboxAddress:
      type: object
      description: An address with its display name. Display names are untrusted content.
      required: [address, name]
      properties:
        address: {$ref: '#/components/schemas/EmailAddress'}
        name:
          type: string
          description: The display name, or an empty string when there is none.
    Label:
      type: string
      description: A label. At most 64 per message.
      pattern: '^[a-z0-9][a-z0-9_:-]{0,63}$'
      examples: [invoice]
    Metadata:
      type: object
      description: Integrator metadata. At most 16 keys; each value is a string of at most 512 bytes.
      maxProperties: 16
      additionalProperties:
        type: string
        maxLength: 512
    Direction:
      type: string
      enum: [inbound, outbound]

    # ── Errors ───────────────────────────────────────────────────────────────────────────────────

    Error:
      type: object
      description: The envelope of every non-2xx response.
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, retryable, fix, docs, request_id]
          properties:
            code: {$ref: '#/components/schemas/ErrorCode'}
            message:
              type: string
              description: Human-readable. It can change. Never parse it.
            retryable:
              type: boolean
              description: >-
                `true`: the same request can succeed later unchanged (retry with backoff, and with the same
                `Idempotency-Key` for sends). `false`: the request has to change.
            fix:
              type: string
              description: One sentence telling a developer, or an agent, what to do.
            docs:
              type: string
              format: uri
              description: The code's entry on the published errors page, `{PM_DOCS_URL}/reference/errors#code-{code}`.
              examples: ['https://pylotamail.com/docs/reference/errors#code-idempotency_conflict']
            request_id: {$ref: '#/components/schemas/RequestId'}
            details:
              $ref: '#/components/schemas/ErrorDetails'
    ErrorDetails:
      type: object
      description: Optional, code-specific details. Known keys are listed; other keys can appear.
      properties:
        required:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/Permission'}
          description: >-
            `permission_denied`: always an array: every permission the key lacks (one element when it
            lacks one); on a route that takes any one of several permissions (the upload routes), all of
            them, with `any_of: true`.
        any_of:
          type: boolean
          description: '`permission_denied`: `true` when the key needs any one of the permissions in `required`.'
        errors:
          type: array
          description: '`invalid_request`: one entry per schema violation.'
          items:
            type: object
            required: [path, message]
            properties:
              path:
                type: string
                description: Where in the request the problem is.
              message:
                type: string
        position:
          type: integer
          minimum: 0
          description: '`invalid_query`: the character offset in `q` where parsing failed.'
        expected:
          description: '`invalid_query`: what the parser expected at `position`.'
        original_message_id:
          description: '`idempotency_conflict`: the message created by the original request, when known.'
          $ref: '#/components/schemas/MessageId'
        reason:
          description: >-
            `identity_paused`: why the identity is paused. `transport_unavailable`: why the deployment or
            the domain's method cannot do what was asked. `invalid_request` on `POST /v1/keys`:
            `permission_not_allowed_for_level` when `permissions` lists one the new key's level cannot hold.
            `scope_denied` on a domain create: `zone_not_allowed` when a non-platform key names a Cloudflare
            zone its tenant may not use (`cloudflare_zone`, `replace_mx`; see `TenantPolicy.domains`).
            `scope_denied` on a policy write: `not_writable` or `above_ceiling`. `permission_denied`:
            `person_required` when only a signed-in person may take the decision (a guard-field loosening by a
            tenant key, a service-account approval by an API key, a draft approval by an API key), or
            `self_approval` when a key approves draft content it wrote, `consumer_owner_only` on a durable
            event consumer, `signup_unverified` for a key of a provisional agent sign-up. `policy_denied` on
            `wait`: `account_not_approved`; on a send: `signup_unverified`, `signup_human_unreachable` or
            `signup_paused`.
            `invalid_request` on `requestServiceAccount`: `own_deployment`; on the event feed: `cursor_ahead`,
            `credential_in_url`, `two_credentials`, `subprotocol_required`; on `POST …/feedback`:
            `feedback_not_applicable`; on `batch-update`: `label_limit`; on a list or retention change of the
            system identity: `system_identity`; on a draft's `send_at`: `beyond_retention`; on `POST /v1/keys`:
            `unknown_mcp_tool`, `mcp_tool_not_permitted`. `approval_required`: the approval level
            (`new_recipients`, `external`, `always`). `draft_revision_mismatch`: `digest`. `source_unavailable`:
            `erased`, `not_visible`, `raw_expired`, `attachment_missing`. `cursor_expired` on the event feed:
            `retention`, `size_limit`, `log_reset`. `too_many_recipients`: `calendar_single_recipient`.
            `header_not_allowed` on a webhook endpoint: `webhook_header`. `message_too_large`:
            `attachments_total`, `transport_limit`. `upload_size_mismatch`: `content_length`, `encoding`,
            `incomplete`. `upload_expired`: `expired`, `too_many_attempts`, `object_missing`.
            `attachment_risky`: `infected`. `signup_closed`: `disabled`, `paused`. `signup_cannot_verify`:
            `workspace_limit`, `human_email_hosted`, `person_disabled`. `signup_code_invalid`: `wrong`,
            `burned`, `locked`, `expired`, `superseded`, `none`. `invalid_request` on `POST /v1/agent-signup`:
            `human_email_not_allowed`, `no_mail_domain`. `calendar_invalid` and the other codes list their own
            values in docs › Errors.
          anyOf:
            - $ref: '#/components/schemas/PauseReason'
            - $ref: '#/components/schemas/TransportUnavailableReason'
            - $ref: '#/components/schemas/RequireApproval'
            - type: string
              const: permission_not_allowed_for_level
            - type: string
              const: zone_not_allowed
            - type: string
              enum: [not_writable, above_ceiling, person_required, account_not_approved, own_deployment]
            - type: string
              enum: [self_approval, consumer_owner_only, signup_unverified, signup_human_unreachable, signup_paused, cursor_ahead, credential_in_url, two_credentials, subprotocol_required, feedback_not_applicable, label_limit, system_identity, beyond_retention, unknown_mcp_tool, mcp_tool_not_permitted, digest, erased, not_visible, raw_expired, attachment_missing, retention, size_limit, log_reset, calendar_single_recipient, webhook_header, attachments_total, transport_limit, content_length, encoding, incomplete, expired, too_many_attempts, object_missing, infected, disabled, paused, workspace_limit, human_email_hosted, person_disabled, wrong, burned, locked, superseded, none, human_email_not_allowed, no_mail_domain]
            - type: string
              description: Any other code-specific reason listed in docs › Errors.
        field:
          type: string
          description: >-
            `scope_denied`: the request field the key may not set to that value, as a dotted path: a
            platform-only or lower-only policy field written by a partner key (`policy.tenant_daily_send_cap`
            is reported as `tenant_daily_send_cap`), `send_policy.daily_cap` above the tenant's identity cap,
            or `status` when a partner key tries to lift a platform suspension.
          examples: [tenant_daily_send_cap, send_policy.daily_cap, status]
        max_tenants:
          type: integer
          minimum: 0
          description: '`partner_tenant_limit`: the partner''s `max_tenants`.'
        ceiling:
          type: [number, boolean]
          description: '`scope_denied` with `above_ceiling`: the loosest value the caller may set on `field`.'
        ceiling_source:
          type: string
          description: '`scope_denied` with `above_ceiling`: which bound decided the ceiling.'
          enum: [deployment, platform, partner]
        service_domain:
          type: string
          description: '`policy_denied` with `account_not_approved`: the organisational domain that has no approved entry.'
        account_id:
          description: '`account_exists`: the existing entry.'
          $ref: '#/components/schemas/ServiceAccountId'
        status:
          description: >-
            `account_exists`, `account_not_pending` and `account_limit_reached`: the state of the entry, or the
            state that hit the limit. `draft_not_editable`, `draft_not_sendable` and `draft_not_pending`: the
            draft's status. `upload_not_ready`: the upload's status. `not_quarantined`: the message's status.
          anyOf:
            - $ref: '#/components/schemas/ServiceAccountStatus'
            - $ref: '#/components/schemas/DraftStatus'
            - $ref: '#/components/schemas/UploadStatus'
            - $ref: '#/components/schemas/MessageStatus'
        limit:
          description: >-
            `account_limit_reached`: the limit that was reached (10 pending, or 200 in any state). The other
            `*_limit_reached` codes: the limit; `upload_limit_reached` and `webhook_header_limit_reached` name
            which limit (`count` or `bytes`) and give `max`.
          anyOf:
            - type: integer
              minimum: 1
            - type: string
              enum: [count, bytes]
        records:
          type: array
          description: >-
            `domain_not_dedicated`: the records found at the name (A, AAAA, MX) and at `www` (CNAME, A)
            that moving the nameservers would take over.
          items:
            type: object
            required: [type, name, value]
            properties:
              type:
                type: string
                enum: [A, AAAA, MX, CNAME]
              name:
                type: string
                examples: [brightwell-agents.example]
              value:
                type: string
                examples: [203.0.113.10]
        retry_after:
          type: integer
          minimum: 0
          description: >-
            `rate_limited` and `thread_busy`: seconds to wait before retrying. `upstream_rate_limited`:
            as in `Retry-After`: `10800` (3 hours) after a Cloudflare 1105, or the wait for the next SES
            control-plane slot.
        resets_at:
          type: [string, 'null']
          format: date-time
          description: '`daily_cap_reached` and `billing_limit`: when the cap or allowance resets (`null` for counts such as `inboxes`, and for `daily_cap_reached` with `cap: billing_dispute`, which ends when the dispute does).'
        cap:
          type: string
          description: >-
            `daily_cap_reached`: which cap refused the request. `identity` and `tenant` are the daily send
            caps of tenant policy (the tenant one lowered by the new-workspace ramp); `invitations` is the
            tenant's 50 invitation emails a day; `shared_domain` is the deployment's shared-domain breaker;
            `billing_dispute` stops a workspace's sends while one of its payments is disputed.
          enum: [identity, tenant, invitations, shared_domain, billing_dispute]
        feature:
          description: '`billing_limit`: the spent allowance.'
          $ref: '#/components/schemas/UsageFeatureName'
        granted:
          type: [integer, 'null']
          minimum: 0
          description: '`billing_limit`: the allowance, top-ups included.'
        used:
          type: integer
          minimum: 0
          description: '`billing_limit`: how much of it is used.'
        upgrade_url:
          type: [string, 'null']
          format: uri
          description: '`billing_limit`: the console plan page, or `null` when the console is off.'
        tenants:
          type: integer
          minimum: 1
          description: '`partner_has_tenants`: how many of the partner''s tenants are not erased yet.'
        lookups:
          type: integer
          minimum: 0
          description: '`spf_lookup_limit`: the DNS lookups the merged SPF record would need.'
      additionalProperties: true
    ErrorCode:
      type: string
      description: >-
        Stable, machine-readable error code. New codes can be added, so handle unknown codes by HTTP status.
        The catalogue, with HTTP status and retryability, is in `docs/src/reference/errors.md`.
      enum:
        # Authentication and access
        - unauthenticated
        - key_expired
        - key_revoked
        - permission_denied
        - scope_denied
        - key_scope_exceeded
        - tenant_suspended
        - partner_suspended
        - partner_tenant_limit
        - test_mode_recipient
        - invalid_signature
        - policy_denied
        - approval_required
        - signup_closed
        # Validation
        - invalid_request
        - idempotency_key_required
        - invalid_idempotency_key
        - invalid_query
        - address_invalid
        - address_unsupported
        - address_reserved
        - local_part_too_long
        - header_not_allowed
        - marketing_requirements_missing
        - too_many_recipients
        - smtp_port_not_allowed
        - spf_lookup_limit
        - message_too_large
        - payload_too_large
        - scope_too_large
        - calendar_invalid
        - calendar_organizer_mismatch
        - calendar_attendee_mismatch
