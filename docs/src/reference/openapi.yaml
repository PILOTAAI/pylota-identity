            (`draft_not_editable`); `request_approval` on a rejected revision without a change
            (`draft_not_sendable`); or an attached upload is not `ready` (`upload_not_ready`).
          x-error-codes: [draft_revision_mismatch, draft_not_editable, draft_not_sendable, upload_not_ready]
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
