          x-error-codes: [upload_expired]
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '413':
          description: >-
            The request body exceeds 7 MiB (`payload_too_large`), the attachments exceed 26,214,400 decoded
            bytes in total (`message_too_large`, `details.reason = "attachments_total"`), the draft's own parts
            exceed the composed limit with `large_attachments: refuse` (`message_too_large`), or
            `calendar.ics` exceeds 262,144 bytes (`calendar_too_large`).
          x-error-codes: [payload_too_large, message_too_large, calendar_too_large]
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '422':
          description: >-
            An added attachment is risky: an inline part with a quarantining risk, a `rejected` upload or a
            risky final filename (`attachment_risky`, `details.index`, `details.risk`).
          x-error-codes: [attachment_risky]
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '423':
          description: >-
            The draft is under a legal hold (its thread, source message or sent message is in a held thread)
            and the patch changes its content, `labels` or `metadata`; nothing changed. A patch of only
            `send_at` or `request_approval` is allowed.
          x-error-codes: [legal_hold]
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
    delete:
      operationId: deleteDraft
      tags: [Drafts]
      summary: Cancel a draft
      description: >-
        Cancels the draft (`status: "canceled"`) and deletes its content; a scheduled draft is never sent
        afterwards. A `canceled` draft answers `200` again with no change. A draft under a legal hold is
        canceled and never sent, but its content is kept until the hold ends. Refused while it is being sent
        or once sent.
      x-required-permission: ['drafts:write']
      x-key-levels: [platform, partner, tenant, identity]
