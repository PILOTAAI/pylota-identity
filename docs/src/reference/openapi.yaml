        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
    patch:
      operationId: updateTenantBilling
      tags: [Usage]
      summary: Change a workspace's billing mode or plan
      description: >-
        Platform keys only: a partner key gets `403 scope_denied` on its own tenants, so only a platform key
        changes a partnered tenant's billing mode. Accepts `mode` (`metered`, `exempt`, `disabled`) and, for
        workspaces without a Stripe subscription, `plan_id` (a complimentary plan). Plans paid through Stripe change only through
        Stripe: a `plan_id` on such a workspace returns `409 plan_managed_by_stripe`. Audit-logged.
      x-required-permission: ['tenants:manage']
      x-key-levels: [platform]
      x-rate-limit-buckets: [api]
      x-idempotency: none
