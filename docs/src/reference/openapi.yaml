  # ─────────────────────────────────────────── Messages ───────────────────────────────────────────

  /identities/{identity_id}/messages:
    parameters:
      - $ref: '#/components/parameters/IdentityIdPath'
    get:
      operationId: listMessages
      tags: [Messages]
      summary: List messages
      description: >-
        Messages in the mailbox, newest first. Each item is a Message object in its default form
        (`extracted_text`, no `text`, `html` or `headers`). Quarantined, screening, hidden and throttled
        messages are excluded by default, whatever the key's permissions. They are listed only when the
