      x-rate-limit-buckets: [api]
      x-idempotency: optional
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReplayRequest'}
            examples:
              by_id:
                summary: Replay specific events
                value:
                  event_ids: [evt_01J9Z5K8V4QW7X2M5N6P8R0T1Y]
              by_range:
                summary: Replay dead deliveries in a time range
                value:
                  since: '2026-10-08T00:00:00Z'
                  until: '2026-10-09T00:00:00Z'
                  status: dead
      responses:
        '202':
          description: The events were queued for redelivery.
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
            RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}
            Idempotent-Replayed: {$ref: '#/components/headers/Idempotent-Replayed'}
