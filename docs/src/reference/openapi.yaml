    TransportUnavailableReason:
      type: string
      description: |
        `details.reason` of `422 transport_unavailable`.

        | Reason | When |
        |---|---|
        | `ses_not_configured` | The SES transport (`PM_SES_*`) is not configured: `dns_records`, `send_only`, or `PATCH` with `transport: ses` |
        | `ses_receiving_not_configured` | `dns_records`, or `smtp_relay` with `inbound: ses`, without `PM_SES_INBOUND_TOPIC_ARN` (and the bucket and queue) |
        | `ses_identity_limit` | The SES region already has 10,000 identities, and the method needs one (`dns_records`, `send_only`, `smtp_relay` with `inbound: ses`) |
        | `subdomain_setup_disabled` | `delegated_subdomain` while `PM_CF_SUBDOMAIN_SETUP` is not `on` |
        | `zone_creation_not_allowed` | `nameservers` by a tenant or partner key whose tenant's policy lacks `domains.allow_create_zone: true`, or a zone create that Cloudflare refused for the Worker token's scope (a token limited to named zones, as on Pylota Mail Cloud) |
        | `ses_identity_not_verified` | `PATCH` with `transport: ses` while SES does not report the domain's identity as verified for sending with DKIM `SUCCESS` (`details.dkim_status`) |
        | `method_not_supported` | The domain's method does not support the operation: `PATCH` with a transport it cannot use, `probe` on a domain whose transport is not `smtp`, `test-forwarding` on an address whose domain does not use `inbound: forward` |
        | `marketing_needs_ses` | A `kind: marketing` send or reply from a domain whose transport is `cloudflare`, the platform domain included: Cloudflare Email Service is for transactional mail only. Use a domain with the `ses` or `smtp` transport |
        | `calendar_needs_raw_mime` | A calendar message on the `cloudflare` transport before the raw send is available (spike S1). A calendar message never falls back to the platform domain |
      enum: [ses_not_configured, ses_receiving_not_configured, ses_identity_limit, subdomain_setup_disabled, zone_creation_not_allowed, ses_identity_not_verified, method_not_supported, marketing_needs_ses, calendar_needs_raw_mime]

    # ── Keys and access ──────────────────────────────────────────────────────────────────────────

    Permission:
      type: string
      description: |
        A permission a key can hold.

        | Permission | Allows |
        |---|---|
        | `tenants:manage` | Create, update and suspend tenants, and their billing accounts. Platform keys, for every tenant; partner keys, for the tenants their partner's keys created, without changing billing |
        | `identities:read`, `identities:write` | Read, and create, update, pause or delete identities and addresses, and test forwarding; read, and create, rotate or revoke identity signing keys. Deleting an identity also needs `erasure:manage`, because it starts an identity-scope erasure |
        | `identities:sign` | Mint agent assertions and Web Bot Auth HTTP signatures as an identity. Tenant and identity keys (an identity key only for its own identity); platform and partner keys cannot hold it, but may grant it to the tenant and identity keys they mint |
        | `domains:read`, `domains:write` | Read, and add, update, verify, probe or remove domains |
        | `messages:read` | Threads, messages (one at a time or up to 100 with `batch-get`), raw MIME, deliveries, screening feedback |
        | `messages:send` | Send, reply, reply-all, forward, cancel, calendar replies, and send drafts (with `drafts:read`); create, read and delete uploads (or with `drafts:write`) |
        | `messages:write` | Labels, read state and archiving, of a message, a thread or up to 100 messages (`batch-update`, with its atomic claim); re-run triage; resolve uncertain sends; screening feedback |
        | `drafts:read` | List and read drafts and their attachments, and the tenant's queue of drafts awaiting approval, scheduled or failed. Every key level; the tenant queue needs a platform, partner or tenant key |
        | `drafts:write` | Create, update, request approval for and delete (cancel) drafts; create, read and delete uploads (or with `messages:send`). Includes `drafts:read`. Every key level |
        | `drafts:approve` | Approve and reject drafts. Includes `drafts:read`. Platform, partner and tenant keys; never identity keys, so an agent cannot approve its own mail. Approving by an API key is also a decision reserved for people: a key approves only while `PM_QUARANTINE_KEY_RELEASE` is `on` or `PM_CONSOLE` is `off`, or where the tenant's `drafts.key_approval` is `true`, which admits only a platform key or the tenant's own partner key; approving with `send: true` also needs `messages:send` |
        | `attachments:read` | Attachment bytes and extracted text |
        | `search:read` | Keyword, semantic, hybrid search, contacts, related, wait |
        | `search:agentic` | Agentic search |
        | `quarantine:review` | See and release quarantined mail |
        | `webhooks:read` | Read webhook endpoints and their deliveries |
        | `webhooks:manage` | Create, change, test, rotate and delete webhook endpoints, and replay. Includes `webhooks:read` |
        | `events:read` | Read the tenant's event log: the feed, durable event consumers, stream tokens and the WebSocket stream |
        | `metrics:read` | Pause-window rates and event counts, and the screening summary. Every key level; never implicit |
        | `keys:manage` | API keys within the caller's scope. A partner key manages only tenant and identity keys of its own tenants |
        | `erasure:manage` | Erasure requests, legal holds, exports. A `tenant`-scope erasure request also needs `tenants:erase` |
        | `tenants:erase` | Delete the workspace (a `tenant`-scope erasure request, with `erasure:manage`). Platform keys, partner keys for their own tenants, and tenant keys minted by the workspace owner's console session or by a key descended from one |
        | `suppressions:manage` | Suppressions, and allow or block lists of the tenant or of one identity |
        | `usage:read` | Plan, allowances and usage figures. Every tenant and identity key holds it implicitly for its own workspace; platform and partner keys must hold it explicitly and pass `tenant_id` |
        | `audit:read` | Audit log |
        | `policy:write` | Read the per-field limits of, and change, the tenant's policy (`getTenantPolicy`, `updateTenantPolicy`) within the key level's rules |
        | `accounts:request` | Request, list, read and close service-ledger entries |
        | `accounts:approve` | Approve, reject and delete service-ledger entries; includes `accounts:request`. Approval by an API key is a decision reserved for people |
        | `members:read` | List console members and pending invitations (tenant, partner and platform keys; every console role holds it) |
        | `members:manage` | Invite, revoke, change roles and remove console members (tenant, partner and platform keys). Includes `members:read` |
        | `partners:manage` | Create, list, read, update and delete partners (platform keys only) |
        | `platform:ops` | Platform operations: signing-key rotation, the dead-letter queue, maintenance jobs, waitlist invitations, the list of agent sign-ups (platform keys only) |

        The upload routes take either `messages:send` or `drafts:write` (`x-required-permission-any`): a key
        needs one of them, not both. While a workspace is a provisional agent sign-up, every key of it acts
        with at most `identities:read`, `messages:read`, `messages:send`, `messages:write`, `attachments:read`,
        `search:read`, `events:read` and the implicit `usage:read`, whatever it lists; a route outside that
        set answers `403 permission_denied` with `details.reason = "signup_unverified"`.

        Which key levels can hold a permission. `POST /v1/keys` refuses any other combination with
        `400 invalid_request` and `details.reason = "permission_not_allowed_for_level"`:

        | Permissions | Key levels |
        |---|---|
        | `platform:ops`, `partners:manage` | platform |
        | `tenants:manage` | platform, partner |
        | `members:read`, `members:manage`, `suppressions:manage`, `audit:read`, `usage:read`, `policy:write`, `accounts:approve`, `drafts:approve` | platform, partner, tenant |
        | `tenants:erase` | platform, partner, and tenant keys minted by the workspace owner or its keys (otherwise `details.reason = "permission_owner_only"`) |
        | `identities:sign` | tenant, identity (platform and partner keys may grant it without holding it) |
        | Every other permission | platform, partner, tenant, identity |
      enum:
        - 'tenants:manage'
        - 'tenants:erase'
        - 'partners:manage'
        - 'identities:read'
        - 'identities:write'
        - 'identities:sign'
        - 'domains:read'
        - 'domains:write'
        - 'messages:read'
        - 'messages:send'
        - 'messages:write'
        - 'drafts:read'
        - 'drafts:write'
        - 'drafts:approve'
        - 'attachments:read'
        - 'search:read'
        - 'search:agentic'
        - 'quarantine:review'
        - 'webhooks:read'
        - 'webhooks:manage'
        - 'events:read'
        - 'metrics:read'
        - 'keys:manage'
        - 'erasure:manage'
        - 'suppressions:manage'
        - 'usage:read'
        - 'audit:read'
        - 'members:read'
        - 'members:manage'
        - 'policy:write'
        - 'accounts:request'
        - 'accounts:approve'
        - 'platform:ops'
    KeyLevel:
      type: string
      description: >-
        From widest to narrowest: `platform` reaches every tenant; `partner` reaches the tenants its
        partner's keys created and its partner's webhook endpoints (FR-KEY-4); `tenant` reaches its own
        tenant; `identity` reaches its own identity, plus its tenant's domains read-only with `domains:read`
        and its tenant's webhook endpoints and deliveries read-only with `webhooks:read`. A route or field
        that needs a higher level returns `403 scope_denied`.
      enum: [platform, partner, tenant, identity]
    Mode:
      type: string
      description: '`live` or `test`. Mail a `test` tenant sends never leaves the deployment (FR-TEN-2).'
      enum: [live, test]
    Me:
      type: object
      description: The key that made the request.
      required: [key_id, name, level, mode, partner_id, tenant_id, identity_id, permissions, mcp_tools, expires_at]
      properties:
        key_id: {$ref: '#/components/schemas/KeyId'}
        name:
          type: string
        level: {$ref: '#/components/schemas/KeyLevel'}
        mode: {$ref: '#/components/schemas/Mode'}
        partner_id:
          description: '`null` unless the key is partner-level.'
          oneOf:
            - $ref: '#/components/schemas/PartnerId'
            - type: 'null'
        tenant_id:
          description: '`null` for platform and partner keys.'
          oneOf:
            - $ref: '#/components/schemas/TenantId'
            - type: 'null'
        identity_id:
          description: '`null` unless the key is identity-level.'
          oneOf:
            - $ref: '#/components/schemas/IdentityId'
            - type: 'null'
        permissions:
          type: array
          uniqueItems: true
          items: {$ref: '#/components/schemas/Permission'}
        mcp_tools: {$ref: '#/components/schemas/McpToolList'}
        expires_at:
          type: [string, 'null']
          format: date-time

    Health:
      type: object
      required: [status, version, commit, env]
      properties:
        status:
          type: string
          description: >-
            `ok`, or `degraded` when a feature is off because of the configuration; the fields below name
            it.
          enum: [ok, degraded]
        ses:
          type: string
          description: Present when the SES transport is off because `PM_SES_SNS_TOPIC_ARN` is missing.
          enum: [sns_topic_missing]
        billing:
          type: string
          description: Present when `PM_BILLING=stripe` lacks `PM_STRIPE_SECRET_KEY` or `PM_STRIPE_WEBHOOK_SECRET`, so billing has not started.
          enum: [stripe_secrets_missing]
        cf_api_token:
          type: string
          description: Present when a Cloudflare REST fallback is in use (a spike S6 result) and `PM_CF_API_TOKEN` is not set.
          enum: [missing]
        ses_region:
          type: string
          description: '`PM_SES_REGION`, present when SES is configured, so anyone can see where AWS processes mail.'
          examples: [eu-west-2]
        version:
          type: string
          description: The deployed release, for example `1.0.0`.
        commit:
          type: string
          description: The short commit hash of the build.
        env:
          type: string
          description: '`PM_ENV` of the deployment.'
          enum: [production, staging, local]
        frozen:
          type: boolean
          description: 'Present and `true` while the deployment is frozen for a restore (`PM_FREEZE = "on"`).'

    # ── Tenants ──────────────────────────────────────────────────────────────────────────────────

    TenantStatus:
      type: string
      description: '`erasing` and `erased` are set by a tenant-scope erasure.'
      enum: [active, suspended, erasing, erased]
    TenantSlug:
      type: string
      pattern: '^[a-z0-9][a-z0-9-]{1,31}$'
      examples: [acme]
    AddressSuffix:
      type: string
      description: >-
        Appended to usernames on the platform domain (`bookings` + `.acme` → `bookings.acme@agents.example`).
        Defaults to `"." + slug`. Only the default tenant made by `pmail setup` can have an empty suffix. A
        suffix that folds to a reserved name gets `400 address_reserved`, and one that folds to another
        tenant's suffix gets `409 suffix_taken` ([D12]).
      pattern: '^(\.[a-z0-9][a-z0-9-]{1,31})?$'
      examples: [.acme]
    Tenant:
      type: object
      required: [id, slug, name, mode, status, suspended_by, partner_id, address_suffix, timezone, policy, sending_paused_at, created_at, updated_at]
      properties:
        id: {$ref: '#/components/schemas/TenantId'}
        slug: {$ref: '#/components/schemas/TenantSlug'}
        name:
          type: string
          examples: [Acme Car Hire]
        mode: {$ref: '#/components/schemas/Mode'}
        status: {$ref: '#/components/schemas/TenantStatus'}
        suspended_by:
          type: [string, 'null']
          description: >-
            Who suspended the tenant while `status` is `suspended`: `platform` (a platform key; a partner key
            cannot lift it) or `partner` (the tenant's partner key). `null` otherwise.
          enum: [platform, partner, null]
        partner_id:
          description: >-
            The partner whose key created the tenant, or `null` (created by a platform key, by `pmail setup` or
            by self-serve sign-up). Set at creation and never changed, also after the tenant is erased and
            the partner deleted.
          oneOf:
            - $ref: '#/components/schemas/PartnerId'
            - type: 'null'
        address_suffix: {$ref: '#/components/schemas/AddressSuffix'}
        timezone:
          type: string
          description: IANA time zone. Daily caps and date filters resolve in it.
          examples: [Europe/London]
        policy:
          $ref: '#/components/schemas/TenantPolicy'
        sending_paused_at:
          type: [string, 'null']
          format: date-time
          description: >-
            When the tenant's sending was paused automatically because its complaint or bounce rate reached
            the provider's review level over 7 days (FR-DLV-6, [G12]) or one of its domains had a burst far
            above it ([J33]); `null` while it may send. Every send then gets `409 sending_paused`, whose
            `details.reason` (`abuse_threshold` or `abuse_burst`) says which. Only a platform key can resume
            it (`sending_paused: false`).
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    TenantCreateRequest:
      type: object
      required: [slug, name, mode]
      properties:
        slug: {$ref: '#/components/schemas/TenantSlug'}
        name:
          type: string
          minLength: 1
        mode: {$ref: '#/components/schemas/Mode'}
        timezone:
          type: string
          description: IANA time zone name (for example `Europe/London`). An unknown name is refused with `400 invalid_request` (path `timezone`).
          default: UTC
        address_suffix: {$ref: '#/components/schemas/AddressSuffix'}
        policy:
          $ref: '#/components/schemas/TenantPolicyPatch'
        owner:
          type: object
          description: >-
            Creates the workspace's console owner and emails them a sign-in link. Without it, a platform or
            partner key can add an owner later with an invitation and an ownership transfer in the console.
          required: [email]
          properties:
            email: {$ref: '#/components/schemas/EmailAddress'}
            name:
              type: string
              minLength: 1
              examples: [Sam Patel]
        billing:
          type: object
          description: >-
            The workspace's billing account. Platform keys only: a partner key gets `403 scope_denied`, and its
            tenants take the partner's `default_billing_mode`.
          properties:
            mode:
              description: Defaults to `metered` (plan `free`) on a deployment with billing on, and to `disabled` otherwise.
              $ref: '#/components/schemas/BillingMode'
    TenantUpdateRequest:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
        timezone:
          type: string
          description: IANA time zone name (for example `Europe/London`). An unknown name is refused with `400 invalid_request` (path `timezone`).
        policy:
          $ref: '#/components/schemas/TenantPolicyPatch'
        status:
          type: string
          description: >-
            `suspended` suspends the tenant (FR-TEN-3) and records `suspended_by`; `active` resumes it, except
            that a partner key cannot resume a tenant a platform key suspended (`403 scope_denied`).
          enum: [active, suspended]
        sending_paused:
          type: boolean
          const: false
          description: >-
            `false` lifts an automatic sending pause ([G12]), audit-logged. Platform keys only: any other key
            gets `403 scope_denied` with `details.field = "sending_paused"`. A pause is never set by hand.

    TenantPolicy:
      type: object
      description: >-
        The full effective policy of a tenant: the built-in defaults shown here, then `PM_DEFAULT_POLICY`,
        then the tenant's own values, deep-merged. Who may write each field (docs › Configuration › Who may
        change a field): platform keys write every field. For a partner key, `web_bot_auth.allowed`,
        `domains.allow_create_zone`, `domains.cloudflare_zones` and `inbound.trusted_arc_sealers` are
        platform-only; `quarantine.key_release` and `drafts.key_approval` are allowed on its own tenants; the
        lower-only fields
        (`identity_daily_send_cap`, `tenant_daily_send_cap`, `max_recipients`, `auto_reply.allowed`,
        `auto_reply.max_automatic_exchanges`, `inbound.per_sender_per_hour`,
        `inbound.unauthenticated_per_hour`, `inbound.per_tenant_per_hour`, `inbound.extract_image_text`,
        `retention.raw_days`, `retention.events_days`, `triage.enabled`, `triage.daily_model_cap`,
        `search.agentic_enabled`,
        `search.agentic_daily_cap`, `search.agentic_max_steps`, `search.agentic_max_seconds` and the `abuse`
        thresholds) may be set at most to min(deployment default, platform ceiling), a switch to `true`
        only when both allow it (for `accounts.require_approval`, `false` is the looser value); every other
        field is free. A tenant key with `policy:write` (`updateTenantPolicy`) may set free fields, lower a
        lower-only field to at most its workspace ceiling (the strictest of the deployment default, the
        platform ceiling and the partner ceiling), and only tighten the guard fields `send_allowlist_only`,
        `quarantine.on_auth_fail`, `quarantine.spam_threshold`, `quarantine.unsolicited_otp`,
        `drafts.require_approval`, `screening.mode`, `screening.on_unavailable` and
        `screening.deadline_seconds` unless API keys may take decisions reserved for people on the tenant;
        platform-only fields, `quarantine.key_release` and `drafts.key_approval` are not writable for it. A refused field gets `403 scope_denied` with
        `details.field` (or `403 permission_denied` with `details.reason = "person_required"` for a guard
        field) and nothing is stored. Identity keys cannot write the policy. While a tenant is a provisional
        agent sign-up, its effective policy also takes a fixed overlay that only tightens (docs › Agent
        self-sign-up § 4.2); the overlay is not stored.
      required: [identity_daily_send_cap, tenant_daily_send_cap, max_recipients, send_allowlist_only, large_attachments, link_ttl_hours, ai_disclosure, auto_reply, quarantine, inbound, retention, triage, search, webhook_text_bytes, abuse, domains, events, domain_fallback, web_bot_auth, accounts, drafts, screening]
      properties:
        identity_daily_send_cap:
          type: integer
          minimum: 0
          default: 500
          description: Sends per identity per day (tenant time zone). Then `429 daily_cap_reached`.
        tenant_daily_send_cap:
          type: integer
          minimum: 0
          default: 5000
          description: >-
            Sends per tenant per day (tenant time zone). Then `429 daily_cap_reached`. With billing on, a new
            workspace on the Free plan has an effective cap of the lower of this value and 50 until its
            new-workspace send ramp is lifted (at the earliest on day 7, or at once on a paid plan).
        max_recipients:
          type: integer
          minimum: 1
          maximum: 49
          default: 10
          description: >-
            Recipients per message across `to`, `cc` and `bcc`, 1–49. Cloudflare allows 50 recipients per
            message, and one is kept for the hidden journal copy. Then `400 too_many_recipients`.
        send_allowlist_only:
          type: boolean
          default: false
          description: Only recipients on the send-allow list are allowed.
        large_attachments:
          type: string
          enum: [refuse, link]
          default: refuse
          description: '`refuse` returns `413 message_too_large`; `link` turns oversized attachments into expiring signed links.'
        link_ttl_hours:
          type: integer
          minimum: 1
          maximum: 168
          default: 72
          description: Lifetime of signed attachment links.
        ai_disclosure:
          type: object
          required: [mode, text]
          properties:
            mode:
              type: string
              enum: [none, footer, header]
              default: none
              description: '`footer` appends `text` to text and HTML bodies; `header` adds `X-AI-Generated: true`.'
            text:
              type: string
              default: This message was written with the help of an AI assistant.
          default:
            mode: none
            text: This message was written with the help of an AI assistant.
        auto_reply:
          type: object
          required: [allowed, max_automatic_exchanges]
          properties:
            allowed:
              type: boolean
              default: true
            max_automatic_exchanges:
              type: integer
              minimum: 0
              default: 2
              description: Automatic replies allowed per thread before a human must act ([D6]).
          default:
            allowed: true
            max_automatic_exchanges: 2
        quarantine:
          type: object
          required: [on_auth_fail, spam_threshold, unsolicited_otp, key_release]
          properties:
            on_auth_fail:
              type: boolean
              default: true
              description: Quarantine mail that fails authentication.
            spam_threshold:
              type: number
              minimum: 0
              maximum: 1
              default: 0.8
              description: Quarantine mail whose spam score is at or above this value.
            unsolicited_otp:
              type: boolean
              default: true
              description: Quarantine password-reset and OTP mail that no `wait` asked for ([E5]).
            key_release:
              type: boolean
              default: false
              description: >-
                Lets keys with `quarantine:review` that reach this tenant (its partner key included) release
                quarantined mail even when `PM_QUARANTINE_KEY_RELEASE` is `off`. Only a platform key, or the
                partner key of the tenant's own partner, can set it, at creation or later ([J14], [J16]).
          default:
            on_auth_fail: true
            spam_threshold: 0.8
            unsolicited_otp: true
            key_release: false
        inbound:
          type: object
          required: [per_sender_per_hour, unauthenticated_per_hour, per_tenant_per_hour, extract_attachment_text, extract_image_text, ses_bounce_retired, trusted_arc_sealers]
          properties:
            per_sender_per_hour:
              type: integer
              minimum: 1
              default: 60
              description: >-
                Inbound messages per sender per identity per hour; the excess is stored `throttled` ([D5]). A
                sender whose mail does not pass authentication is counted under `unauth:` + its address, so a
                forged `From` never uses a real correspondent's allowance.
            unauthenticated_per_hour:
              type: integer
              minimum: 1
              default: 120
              description: >-
                Inbound messages per identity per hour, across all senders whose mail does not pass
                authentication and who are not known correspondents; the excess is stored `throttled` ([D13]).
            per_tenant_per_hour:
              type: integer
              minimum: 1
              default: 2000
              description: >-
                Inbound messages per tenant per hour, across its identities, from senders who are not known
                correspondents; the excess is stored `throttled` ([D13]).
            extract_attachment_text:
              type: array
              uniqueItems: true
              items:
                type: string
                enum: [pdf, office, text, html]
              default: [pdf, office, text, html]
              description: Attachment families whose text is extracted.
            extract_image_text:
              type: boolean
              default: false
              description: Extract text from images.
            ses_bounce_retired:
              type: boolean
              default: true
              description: >-
                On SES-receiving domains, `true` bounces mail to retired addresses with `550 5.1.6` through SES
                receipt rules; `false` drops it without a bounce.
            trusted_arc_sealers:
              type: array
              maxItems: 20
              uniqueItems: true
              default: [google.com, microsoft.com]
              items:
                type: string
                pattern: '^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?(\.[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?)+$'
              description: >-
                ARC sealers, by the `d=` of their `ARC-Seal` (A-label registrable domains), whose verified seal can
                rescue mail that fails DMARC (verdict `arc_rescued`). A public suffix is refused. `[]` turns the
                rescue off. Platform-only.
          default:
            per_sender_per_hour: 60
            unauthenticated_per_hour: 120
            per_tenant_per_hour: 2000
            extract_attachment_text: [pdf, office, text, html]
            extract_image_text: false
            ses_bounce_retired: true
            trusted_arc_sealers: [google.com, microsoft.com]
        retention:
          type: object
          required: [raw_days, message_days, events_days]
          properties:
            raw_days:
              type: integer
              minimum: 1
              default: 90
              description: Days raw MIME is kept. Then `410 raw_expired`.
            message_days:
              type: [integer, 'null']
              minimum: 1
              default: null
              description: >-
                `null` keeps parsed messages indefinitely. A number deletes messages, attachments, index rows
                and vectors after that age, except held threads.
            events_days:
              type: integer
              minimum: 1
              maximum: 365
              default: 30
              description: >-
                Days events, delivery logs and replayable event payloads are kept. Webhook replay reaches back
                30 days from an event's `occurred_at`, or this many days if fewer.
          default:
            raw_days: 90
            message_days: null
            events_days: 30
        triage:
          type: object
          required: [enabled, daily_model_cap, categories, rules]
          properties:
            enabled:
              type: boolean
              default: true
            daily_model_cap:
              type: integer
              minimum: 0
              default: 2000
              description: >-
                Model-backed triage runs per day in the tenant's time zone. Past it, triage is rules-only
                (`model: "rules"`) until the next local midnight. It applies whatever the billing mode, so an
                `exempt` workspace still has a ceiling on model spend ([D13]). Screening counts its own calls
                against the same number on a separate counter, at most a tenth of it per authenticated sender
                address and four fifths for senders that are not known correspondents; a
                screening verdict past it is `unavailable` with reason `model_cap` and always held.
            categories:
              type: [array, 'null']
              maxItems: 20
              items: {$ref: '#/components/schemas/TriageCategoryDefinition'}
              default: null
              description: '`null` uses the built-in categories. Otherwise up to 20 custom categories that replace them.'
            rules:
              type: array
              maxItems: 50
              items: {$ref: '#/components/schemas/TriageRule'}
              default: []
              description: Deterministic rules that run before the model (FR-TRI-2), at most 50.
          default:
            enabled: true
            daily_model_cap: 2000
            categories: null
            rules: []
        search:
          type: object
          required: [agentic_enabled, agentic_daily_cap, agentic_max_steps, agentic_max_seconds, refs_packs, custom_refs]
          properties:
            agentic_enabled:
              type: boolean
              default: true
            agentic_daily_cap:
              type: integer
              minimum: 0
              default: 500
              description: Agentic searches per tenant per day. Then `429 agentic_budget_exhausted`.
            agentic_max_steps:
              type: integer
              minimum: 2
              maximum: 10
              default: 6
              description: The default, and the maximum, `budget.max_steps`.
            agentic_max_seconds:
              type: integer
              minimum: 3
              maximum: 30
              default: 8
              description: The default, and the maximum, `budget.max_seconds`.
            refs_packs:
              type: array
              uniqueItems: true
              items:
                type: string
                enum: [core, uk_vehicle]
              default: [core]
              description: >-
                `core`: amounts, phones, emails, domains, dates, invoice and order numbers. `uk_vehicle`:
                plates and PCNs.
            custom_refs:
              type: array
              maxItems: 20
              items: {$ref: '#/components/schemas/CustomRefPattern'}
              default: []
          default:
            agentic_enabled: true
            agentic_daily_cap: 500
            agentic_max_steps: 6
            agentic_max_seconds: 8
            refs_packs: [core]
            custom_refs: []
        webhook_text_bytes:
          type: integer
          minimum: 0
          maximum: 65536
          default: 16384
          description: Bytes of `extracted_text` included in `message.received` payloads.
        abuse:
          type: object
          required: [complaint_rate_pause, bounce_rate_pause, tenant_complaint_rate_pause, tenant_bounce_rate_pause]
          properties:
            complaint_rate_pause:
              type: number
              minimum: 0
              maximum: 1
              default: 0.003
              description: Pause an identity whose complaint rate over its last 1,000 sends exceeds this (FR-DLV-3).
            bounce_rate_pause:
              type: number
              minimum: 0
              maximum: 1
              default: 0.05
              description: Pause an identity whose bounce rate over its last 200 sends exceeds this (FR-DLV-3).
            tenant_complaint_rate_pause:
              type: number
              minimum: 0
              maximum: 1
              default: 0.001
              description: >-
                Pause the tenant's sending, or one of its sending domains, when its complaint rate over the last
                7 UTC days, with at least 500 outcomes, reaches this (FR-DLV-6, [G12]). The default is Amazon
                SES's review rate.
            tenant_bounce_rate_pause:
              type: number
              minimum: 0
              maximum: 1
              default: 0.05
              description: As `tenant_complaint_rate_pause`, for the bounce rate (FR-DLV-6, [G12]).
          default:
            complaint_rate_pause: 0.003
            bounce_rate_pause: 0.05
            tenant_complaint_rate_pause: 0.001
            tenant_bounce_rate_pause: 0.05
        domains:
          type: object
          required: [allow_create_zone, cloudflare_zones]
          properties:
            allow_create_zone:
              type: boolean
              default: false
              description: >-
                Lets the tenant's own keys, and its partner key, use the `nameservers` method, which creates a
                Cloudflare zone. Without it, they get `422 transport_unavailable` (`zone_creation_not_allowed`).
                Platform keys may always use it, when the Worker's Cloudflare token can create zones. Pylota Mail
                Cloud keeps it `false` (its Worker token, in a Cloudflare account shared with Pylota, cannot create
                zones). Platform-only.
            cloudflare_zones:
              type: array
              maxItems: 50
              uniqueItems: true
              default: []
              items:
                type: string
                pattern: '^=?[a-z0-9.-]{1,253}$'
              description: >-
                Zones of the deployment's Cloudflare account, by A-label name, that the tenant's own keys and
                its partner key may use with `cloudflare_zone` (names strictly under a listed zone, never its
                apex), and exact host names written `=name` (for example `=notify.pylota.io`), which grant that
                one name only; list a zone you also use yourself only by exact names. These are besides the
                zones this deployment created for the tenant (`nameservers`, `delegated_subdomain`), and
                `replace_mx` is platform-only except on those. A zone created for
                another tenant, or under the zones of the deployment's platform domain, API host or console
                host, is refused even when listed (`403 scope_denied`, `details.reason = "zone_not_allowed"`).
                Platform keys may use any zone. The zone must also be among the zones of the Worker's
                Cloudflare token. Dropping a zone while the tenant still has domains in it is refused
                (`409 domain_in_use`, `zone_has_domains`). Platform-only.
          default:
            allow_create_zone: false
            cloudflare_zones: []
        events:
          type: object
          required: [labels_changed]
          properties:
            labels_changed:
              type: boolean
              default: false
              description: >-
                `true` emits the opt-in event `message.labels_changed`, delivered only to endpoints that name it.
          default:
            labels_changed: false
        domain_fallback:
          type: boolean
          default: true
          description: '`false` fails sends on a failing domain (`domain_failing_no_fallback`) instead of using the platform address.'
        web_bot_auth:
          type: object
          required: [allowed]
          properties:
            allowed:
              type: boolean
              default: false
              description: >-
                Lets the tenant's identities sign HTTP requests (Web Bot Auth). While it is `false`,
                `POST …/http-signatures` returns `403 policy_denied` ([O13]). It has no effect while the
                deployment has `PM_WEB_BOT_AUTH=off`. Agent assertions do not depend on it. Platform-only.
          default:
            allowed: false
        accounts:
          type: object
          required: [require_approval]
          properties:
            require_approval:
              type: boolean
              default: false
              description: >-
                `true` turns on the service sign-up ledger gate: a verification code or link from a service
                reaches the tenant's agents only when an approved ledger entry matches the mail; other such
                mail is quarantined `account_unapproved`, and `wait` with `kind=verification` needs an approved
                entry (`403 policy_denied`). Pylota Mail Cloud sets `true` in `PM_DEFAULT_POLICY`. Lower-only,
                with `false` as the looser value.
          default:
            require_approval: false
        drafts:
          type: object
          required: [require_approval, key_approval]
          properties:
            require_approval:
              description: >-
                When a send needs approval: `never`, `new_recipients` (a recipient is neither known nor internal
                to the workspace), `external` (a recipient is not internal) or `always`. It applies to draft sends
                and to direct sends, which get `403 approval_required` when approval is needed; an identity's
                `send_policy.require_approval` can only make it stricter. A guard field: tightening means a
                level at or above the current one in the order `never` < `new_recipients` < `external` <
                `always`.
              default: never
              $ref: '#/components/schemas/RequireApproval'
            key_approval:
              type: boolean
              default: false
              description: >-
                Lets API keys with `drafts:approve` that reach this tenant, its partner key included, approve
                drafts even when `PM_QUARANTINE_KEY_RELEASE` is `off`; with it, only a platform key or the
                tenant's own partner key approves, never a tenant key. Only a platform key or the tenant's own
                partner key can set it; `quarantine.key_release` does not imply it.
          default:
            require_approval: never
            key_approval: false
        screening:
          type: object
          required: [mode, on_unavailable, deadline_seconds]
          properties:
            mode:
              type: string
              enum: ['off', monitor, hold]
              default: monitor
              description: >-
                `off`; `monitor` (mail is delivered at once and screened alongside, with a `message.screened`
                event); or `hold` (mail waits, hidden from agents, in status `screening` until its verdict).
                Guard field: tightening is a value at least as strict in the order `off` < `monitor` < `hold`.
            on_unavailable:
              type: string
              enum: [quarantine, deliver]
              default: quarantine
              description: >-
                `quarantine` (no verdict by the deadline holds the message as `screening_unavailable`) or
                `deliver`. `deliver` applies only to `model_unavailable`, `ai_rate_limited` and
                `deadline_exceeded`; `model_cap` and `invalid_output`, which the mail itself can cause, are
                always held. Guard field; `quarantine` is the stricter value.
            deadline_seconds:
              type: integer
              minimum: 30
              maximum: 900
              default: 120
              description: >-
                The longest a held message waits for its verdict. Guard field: a tenant key may lower it only
                while the effective `on_unavailable` after the write is `quarantine`, otherwise only raise it.
          default:
            mode: monitor
            on_unavailable: quarantine
            deadline_seconds: 120

    TenantPolicyPatch:
      type: object
      description: >-
        A partial `TenantPolicy`, deep-merged over the current policy. Any field set to `null` resets to its
        default (for `retention.message_days` and `triage.categories`, whose default is `null`, this is the
        same as setting `null`). Arrays replace, they do not merge.
      properties:
        identity_daily_send_cap:
          type: [integer, 'null']
          minimum: 0
        tenant_daily_send_cap:
          type: [integer, 'null']
          minimum: 0
        max_recipients:
          type: [integer, 'null']
          minimum: 1
          maximum: 49
        send_allowlist_only:
