        always carries `partial` and `failed_identities`: each identity's mailbox has 900 ms from the start
        of the fan-out, and one that errors or misses it is listed in `failed_identities` with
        `partial: true` ([F15]); otherwise they are `false` and `[]`. `mode: "agentic"` with agentic search
        turned off by tenant policy returns `422 agentic_disabled`.
