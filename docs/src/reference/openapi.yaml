  # ──────────────────────────────────────────── Webhooks ──────────────────────────────────────────

  /webhooks:
    post:
      operationId: createPlatformWebhook
      tags: [Webhooks]
      summary: Create a platform or partner webhook endpoint
      description: >-
        Platform and partner keys. With a platform key it creates a platform endpoint (`scope: "platform"`),
        which receives events from every tenant; with a partner key, a partner endpoint
        (`scope: "partner"`), which receives only the events of the tenants its partner's keys created. Both
        are filtered by `events` and `identity_ids`. The response carries `secret` (`whsec_…`), **shown only
        once**. `events: ["*"]` subscribes to everything, including event types added later, except the
        opt-in `message.labels_changed`, which must be named. The URL must be HTTPS; private, loopback and
        reserved addresses are refused (FR-WH-5). `headers` (optional) adds up to 10 static request headers to
        every delivery, values together at most 4,096 bytes; values are write-only (`header_names`).
      x-required-permission: ['webhooks:manage']
      x-key-levels: [platform, partner]
      x-permission-notes: >-
        Mail events need more than `webhooks:manage` ([J29]): when the endpoint's `events` include `*`, any
        `message.*` type, `verification.received` or `calendar.received`, the key must also hold
        `messages:read`, and when they include `*`, `message.quarantined` or `message.screened`,
        `quarantine:review` as well; otherwise `403 permission_denied` with `details.required`. `draft.*`
        events carry no mail content and need `webhooks:manage` only.
      x-rate-limit-buckets: [api]
      x-idempotency: optional
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/WebhookCreateRequest'}
            example:
              url: https://api.example.com/webhooks/mail
              events: [message.received, message.bounced]
              identity_ids: null
              description: Production API
      responses:
        '201':
          description: The endpoint, with its signing secret (shown only once).
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
            RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}
            Idempotent-Replayed: {$ref: '#/components/headers/Idempotent-Replayed'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WebhookCreated'}
        '400':
          description: >-
            As `BadRequest`, plus `header_not_allowed` for a `headers` name the service refuses
            (`details.reason = "webhook_header"`, `details.name`).
          x-error-codes: [invalid_request, invalid_idempotency_key, header_not_allowed]
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/IdempotencyConflict'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '422':
          description: >-
            The tenant (or the partner, or the platform) already has 20 webhook endpoints
            (`webhook_limit_reached`), or more than 10 headers or 4,096 bytes of header values
            (`webhook_header_limit_reached`, `details.reason`).
          x-error-codes: [webhook_limit_reached, webhook_header_limit_reached]
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
    get:
      operationId: listWebhooks
      tags: [Webhooks]
      summary: List webhook endpoints
      description: >-
        With a platform key: the platform endpoints. With a partner key: its partner's endpoints. With a
        tenant key: the tenant's endpoints. An identity key reads its tenant's endpoints, read-only.
      x-required-permission: ['webhooks:read']
      x-permission-notes: '`webhooks:manage` includes `webhooks:read`. An identity key can read its tenant''s endpoints and deliveries with `webhooks:read`.'
      x-key-levels: [platform, partner, tenant, identity]
      x-rate-limit-buckets: [api]
      x-idempotency: none
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
