        '410': {$ref: '#/components/responses/CursorExpired'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
    post:
      operationId: sendMessage
      tags: [Sending]
      summary: Send a new message
      description: |
        Validates the request, runs policy (identity and tenant active, accountable human, the approval
        requirement, daily caps, suppressions and lists, recipient count, size, automated-mail rule:
        FR-OUT-3), stores the message as `queued` and returns `202` with the Message object
        (`direction: "outbound"`, `status: "queued"`) plus `"deduplicated": false`.

        - **Idempotency** (FR-OUT-1): the `Idempotency-Key` header is required. The same key with the same
          body returns the original response with `"deduplicated": true` and `Idempotent-Replayed: true`;
          a different body returns `409 idempotency_conflict`; a request still running returns
          `409 request_in_progress` (retryable). Always reuse the same key when retrying the same message.
        - **Dry run**: `?dry_run=true` runs every check (permissions, policy, recipients, suppressions and
          lists, size) without sending or storing anything, taking quota or locking the thread. The
          `Idempotency-Key` header is optional on a dry run and is never recorded. It returns `200` with a
          `DryRunResult`, or the error a real send would get, plus `422 all_recipients_suppressed` and
          `422 recipient_blocked`, which only a dry run returns.
        - **Recipients**: strings or objects, at most `policy.max_recipients` (default 10, hard maximum 49)
          across `to`, `cc` and `bcc` (`400 too_many_recipients`). Duplicates are removed. A send whose every
          recipient is suppressed is accepted and ends `suppressed`.
        - **Body**: at least one of `text` and `html`. Text is derived from HTML when missing. The identity's
          signature and the tenant's AI-disclosure footer are appended according to policy.
        - **`kind`**: `transactional` (default); `marketing`, which needs `unsubscribe` and `consent`
          (`400 marketing_requirements_missing`); `auto_reply`, which sets `Auto-Submitted: auto-replied` and
          is only allowed in reply to a non-automated message (`409 auto_reply_not_allowed`).
        - **`thread_id`** continues an existing thread without quoting; `References` are set from the thread.
        - **`from_address`** must be an `active` address of the identity, or a `retiring` one on a thread
          that already uses it ([G7]; with `thread_id`). Otherwise `400 invalid_request` with
          `details.errors[0].path = "from_address"`. The default is the primary.
        - **`headers`** accepts only `X-` names matching `^X-[A-Za-z0-9_-]+$` plus `Importance`, `Priority`,
          `Sensitivity`, `Keywords`, `Comments` and `Organization`, matched case-insensitively
          (`400 header_not_allowed`).
          `Importance` must be `high`, `normal` or `low`, `Priority` `normal`, `non-urgent` or `urgent`, and
          `Sensitivity` `personal`, `private` or `company-confidential` (`400 invalid_request`). Everything
          else is set by the service.
        - **Attachments**: each is inline (`filename`, `content_type`, `content_base64`) or an upload
          (`upload_id`, optional `filename`), with `disposition` and `content_id`. An upload must be `ready`
          and belong to the sending identity (`404 upload_not_found`, `409 upload_not_ready`,
          `410 upload_expired`). Every attachment is classified like inbound mail, and one with a quarantining
          risk (also after a rename) gets `422 attachment_risky`.
        - **Size**: attachments total at most 26,214,400 decoded bytes, and the encoded message must fit the
          transport limit (5 MiB with Cloudflare), otherwise `413 message_too_large` (`details.reason`
          `attachments_total` or `transport_limit`). With `policy.large_attachments: "link"`, oversized
          attachments become expiring signed links instead.
        - **Approval required** (FR-DRF-4): when the tenant's `drafts.require_approval`, or the identity's
          stricter `send_policy.require_approval`, needs approval for these recipients, the send is refused
          with `403 approval_required` (`details.reason`, `details.recipients`) and nothing is stored: create
          the same message as a draft (`createDraft`) and send it; it waits for an approver.
        - **`calendar`** sends iMIP (docs › Calendar invitations § 5).
        - **Expired messages**: a retry with the same `Idempotency-Key` and body after the message expired
          under the identity's `retention.message_hours` gets `410 message_expired` and nothing is sent.

        Failures after `202` arrive as message status and events (`message.rejected`, `message.failed`,
        `message.uncertain`, `message.bounced`), never as HTTP errors.
      x-required-permission: ['messages:send']
      x-key-levels: [platform, partner, tenant, identity]
      x-rate-limit-buckets: [api, send]
      x-idempotency: required
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeySend'
        - $ref: '#/components/parameters/DryRun'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SendRequest'}
            example:
              to:
                - address: jo@example.net
                  name: Jo Rivera
              cc: []
              bcc: []
              subject: Your booking BK-2291 is confirmed
              text: Hi Jo, your Golf is booked for Friday 10:00…
              html: <p>Hi Jo, your Golf is booked for <b>Friday 10:00</b>…</p>
              attachments:
                - filename: BK-2291.pdf
                  content_type: application/pdf
                  content_base64: JVBERi0xLjcK
                  disposition: attachment
              kind: transactional
              thread_id: null
              from_address: null
              labels: [booking]
              headers:
                X-Booking-Ref: BK-2291
              metadata:
                booking_id: bk_2291
      responses:
        '200': {$ref: '#/components/responses/DryRunOk'}
        '202':
          description: Accepted into the queue, or the original response when the request is a replay.
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
            RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}
            Idempotent-Replayed: {$ref: '#/components/headers/Idempotent-Replayed'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SendResponse'}
        '400': {$ref: '#/components/responses/SendBadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '402':
          $ref: '#/components/responses/BillingLimit'
          description: 'The plan''s `sends` allowance is spent (`details.feature: "sends"`). Nothing was stored: upgrade or add a top-up, then retry with the same `Idempotency-Key`.'
        '403': {$ref: '#/components/responses/SendForbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/SendConflict'}
        '410': {$ref: '#/components/responses/SendGone'}
        '413': {$ref: '#/components/responses/SendPayloadTooLarge'}
        '422': {$ref: '#/components/responses/SendUnprocessable'}
        '429': {$ref: '#/components/responses/SendTooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
        '504': {$ref: '#/components/responses/GatewayTimeout'}

