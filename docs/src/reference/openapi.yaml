          description: The erasure request, with its receipt once complete.
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
            RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErasureRequest'}
              example:
                id: era_01J9Z3K8V4QW7X2M5N6P8R0T1Y
                tenant_id: ten_01J9Z3K8V4QW7X2M5N6P8R0T1Y
                scope: counterparty
                status: completed_with_holds
                identity_id: null
                target_id: null
                resumes_id: null
                created_at: '2026-10-09T10:00:00Z'
                deadline_at: '2026-10-10T10:00:00Z'
                completed_at: '2026-10-09T10:04:12Z'
                receipt:
                  messages_deleted: 14
                  attachments_deleted: 9
                  r2_objects_deleted: 38
                  fts_rows_deleted: 14
                  refs_deleted: 51
                  vectors_deleted: 63
                  events_deleted: 31
                  log_events_deleted: 31
                  drafts_deleted: 2
                  uploads_deleted: 0
                  screenings_deleted: 3
                  screening_feedback_deleted: 1
                  list_entries_deleted: 0
                  identities_affected: [idn_01J9Z3K8V4QW7X2M5N6P8R0T1Y, idn_01JA2B3C4D5E6F7G8H9J0K1M2N]
                  held:
                    - thread_id: thr_01JA2B3C4D5E6F7G8H9J0K1M2N
                      reason: PCN dispute WM12345678
                  probe:
                    keyword_hits: 0
                    semantic_hits: 0
                    log_hits: 0
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}

  /exports:
    post:
      operationId: createExport
      tags: [Privacy]
      summary: Start a subject-access export
      description: >-
        Builds a ZIP holding one `.eml` per message plus `messages.json`. `scope` is `counterparty` (with
        `counterparty_address`: every message to or from it across the tenant's identities, FR-PRV-5) or
        `identity` (with `identity_id`: the whole mailbox). Returns `202` with the export
        (`status: "queued"`). When finished, the export has a `download_url` (a signed link for one
        download within one hour, minted again on each `getExport`) until `expires_at`, 7 days later, and an
        `export.completed` event is emitted. Quarantined, hidden and throttled messages are included as
        `.eml` only when the key also holds `quarantine:review`; otherwise `messages.json` lists them with
        `content_withheld: "quarantine_review_required"` ([I14]).
      x-required-permission: ['erasure:manage', 'messages:read', 'attachments:read']
      x-key-levels: [platform, partner, tenant]
      x-permission-notes: 'An export is a read of mail, so it needs the read permissions too; identity keys cannot create exports.'
      x-rate-limit-buckets: [api]
      x-idempotency: optional
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ExportCreate'}
            example:
              tenant_id: ten_01J9Z3K8V4QW7X2M5N6P8R0T1Y
              scope: counterparty
              counterparty_address: jo@example.net
      responses:
        '202':
          description: The export, `queued`.
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
            RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}
            Idempotent-Replayed: {$ref: '#/components/headers/Idempotent-Replayed'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Export'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/IdempotencyConflict'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}

  /exports/{export_id}:
    parameters:
      - $ref: '#/components/parameters/ExportIdPath'
    get:
      operationId: getExport
      tags: [Privacy]
      summary: Get an export
      description: >-
        `status` is `queued`, `running`, `completed`, `failed`, `canceled` or `expired`. A `completed`
        export has `download_url`, a signed link (`getSignedLink`) minted on each `GET` and valid for one
        download within one hour from it, or until `expires_at` if that is sooner. An earlier link stops working when its hour
        ends, or at once when the export is deleted (`deleteExport`).
      x-required-permission: ['erasure:manage']
      x-key-levels: [platform, partner, tenant, identity]
      x-rate-limit-buckets: [api]
      x-idempotency: none
      responses:
        '200':
          description: The export, with `download_url` once `completed`.
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
            RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Export'}
              example:
                id: exp_01JA4B3C4D5E6F7G8H9J0K1M2N
                tenant_id: ten_01J9Z3K8V4QW7X2M5N6P8R0T1Y
                scope: counterparty
                status: completed
                size: 1843321
                created_at: '2026-10-09T10:00:00Z'
                expires_at: '2026-10-16T10:00:00Z'
                download_url: https://mail.example.com/v1/links/bDE6Mz
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
    delete:
      operationId: deleteExport
      tags: [Privacy]
      summary: Delete an export and revoke its links
      description: >-
        Revokes every download link of the export at once. A `completed` export's ZIP is deleted and its
        status becomes `expired`; a `queued` or `running` export is stopped and becomes `canceled`; an
        export that is already `expired`, `failed` or `canceled` is left as it is. Returns `204` in every
        case. A signed link of a deleted export answers `404 export_not_found`. Audit-logged
        (`export.delete`).
      x-required-permission: ['erasure:manage']
      x-key-levels: [platform, partner, tenant, identity]
      x-permission-notes: An identity key can delete only exports of its own identity.
      x-rate-limit-buckets: [api]
      x-idempotency: none
      responses:
        '204':
          description: The export is deleted or stopped, and its links no longer work.
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
            RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}

  # ──────────────────────────────────────── Usage and audit ───────────────────────────────────────

  /usage:
    get:
      operationId: getUsage
      tags: [Usage]
      summary: Get the plan and allowances
      description: |
        The workspace's plan and the state of every allowance in the current period. Agents read it to know
        their limits before they hit `402 billing_limit`.

        - **Who can read it.** Every tenant and identity key holds `usage:read` implicitly for its own
          workspace, so they can always call this without listing it. A platform or partner key must hold
          `usage:read` explicitly and must pass `tenant_id`; without `tenant_id` it gets `400 invalid_request`.
        - `billing` is `metered`, `exempt` (no limits) or `disabled` (self-hosted without billing; `features`
          show the real `used` with `granted: null`, `remaining: null` and `unlimited: true`).
        - `used` for `storage_gb` is measured, rounded up, and refreshed at least hourly.
        - `granted` includes top-ups. `plans` is the catalog from `PM_PLAN_CATALOG`.
      x-required-permission: ['usage:read']
      x-key-levels: [platform, partner, tenant, identity]
      x-permission-notes: >-
        Tenant and identity keys hold `usage:read` implicitly for their own workspace. Platform and partner
        keys must hold it explicitly and pass `tenant_id` (`400 invalid_request` without it).
      x-rate-limit-buckets: [api]
      x-idempotency: none
      parameters:
        - name: tenant_id
          in: query
          description: Required for platform keys (`400 invalid_request` without it). Other keys always read their own workspace.
          schema: {$ref: '#/components/schemas/TenantId'}
      responses:
        '200':
          description: The plan, every allowance and the plan catalog.
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
            RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UsageSummary'}
              example:
                billing: metered
                plan:
                  plan_id: developer
                  status: active
                  current_period_end: '2026-11-01T00:00:00Z'
                  cancel_at_period_end: false
                features:
                  - {feature: inboxes, granted: 10, used: 4, remaining: 6, unlimited: false, resets_at: null}
                  - {feature: sends, granted: 12000, used: 8312, remaining: 3688, unlimited: false, resets_at: '2026-11-01T00:00:00Z'}
                  - {feature: triage, granted: 10000, used: 2210, remaining: 7790, unlimited: false, resets_at: '2026-11-01T00:00:00Z'}
                  - {feature: custom_domains, granted: 5, used: 1, remaining: 4, unlimited: false, resets_at: null}
                  - {feature: storage_gb, granted: 10, used: 2, remaining: 8, unlimited: false, resets_at: null}
                  - {feature: seats, granted: 2, used: 2, remaining: 0, unlimited: false, resets_at: null}
                topups:
                  inboxes: 0
                  sends: 2
                  triage: 0
                plans:
                  - plan_id: free
                    name: Free
                    price: 0
                    currency: gbp
                    interval: month
                    included: {inboxes: 5, sends: 1000, triage: 500, custom_domains: 0, storage_gb: 1, seats: 1}
                    topups: false
                    support: github_issues
        '400':
          description: >-
            The request is invalid, or a platform key did not pass `tenant_id` (`invalid_request`,
            `details.errors[0].path = "tenant_id"`).
          x-error-codes: [invalid_request]
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
              example:
                error:
                  code: invalid_request
                  message: 'tenant_id: required for a platform key.'
                  retryable: false
                  fix: Pass the workspace's tenant_id.
                  docs: https://pylotamail.com/docs/reference/errors#code-invalid_request
                  request_id: req_01J9Z4K8V4QW7X2M5N6P8R0T1Y
                  details:
                    errors:
                      - path: tenant_id
                        message: required for a platform key
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}

