            X-Content-Type-Options: {$ref: '#/components/headers/X-Content-Type-Options'}
            Content-Security-Policy: {$ref: '#/components/headers/Content-Security-Policy'}
          content:
            '*/*':
              schema:
                type: string
                contentMediaType: application/octet-stream
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}

  /identities/{identity_id}/drafts/{draft_id}/send:
    parameters:
      - $ref: '#/components/parameters/IdentityIdPath'
      - $ref: '#/components/parameters/DraftIdPath'
    post:
      operationId: sendDraft
      tags: [Drafts]
      summary: Send or schedule a draft
      description: >-
        Sends the draft through the one send pipeline, now or at `send_at` (a time schedules; `null` sends now;
        left out, the draft's future `send_at` is used, or it is sent now). `revision`, when given, must still
        be the draft's. Returns `202` with the draft: `sent` with `message_id`, `scheduled`, or
        `pending_approval` when policy needs an approval the current revision does not have
        (`draft.approval_requested`). A refusal of the send pipeline answers its own error and leaves the draft
        as it was. `?dry_run=true` returns what would happen and changes nothing. The recipients of an
        approved revision count as known recipients.
      x-required-permission: ['messages:send', 'drafts:read']
      x-key-levels: [platform, partner, tenant, identity]
      x-rate-limit-buckets: [api, send]
      x-idempotency: required
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeySend'
        - $ref: '#/components/parameters/DryRun'
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DraftSendRequest'}
            example:
              send_at: '2026-10-18T08:30:00Z'
              revision: 3
      responses:
        '200':
          description: Dry run only (`dry_run=true`). Nothing was sent, scheduled or stored.
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
            RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DraftDryRun'}
        '202':
          description: The draft, `sent`, `scheduled` or `pending_approval`, or the original response when the request is a replay.
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
            RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}
            Idempotent-Replayed: {$ref: '#/components/headers/Idempotent-Replayed'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Draft'}
        '400': {$ref: '#/components/responses/SendBadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '402':
          $ref: '#/components/responses/BillingLimit'
          description: 'The plan''s `sends` allowance is spent (`details.feature: "sends"`). Nothing was stored: upgrade or add a top-up, then retry with the same `Idempotency-Key`.'
        '403':
          description: >-
            As `SendForbidden`, without `approval_required`: a draft that needs approval waits for it
            (`pending_approval`) instead.
          x-error-codes: [permission_denied, scope_denied, tenant_suspended, partner_suspended, test_mode_recipient, policy_denied]
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '404':
          description: No such draft, identity or thread in the key's scope.
          x-error-codes: [draft_not_found, identity_not_found, thread_not_found]
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '409':
          description: >-
            The draft is being sent (`retryable: true`), sent, rejected or canceled (`draft_not_sendable`); its
            revision moved on (`draft_revision_mismatch`); its source cannot be used (`source_unavailable`,
            `details.reason`); or the send conflicts with the idempotency record or with the identity, thread,
            domain or calendar state, as `SendConflict`.
          x-error-codes: [draft_not_sendable, draft_revision_mismatch, source_unavailable, idempotency_conflict, request_in_progress, identity_paused, identity_owner_required, sending_paused, domain_not_ready, thread_busy, loop_detected, auto_reply_not_allowed, calendar_sequence_stale]
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '413':
          description: 'The composed message exceeds the transport limit and the tenant does not use `large_attachments: link`.'
          x-error-codes: [message_too_large]
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '422':
          description: >-
            The sending domain's transport is not configured (`transport_unavailable`); an attachment that this
            release's classification rules find risky though they passed it when the revision was saved
            (`attachment_risky`); on a dry run only, `all_recipients_suppressed` and `recipient_blocked`, as
            `SendUnprocessable`.
          x-error-codes: [transport_unavailable, attachment_risky, all_recipients_suppressed, recipient_blocked]
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '429': {$ref: '#/components/responses/SendTooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
        '504': {$ref: '#/components/responses/GatewayTimeout'}

  /identities/{identity_id}/drafts/{draft_id}/approve:
    parameters:
      - $ref: '#/components/parameters/IdentityIdPath'
      - $ref: '#/components/parameters/DraftIdPath'
    post:
      operationId: approveDraft
      tags: [Drafts]
      summary: Approve a draft
      description: >-
        Approves the given `revision` (and `digest`, when sent) of an `editing`, `pending_approval`,
        `approved`, `scheduled` or `failed` draft; a `scheduled` draft stays scheduled, and a repeated approval
        of the same revision changes nothing. A reply draft whose resolved recipients changed is first stored
        as a new revision, so an approval of the old one gets `409 draft_revision_mismatch`. `send: true`
        also sends it now, or at a future `send_at`; a send refused by the pipeline then shows
        `status: "failed"` and `failure` on the returned draft (and in `draft.failed`). A decision reserved for
        people: an API key may approve only when `PM_QUARANTINE_KEY_RELEASE` is `on` or `PM_CONSOLE` is `off`,
        or when the tenant's `drafts.key_approval` is `true` and the key is a platform key or the tenant's own
        partner key; a tenant key never approves where people decide. A key never approves content it wrote
        (`self_approval`, the draft's `content_by_key_id`). `on_behalf_of` records the caller's own user ID.
        Emits `draft.approved`; audit `draft.approve`.
      x-required-permission: ['drafts:approve']
      x-key-levels: [platform, partner, tenant]
      x-permission-notes: >-
        `send: true` also needs `messages:send`. Otherwise `403 permission_denied` with
        `details.reason = "person_required"`: a signed-in person approves in the console; or
        `details.reason = "self_approval"` for the key that wrote the content. Identity keys can never hold
        `drafts:approve`.
      x-rate-limit-buckets: [api]
      x-idempotency: optional
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DraftApproveRequest'}
            example:
              revision: 3
              digest: 9f2c41ab7d0e5c3b2a19f8e7d6c5b4a39281706f5e4d3c2b1a0f9e8d7c6b5a49
              send: true
              note: Quote checked against the rate card.
              on_behalf_of: usr-4471
      responses:
        '200':
          description: The draft, `approved`, `scheduled`, `sent` or `failed`.
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
            RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}
            Idempotent-Replayed: {$ref: '#/components/headers/Idempotent-Replayed'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Draft'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403':
          description: >-
            The key lacks `drafts:approve` (or `messages:send` with `send: true`), API keys may not take decisions
            reserved for people on this tenant (`permission_denied`, `details.reason = "person_required"`), the
            key wrote the content (`details.reason = "self_approval"`), or the tenant or the key's partner is
            suspended.
          x-error-codes: [permission_denied, scope_denied, tenant_suspended, partner_suspended]
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: >-
            The draft is in a status that cannot be decided (`draft_not_pending`, `details.status`); `revision`
            or `digest` is not current (`draft_revision_mismatch`); its source cannot be used
            (`source_unavailable`); or the idempotency key is in use.
          x-error-codes: [draft_not_pending, draft_revision_mismatch, source_unavailable, idempotency_conflict, request_in_progress]
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}

  /identities/{identity_id}/drafts/{draft_id}/reject:
    parameters:
      - $ref: '#/components/parameters/IdentityIdPath'
      - $ref: '#/components/parameters/DraftIdPath'
    post:
      operationId: rejectDraft
      tags: [Drafts]
      summary: Reject a draft
      description: >-
        Rejects an `editing`, `pending_approval`, `approved`, `scheduled` or `failed` draft (`status: "rejected"`,
        `rejection.reason: "operator"`); a `rejected` draft answers `200` with no change. Always allowed for a
        key that holds `drafts:approve`. Emits `draft.rejected`; audit `draft.reject`.
      x-required-permission: ['drafts:approve']
      x-key-levels: [platform, partner, tenant]
      x-rate-limit-buckets: [api]
      x-idempotency: optional
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DraftRejectRequest'}
            example:
              reason: The quote uses last year's rates.
              revision: 3
      responses:
        '200':
          description: The draft, `rejected`.
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
            RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}
            Idempotent-Replayed: {$ref: '#/components/headers/Idempotent-Replayed'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Draft'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: >-
            The draft is `sent` or `canceled` (`draft_not_pending`, `details.status`), is being sent
            (`draft_not_editable`, `retryable: true`), or `revision` is not current (`draft_revision_mismatch`);
            or the idempotency key is in use.
          x-error-codes: [draft_not_pending, draft_not_editable, draft_revision_mismatch, idempotency_conflict, request_in_progress]
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}

  /tenants/{tenant_id}/drafts:
    parameters:
      - $ref: '#/components/parameters/TenantIdPath'
    get:
      operationId: listTenantDrafts
      tags: [Drafts]
      summary: List a tenant's queue of drafts
      description: >-
        The tenant's drafts awaiting approval (the default), scheduled or failed, oldest first. Items hold IDs,
        status, kind, counts and times, never content: read a draft by ID on its identity. A draft whose
