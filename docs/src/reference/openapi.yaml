        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '410': {$ref: '#/components/responses/CursorExpired'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}

  # ──────────────────────────────────────────── Uploads ───────────────────────────────────────────

  /identities/{identity_id}/uploads:
    parameters:
      - $ref: '#/components/parameters/IdentityIdPath'
    post:
      operationId: createUpload
      tags: [Uploads]
      summary: Create an upload
      description: >-
        Declares a file (name, type, size, SHA-256) and returns an upload with a signed `upload_url`, valid
        for at most one hour, to `PUT` the bytes to. The upload becomes `ready` when the bytes match and pass
        classification (and the scanner, when configured), and can then be attached by `upload_id` to sends,
        replies, reply-alls, forwards and drafts of the same identity until `expires_at`. Each message copies
        the bytes. A replay re-reads the upload and mints a new `upload_url`. There is no download route, and
        Pylota Mail never fetches attachments from URLs.
      x-required-permission: []
      x-required-permission-any: ['messages:send', 'drafts:write']
      x-key-levels: [platform, partner, tenant, identity]
      x-permission-notes: An identity key creates uploads only for its own identity. A key without either permission gets `403 permission_denied` with `details.required` listing both and `details.any_of = true`.
      x-rate-limit-buckets: [api]
      x-idempotency: optional
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UploadCreateRequest'}
            example:
              filename: FNOL-7781.pdf
              content_type: application/pdf
              size: 9437184
              sha256: 2c26b46b68ffc68ff99b453c1d30413413422d706483bfa0f98a5e886266e7ae
              expires_in: 86400
      responses:
        '201':
          description: The upload, `pending`, with `upload_url`.
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
            RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}
            Idempotent-Replayed: {$ref: '#/components/headers/Idempotent-Replayed'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Upload'}
              example:
                id: upl_01JAC3Q7W9X2M5N6P8R0T1Y4ZB
                identity_id: idn_01J9Z3K8V4QW7X2M5N6P8R0T1Y
                filename: FNOL-7781.pdf
                content_type: application/pdf
                size: 9437184
                sha256: 2c26b46b68ffc68ff99b453c1d30413413422d706483bfa0f98a5e886266e7ae
                status: pending
                status_reason: null
                sniffed_type: null
                risk: null
                scan_status: skipped
                use_count: 0
                last_used_at: null
                created_at: '2026-10-17T09:00:00Z'
                expires_at: '2026-10-18T09:00:00Z'
                upload_url: https://mail.example.com/v1/links/l1.01JAC3Q7.upload.sig
                upload_url_expires_at: '2026-10-17T10:00:00Z'
        '400':
          description: A field is out of bounds, or the idempotency key is invalid.
          x-error-codes: [invalid_request, invalid_idempotency_key]
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '402':
          $ref: '#/components/responses/BillingLimit'
          description: 'Storage is at or over the plan''s allowance (`details.feature: "storage_gb"`).'
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: The identity is paused (`identity_paused`), or the idempotency key is in use with another body.
          x-error-codes: [identity_paused, idempotency_conflict, request_in_progress]
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '422':
          description: >-
            The identity already has 100 live uploads or 524,288,000 declared bytes of them
            (`upload_limit_reached`, `details.limit` = `count` or `bytes`, `details.used`, `details.max`).
          x-error-codes: [upload_limit_reached]
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
    get:
      operationId: listUploads
      tags: [Uploads]
      summary: List uploads
      description: >-
        The identity's uploads, newest first, including `rejected` and `expired` tombstones while they
        exist (7 days). Never carries `upload_url`.
      x-required-permission: []
      x-required-permission-any: ['messages:send', 'drafts:write']
      x-key-levels: [platform, partner, tenant, identity]
      x-rate-limit-buckets: [api]
      x-idempotency: none
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: status
          in: query
          description: Only uploads with this status.
          schema: {$ref: '#/components/schemas/UploadStatus'}
      responses:
        '200':
          description: A page of uploads.
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
            RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UploadPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '410': {$ref: '#/components/responses/CursorExpired'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}

  /identities/{identity_id}/uploads/{upload_id}:
    parameters:
      - $ref: '#/components/parameters/IdentityIdPath'
      - $ref: '#/components/parameters/UploadIdPath'
    get:
      operationId: getUpload
      tags: [Uploads]
      summary: Get an upload
      description: The upload. While it is `pending` or `uploading`, the response carries a newly minted `upload_url`.
      x-required-permission: []
      x-required-permission-any: ['messages:send', 'drafts:write']
      x-key-levels: [platform, partner, tenant, identity]
      x-rate-limit-buckets: [api]
      x-idempotency: none
      responses:
        '200':
          description: The upload.
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
            RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Upload'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404':
          description: No such upload in scope (`upload_not_found`), or no such identity.
          x-error-codes: [upload_not_found, identity_not_found]
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
    delete:
      operationId: deleteUpload
      tags: [Uploads]
      summary: Delete an upload
      description: >-
        Deletes the upload and its bytes in any state. Messages and drafts that copied it keep their copies.
        A send that is attaching it at that moment makes the delete answer `409 upload_in_use`.
      x-required-permission: []
      x-required-permission-any: ['messages:send', 'drafts:write']
      x-key-levels: [platform, partner, tenant, identity]
      x-rate-limit-buckets: [api]
      x-idempotency: none
      responses:
        '204':
          description: Deleted.
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
            RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404':
          description: No such upload in scope.
          x-error-codes: [upload_not_found, identity_not_found]
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '409':
          description: 'A send is attaching the upload right now (`upload_in_use`, retryable, `Retry-After: 5`).'
          x-error-codes: [upload_in_use]
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
            Retry-After: {$ref: '#/components/headers/Retry-After'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}

  # ──────────────────────────────────────────── Search ────────────────────────────────────────────

  /identities/{identity_id}/search:
    parameters:
      - $ref: '#/components/parameters/IdentityIdPath'
    post:
      operationId: searchIdentity
      tags: [Search]
      summary: Search an identity's mailbox
      description: |
        One request shape and one result shape for four modes (FR-SRCH-1): `keyword` (FTS5 BM25 plus exact
        references), `semantic` (Vectorize), `hybrid` (the default: reciprocal-rank fusion, then reranking)
        and `agentic` (a bounded plan, search, judge and refine loop with a cited answer whose citations are
        checked by code).

        `q` uses the query language: `from:` `to:` `participant:` `subject:` `ref:` `label:`
        `has:attachment` `filename:` `type:` `after:` `before:` `newer_than:` `older_than:`
        `in:inbound|outbound` `thread:` `is:unread|needs_reply|quarantined` `category:`, quoted phrases,
        `OR` and `-` negation. A query that cannot be parsed returns `400 invalid_query`.

        - When a mode's dependency is unavailable, search degrades and sets `degraded: true`, unless the
          request set `require_mode: true`, in which case it returns `503 search_degraded`.
        - Quarantined mail, and mail still being screened, is excluded unless `include_quarantined: true`
          and the key holds `quarantine:review` ([F7]).
        - Results respect `limit`, `snippet_chars` and a 256 KB response cap that sets `truncated` ([F8]).
          Cursors pin `as_of`, so pages stay stable while mail arrives (FR-SRCH-6).

        **Agentic mode** (`mode: "agentic"`, an `AgenticRequest`) returns an `AgenticResponse`. With
        `stream: true` and `Accept: text/event-stream`, the response is a server-sent event stream instead.
