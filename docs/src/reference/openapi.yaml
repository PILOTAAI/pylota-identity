  /platform/jobs:
    post:
      operationId: createJob
      tags: [Platform]
      summary: Start a maintenance job
      description: |
        Starts a maintenance job ([J3]). Audit-logged.

        | `kind` | Does |
        |---|---|
        | `reparse` | Re-parses messages from raw MIME with the deployed parser and re-emits their events with `reprocessed: true`. Messages past `raw_days` are skipped and counted |
        | `reembed` | Re-chunks and re-embeds messages into Vectorize, for example after a model change |
        | `reindex` | Rebuilds the keyword index (FTS5 and references) of each mailbox |
        | `restore_reconcile` | After a mailbox restore: re-queues inbound mail received after `after` whose raw MIME is still in R2, and re-inserts sends made after it as `uncertain` with their idempotency records. Needs `after` and `identity_ids`; runs even while the deployment is frozen |
        | `event_log_rebuild` | Rebuilds the tenant's event log in a new epoch: old cursors get `410 cursor_expired` (`log_reset`), durable consumers become `reset_required`, streams close with `4410`, and the events whose payloads the owners still hold are backfilled in `occurred_at` order |

        `tenant_id` is required; `identity_ids` (default: every identity of the tenant), `after` and
        `before` narrow it.
      x-required-permission: ['platform:ops']
      x-key-levels: [platform]
      x-rate-limit-buckets: [api]
      x-idempotency: optional
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/JobCreateRequest'}
            example:
              kind: reparse
              tenant_id: ten_01J9Z3K8V4QW7X2M5N6P8R0T1Y
              identity_ids: null
              after: '2026-09-01T00:00:00Z'
              before: null
      responses:
        '202':
          description: The job, `queued`.
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
            RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}
            Idempotent-Replayed: {$ref: '#/components/headers/Idempotent-Replayed'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Job'}
              example:
                id: job_01JA2B3C4D5E6F7G8H9J0K1M2N
                kind: reparse
                tenant_id: ten_01J9Z3K8V4QW7X2M5N6P8R0T1Y
                status: queued
                created_at: '2026-10-09T10:00:00Z'
                completed_at: null
                result: null
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/IdempotencyConflict'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
