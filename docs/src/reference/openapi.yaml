            RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}
            Idempotent-Replayed: {$ref: '#/components/headers/Idempotent-Replayed'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Message'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403':
          description: >-
            The key lacks `quarantine:review`; or release by API keys is off for this tenant
            (`PM_QUARANTINE_KEY_RELEASE=off`, and `policy.quarantine.key_release` is `false` or the key is a
            tenant or identity key), so only a person can release, in the console (`permission_denied`); or the
            partner is suspended.
          x-error-codes: [permission_denied, scope_denied, tenant_suspended, partner_suspended]
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: >-
