    post:
      operationId: createInvitation
      tags: [Members]
      summary: Invite a member
      description: >-
        Sends an invitation email from the deployment's system identity. A pending invitation uses a seat;
        with no seat left the request fails with `402 billing_limit` (`details.feature: "seats"`). Roles:
        `admin`, `member`, `viewer`. The owner is set at workspace creation (`owner` in `createTenant`) or by
        an ownership transfer in the console. A partner key's invitations count in the `partner` bucket
        (`RL_PARTNER`, 10 a minute per partner, shared with tenant creation). A tenant sends at most 50
        invitation emails (new and re-sent) per UTC day: past that, `429 daily_cap_reached` with
        `details.cap: "invitations"` and `details.resets_at`, before anything is written. An address that
        this deployment hosts (on the platform domain, or an identity's address) cannot be invited:
        `400 invalid_request` with `details.errors[0].path = "email"`. Accepting an invitation is always an
        explicit click in the console, and a person enrolled in two-step verification passes it before the
        membership exists.
