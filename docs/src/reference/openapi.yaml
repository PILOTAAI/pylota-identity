  # ──────────────────────────────────────────── Drafts ────────────────────────────────────────────

  /identities/{identity_id}/drafts:
    parameters:
      - $ref: '#/components/parameters/IdentityIdPath'
    post:
      operationId: createDraft
      tags: [Drafts]
      summary: Create a draft
      description: >-
        Stores an email as a draft of the identity, to be approved when policy needs it and sent at once or at
        `send_at` through the same pipeline as every send. The body takes the fields of `sendMessage`, or
        `in_reply_to` (with `reply_all`) or `forward_of` with the fields of a reply or forward, plus `send_at`,
        `client_id` and `request_approval`; the kind (`draft_kind`) is fixed at creation and a field the kind
        does not take is `400 invalid_request`. An attachment is inline (`content_base64`) or
        `{ "upload_id": "…" }`, whose bytes are copied when the revision is saved; attachments are checked as a
        send checks them (upload states, the final filename, inline classification, 26,214,400 bytes in
        total). `client_id` makes the create idempotent (`200` with the existing draft for the same body,
        `409 client_id_conflict` for another); an `Idempotency-Key` replay answers `201` again.
        A draft may be incomplete while it is edited; completeness is checked when it is sent or scheduled.
      x-required-permission: ['drafts:write']
      x-key-levels: [platform, partner, tenant, identity]
      x-permission-notes: An identity key creates drafts only for its own identity. A reply or forward draft (`in_reply_to` or `forward_of`) also needs `messages:read`, checked once the body is parsed (`403 permission_denied`), and its source must be visible to the key (a `quarantined` or `screening` source needs `quarantine:review`).
      x-rate-limit-buckets: [api]
      x-idempotency: optional
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DraftCreateRequest'}
            example:
              client_id: 'pm:v1:draft:apv_8812'
              to:
                - address: jo@example.net
                  name: Jo Rivera
              subject: Your quote for the Golf, 14–16 November
              text: Hi Jo, here is your quote for the Golf…
              attachments:
                - upload_id: upl_01JAC3Q7W9X2M5N6P8R0T1Y4ZB
              labels: [quote]
              metadata:
                quote_id: q_118
              request_approval: true
      responses:
        '200':
          description: A `client_id` replay (the existing draft for the same body).
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
            RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}
            Idempotent-Replayed: {$ref: '#/components/headers/Idempotent-Replayed'}
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Draft'}
        '201':
          description: 'The draft; also an idempotent replay with the same `Idempotency-Key` (`Idempotent-Replayed: true`).'
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
            RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}
            Idempotent-Replayed: {$ref: '#/components/headers/Idempotent-Replayed'}
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Draft'}
        '400':
          description: >-
            The request is invalid (a field the kind does not take, `in_reply_to` with `forward_of`, a `send_at`
            outside the window), or a recipient, header, marketing or calendar field is refused as on a send.
          x-error-codes: [invalid_request, invalid_idempotency_key, address_invalid, address_unsupported, too_many_recipients, header_not_allowed, marketing_requirements_missing, calendar_invalid]
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404':
          description: >-
            No such identity, source message, thread or upload in the key's scope (indistinguishable from a
            missing one).
          x-error-codes: [identity_not_found, message_not_found, thread_not_found, upload_not_found]
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '409':
          description: >-
            The `client_id` is in use with another body (`client_id_conflict`), an attached upload is not `ready`
            (`upload_not_ready`, `details.index`, `details.status`), or the idempotency key is in use.
          x-error-codes: [client_id_conflict, upload_not_ready, idempotency_conflict, request_in_progress]
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '410':
          description: An attached upload expired (`upload_expired`, `details.reason`). Upload the file again.
          x-error-codes: [upload_expired]
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '413':
          description: >-
            The request body exceeds 7 MiB (`payload_too_large`), the attachments exceed 26,214,400 decoded
            bytes in total (`message_too_large`, `details.reason = "attachments_total"`), the draft's own parts
            exceed the composed limit with `large_attachments: refuse` (`message_too_large`), or
            `calendar.ics` exceeds 262,144 bytes (`calendar_too_large`).
          x-error-codes: [payload_too_large, message_too_large, calendar_too_large]
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '422':
          description: >-
            The identity already has 1,000 drafts that are not `sent` or `canceled` (`draft_limit_reached`,
            `details.limit`), or an attachment is risky: an inline part with a quarantining risk, a `rejected`
            upload or a risky final filename (`attachment_risky`, `details.index`, `details.risk`).
          x-error-codes: [draft_limit_reached, attachment_risky]
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
    get:
      operationId: listDrafts
      tags: [Drafts]
      summary: List an identity's drafts
      description: >-
        Drafts, newest first. Items carry `preview` (at most 240 characters) and `text` and `html` set to
        `null`. A reply or forward draft whose source is `quarantined` or `screening` is listed only for keys
        holding `quarantine:review`.
      x-required-permission: ['drafts:read']
      x-key-levels: [platform, partner, tenant, identity]
      x-permission-notes: '`drafts:write` and `drafts:approve` include `drafts:read`.'
      x-rate-limit-buckets: [api]
      x-idempotency: none
      parameters:
        - name: status
          in: query
          description: Only drafts with one of these statuses (comma-separated).
          style: form
          explode: false
          schema:
            type: array
            uniqueItems: true
            items: {$ref: '#/components/schemas/DraftStatus'}
        - name: draft_kind
          in: query
          description: Only drafts of this kind.
          schema: {$ref: '#/components/schemas/DraftKind'}
        - name: label
          in: query
          description: Only drafts carrying this label.
          schema: {$ref: '#/components/schemas/Label'}
        - name: thread_id
          in: query
          description: Only drafts that will join this thread.
          schema: {$ref: '#/components/schemas/ThreadId'}
        - name: client_id
          in: query
          description: Only the draft with this `client_id`.
          schema:
            type: string
            minLength: 1
            maxLength: 255
        - name: scheduled_after
          in: query
          description: Only drafts whose `send_at` is at or after this time.
          schema:
            type: string
            format: date-time
        - name: scheduled_before
          in: query
          description: Only drafts whose `send_at` is before this time.
          schema:
            type: string
            format: date-time
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of drafts.
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
            RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DraftPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '410': {$ref: '#/components/responses/CursorExpired'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}

  /identities/{identity_id}/drafts/{draft_id}:
    parameters:
      - $ref: '#/components/parameters/IdentityIdPath'
