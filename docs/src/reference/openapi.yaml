      x-key-levels: [platform, partner, tenant, identity]
      x-permission-notes: >-
        Allowed for API keys when `PM_QUARANTINE_KEY_RELEASE` is `on` (or `PM_CONSOLE=off`), or for a
        platform key or the tenant's partner key when the tenant's `policy.quarantine.key_release` is `true`;
