      summary: Reply to a message
      description: >-
        Replies to the sender of `message_id`, or to its `Reply-To` when that shares the sender's
        organisational domain or is a known contact ([D3]). The subject gets one `Re:` prefix. The `From` is
        the address the counterparty wrote to, unless that address is retired (FR-OUT-5). `In-Reply-To` and
        `References` are set (the first plus the 19 most recent references are kept, [C2]). Idempotency,
        `dry_run`, policy, size and response behave as in `sendMessage`. `kind: "auto_reply"` is refused for
        automated mail or over the automatic-exchange limit (`409 auto_reply_not_allowed`, [D6]). `calendar`
        sends iMIP (docs › Calendar invitations § 5).
      x-required-permission: ['messages:send']
      x-key-levels: [platform, partner, tenant, identity]
      x-permission-notes: 'The message replied to or forwarded must be visible to the key: a `quarantined` or `screening` one needs `quarantine:review` as well, and a `hidden` or `throttled` one can never be the target; otherwise `404 message_not_found`, as if it did not exist.'
      x-rate-limit-buckets: [api, send]
      x-idempotency: required
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeySend'
        - $ref: '#/components/parameters/DryRun'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReplyRequest'}
            example:
              text: Friday works. See you at 10.
              html: null
              attachments: []
              kind: transactional
      responses:
        '200': {$ref: '#/components/responses/DryRunOk'}
        '202':
          description: Accepted into the queue, or the original response when the request is a replay.
