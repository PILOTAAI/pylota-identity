              attachments_remove: [att_01JA2B3C4D5E6F7G8H9J0K1M2P]
      responses:
        '200':
          description: The draft at its new revision.
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
            RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Draft'}
        '400':
          description: >-
            The request is invalid (a field the kind does not take, a `send_at` outside the window), or a
            recipient, header, marketing or calendar field is refused as on a send.
          x-error-codes: [invalid_request, address_invalid, address_unsupported, too_many_recipients, header_not_allowed, marketing_requirements_missing, calendar_invalid]
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404':
          description: No such draft, identity or upload in the key's scope.
          x-error-codes: [draft_not_found, identity_not_found, upload_not_found]
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
          content:
            application/json:
