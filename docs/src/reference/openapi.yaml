  /identities/{identity_id}/wait:
    parameters:
      - $ref: '#/components/parameters/IdentityIdPath'
    get:
      operationId: waitForMessage
      tags: [Search]
      summary: Wait for a matching message
      description: >-
        Long-polls until a matching message arrives after the request started (or after `since`), or until
        `timeout`. A timeout is not an error: it returns `200` with `timed_out: true` and `message: null`.
        A verification code or link is released only when `from` names the expected sender domain and the
        message passed authentication (`verdict: pass`) ([E4]). An active `wait` also marks OTP mail from
        that sender domain as solicited for 30 minutes ([E5]). When the tenant's
        `accounts.require_approval` is `true`, `kind=verification` also needs an approved service-ledger
        entry whose sender domains include the domain of `from`: without one the request gets
        `403 policy_denied` (`details.reason = "account_not_approved"`) at once, and a code is released only
        while its entry is still approved ([E9]). A message still being screened is never returned; it is
        returned once it is `received`.
      x-required-permission: ['search:read']
      x-key-levels: [platform, partner, tenant, identity]
      x-rate-limit-buckets: [api]
      x-idempotency: none
      parameters:
        - name: from
          in: query
          description: An address (`noreply@service.example`) or a domain (`@service.example`).
          schema:
            type: string
            pattern: '^([^@\s]+@[^@\s]+|@[^@\s]+)$'
          example: '@service.example'
        - name: subject_contains
          in: query
          description: Only messages whose subject contains this text (case-insensitive).
          schema:
            type: string
        - name: thread_id
          in: query
          description: Only messages in this thread.
          schema: {$ref: '#/components/schemas/ThreadId'}
        - name: kind
          in: query
          description: '`any` message, a `reply` (a message that joins an existing thread), or a `verification` message (a code or link was found).'
          schema:
            type: string
            enum: [any, reply, verification]
            default: any
        - name: since
          in: query
          description: Match messages received after this time instead of after the request started.
          schema:
            type: string
            format: date-time
        - name: timeout
          in: query
          description: Seconds to wait.
          schema:
            type: integer
            minimum: 1
            maximum: 60
            default: 30
      responses:
        '200':
          description: A matching message, or a timeout.
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
            RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WaitResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403':
          description: >-
            As `Forbidden`, plus `policy_denied` for `kind=verification` when the tenant requires approval and
            no approved service-ledger entry covers the sender domain ([E9]).
          x-error-codes: [permission_denied, scope_denied, tenant_suspended, partner_suspended, policy_denied]
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
              example:
                error:
                  code: policy_denied
                  message: No approved service account covers service.example for this identity.
                  retryable: false
                  fix: Request an entry with POST /v1/identities/{identity_id}/accounts and wait for its approval before signing up.
                  docs: https://pylotamail.com/docs/reference/errors#code-policy_denied
                  request_id: req_01J9Z4K8V4QW7X2M5N6P8R0T1Y
                  details:
                    reason: account_not_approved
                    service_domain: service.example
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}

