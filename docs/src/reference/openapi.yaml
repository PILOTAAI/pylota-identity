    patch:
      operationId: updateDraft
      tags: [Drafts]
      summary: Update a draft
      description: >-
        Changes fields of the draft and raises `revision`. `If-Match` makes a stale write fail with
        `409 draft_revision_mismatch`. Attachments change through `attachments_add` and `attachments_remove`,
        labels through `labels`, `labels_add` and `labels_remove`. Changing the content of a draft that was
        approved, pending or scheduled drops the approval and the schedule and asks for approval again
        (`draft.approval_requested`); changing only `send_at`, `labels` or `metadata` keeps them. `send_at`
        reschedules a scheduled draft, `null` unschedules it, and a time on a failed draft schedules it again.
        `in_reply_to`, `reply_all` and `forward_of` cannot be changed.
      x-required-permission: ['drafts:write']
      x-key-levels: [platform, partner, tenant, identity]
