# Spike S2's throwaway Worker (build plan M1): S1's spike Worker, whose email export accepts, calls
# setReject for `reject@`, and rejects its promise (a thrown handler) for `tempfail@`. Build it first with
# `worker-build --release` in spikes/s1-bindings. Deleted when the spike ends.
name = "pi-spike-2"
main = "../s1-bindings/build/index.js"
compatibility_date = "2026-09-22"
workers_dev = true

[[durable_objects.bindings]]
name = "SPIKE_OBJECT"
class_name = "SpikeObject"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SpikeObject"]
